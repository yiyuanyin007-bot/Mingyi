// 生成考试题
function generateQuestions(cardId) {
  const card = getCard(cardId);
  if (!card) return [];
  const c = card.data.canonical;
  const profile = c.symptom_profile || {};
  const allSymptoms = [...(profile.necessary || []), ...(profile.common || [])];
  const questions = [];

  // 0→1: 方名→症状
  const necessaryJoined = (profile.necessary || []).join('、');
  questions.push({
    type: '0→1',
    text: `${card.name}的必要症状包括哪些？`,
    correct: necessaryJoined,
    options: generateOptions(cardId, '0→1', necessaryJoined)
  });

  // 1→0: 症状→方名
  if (allSymptoms.length > 0) {
    questions.push({
      type: '1→0',
      text: `患者出现 ${allSymptoms.slice(0, 2).join('、')}，最可能选哪个方？`,
      correct: card.id,
      options: generateOptions(cardId, '1→0')
    });
  }

  // 0→2: 方名→核心药物组合
  const coreCombo = getCoreCombo(card);
  if (c.herbs.length > 0) {
    questions.push({
      type: '0→2',
      text: `${card.name}的核心药物组合是？`,
      correct: [coreCombo],
      options: generateOptions(cardId, '0→2', coreCombo)
    });
  }

  // 2→0: 核心药物组合→方名
  if (c.herbs.length > 0) {
    questions.push({
      type: '2→0',
      text: `药物组合“${coreCombo}”对应哪个方？`,
      correct: card.name,
      options: generateOptions(cardId, '2→0')
    });
  }

  // 0→contra: 方名→禁忌
  if (c.contraindications.length > 0) {
    questions.push({
      type: '0→contra',
      text: `${card.name}的禁忌是什么？`,
      correct: [c.contraindications[0]],
      options: generateOptions(cardId, '0→contra', c.contraindications[0])
    });
  }

  return questions;
}

function generateOptions(cardId, type, correctValue) {
  const target = getCard(cardId);

  // 计算正确答案的标签
  const correctLabel = getOptionLabel(target, type);

  // 构建正确答案选项
  const opts = [{ id: target.id, label: correctLabel }];
  const usedLabels = new Set([correctLabel]);

  // 从其他卡片中抽取标签不重复的干扰项
  const others = CARDS.filter(c => c.id !== cardId);
  const shuffled = others.sort(() => Math.random() - 0.5);

  for (const c of shuffled) {
    if (opts.length >= 4) break;
    const label = getOptionLabel(c, type);
    if (!usedLabels.has(label)) {
      usedLabels.add(label);
      opts.push({ id: c.id, label });
    }
  }

  // 极端情况下（题库太小）仍凑不够 4 个，用占位补齐
  while (opts.length < 4) {
    const fallback = `选项 ${opts.length + 1}`;
    if (!usedLabels.has(fallback)) {
      usedLabels.add(fallback);
      opts.push({ id: `fallback-${opts.length}`, label: fallback });
    }
  }

  return opts.sort(() => Math.random() - 0.5);
}

function startPractice(cardId) {
  state.activeCardId = cardId;
  state.exam.questions = generateQuestions(cardId);
  state.exam.current = 0;
  state.exam.answers = [];
  state.exam.finished = false;
  state.exam.submitted = false;
  state.exam.mode = 'practice-card';
  switchView('exam');
  renderExam();
}

// 保留旧别名
function startExam(cardId) { startPractice(cardId); }

// 计算与指定卡片最相近的若干卡片（按标签/章节/来源重合度）
function getSimilarCardIds(cardId, count = 4) {
  const target = getCard(cardId);
  if (!target) return [];
  const targetTags = new Set(target.tags || []);
  const targetChapter = target.source_chapter;
  const targetBase = target.lineage && target.lineage.base_formula;

  const scored = CARDS.filter(c => c.id !== cardId).map(c => {
    let score = 0;
    const tags = c.tags || [];
    tags.forEach(t => { if (targetTags.has(t)) score += 2; });
    if (c.source_chapter && c.source_chapter === targetChapter) score += 3;
    if (c.lineage && c.lineage.base_formula === targetBase) score += 5;
    return { id: c.id, score };
  });

  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, count).map(s => s.id);
}

// 类方练习：从当前卡片及其相近卡片中各抽题，混合成一次练习
function startPracticeSimilar(cardId) {
  const similarIds = getSimilarCardIds(cardId, 3);
  const ids = [cardId, ...similarIds];
  const questions = ids.flatMap(id => generateQuestions(id).slice(0, 2)).filter(Boolean);
  if (questions.length === 0) {
    alert('暂无可练习题目。');
    return;
  }
  questions.sort(() => Math.random() - 0.5);
  state.activeCardId = cardId;
  state.exam.questions = questions;
  state.exam.current = 0;
  state.exam.answers = [];
  state.exam.finished = false;
  state.exam.submitted = false;
  state.exam.mode = 'practice-similar';
  switchView('exam');
  renderExam();
}

// 模拟考试：随机抽取卡片与向量，提交后统一判分
function startExamMode(count = 10) {
  const allVectors = [];
  CARDS.forEach(card => {
    if (!card.mastery) return;
    const vectors = Object.keys(card.mastery).filter(v => {
      const q = generateQuestionForVector(card, v);
      return !!q;
    });
    vectors.forEach(v => allVectors.push({ card, vector: v }));
  });

  if (allVectors.length === 0) {
    alert('暂无可考试题目，请先学习卡片。');
    return;
  }

  const shuffled = allVectors.sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(count, shuffled.length));
  const questions = selected.map(s => generateQuestionForVector(s.card, s.vector)).filter(Boolean);

  state.activeCardId = questions[0] ? questions[0].cardId : null;
  state.exam.questions = questions;
  state.exam.current = 0;
  state.exam.answers = questions.map(q => ({ question: q, selected: null, isCorrect: null }));
  state.exam.finished = false;
  state.exam.submitted = false;
  state.exam.mode = 'exam';
  switchView('exam');
  renderExam();
}

/* ===== 再来一组：关联学习模式（一题多向） ===== */

function startRetrievalRound() {
  const prevAnswers = state.exam.answers || [];
  const wrongAnswers = prevAnswers.filter(a => !a.isCorrect);

  // 1. 提取薄弱方，按错题数排序，取前3个（工作记忆限制 4±1）
  const cardWrongCount = {};
  wrongAnswers.forEach(a => {
    const cid = a.question.cardId;
    cardWrongCount[cid] = (cardWrongCount[cid] || 0) + 1;
  });
  const weakCardIds = Object.entries(cardWrongCount)
    .sort((a, b) => b[1] - a[1])
    .map(([id]) => id)
    .slice(0, 3);

  // 2. 为每个薄弱方生成2-3个向量题目（关联学习）
  const cardGroups = [];
  weakCardIds.forEach((cardId, cardIdx) => {
    const card = getCard(cardId);
    if (!card) return;

    const wrongVectors = new Set();
    wrongAnswers.forEach(a => {
      if (a.question.cardId === cardId) wrongVectors.add(a.question.type);
    });

    const vectors = [];
    // 必包含：错题向量（纠错）
    wrongVectors.forEach(v => { if (!vectors.includes(v)) vectors.push(v); });
    // 必包含：反向向量（交叉验证，Hebbian关联）
    const reverseMap = {'0→1':'1→0', '1→0':'0→1', '0→2':'2→0', '2→0':'0→2', '0→contra':'0→contra', '0→usage':'0→usage'};
    wrongVectors.forEach(v => {
      const rv = reverseMap[v];
      if (rv && rv !== v && !vectors.includes(rv)) vectors.push(rv);
    });
    // 可选：药组向量（关联学习）
    if (card.data.canonical.herbs.length > 0 && !vectors.includes('0→2')) {
      vectors.push('0→2');
    }
    // 截断到每方最多3个
    if (vectors.length > 3) vectors.length = 3;

    const questions = [];
    vectors.forEach((v, vi) => {
      const q = generateQuestionForVector(card, v);
      if (q) {
        questions.push({
          ...q,
          roundInfo: {
            cardIndex: cardIdx,
            totalCards: weakCardIds.length,
            cardName: card.name,
            vectorIndex: vi,
            totalVectors: vectors.length
          }
        });
      }
    });

    if (questions.length > 0) {
      cardGroups.push({ cardId, cardName: card.name, questions });
    }
  });

  // 3. 合并：同一方的题连续出现（组块化），不同方之间切换
  let allQuestions = [];
  cardGroups.forEach(g => { allQuestions = allQuestions.concat(g.questions); });

  // 截断到10题（避免认知超载）
  if (allQuestions.length > 10) allQuestions = allQuestions.slice(0, 10);

  // 更新 totalQuestions
  const totalQ = allQuestions.length;
  allQuestions.forEach(q => { if (q.roundInfo) q.roundInfo.totalQuestions = totalQ; });

  // Fallback：无新题时随机抽3个方
  if (allQuestions.length === 0) {
    const randomCards = CARDS.sort(() => Math.random() - 0.5).slice(0, 3);
    allQuestions = randomCards.flatMap(c => {
      const q = generateQuestionForVector(c, '0→1');
      return q ? [{ ...q, roundInfo: { cardIndex: 0, totalCards: 1, cardName: c.name, vectorIndex: 0, totalVectors: 1, totalQuestions: 1 } }] : [];
    }).slice(0, 10);
  }

  state.exam.questions = allQuestions;
  state.exam.current = 0;
  state.exam.answers = [];
  state.exam.finished = false;
  state.exam.submitted = false;
  state.exam.mode = 'retrieval-round';

  switchView('exam');
  renderExam();
  showToast(`再来一组：${allQuestions.length} 题，${cardGroups.length} 个方，每方建立概念网络`);
}

function renderExam() {
  const q = state.exam.questions[state.exam.current];
  if (!q) return;

  const isExam = state.exam.mode === 'exam';

  // 隐藏考试结果面板、恢复布局
  document.getElementById('examResultPanel').style.display = 'none';
  document.getElementById('examLayout').style.display = 'grid';

  const ri = q.roundInfo;
  let progressText = `题目 ${state.exam.current + 1} / ${state.exam.questions.length}`;
  if (ri && state.exam.mode === 'retrieval-round') {
    progressText = `第 ${state.exam.current + 1}/${ri.totalQuestions} 题 · 第 ${ri.cardIndex + 1} 个方：${ri.cardName}（${ri.vectorIndex + 1}/${ri.totalVectors} 向量）`;
  }
  document.getElementById('examProgress').textContent = progressText;
  document.getElementById('examQuestion').textContent = q.text;
  document.getElementById('examHint').textContent = `类型：${q.type}`;

  const optsContainer = document.getElementById('examOptions');
  optsContainer.innerHTML = q.options.map((opt, idx) => `
    <button class="exam-option" id="opt-${idx}" onclick="selectOption(${idx})">
      ${opt.label}
    </button>
  `).join('');

  document.getElementById('examFeedback').className = 'exam-feedback';
  document.getElementById('examFeedback').innerHTML = '';

  if (isExam) {
    // 考试模式：恢复已选答案，提交后显示反馈
    const record = state.exam.answers[state.exam.current];
    if (record && record.selected) {
      const idx = q.options.findIndex(o => o.label === record.selected.label && o.id === record.selected.id);
      if (idx >= 0) document.getElementById(`opt-${idx}`).classList.add('selected');
    }
    if (state.exam.submitted) {
      applyAnswerUI(record);
    }
    state.exam.finished = state.exam.submitted;
  } else {
    // 练习模式：即时反馈
    const answered = state.exam.answers[state.exam.current];
    state.exam.finished = !!answered;
    if (answered) {
      applyAnswerUI(answered);
    }
  }

  renderExamNav();
}

// 根据已记录答案渲染选项状态与反馈
function applyAnswerUI(answered) {
  const q = answered.question;
  const idx = answered.selected
    ? q.options.findIndex(o => o.label === answered.selected.label && o.id === answered.selected.id)
    : -1;

  q.options.forEach((opt, i) => {
    const btn = document.getElementById(`opt-${i}`);
    const optCorrect = q.type === '1→0'
      ? opt.id === q.correct
      : (Array.isArray(q.correct) ? q.correct.includes(opt.label) : opt.label === q.correct);
    if (optCorrect) btn.classList.add('correct');
    if (i === idx && !optCorrect) btn.classList.add('wrong');
    btn.disabled = true;
  });

  const fb = document.getElementById('examFeedback');
  fb.className = 'exam-feedback show';
  if (!answered.selected) {
    fb.innerHTML = `<strong>未作答。</strong> 正确答案是：${formatCorrectAnswer(q)}`;
    return;
  }
  fb.innerHTML = answered.isCorrect
    ? `<strong>回答正确。</strong> ${(q.type === '1→0' || q.type === '2→0') ? '该症状/药物组合指向' + slugToName(q.correct) : ''}`
    : `<strong>回答错误。</strong> 正确答案是：${formatCorrectAnswer(q)}`;

  renderExamNav();
}

function renderExamNav() {
  const nav = document.getElementById('examNav');
  const isExam = state.exam.mode === 'exam';
  const prevBtn = state.exam.current > 0
    ? `<button class="btn-secondary" onclick="previousQuestion()">上一题</button>`
    : '';

  if (isExam) {
    const isLast = state.exam.current >= state.exam.questions.length - 1;
    const nextBtn = state.exam.submitted
      ? (isLast
          ? `<button class="btn-primary" onclick="finishExam()">完成</button>`
          : `<button class="btn-primary" onclick="nextQuestion()">下一题</button>`)
      : (isLast
          ? `<button class="btn-primary" onclick="submitExam()">提交试卷</button>`
          : `<button class="btn-primary" onclick="nextQuestion()">下一题</button>`);
    nav.innerHTML = `<div style="display:flex;justify-content:space-between;width:100%;">${prevBtn}${nextBtn}</div>`;
    return;
  }

  // 练习模式：必须答完才能进入下一题
  const answered = state.exam.answers[state.exam.current];
  const isLast = state.exam.current >= state.exam.questions.length - 1;
  const nextLabel = isLast ? '完成' : '下一题';
  const nextAction = isLast ? 'finishExam()' : 'nextQuestion()';
  const nextBtn = `<button class="btn-primary" onclick="${nextAction}" ${answered ? '' : 'disabled'}>${nextLabel}</button>`;
  nav.innerHTML = `<div style="display:flex;justify-content:space-between;width:100%;">${prevBtn}${nextBtn}</div>`;
}

function selectOption(idx) {
  const isExam = state.exam.mode === 'exam';
  if (state.exam.finished && !isExam) return;
  if (isExam && state.exam.submitted) return;

  const q = state.exam.questions[state.exam.current];
  const selected = q.options[idx];
  const isCorrect = q.type === '1→0'
    ? selected.id === q.correct
    : (Array.isArray(q.correct) ? q.correct.includes(selected.label) : selected.label === q.correct);

  if (isExam) {
    // 考试模式：只记录选择，不立即判分
    const record = state.exam.answers[state.exam.current];
    record.selected = selected;
    // 高亮当前选择
    q.options.forEach((_, i) => {
      document.getElementById(`opt-${i}`).classList.remove('selected');
    });
    document.getElementById(`opt-${idx}`).classList.add('selected');
    renderExamNav();
    return;
  }

  // 练习模式：即时判分
  state.exam.answers.push({ question: q, selected, isCorrect });
  state.exam.finished = true;
  state.stats.total++;
  if (isCorrect) state.stats.right++; else state.stats.wrong++;

  // 更新掌握度并持久化
  updateMasteryAfterAnswer(q.type, isCorrect, q.cardId);

  applyAnswerUI({ question: q, selected, isCorrect });
}

function previousQuestion() {
  if (state.exam.current <= 0) return;
  state.exam.current--;
  if (state.exam.mode !== 'exam') {
    state.exam.finished = !!state.exam.answers[state.exam.current];
  }
  renderExam();
}

function nextQuestion() {
  if (state.exam.current >= state.exam.questions.length - 1) return;
  state.exam.current++;
  if (state.exam.mode !== 'exam') {
    state.exam.finished = !!state.exam.answers[state.exam.current];
  }
  renderExam();
}

function finishExam() {
  if (state.exam.mode === 'exam') {
    goToDashboard();
  } else {
    renderPracticeSummary();
  }
}

// 提交试卷：仅用于考试模式
function submitExam() {
  if (state.exam.mode !== 'exam' || state.exam.submitted) return;

  // 未作答的题目按错误处理
  state.exam.answers.forEach(record => {
    if (!record.selected) {
      record.isCorrect = false;
    } else {
      const q = record.question;
      record.isCorrect = q.type === '1→0'
        ? record.selected.id === q.correct
        : (Array.isArray(q.correct) ? q.correct.includes(record.selected.label) : record.selected.label === q.correct);
    }
  });

  // 统计与掌握度
  state.exam.answers.forEach(record => {
    state.stats.total++;
    if (record.isCorrect) state.stats.right++; else state.stats.wrong++;
    updateMasteryAfterAnswer(record.question.type, record.isCorrect, record.question.cardId);
  });

  state.exam.submitted = true;
  state.exam.finished = true;
  renderExamResult();
}

// 桌面版键盘快捷键
document.addEventListener('keydown', (e) => {
  // 忽略输入框中的按键
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  // 仪表盘：方向键/Enter 选择卡片
  if (state.page === 'dashboard') {
    const items = document.querySelectorAll('.card-list-item');
    const current = document.activeElement;
    let idx = Array.from(items).indexOf(current);
    if (e.key === 'ArrowDown' || e.key === 'j' || e.key === 'J') {
      e.preventDefault();
      idx = Math.min(idx + 1, items.length - 1);
      if (idx >= 0) items[idx].focus();
      else if (items.length > 0) items[0].focus();
    } else if (e.key === 'ArrowUp' || e.key === 'k' || e.key === 'K') {
      e.preventDefault();
      idx = Math.max(idx - 1, 0);
      if (idx >= 0) items[idx].focus();
    } else if (e.key === 'Enter' && current.classList.contains('card-list-item')) {
      e.preventDefault();
      current.click();
    }
    return;
  }

  // 学习视图
  if (state.page === 'learn') {
    if (e.key === 'Enter') {
      e.preventDefault();
      startPractice(state.activeCardId);
    } else if (e.key === 'Escape' || e.key === 'Backspace') {
      e.preventDefault();
      goToDashboard();
    }
    return;
  }

  // 考试视图
  if (state.page === 'exam') {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      const nextBtn = document.querySelector('.exam-nav .btn-primary');
      if (nextBtn && !nextBtn.disabled) nextBtn.click();
      return;
    }
    const canSelect = state.exam.mode === 'exam' ? !state.exam.submitted : !state.exam.finished;
    if (e.key >= '1' && e.key <= '4' && canSelect) {
      const idx = parseInt(e.key, 10) - 1;
      const opts = document.querySelectorAll('.exam-option');
      if (opts[idx]) {
        e.preventDefault();
        selectOption(idx);
      }
    } else if (e.key === 'Escape') {
      e.preventDefault();
      goToDashboard();
    }
    return;
  }

  // 统计视图
  if (state.page === 'stats') {
    if (e.key === 'Escape') {
      e.preventDefault();
      goToDashboard();
    }
  }
});

const USER_PROFILE = 'A01'; // 用户档案标识，后续可动态切换

function storageKey(name) { return `${USER_PROFILE}_${name}`; }

function loadStoreData(key, fallback) {
  try {
    const raw = localStorage.getItem(storageKey(key));
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}

function saveStoreData(key, value) {
  try {
    localStorage.setItem(storageKey(key), JSON.stringify(value));
  } catch (e) { console.warn('saveStoreData failed:', e); }
}

function removeStoreData(key) {
  localStorage.removeItem(storageKey(key));
}

// 数据迁移：旧键名 → A01 前缀
function migrateUserData() {
  if (localStorage.getItem(storageKey('migration_done'))) return;
  const migrations = [
    { old: 'sh_user_traces_v1', new: storageKey('traces'), init: { traces: [], dailySummary: {} } },
    { old: 'sh_index_v1_state', new: storageKey('state'), init: null },
    { old: 'sh_study_notes', new: storageKey('study_notes'), init: { notes: [] } },
    { old: 'sh_mastery', new: storageKey('mastery'), init: {} }
  ];
  let migrated = 0;
  migrations.forEach(({ old, new: newKey, init }) => {
    const raw = localStorage.getItem(old);
    if (raw !== null) {
      localStorage.setItem(newKey, raw);
      localStorage.removeItem(old);
      migrated++;
    } else if (init !== null && localStorage.getItem(newKey) === null) {
      localStorage.setItem(newKey, JSON.stringify(init));
    }
  });
  if (migrated > 0) console.log(`[Migration] ${migrated} keys migrated to ${USER_PROFILE}`);
  localStorage.setItem(storageKey('migration_done'), 'true');
}

// 每日总结
function getDailyLearningData(dateStr) {
  const data = JSON.parse(localStorage.getItem(TRACE_KEY) || '{"traces":[],"dailySummary":{}}');
  const date = dateStr || new Date().toISOString().split('T')[0];
  const dayTraces = data.traces.filter(t => t.timestamp.startsWith(date));

  const formulasViewed = [...new Set(dayTraces.filter(t => t.type === 'card_view').map(t => t.cardId))];
  const herbsClicked = {};
  const formulasClicked = {};
  const referencesClicked = {};
  let longChainViewing = 0;
  let repeatedReview = 0;
  let deepDive = 0;
  let quickScan = 0;
  let rxFocus = 0;

  // 统计 herbs/formulas/references 点击
  dayTraces.forEach(t => {
    if (t.type === 'link_click') {
      if (t.target === 'herb') herbsClicked[t.targetName] = (herbsClicked[t.targetName] || 0) + 1;
      if (t.target === 'formula') formulasClicked[t.targetName] = (formulasClicked[t.targetName] || 0) + 1;
      if (t.target === 'reference_url' || t.target === 'reference_local') referencesClicked[t.targetName] = (referencesClicked[t.targetName] || 0) + 1;
    }
  });

  // 统计行为模式
  const cardViewTimes = {};
  dayTraces.filter(t => t.type === 'card_view').forEach(t => {
    cardViewTimes[t.cardId] = (cardViewTimes[t.cardId] || 0) + 1;
  });
  repeatedReview = Object.values(cardViewTimes).filter(c => c >= 2).length;

  const linkClicks = dayTraces.filter(t => t.type === 'link_click').length;
  if (linkClicks >= 3) deepDive = 1;

  const totalCards = Object.keys(cardViewTimes).length;
  if (totalCards >= 3) {
    // 检查是否有关联的方（lineage）
    const viewedFormulas = formulasViewed.map(id => getCard(id)).filter(Boolean).map(c => c.formula_name);
    // 简单检查：是否有柴胡系列、桂枝系列等
    const series = { '柴胡': 0, '桂枝': 0, '承气': 0, '四逆': 0 };
    viewedFormulas.forEach(f => {
      Object.keys(series).forEach(s => { if (f.includes(s)) series[s]++; });
    });
    if (Object.values(series).some(c => c >= 2)) longChainViewing = 1;
  }

  // quickScan: 平均停留时间 < 30 秒（简化估计）
  if (totalCards > 0 && linkClicks === 0 && Object.keys(herbsClicked).length === 0) {
    quickScan = 1;
  }

  // rxFocus: 点击药名或处方区域
  if (Object.keys(herbsClicked).length >= 2) rxFocus = 1;

  const summary = {
    date,
    formulasViewed,
    herbsClicked,
    formulasClicked,
    referencesClicked,
    behaviorPatterns: {
      longChainViewing,
      repeatedReview,
      deepDive,
      quickScan,
      rxFocus
    }
  };

  // 缓存到 dailySummary
  data.dailySummary[date] = summary;
  localStorage.setItem(TRACE_KEY, JSON.stringify(data));

  return summary;
}

function generateDailyReport(dateStr) {
  const summary = getDailyLearningData(dateStr);
  const cardNames = summary.formulasViewed.map(id => getCard(id)?.name || id).filter(Boolean);
  const patterns = summary.behaviorPatterns;

  let report = `📊 ${summary.date} 学习日报\n\n`;
  report += `今日浏览方剂：${cardNames.length > 0 ? cardNames.join('、') : '无'}\n`;
  if (Object.keys(summary.herbsClicked).length > 0) {
    report += `关注的药物：${Object.entries(summary.herbsClicked).map(([k,v]) => `${k}(${v}次)`).join('、')}\n`;
  }
  if (Object.keys(summary.formulasClicked).length > 0) {
    report += `点击的方剂：${Object.entries(summary.formulasClicked).map(([k,v]) => `${k}(${v}次)`).join('、')}\n`;
  }

  report += `\n行为模式：\n`;
  if (patterns.longChainViewing) report += `• 长链条浏览：你在系统学习某类方剂（如柴胡剂/桂枝剂）\n`;
  if (patterns.repeatedReview) report += `• 反复回看：${patterns.repeatedReview} 个方需要加强复习\n`;
  if (patterns.deepDive) report += `• 深度探究：你深入查看了参考资料和药物链接\n`;
  if (patterns.rxFocus) report += `• 处方关注：你对剂量和加减很感兴趣\n`;
  if (patterns.quickScan) report += `• 快速扫描：今天浏览量大但深入少，建议挑重点复习\n`;
  if (!patterns.longChainViewing && !patterns.repeatedReview && !patterns.deepDive && !patterns.rxFocus && !patterns.quickScan) {
    report += `• 今日学习平稳，继续保持！\n`;
  }

  return report;
}

const STUDY_NOTES_KEY = storageKey('study_notes');
const EBINGHAUS_INTERVALS = [1, 2, 4, 7, 14, 30];

function autoDiagnoseMistake(answer) {
  const q = answer.question;
  const selected = answer.selected;
  if (!selected) return 'skipped';
  const correctCard = getCard(q.cardId);
  const selectedCard = CARDS.find(c => c.id === selected.id || c.name === selected.label);
  if (selectedCard && correctCard) {
    if (selectedCard.id === correctCard.id && q.type !== '1→0' && q.type !== '2→0') return 'misremembered';
    const sharedTags = (selectedCard.tags || []).filter(t => (correctCard.tags || []).includes(t));
    if (sharedTags.length >= 2) return 'confused';
    if (selectedCard.lineage?.base_formula === correctCard.lineage?.base_formula) return 'confused';
    if (sharedTags.length === 0) return 'unknown';
  }
  return 'unknown';
}

function getDiagnosisLabel(diagnosis) {
  const labels = { confused: '🔀 类方混淆', misremembered: '↔️ 反向盲区', unknown: '🕳️ 知识缺口', random: '🧠 决策失误', skipped: '⏭️ 未作答' };
  return labels[diagnosis] || '🕳️ 知识缺口';
}

function generateDiagnosisPrompt(answer, diagnosis) {
  const q = answer.question;
  const selected = answer.selected;
  const correctCard = getCard(q.cardId);
  const vectorLabel = { '0→1': '方名→症状', '1→0': '症状→方名', '0→2': '方名→核心药组', '2→0': '核心药组→方名', '0→contra': '方名→禁忌', '0→usage': '方名→煎服法' }[q.type] || q.type;
  const templates = {
    confused: `你是中医经方学习助手。用户在做"${vectorLabel}"题型时，把【${selected?.label || '未选'}】和【${correctCard?.name || ''}】搞混了。\n\n具体题目：\n- 题目：${q.text}\n- 用户选择了：${selected?.label || '未选'}\n- 正确答案是：${formatCorrectAnswer(q)}\n\n请用以下内容帮助用户区分：\n1. 两方的核心差异（症状、病机、药物组成）\n2. 简洁的口诀或记忆锚点\n3. 临床辨别的关键要点（一句话原则）\n\n要求：结构化输出，适合临床快速回忆。不超过400字。`,
    misremembered: `你是中医经方学习助手。用户在做"${vectorLabel}"题型时，出现了**反向盲区**——正向通路（如方名→症状）通畅，但反向通路（症状→方名）不通。这是「提取通路不对称」现象：0→1和1→0激活的是不同的神经通路，只练一个方向时，另一方向未被强化。\n\n具体题目：\n- 题目：${q.text}\n- 用户选择了：${selected?.label || '未选'}\n- 正确答案是：${formatCorrectAnswer(q)}\n\n请用以下内容帮助用户记忆：\n1. 解释为什么这个知识点容易记错（常见误区）\n2. 给出记忆锚点（联想、口诀、图像化）\n3. 补充临床运用要点（让知识变得有用）\n\n要求：不超过300字，便于记忆。`,
    unknown: `你是中医经方学习助手。用户在【${correctCard?.name || ''}】这个知识点上存在**知识缺口**——信息从未真正进入长期记忆。这通常是「深度加工不足」或「注意过滤」导致的编码失败，不是"没学过"，而是"学过但没编码"。\n\n具体题目：\n- 题目：${q.text}\n- 正确答案是：${formatCorrectAnswer(q)}\n\n请用以下内容帮用户快速入门：\n1. 这个方的核心定位（一句话记住它是干嘛的）\n2. 经典原文 + 关键症状（原文是最强的记忆锚点）\n3. 药物组成速记（核心药组）\n4. 临床应用一句话\n\n要求：入门友好，不超过300字。用"💡"标记关键要点。`,
    random: `你是中医经方学习助手。用户表示这道题是"决策失误"——知道知识点但选错了，或没看完题就冲动选择。这是「执行控制失败」现象：前额叶的抑制控制不足，系统1（直觉）压倒了系统2（理性）。\n\n具体题目：\n- ${q.text}\n- 正确答案是：${formatCorrectAnswer(q)}\n\n请用以下内容帮用户降低心理门槛：\n1. 用1-2句话提炼这个知识点的核心（不要长句）\n2. 给一个有趣的临床场景（让知识变得有趣/有用）\n3. 建议用户下次如何避免"乱选"心态（如：先深呼吸，先看关键词）\n\n要求：轻松、有温度、简短。不超过150字。用"🌟"标记鼓励的话。`,
    skipped: `你是中医经方学习助手。用户这道题没有作答，可能是时间不够或完全不会。\n\n具体题目：\n- ${q.text}\n- 正确答案是：${formatCorrectAnswer(q)}\n\n请用以下内容帮用户：\n1. 用1-2句话提炼这个知识点的核心\n2. 给一个记忆锚点（口诀或联想）\n3. 建议下次遇到不会的题目时如何处理\n\n要求：简短、不增加心理压力。不超过150字。`
  };
  return templates[diagnosis] || templates.unknown;
}

function createReviewSchedule(baseDate) {
  const base = new Date(baseDate);
  return EBINGHAUS_INTERVALS.map(days => {
    const d = new Date(base);
    d.setDate(d.getDate() + days);
    return { date: d.toISOString().split('T')[0], done: false };
  });
}

function saveStudyNote(data) {
  const notes = JSON.parse(localStorage.getItem(STUDY_NOTES_KEY) || '{"notes":[]}');
  const note = {
    id: 'note-' + Date.now(),
    timestamp: new Date().toISOString(),
    cardId: data.cardId,
    cardName: data.cardName,
    vector: data.vector,
    vectorLabel: data.vectorLabel,
    diagnosis: data.diagnosis,
    diagnosisLabel: getDiagnosisLabel(data.diagnosis),
    question: data.question,
    selected: data.selected,
    correct: data.correct,
    prompt: data.prompt,
    notes: data.notes,
    reviewSchedule: createReviewSchedule(new Date())
  };
  notes.notes.push(note);
  localStorage.setItem(STUDY_NOTES_KEY, JSON.stringify(notes));
  return note;
}

function loadStudyNotes() {
  try {
    return JSON.parse(localStorage.getItem(STUDY_NOTES_KEY) || '{"notes":[]}').notes;
  } catch (e) { return []; }
}

function getDueStudyNotes() {
  const today = new Date().toISOString().split('T')[0];
  return loadStudyNotes().filter(note => note.reviewSchedule && note.reviewSchedule.some(r => r.date === today && !r.done));
}

function markNoteReviewed(noteId) {
  const notes = JSON.parse(localStorage.getItem(STUDY_NOTES_KEY) || '{"notes":[]}');
  const today = new Date().toISOString().split('T')[0];
  const note = notes.notes.find(n => n.id === noteId);
  if (note) {
    const r = note.reviewSchedule.find(x => x.date === today);
    if (r) r.done = true;
    localStorage.setItem(STUDY_NOTES_KEY, JSON.stringify(notes));
  }
}

function exportStudyNotes() {
  const notes = localStorage.getItem(STUDY_NOTES_KEY) || '{"notes":[]}';
  const blob = new Blob([notes], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `A01_study_notes_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function copyToClipboard(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

function showToast(message) {
  const toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;transition:opacity 0.3s;';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2000);
}

// 导出/导入
function exportTraces() {
  const data = localStorage.getItem(TRACE_KEY) || '{"traces":[],"dailySummary":{}}';
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sh_traces_${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importTraces(jsonText) {
  try {
    const data = JSON.parse(jsonText);
    if (data.traces && data.dailySummary) {
      localStorage.setItem(TRACE_KEY, jsonText);
      return true;
    }
    return false;
  } catch (e) {
    return false;
  }
}

function importTraceFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    try {
      importTraces(text);
      showModal(`<div class="modal-title">✅ 导入成功</div><div class="modal-body">学习数据已恢复。页面即将刷新。</div><div class="modal-actions"><button class="modal-btn" onclick="closeModal();location.reload();">刷新页面</button></div>`);
    } catch (err) {
      showModal(`<div class="modal-title">❌ 导入失败</div><div class="modal-body">${err.message}</div><div class="modal-actions"><button class="modal-btn" onclick="closeModal()">关闭</button></div>`);
    }
  };
  input.click();
}

function onHerbClick(herbName, fromCardId) {
  recordTrace('link_click', 'herb', herbName, fromCardId, getCard(fromCardId)?.formula_name || '');

  // 标准化药名
  const standardName = (window.HERB_ALIAS_MAP && window.HERB_ALIAS_MAP[herbName]) || herbName;
  const isAlias = standardName !== herbName;
  const classInfo = (window.HERB_CLASS_MAP && window.HERB_CLASS_MAP[standardName]) || { class_name: standardName + '相关方', count: 0 };

  // 计算查看次数（从痕迹记录中）
  let viewCount = 0;
  try {
    const traceData = JSON.parse(localStorage.getItem(TRACE_KEY) || '{"traces":[]}');
    viewCount = traceData.traces.filter(t => t.type === 'link_click' && t.target === 'herb' && ((window.HERB_ALIAS_MAP && window.HERB_ALIAS_MAP[t.targetName]) || t.targetName) === standardName).length;
  } catch(e) {}

  // 查找所有含该标准药名的方（fallback：如果标准名找不到，也尝试原始名匹配）
  let containingCards = CARDS.filter(c => {
    const herbs = c.data?.canonical?.herbs || [];
    return herbs.some(h => {
      const hStandard = (window.HERB_ALIAS_MAP && window.HERB_ALIAS_MAP[h.name]) || h.name;
      return hStandard === standardName;
    });
  });

  // Fallback：如果标准名没找到，尝试直接包含原始名或标准名
  if (containingCards.length === 0) {
    containingCards = CARDS.filter(c => {
      const herbs = c.data?.canonical?.herbs || [];
      return herbs.some(h => h.name === herbName || h.name === standardName || h.name.includes(herbName) || herbName.includes(h.name));
    });
  }

  // 按 lineage/base_formula 分组（类方）
  const groups = {};
  containingCards.forEach(c => {
    const base = c.lineage?.base_formula || c.formula_name;
    if (!groups[base]) groups[base] = [];
    groups[base].push(c);
  });

  // 按组大小排序，取前3组
  const sortedGroups = Object.entries(groups).sort((a, b) => b[1].length - a[1].length).slice(0, 3);

  let html = `<div class="modal-title">🌿 ${standardName}${isAlias ? `<span style="font-size:13px;color:var(--text-muted);font-weight:400;">（${herbName}）</span>` : ''}${viewCount > 0 ? `<span style="font-size:12px;color:var(--text-muted);font-weight:400;margin-left:8px;">· 已查看 ${viewCount} 次</span>` : ''}</div>`;
  html += `<div class="modal-body">`;

  if (classInfo.count > 0) {
    html += `<div style="margin-bottom:12px;font-size:12px;color:var(--text-secondary);background:var(--accent-bg);padding:6px 10px;border-radius:6px;display:inline-block;">类方：${classInfo.class_name} · 共 ${classInfo.count} 方</div>`;
  }

  if (sortedGroups.length > 0) {
    sortedGroups.forEach(([baseName, groupCards]) => {
      html += `<div style="margin-top:14px;">`;
      html += `<div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:8px;border-left:3px solid var(--accent);padding-left:8px;">${baseName} 系列（${groupCards.length}方）</div>`;
      html += `<div style="display:flex;flex-direction:column;gap:8px;">`;
      groupCards.slice(0, 5).forEach(c => {
        const m = c.mastery || {};
        const done = Object.values(m).filter(x => x && x.status === '已掌握').length;
        const total = Object.keys(m).length;
        const herbInCard = c.data?.canonical?.herbs?.find(h => {
          const hStandard = (window.HERB_ALIAS_MAP && window.HERB_ALIAS_MAP[h.name]) || h.name;
          return hStandard === standardName;
        });
        html += `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg-card);border-radius:8px;border:1px solid var(--border);cursor:pointer;transition:all 0.15s;" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='var(--bg-card)'" onclick="handleModalGoToLearn('${c.id}')">
            <div>
              <div style="font-weight:600;font-size:14px;color:var(--text-primary);">${c.name}</div>
              <div style="font-size:12px;color:var(--text-secondary);margin-top:2px;">${c.desc || ''}${herbInCard ? ' · 该方中' + herbInCard.dosage : ''}</div>
            </div>
            <div style="display:flex;gap:3px;flex-shrink:0;margin-left:8px;">
              ${Array.from({length: total}, (_, i) => `<div style="width:7px;height:7px;border-radius:50%;background:${i < done ? 'var(--success)' : 'var(--border)'};"></div>`).join('')}
            </div>
          </div>
        `;
      });
      if (groupCards.length > 5) {
        html += `<div style="font-size:12px;color:var(--text-muted);text-align:center;">还有 ${groupCards.length - 5} 个方...</div>`;
      }
      html += `</div></div>`;
    });
  } else {
    html += `<p style="color:var(--text-muted);">该药物在系统方剂中未记录。可能是别名未收录，建议检查。</p>`;
  }
  html += `</div>`;
  html += `<div class="modal-actions">`;
  if (containingCards.length > 0) {
    html += `<button class="modal-btn primary" onclick="handleModalGoToLearn('${containingCards[0].id}')">去学习 ${containingCards[0].name}</button>`;
  }
  html += `<button class="modal-btn" onclick="closeModal()">关闭</button>`;
  html += `</div>`;

  showModal(html);
}

function showModal(contentHtml, className) {
  let overlay = document.getElementById('traceModal');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'traceModal';
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal-box" id="traceModalBox"></div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeModal();
    });
  }
  const box = document.getElementById('traceModalBox');
  box.innerHTML = contentHtml;
  if (className) {
    box.className = 'modal-box ' + className;
  } else {
    box.className = 'modal-box';
  }
  overlay.classList.add('active');
  // ESC 关闭弹窗
  const escHandler = (e) => {
    if (e.key === 'Escape') {
      closeModal();
      document.removeEventListener('keydown', escHandler);
    }
  };
  document.addEventListener('keydown', escHandler);
}

function closeModal() {
  const overlay = document.getElementById('traceModal');
  if (overlay) overlay.classList.remove('active');
}

// ==================== 方案B：条文讲解滑入面板（v2：分类阅读版）====================

let slidePanelState = {
  articles: [],      // 标准化后的条文数组
  currentArticle: 0, // 当前条文索引
  currentTab: 0,     // 当前标签索引
  cardId: null,
  cardName: '',
  myNotes: {}        // { articleIndex: '用户笔记' }
};

/**
 * 数据兼容层：统一新旧两种 source_annotations 格式
 * 旧格式：card.references.source_annotations = [{id, title, source, summary: "【条文】...\n【刘渡舟】..."}]
 * 新格式：card.source_annotations.references = [{text, annotations: {刘渡舟, 胡希恕, 个人总结}}]
 * 输出：{article_number, title, source, tabs: [{label, content}]}
 */
function normalizeSourceAnnotations(card) {
  const articles = [];

  // 1. 新格式：card.source_annotations.references[]
  const sa = card.source_annotations;
  if (sa && sa.references && sa.references.length) {
    sa.references.forEach(ref => {
      const tabs = [];
      // 条文原文
      if (ref.text) {
        tabs.push({ label: '条文', content: ref.text });
      }
      // 注家讲解
      if (ref.annotations) {
        const annoOrder = ['刘渡舟', '胡希恕', '个人总结'];
        annoOrder.forEach(key => {
          if (ref.annotations[key] && ref.annotations[key].trim()) {
            tabs.push({ label: key, content: ref.annotations[key] });
          }
        });
        // 其他未列出的键
        Object.keys(ref.annotations).forEach(key => {
          if (!annoOrder.includes(key) && ref.annotations[key] && ref.annotations[key].trim()) {
            tabs.push({ label: key, content: ref.annotations[key] });
          }
        });
      }
      if (tabs.length) {
        articles.push({
          article_number: ref.article_number || '',
          title: ref.article_number || '条文',
          source: ref.source_name || '伤寒论',
          tabs: tabs
        });
      }
    });
  }

  // 2. 旧格式：card.references.source_annotations[]
  const refs = card.references;
  if (refs && refs.source_annotations && refs.source_annotations.length) {
    refs.source_annotations.forEach(anno => {
      const summary = anno.summary || '';
      if (!summary.trim()) return;
      // 解析 summary 中的标签
      const tabs = [];
      const tagPattern = /【([^】]+)】/g;
      let match;
      let lastIndex = 0;
      let currentLabel = null;
      let currentContent = [];

      const lines = summary.split('\n');
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const tagMatch = line.match(/【([^】]+)】/);
        if (tagMatch) {
          // 保存之前的标签内容
          if (currentLabel && currentContent.length) {
            tabs.push({
              label: currentLabel,
              content: currentContent.join('\n').trim()
            });
          }
          currentLabel = tagMatch[1];
          // 去掉标签后的内容
          const rest = line.substring(tagMatch[0].length).trim();
          currentContent = rest ? [rest] : [];
        } else if (currentLabel) {
          currentContent.push(line);
        } else {
          // 在第一个标签之前的内容，归为"条文"
          if (line.trim()) {
            if (!tabs.find(t => t.label === '条文')) {
              tabs.push({ label: '条文', content: line.trim() });
            } else {
              const t = tabs.find(t => t.label === '条文');
              t.content += '\n' + line.trim();
            }
          }
        }
      }
      // 保存最后一个标签
      if (currentLabel && currentContent.length) {
        tabs.push({
          label: currentLabel,
          content: currentContent.join('\n').trim()
        });
      }

      // 如果没有解析到标签，把整条 summary 作为"条文"
      if (tabs.length === 0) {
        tabs.push({ label: '条文', content: summary.trim() });
      }

      // 统一标签名："条文" -> 放最前面，其他保持原样
      const textTab = tabs.find(t => t.label === '条文');
      const otherTabs = tabs.filter(t => t.label !== '条文');
      const orderedTabs = textTab ? [textTab, ...otherTabs] : otherTabs;

      articles.push({
        article_number: anno.title || '',
        title: anno.title || '条文',
        source: anno.source || '伤寒论',
        tabs: orderedTabs
      });
    });
  }

  // 3. 从 SOURCE_CARDS 补充原文（新增，适配 article-XXX 格式）
  // 优先检查 card.source_text_ids，如果 SOURCE_CARDS 中有对应条文，融合或补充
  if (card.source_text_ids && window.SOURCE_CARDS && window.SOURCE_CARDS.length) {
    card.source_text_ids.forEach(id => {
      const sc = window.SOURCE_CARDS.find(x => x.id === id);
      if (!sc || !sc.text) return;
      // 检查是否已存在该条文（通过 article_number 匹配）
      const existing = articles.find(a => a.article_number === (sc.article_number || ''));
      if (existing) {
        // 如果已有文章但没有"条文"标签，将 source_cards 的 text 作为条文补充
        if (!existing.tabs.find(t => t.label === '条文')) {
          existing.tabs.unshift({ label: '条文', content: sc.text });
        }
      } else {
        // 创建一个只有"条文"的新 article
        articles.push({
          article_number: sc.article_number || '',
          title: '第' + sc.article_number + '条' || '条文',
          source: sc.source || '伤寒论',
          tabs: [{ label: '条文', content: sc.text }]
        });
      }
    });
  }

  return articles;
}

function openSlidePanel(card) {
  const articles = normalizeSourceAnnotations(card);
  if (!articles.length) {
    showToast('暂无条文讲解');
    return;
  }
  slidePanelState = {
    articles: articles,
    currentArticle: 0,
    currentTab: 0,
    cardId: card.id,
    cardName: card.name || card.formula_name || '本方',

  };

  document.getElementById('slideOverlay').classList.add('open');
  document.getElementById('slidePanel').classList.add('open');
  document.body.classList.add('panel-open');

}

function closeSlidePanel() {
  document.getElementById('slideOverlay').classList.remove('open');
  document.getElementById('slidePanel').classList.remove('open');
  document.body.classList.remove('panel-open');
}

function getSlidePanelDisplayTabs(article) {
  // 分级解锁：根据卡片掌握度控制显示内容
  let masteryLevel = 0;
  const cardId = slidePanelState.cardId;
  if (cardId) {
    const card = getCard(cardId);
    if (card && card.mastery) {
      // 取最高掌握度等级（6向量中取最大值）
      Object.values(card.mastery).forEach(m => {
        if (m && m.level > masteryLevel) masteryLevel = m.level;
      });
    }
  }
  
  const tabs = article.tabs.slice();
  
  // 根据掌握度过滤标签
  if (masteryLevel <= 1) {
    // 只显示【条文】
    const textTab = tabs.find(t => t.label === '条文');
    tabs.length = 0;
    if (textTab) tabs.push(textTab);
  } else if (masteryLevel <= 3) {
    // 显示【条文】+【刘渡舟】（注家讲解）
    const textTab = tabs.find(t => t.label === '条文');
    const liuTab = tabs.find(t => t.label === '刘渡舟');
    tabs.length = 0;
    if (textTab) tabs.push(textTab);
    if (liuTab) tabs.push(liuTab);
  } else {
    // 显示全部：原文 + 刘渡舟 + 胡希恕 + 个人总结 + 对比
    const hasLiuduzhou = tabs.find(t => t.label === '刘渡舟');
    const hasHuxishu = tabs.find(t => t.label === '胡希恕');
    if (hasLiuduzhou && hasHuxishu) {
      tabs.push({
        label: '对比',
        content: `<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px;">
          <div style="border-right:1px solid var(--border);padding-right:12px;">
            <div class="md-tag-compare" style="margin-bottom:10px;">刘渡舟</div>
            ${renderSlideMD(hasLiuduzhou.content)}
          </div>
          <div style="padding-left:4px;">
            <div class="md-tag-compare" style="margin-bottom:10px;">胡希恕</div>
            ${renderSlideMD(hasHuxishu.content)}
          </div>
        </div>`
      });
    }
  }
  
  // 无论掌握度如何，都保留"我的理解"编辑区
  tabs.push({ label: '我的理解', content: '', editable: true });
  return tabs;
}

function slidePanelRender() {
  const { articles, currentArticle, currentTab, myNotes } = slidePanelState;
  const article = articles[currentArticle];
  if (!article) return;

  // 动态构建 displayTabs
  const displayTabs = getSlidePanelDisplayTabs(article);
  // 如果 currentTab 越界，重置
  if (currentTab >= displayTabs.length) {
    slidePanelState.currentTab = 0;
  }
  const activeTab = displayTabs[slidePanelState.currentTab];

  // 标题
  document.getElementById('slidePanelTitle').textContent = article.title;
  document.getElementById('slidePanelMeta').textContent = article.source;

  // 翻页指示器
  const navIndicator = document.getElementById('slidePanelNavIndicator');
  const prevBtn = document.getElementById('slidePanelPrevBtn');
  const nextBtn = document.getElementById('slidePanelNextBtn');
  if (articles.length > 1) {
    navIndicator.textContent = (currentArticle + 1) + ' / ' + articles.length;
    prevBtn.disabled = currentArticle === 0;
    nextBtn.disabled = currentArticle === articles.length - 1;
    document.getElementById('slidePanelNav').style.display = 'flex';
  } else {
    document.getElementById('slidePanelNav').style.display = 'none';
  }

  // 标签栏
  const tabsEl = document.getElementById('slidePanelTabs');
  let tabsHtml = '';
  displayTabs.forEach((tab, idx) => {
    const keyNum = idx < 9 ? (idx + 1) : '';
    const active = idx === slidePanelState.currentTab ? 'active' : '';
    tabsHtml += `<button class="slide-panel-tab ${active}" onclick="slidePanelSwitchTab(${idx})" data-tab="${idx}">${tab.label}<span class="tab-key">${keyNum}</span></button>`;
  });
  tabsEl.innerHTML = tabsHtml;

  // 内容区
  const contentEl = document.getElementById('slidePanelBody');
  if (activeTab) {
    if (activeTab.editable) {
      const savedNote = myNotes[currentArticle] || '';
      contentEl.innerHTML = `<div class="slide-panel-my-note">
        <textarea id="myNoteArea" placeholder="在此记录你对本条文的理解...">${savedNote}</textarea>
        <div style="text-align:right;margin-top:10px;">
          <button class="btn-small btn-accent" onclick="saveMyNote()">💾 保存笔记</button>
        </div>
      </div>`;
    } else {
      contentEl.innerHTML = renderSlideMD(activeTab.content);
    }
  } else {
    contentEl.innerHTML = '';
  }

  // 更新底部提示（动态显示可用的快捷键）
  const hintEl = document.getElementById('slidePanelHint');
  let hintParts = [];
  displayTabs.forEach((tab, idx) => {
    if (idx < 9) hintParts.push(`<kbd>${idx+1}</kbd>${tab.label}`);
  });
  if (articles.length > 1) {
    hintParts.push('<kbd>-</kbd>上条', '<kbd>=</kbd>下条');
  }
  hintParts.push('<kbd>Space</kbd>遮住', '<kbd>Esc</kbd>关闭');
  hintEl.innerHTML = hintParts.join(' ');
}

function slidePanelSwitchTab(idx) {
  const article = slidePanelState.articles[slidePanelState.currentArticle];
  if (!article) return;
  const displayTabs = getSlidePanelDisplayTabs(article);
  if (idx < 0 || idx >= displayTabs.length) return;
  slidePanelState.currentTab = idx;
  slidePanelRender();
}

function saveMyNote() {
  const textarea = document.getElementById('myNoteArea');
  if (!textarea) return;
  const note = textarea.value.trim();
  const { currentArticle } = slidePanelState;
  slidePanelState.myNotes[currentArticle] = note;
  // 保存到 localStorage
  const allNotes = JSON.parse(localStorage.getItem('source_notes_v1') || '{}');
  const cardId = slidePanelState.cardId;
  if (!allNotes[cardId]) allNotes[cardId] = {};
  allNotes[cardId][currentArticle] = note;
  localStorage.setItem('source_notes_v1', JSON.stringify(allNotes));
  showToast('笔记已保存');
}

function loadMyNotes() {
  const allNotes = JSON.parse(localStorage.getItem('source_notes_v1') || '{}');
  const cardId = slidePanelState.cardId;
  if (cardId && allNotes[cardId]) {
    slidePanelState.myNotes = { ...allNotes[cardId] };
  }
}

function slidePanelPrevArticle() {
  if (slidePanelState.currentArticle > 0) {
    slidePanelState.currentArticle--;
    slidePanelState.currentTab = 0;
    slidePanelRender();
  }
}

function slidePanelNextArticle() {
  if (slidePanelState.currentArticle < slidePanelState.articles.length - 1) {
    slidePanelState.currentArticle++;
    slidePanelState.currentTab = 0;
    slidePanelRender();
  }
}

function renderSlideMD(text) {
  if (!text) return '';
  // 预处理标签着色（兼容旧格式字符串中可能残留的【标签】）
  let processed = text
    .replace(/【条文】/g, '<span class="md-tag">【条文】</span>')
    .replace(/【刘渡舟】/g, '<span class="md-tag-teacher1">【刘渡舟】</span>')
    .replace(/【胡希恕】/g, '<span class="md-tag-teacher2">【胡希恕】</span>')
    .replace(/个人总结/g, '<span class="md-tag" style="background:#f5f0e8;color:#8a6a3a;border-color:#c4a86b;">个人总结</span>');
  // 简单 Markdown 渲染
  let html = processed;
  html = html.replace(/^>(.*)$/gm, '<div class="md-quote">$1</div>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  const paragraphs = html.split(/\n\n+/);
  html = paragraphs.map(p => {
    if (p.trim().includes('class="md-quote"')) return p;
    if (p.trim().startsWith('<span class="md-tag')) return '<p>' + p + '</p>';
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');
  return html;
}

function toggleMask() {
  const contentEl = document.getElementById('slidePanelBody');
  if (!contentEl) return;
  let mask = contentEl.querySelector('.slide-mask');
  if (mask) {
    mask.remove();
  } else {
    mask = document.createElement('div');
    mask.className = 'slide-mask';
    mask.innerHTML = '<div class="slide-mask-text">先回忆一下...<br><small style="color:var(--text-muted);font-size:13px;">按 Space 或点击按钮显示内容</small></div>';
    contentEl.appendChild(mask);
  }
}

function startSourceQuiz() {
  const { articles, currentArticle, cardId } = slidePanelState;
  const article = articles[currentArticle];
  if (!article || !cardId) {
    showToast('无法生成测试题');
    return;
  }
  const card = (window.CARDS || []).find(c => c.id === cardId);
  if (!card || !card.source_text_ids || !card.source_text_ids.length) {
    showToast('当前卡片没有关联的条文 ID');
    return;
  }
  // 从 SOURCE_CARDS 取第一条关联条文
  const sc = window.SOURCE_CARDS && window.SOURCE_CARDS.find(x => x.id === card.source_text_ids[0]);
  if (!sc) {
    showToast('未找到对应的条文数据');
    return;
  }
  // 简单随机选题
  const questions = [];
  if (sc.mentioned_formulas && sc.mentioned_formulas.length) {
    questions.push({
      q: `【${sc.article_number || '条文'}】本条文的对应方剂是？`,
      a: sc.mentioned_formulas.join('、')
    });
  }
  if (sc.symptoms && sc.symptoms.length) {
    const necessary = sc.symptoms.filter(s => s.type === 'necessary');
    const target = necessary.length ? necessary : sc.symptoms;
    if (target.length) {
      questions.push({
        q: `【${sc.article_number || '条文'}】本条文的必要症状是？`,
        a: target.slice(0, 3).map(s => s.name || s).join('、')
      });
    }
  }
  if (questions.length === 0) {
    showToast('当前条文信息不足，无法生成测试题');
    return;
  }
  const q = questions[Math.floor(Math.random() * questions.length)];
  const userAnswer = window.prompt(q.q + '\n\n请输入你的答案：');
  if (userAnswer !== null) {
    const correct = userAnswer.trim() === q.a || q.a.includes(userAnswer.trim()) || userAnswer.trim().includes(q.a);
    if (correct) {
      alert('✅ 回答正确！\n\n正确答案：' + q.a);
    } else {
      alert('❌ 回答错误。\n\n你的答案：' + userAnswer + '\n正确答案：' + q.a);
    }
  }
}

// 键盘快捷键：数字键切换标签，-=翻页，Esc关闭，Space遮住
document.addEventListener('keydown', function(e) {
  const panel = document.getElementById('slidePanel');
  if (!panel || !panel.classList.contains('open')) return;

  if (e.key === 'Escape') {
    closeSlidePanel();
    return;
  }

  const { articles, currentArticle } = slidePanelState;
  const article = articles[currentArticle];
  const displayTabs = article ? getSlidePanelDisplayTabs(article) : [];

  // Space 遮住/显示内容
  if (e.key === ' ' || e.key === 'Spacebar') {
    e.preventDefault();
    toggleMask();
    return;
  }

  // 数字键 1-9 切换标签
  if (/^[1-9]$/.test(e.key)) {
    const idx = parseInt(e.key) - 1;
    if (idx < displayTabs.length) {
      slidePanelSwitchTab(idx);
    }
    return;
  }

  // - 上一条文
  if (e.key === '-' || e.key === '_') {
    slidePanelPrevArticle();
    return;
  }
  // = 下一条文
  if (e.key === '=' || e.key === '+') {
    slidePanelNextArticle();
    return;
  }
});

<script>
// ==================== 临床录入系统 ====================
const CL_KEY = 'clinical_records_v1';

let clState = {
  view: 'list',
  records: [],
  dataLoaded: false,
  symptomIndex: null,
  formulaCards: null,
  articleMap: null,
  currentInput: '',
  currentResult: null,
  currentId: null,
  currentRecord: null,
  collectionEval: null,
  addInput: ''
};

function goToClinical() {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('viewClinical').classList.add('active');
  state.page = 'clinical';
  clInit();
}

function clInit() {
  clLoadRecords();
  clState.collectionEval = null;
  clState.addInput = '';
  if (!clState.dataLoaded) {
    clLoadData().then(() => clRender()).catch(() => clRender());
  } else {
    clRender();
  }
}

function clLoadRecords() {
  clState.records = JSON.parse(localStorage.getItem(CL_KEY) || '[]');
}

function clSaveRecords() {
  localStorage.setItem(CL_KEY, JSON.stringify(clState.records));
}

function clGenerateId() {
  const now = new Date();
  const d = now.toISOString().slice(0,10).replace(/-/g,'');
  const t = now.toTimeString().slice(0,8).replace(/:/g,'');
  const seq = String(clState.records.filter(r => r.id.startsWith('P-' + d)).length + 1).padStart(3, '0');
  return 'P-' + d + '-' + t + '-' + seq;
}

async function clLoadData() {
  const [si, fc, am] = await Promise.all([
    fetch('../data/symptom_expression_index.json').then(r => r.json()).catch(() => null),
    fetch('../data/formula_cards.json').then(r => r.json()).catch(() => null),
    fetch('../data/source_article_map.json').then(r => r.json()).catch(() => null)
  ]);
  clState.symptomIndex = si;
  clState.formulaCards = fc;
  clState.articleMap = am;
  clState.dataLoaded = true;
}

function clParseText(text) {
  const std = [];
  const quotes = [];
  const conf = {};
  const seen = new Set();
  
  if (clState.symptomIndex && clState.symptomIndex.symptoms) {
    Object.entries(clState.symptomIndex.symptoms).forEach(([sym, info]) => {
      if (info.expressions) {
        info.expressions.forEach(expr => {
          if (text.includes(expr) && !seen.has(sym)) {
            seen.add(sym);
            std.push(sym);
            quotes.push(expr);
            conf[sym] = 0.95;
          }
        });
      }
    });
  }
  
  const pulsePatterns = ['浮缓','浮紧','浮数','沉细','沉紧','迟','数','滑','涩','弦','弱','虚','实','洪','微'];
  pulsePatterns.forEach(p => {
    if (text.includes(p) && !seen.has('脉'+p)) {
      seen.add('脉'+p);
      std.push('脉'+p);
      conf['脉'+p] = 0.9;
    }
  });
  
  const directKeywords = {
    '汗出': ['汗出','出汗','有汗','自汗','盗汗'],
    '无汗': ['无汗','不出汗','没汗','皮肤干燥'],
    '恶风': ['恶风','怕风','畏风','风吹难受'],
    '恶寒': ['恶寒','怕冷','畏寒','寒战'],
    '头痛': ['头痛','头疼','头胀'],
    '身痛': ['身痛','身体疼痛','周身疼痛','全身酸痛'],
    '发热': ['发热','发烧','身热','潮热'],
    '口渴': ['口渴','口干','想喝水','渴欲饮水'],
    '不渴': ['不渴','口不渴','不想喝水'],
    '呕吐': ['呕吐','吐','恶心','干呕'],
    '下利': ['下利','腹泻','拉肚子','便溏'],
    '便秘': ['便秘','大便难','几日未行'],
    '喘': ['喘','气喘','呼吸急促'],
    '胸胁苦满': ['胸胁','胁下','两胁'],
    '心烦': ['心烦','烦躁','心中烦'],
    '但欲寐': ['但欲寐','只想睡','昏昏欲睡'],
    '四肢厥逆': ['四肢冷','手足冷','手脚冰凉','厥冷']
  };
  
  Object.entries(directKeywords).forEach(([sym, keywords]) => {
    if (!seen.has(sym)) {
      keywords.forEach(kw => {
        if (text.includes(kw)) {
          seen.add(sym);
          std.push(sym);
          quotes.push(kw);
          conf[sym] = 0.9;
          return;
        }
      });
    }
  });
  
  return { std, quotes, conf };
}

function clMatchFormulas(symptomVector) {
  if (!clState.formulaCards || !Array.isArray(clState.formulaCards)) return [];
  const results = [];
  
  clState.formulaCards.forEach(card => {
    const profile = card.data && card.data.canonical && card.data.canonical.symptom_profile;
    if (!profile) return;
    
    const necessary = profile.necessary || [];
    const common = profile.common || [];
    const excluding = profile.excluding || [];
    
    const necessaryMatch = necessary.filter(s => symptomVector.includes(s));
    const necessaryRate = necessary.length > 0 ? necessaryMatch.length / necessary.length : 1;
    if (necessaryRate < 0.5) return;
    
    const excludingHit = excluding.filter(s => symptomVector.includes(s));
    const disqualified = excludingHit.length > 0;
    
    const commonMatch = common.filter(s => symptomVector.includes(s));
    let score = necessaryMatch.length * 3 + commonMatch.length * 1;
    
    let articleBoost = 0;
    let articleId = null;
    if (clState.articleMap && Array.isArray(clState.articleMap)) {
      clState.articleMap.forEach(art => {
        if (art.formulas && art.formulas.includes(card.id)) {
          if (art.symptom_pool) {
            const overlap = art.symptom_pool.filter(s => symptomVector.includes(s));
            const overlapRate = overlap.length / art.symptom_pool.length;
            if (overlapRate > 0.5) {
              articleBoost = 2;
              articleId = art.id;
            }
          }
        }
      });
    }
    
    score += articleBoost;
    if (disqualified) score -= 5;
    
    results.push({
      formula_id: card.id,
      formula_name: card.formula_name || card.name,
      score,
      necessary_match: necessaryMatch,
      necessary_miss: necessary.filter(s => !symptomVector.includes(s)),
      common_match: commonMatch,
      common_miss: common.filter(s => !symptomVector.includes(s)),
      excluding_hit: excludingHit,
      disqualified,
      article_boost: articleBoost,
      article_id: articleId,
      herbs: (card.data && card.data.canonical && card.data.canonical.herbs) || [],
      contraindications: (card.data && card.data.canonical && card.data.canonical.contraindications) || [],
      usage: (card.data && card.data.canonical && card.data.canonical.usage) || '',
      pathology: (card.data && card.data.canonical && card.data.canonical.pathology) || ''
    });
  });
  
  results.sort((a, b) => b.score - a.score);
  return results.slice(0, 10);
}

function clBuildReason(rec) {
  const parts = [];
  if (rec.necessary_match && rec.necessary_match.length > 0) parts.push('必要症状命中 ' + rec.necessary_match.join('、'));
  if (rec.common_match && rec.common_match.length > 0) parts.push('常见症状命中 ' + rec.common_match.join('、'));
  if (rec.necessary_miss && rec.necessary_miss.length > 0) parts.push('必要症状缺失 ' + rec.necessary_miss.join('、'));
  if (rec.common_miss && rec.common_miss.length > 0) parts.push('常见症状缺失 ' + rec.common_miss.join('、'));
  if (rec.article_boost && rec.article_boost > 0) parts.push('条文增强（' + rec.article_id + '）');
  if (rec.article_id && (!rec.article_boost || rec.article_boost === 0)) parts.push('条文依据：' + rec.article_id);
  return parts.join('；') || '症状部分匹配';
}

function clBuildCompareTable(first, second, symptoms) {
  if (!first || !second) return '';
  const allSymptoms = [...new Set([...first.necessary_match, ...first.common_match, ...first.necessary_miss, ...second.necessary_match, ...second.common_match, ...second.necessary_miss])];
  let html = '<div class="cl-differentiation"><strong>关键鉴别对比</strong>';
  html += '<div class="cl-compare-table">';
  html += '<div class="cl-compare-row"><div class="cl-compare-header">症状</div><div class="cl-compare-header">' + first.formula_name + '</div><div class="cl-compare-header">' + second.formula_name + '</div></div>';
  allSymptoms.forEach(sym => {
    const inFirst = first.necessary_match.includes(sym) || first.common_match.includes(sym);
    const inSecond = second.necessary_match.includes(sym) || second.common_match.includes(sym);
    const missFirst = first.necessary_miss.includes(sym);
    const missSecond = second.necessary_miss.includes(sym);
    let cell1 = missFirst ? '<span class="cl-compare-cell unknown">❓ 未确认</span>' : (inFirst ? '<span class="cl-compare-cell yes">✅ 有</span>' : '<span class="cl-compare-cell no">❌ 无</span>');
    let cell2 = missSecond ? '<span class="cl-compare-cell unknown">❓ 未确认</span>' : (inSecond ? '<span class="cl-compare-cell yes">✅ 有</span>' : '<span class="cl-compare-cell no">❌ 无</span>');
    html += '<div class="cl-compare-row"><div class="cl-compare-cell" style="text-align:left;font-weight:600;">' + sym + '</div>' + cell1 + cell2 + '</div>';
  });
  html += '</div>';
  const hints = [];
  if (first.necessary_miss.length > 0) hints.push(first.formula_name + ' 需确认：' + first.necessary_miss.join('、'));
  if (second.necessary_miss.length > 0) hints.push(second.formula_name + ' 需确认：' + second.necessary_miss.join('、'));
  if (hints.length > 0) {
    html += '<div class="cl-compare-hint">💡 问诊提示：' + hints.join('；') + '</div>';
  }
  html += '</div>';
  return html;
}

function clGenerateIMAPrompt() {
  const result = clState.currentResult;
  if (!result) return '';
  const top3 = result.recommendations.slice(0, 3);
  let prompt = '【伤寒论方证分析 · 求进一步确认】\n\n';
  prompt += '患者原始症状总结：\n' + clState.currentInput + '\n\n';
  prompt += '系统已提取标准症状：\n' + result.standard_symptoms.join('、') + '\n\n';
  prompt += '系统推荐TOP3：\n';
  top3.forEach((rec, i) => {
    const label = i === 0 ? '高度匹配' : i === 1 ? '条件匹配' : '参考';
    prompt += (i+1) + '. ' + rec.formula_name + '（' + label + '）\n';
    if (rec.necessary_match.length > 0) prompt += '   - 必要症状命中：' + rec.necessary_match.join('、') + '\n';
    if (rec.necessary_miss.length > 0) prompt += '   - 未确认症状：' + rec.necessary_miss.join('、') + '\n';
    if (rec.excluding_hit.length > 0) prompt += '   - 禁忌命中：' + rec.excluding_hit.join('、') + '\n';
    if (rec.article_id) prompt += '   - 条文依据：' + rec.article_id + '\n';
    prompt += '\n';
  });
  if (top3.length >= 2) {
    const first = top3[0];
    const second = top3[1];
    const diff = first.necessary_match.filter(s => !second.necessary_match.includes(s));
    const diff2 = second.necessary_match.filter(s => !first.necessary_match.includes(s));
    prompt += '关键鉴别难点：\n';
    if (diff.length > 0 || diff2.length > 0) {
      prompt += first.formula_name + ' 核心指征：' + (diff.length > 0 ? diff.join('、') : '与' + second.formula_name + '重叠') + '\n';
      prompt += second.formula_name + ' 核心指征：' + (diff2.length > 0 ? diff2.join('、') : '与' + first.formula_name + '重叠') + '\n';
    } else {
      prompt += first.formula_name + ' 与 ' + second.formula_name + ' 症状重叠度高，需进一步问诊区分。\n';
    }
    prompt += '\n';
  }
  prompt += '请帮我：\n';
  prompt += '1. 确认以上症状提取是否完整，有无遗漏？\n';
  prompt += '2. 针对"未确认症状"给出具体问诊话术\n';
  prompt += '3. 基于现有信息，给出最终的方证取舍建议\n';
  return prompt;
}

function clCopyIMAPrompt() {
  const prompt = clGenerateIMAPrompt();
  if (!prompt) { alert('暂无解析结果'); return; }
  const body = document.getElementById('clImaPromptBody');
  if (body) body.textContent = prompt;
  const overlay = document.getElementById('clImaOverlay');
  const panel = document.getElementById('clImaPrompt');
  if (overlay) overlay.classList.add('active');
  if (panel) panel.classList.add('active');
  if (navigator.clipboard) {
    navigator.clipboard.writeText(prompt).then(() => showToast('IMA 提示词已复制')).catch(() => {});

    const ta = document.createElement('textarea');

    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('IMA 提示词已复制');
  }
}

function clCloseIMAPrompt() {

function clSaveVisit() {
  if (!clState.currentRecord || !clState.currentResult) return;
  const seq = clState.currentRecord.visits.length + 1;
  const evalData = clState.collectionEval || { level: '充足', collected: [], missing: [] };
  const visit = {
    visit_id: 'V-' + clState.currentId.split('-').slice(1).join('-') + '-' + String(seq).padStart(3, '0'),
    input_text: clState.currentInput,
    standard_symptoms: clState.currentResult.standard_symptoms,
    recommendations: clState.currentResult.recommendations.slice(0, 3).map(r => ({
      formula_id: r.formula_id,
      formula_name: r.formula_name,
      score: r.score,
      necessary_match: r.necessary_match,
      common_match: r.common_match,
      excluding_hit: r.excluding_hit,
      article_id: r.article_id
    })),
    collection_status: 'completed',
    dimensions_collected: evalData.collected,
    dimensions_missing: evalData.missing
  };
  clState.currentRecord.visits.push(visit);
  clSaveRecords();
  clState.collectionEval = null;
  clState.addInput = '';
  clState.view = 'list';
  clRender();
  showToast('已保存到档案');
}


function clEvaluateCollection(text) {
  const dimensions = [
    { key: '寒热', keywords: ['寒','热','冷','热','发热','恶寒','恶风','畏寒','寒战','潮热','蒸蒸','翕翕','身热'], inquiry: '有无发热、恶寒、怕冷？体温变化？' },
    { key: '汗出', keywords: ['汗','出汗','无汗','有汗','自汗','盗汗','大汗','微汗','但头汗出','遍身'], inquiry: '有无出汗？出汗部位？白天还是夜间？' },
    { key: '头身', keywords: ['头','身','痛','疼','头痛','头胀','身痛','身重','腰痛','骨节','项','背','项背','强几几','脖子','颈','肩'], inquiry: '有无头痛、身痛、项背强痛？' },
    { key: '二便', keywords: ['便','大','小','尿','便秘','便溏','下利','腹泻','小便','不利','尿','频','夜尿'], inquiry: '大便次数、性状？小便量、色？' },
    { key: '饮食', keywords: ['食','饮','渴','不渴','口','口干','想喝水','不欲食','呕吐','哕','恶心','纳','胃口','食欲'], inquiry: '食欲如何？口渴否？有无恶心呕吐？' },
    { key: '胸腹', keywords: ['胸','腹','胁','满','痞','胀','痛','胸闷','胁痛','胸胁','心下','腹','满','痛','硬','急'], inquiry: '有无胸闷、胁痛、腹胀、腹痛？' },
    { key: '耳目', keywords: ['耳','目','眼','聋','鸣','眩','眼花','视力','听力'], inquiry: '有无耳鸣、耳聋、眼花、目眩？' },
    { key: '口渴', keywords: ['渴','不渴','欲饮水','不欲饮','口干','舌燥'], inquiry: '口渴程度？喜冷饮还是热饮？' },
    { key: '旧病诱因', keywords: ['旧','病','既往','诱因','因','冷','凉','食','劳','累','气','怒','风','雨','浴','月经','产后'], inquiry: '发病有无诱因？既往病史？' },
    { key: '服药', keywords: ['药','服','已服','用','吃过','服过','西药','中药'], inquiry: '近期是否服用过药物？效果如何？' },
    { key: '妇科', keywords: ['经','期','月经','带','产','孕','妊娠','恶露','胎','乳'], inquiry: '女性患者询问月经、带下、妊娠情况' },
    { key: '脉象', keywords: ['脉','浮','沉','迟','数','紧','缓','细','弱','虚','实','滑','涩','弦','洪','微','大','小'], inquiry: '脉象如何？左右手分别？' },
    { key: '查体', keywords: ['体','温','压','舌','苔','舌淡','舌红','苔白','苔黄','苔腻','舌紫','舌淡红','苔薄白','苔厚','黄','白'], inquiry: '舌象？体温？血压？其他异常体征？' }
  ];
  
  const core = ['寒热','汗出','头身','二便','饮食','脉象'];
  const collected = [];
  const missing = [];
  
  dimensions.forEach(d => {
    const hit = d.keywords.some(kw => text.includes(kw));
    if (hit) collected.push(d);
    else missing.push(d);
  });
  
  const coreCollected = core.filter(k => collected.some(c => c.key === k));
  const coreMissing = core.filter(k => missing.some(m => m.key === k));
  const coreRate = coreCollected.length / core.length;
  
  let level = '不足';
  if (coreRate >= 1 && collected.length >= 8) level = '充足';
  else if (coreRate >= 0.8) level = '部分';
  
  return { level, collected, missing, coreCollected, coreMissing, coreRate, total: dimensions.length };
}

function clRenderEvaluate() {
  const eval = clState.collectionEval;
  if (!eval) return '';
  let html = '<div class="cl-header"><div class="cl-header-title">信息采集评估</div><div class="cl-header-desc">档案编码：' + (clState.currentId || '新建') + '</div></div>';
  
  const levelStars = eval.level === '充足' ? '⭐⭐⭐⭐⭐' : eval.level === '部分' ? '⭐⭐⭐☆☆' : '⭐⭐☆☆☆';
  html += '<div class="cl-collection-level">完整性评级：' + eval.level + ' <span class="stars">' + levelStars + '</span></div>';
  
  if (eval.level === '不足') {
    html += '<div class="cl-collection-hint">⚠️ 核心信息缺失较多，强烈建议补充采集后再匹配。十问歌问诊可有效降低漏诊风险。</div>';
  } else if (eval.level === '部分') {
    html += '<div class="cl-collection-hint">ℹ️ 核心信息基本覆盖，但仍有维度未采集。您可以继续补采，或先进入匹配、后续补充。</div>';
  } else {
    html += '<div class="cl-collection-hint">✅ 信息采集较完整，可进入方证匹配。</div>';
  }
  
  html += '<div class="cl-result-title">已采集维度（' + eval.collected.length + '/' + eval.total + '）</div>';
  html += '<div class="cl-dimension-grid">';
  eval.collected.forEach(d => { html += '<div class="cl-dimension-item collected"><span class="icon">✅</span><span class="name">' + d.key + '</span></div>'; });
  html += '</div>';
  
  html += '<div class="cl-result-title" style="margin-top:20px;">未采集维度（' + eval.missing.length + '/' + eval.total + '）</div>';
  html += '<div class="cl-dimension-grid">';
  eval.missing.forEach(d => { html += '<div class="cl-dimension-item missing"><span class="icon">❌</span><span class="name">' + d.key + '</span><span class="status">' + d.inquiry + '</span></div>'; });
  html += '</div>';
  
  html += '<div class="cl-collection-actions">';
  if (eval.level !== '充足') {
    html += '<button class="cl-btn cl-btn-primary" onclick="clSwitchTab(\'collect\')">📝 补采信息</button>';
  }
  html += '<button class="cl-btn cl-btn-primary" onclick="clProceedToMatch()">🔍 进入匹配</button>';
  html += '<button class="cl-btn cl-btn-secondary" onclick="clSkipAndSave()">⏭ 先跳过保存</button>';
  html += '<button class="cl-btn cl-btn-secondary" onclick="clSwitchTab(\'input\')">↩ 重新录入</button>';
  html += '</div>';
  return html;
}

function clRenderCollect() {
  let html = '<div class="cl-header"><div class="cl-header-title">补采信息</div><div class="cl-header-desc">补充之前未采集的维度，追加到现有症状总结中。</div></div>';
  html += '<div class="cl-input-area cl-add-input"><label class="cl-label">补充症状信息（可再次粘贴 IMA 输出）</label>';
  html += '<textarea class="cl-textarea" id="clAddInputText" placeholder="例：患者还有胸闷，无胁痛，既往高血压病史..."></textarea>';
  html += '<div class="cl-actions"><button class="cl-btn cl-btn-primary" onclick="clAppendAndReeval()">追加并重新评估</button><button class="cl-btn cl-btn-secondary" onclick="clSwitchTab(\'evaluate\')">返回评估</button></div></div>';
  return html;
}

function clAppendAndReeval() {
  const addText = document.getElementById('clAddInputText') && document.getElementById('clAddInputText').value ? document.getElementById('clAddInputText').value.trim() : '';
  if (!addText) { alert('请输入补充信息'); return; }
  clState.currentInput += '\n' + addText;
  clState.collectionEval = clEvaluateCollection(clState.currentInput);
  clState.view = 'evaluate';
  clRender();
  showToast('已追加并重新评估');
}

function clProceedToMatch() {
  const parsed = clParseText(clState.currentInput);
  const matched = clMatchFormulas(parsed.std);
  clState.currentResult = {
    standard_symptoms: parsed.std,
    quotes: parsed.quotes,
    confidence: parsed.conf,
    recommendations: matched
  };
  if (clState.currentRecord && clState.currentId) {
    clState.view = 'result';
    clRender();
  } else {
    clShowArchiveModal();
  }
}

function clSkipAndSave() {
  if (clState.currentRecord && clState.currentId) {
    const seq = clState.currentRecord.visits.length + 1;
    const evalData = clState.collectionEval || { level: '不足', collected: [], missing: [] };
    const visit = {
      visit_id: 'V-' + clState.currentId.split('-').slice(1).join('-') + '-' + String(seq).padStart(3, '0'),
      input_text: clState.currentInput,
      standard_symptoms: [],
      recommendations: [],
      collection_status: 'pending',
      dimensions_collected: evalData.collected.map(d => d.key),
      dimensions_missing: evalData.missing.map(d => d.key)
    };
    clState.currentRecord.visits.push(visit);
    clSaveRecords();
    clState.collectionEval = null;
    clState.addInput = '';
    clState.view = 'list';
    clRender();
    showToast('已保存为待补采状态');
  } else {
    clShowArchiveModal();
  }
}

function clShowDetail(id) {
  const rec = clState.records.find(r => r.id === id);
  if (!rec) return;
  clState.currentRecord = rec;
  clState.currentId = id;
  clState.view = 'detail';
  clRender();
}
function clDeleteRecord(id) {
  if (!confirm('确定删除此档案？此操作不可撤销。')) return;
  clState.records = clState.records.filter(r => r.id !== id);
  clSaveRecords();
  clState.currentRecord = null;
  clState.currentId = null;
  clSwitchTab('list');
  showToast('档案已删除');
}

function clRenameRecord(id) {
  const rec = clState.records.find(r => r.id === id);
  if (!rec) return;
  const newName = prompt('修改患者名字：', rec.name || '匿名');
  if (newName !== null) {
    rec.name = newName.trim() || '匿名';
    clSaveRecords();
    clShowDetail(id);
    showToast('已更新患者名字');
  }
}

function clEditNote(id) {
  const rec = clState.records.find(r => r.id === id);
  if (!rec) return;
  const newNote = prompt('编辑备注：', rec.note || '');
  if (newNote !== null) {
    rec.note = newNote.trim();
    clSaveRecords();
    clShowDetail(id);
    showToast('已更新备注');
  }
}

function clAddFollowup(id) {
  const rec = clState.records.find(r => r.id === id);
  if (!rec) return;
  clState.currentRecord = rec;
  clState.currentId = id;
  clState.currentInput = '';
  clState.currentResult = null;
  clState.collectionEval = null;
  clSwitchTab('input');
  showToast('请粘贴新的症状总结，点击「开始解析」将自动关联到当前档案');
}

function clResumeCollection(id) {
  const rec = clState.records.find(r => r.id === id);
  if (!rec) return;
  const lastVisit = rec.visits[rec.visits.length - 1];
  if (!lastVisit) return;
  clState.currentRecord = rec;
  clState.currentId = id;
  clState.currentInput = lastVisit.input_text || '';
  clState.currentResult = null;
  clState.collectionEval = clEvaluateCollection(clState.currentInput);
  clSwitchTab('evaluate');
  showToast('继续补采：当前状态为「' + (lastVisit.collection_status === 'pending' ? '待补采' : '其他') + '」');
}

</script>
