<!DOCTYPE html>
<html data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《伤寒论》方剂训练 · 桌面版</title>
  <script src="herb-aliases.js"></script>
<style>
:root {
  --bg-body: #fafafa;
  --bg-panel: #ffffff;
  --bg-card: #f5f5f5;
  --bg-hover: #eeeeee;
  --border: #e0e0e0;
  --text-primary: #212121;
  --text-secondary: #616161;
  --text-muted: #9e9e9e;
  --accent: #455a64;
  --accent-bg: #eceff1;
  --success: #2e7d32;
  --error: #c62828;
  --shadow: 0 1px 2px rgba(0,0,0,0.06);
}

[data-theme="dark"] {
  --bg-body: #121212;
  --bg-panel: #1e1e1e;
  --bg-card: #252525;
  --bg-hover: #2d2d2d;
  --border: #333333;
  --text-primary: #e0e0e0;
  --text-secondary: #b0b0b0;
  --text-muted: #757575;
  --accent: #90a4ae;
  --accent-bg: #263238;
  --success: #4caf50;
  --error: #ef5350;
  --shadow: 0 1px 2px rgba(0,0,0,0.2);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-body);
  color: var(--text-primary);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 顶部栏 */
.topbar {
  height: 52px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  box-shadow: var(--shadow);
  flex-shrink: 0;
}
.topbar-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
.topbar-actions { display: flex; gap: 10px; align-items: center; }
.topbar-btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-panel);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
}
.topbar-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.theme-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-panel);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 主内容区 */
.main {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.view {
  display: none;
  height: 100%;
  overflow-y: auto;
  padding: 24px;
  animation: fadeIn 0.2s ease;
}
.view.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 仪表盘 */
.dashboard-container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  box-sizing: border-box;
}
.dashboard-header {
  margin-bottom: 24px;
  padding: 0;
}
.dashboard-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.dashboard-desc { font-size: 13px; color: var(--text-secondary); }
.dashboard-body {
  display: flex;
  gap: 24px;
  align-items: flex-start;
}
.card-list {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex: 1;
}
.search-clear {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 18px;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  transition: background 0.15s;
}
.search-clear:hover {
  background: var(--border);
}
.search-no-results {
  text-align: center;
  color: var(--text-muted);
  padding: 16px;
  font-size: 13px;
}
.search-filter-hint {
  padding: 10px 16px;
  background: var(--accent-bg);
  border-radius: 8px;
  margin-bottom: 12px;
  font-size: 13px;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 4px;
}
.card-list-item {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 18px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.card-list-item:hover {
  border-color: var(--accent);
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}
.card-list-main { flex: 1; }
.card-list-name { font-size: 16px; font-weight: 600; }
.card-list-desc { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
.card-list-tags { display: flex; gap: 6px; margin-top: 8px; }
.tag {
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  background: var(--bg-card);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.15s;
}
.tag:hover {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.tag.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

/* 标签聚类视图 */
.tag-cluster-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  padding: 12px 16px;
  background: var(--bg-card);
  border-radius: 10px;
  border: 1px solid var(--border);
}
.tag-cluster-badge {
  font-size: 14px;
  font-weight: 600;
  color: var(--accent);
  padding: 4px 12px;
  border-radius: 8px;
  background: var(--accent-bg);
}
.tag-cluster-count {
  font-size: 13px;
  color: var(--text-secondary);
}
.tag-cluster-actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
}
.tag-cluster-back {
  font-size: 13px;
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-panel);
  cursor: pointer;
  color: var(--text-secondary);
}
.tag-cluster-back:hover {
  background: var(--bg-hover);
}
.tag-cluster-exam {
  font-size: 13px;
  padding: 6px 14px;
  border-radius: 6px;
  border: none;
  background: var(--accent);
  color: white;
  cursor: pointer;
  font-weight: 600;
}
.tag-cluster-exam:hover {
  filter: brightness(1.1);
}
.progress-dots { display: flex; gap: 4px; }
.progress-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
}
.progress-dot.done { background: var(--accent); }

/* 学习视图 - 单栏 */
.learn-container {
  max-width: 680px;
  margin: 0 auto;
}
.back-link {
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  margin-bottom: 16px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.back-link:hover { color: var(--accent); }
.learn-header { margin-bottom: 24px; }
.learn-name { font-size: 26px; font-weight: 700; }
.learn-tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

.section {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 14px;
}
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
}
.section-body {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-primary);
}

.source-text {
  font-size: 16px;
  line-height: 1.9;
  color: var(--text-primary);
  padding: 16px;
  background: var(--bg-card);
  border-radius: 8px;
  border-left: 3px solid var(--accent);
}

.symptom-group { margin-bottom: 12px; }
.symptom-group:last-child { margin-bottom: 0; }
.symptom-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.symptom-items { display: flex; flex-wrap: wrap; gap: 6px; }
.symptom-item {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 13px;
  background: var(--bg-card);
  border: 1px solid var(--border);
}
.symptom-item.necessary {
  background: var(--accent-bg);
  border-color: var(--accent);
  color: var(--text-primary);
}
.symptom-item.excluding {
  text-decoration: line-through;
  opacity: 0.6;
}

.herbs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 10px;
}
.herb-item {
  text-align: center;
  padding: 12px 8px;
  background: var(--bg-card);
  border-radius: 8px;
  border: 1px solid var(--border);
}
.herb-name { font-size: 15px; font-weight: 600; }
.herb-dose {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 3px;
  display: none;
}
.herb-dose.revealed { display: block; }
.dose-original { font-weight: 600; margin-bottom: 2px; color: var(--text-primary); font-size: 13px; }
.dose-pill-container { display: flex; gap: 4px; justify-content: center; margin-top: 3px; flex-wrap: wrap; }
.dose-pill { display: flex; flex-direction: column; align-items: center; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; padding: 3px 7px 2px; min-width: 36px; cursor: default; transition: all 0.15s ease; }
.dose-pill:hover { border-color: var(--accent); }
.dose-pill-label { font-size: 9px; color: var(--text-muted); line-height: 1; margin-bottom: 1px; letter-spacing: 0.5px; }
.dose-pill-value { font-size: 12px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
.dose-pill.active { border-color: var(--accent); background: var(--accent-bg); }
.dose-pill.active .dose-pill-value { color: var(--accent); }
.dose-info { font-size: 11px; color: var(--text-muted); margin-top: 4px; text-align: center; }
/* 弹窗表格内剂量标签（统一配色） */
.dose-tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; white-space: nowrap; font-weight: 500; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary); }
.dose-tag.active { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
.herb-item { cursor: pointer; user-select: none; transition: background 0.15s; }
.herb-item:hover { background: var(--bg-hover); }
.herb-item.revealed .herb-dose { display: block; }

.section-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.section-title-row .section-title { margin-bottom: 0; }
.reveal-btn {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-panel);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.15s;
}
.reveal-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.reveal-content { display: none; }
.reveal-content.revealed { display: block; }

.experience-box {
  background: var(--accent-bg);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 14px;
  margin-top: 8px;
}
.experience-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.experience-content { font-size: 13px; line-height: 1.7; color: var(--text-secondary); }
.efficacy-tags { display: flex; gap: 6px; margin-top: 10px; }

.ref-link {
  margin-bottom: 8px;
  font-size: 13px;
  line-height: 1.6;
  word-break: break-all;
}
.ref-link a {
  color: var(--accent);
  text-decoration: none;
}
.ref-link a:hover {
  text-decoration: underline;
}

.learn-action-bar-top {
  display: flex;
  gap: 10px;
  padding: 14px 0;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.learn-action-bar-top .btn-primary,
.learn-action-bar-top .btn-secondary {
  white-space: nowrap;
}
.learn-back-bottom {
  display: flex;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.action-bar {
  display: flex;
  gap: 10px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.btn-primary {
  padding: 10px 20px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 14px;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.85; }
.btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-secondary {
  padding: 10px 20px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-panel);
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
}
.btn-secondary:hover { background: var(--bg-hover); }

/* 考试视图 - 双栏 */
.exam-layout {
  max-width: 900px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  height: 100%;
}
.exam-question {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px;
}
.exam-question-title {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 12px;
}
.exam-question-body {
  font-size: 18px;
  line-height: 1.7;
  font-weight: 500;
}
.exam-question-hint {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 16px;
}
.exam-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.exam-option {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  cursor: pointer;
  font-size: 15px;
  transition: all 0.15s;
  text-align: left;
}
.exam-option:hover {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.exam-option.selected {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.exam-option.correct {
  border-color: var(--success);
  background: rgba(46, 125, 50, 0.10);
  color: var(--success);
}
.exam-option.wrong {
  border-color: var(--error);
  background: rgba(198, 40, 40, 0.10);
  color: var(--error);
}
[data-theme="dark"] .exam-option.correct {
  background: rgba(76, 175, 80, 0.15);
}
[data-theme="dark"] .exam-option.wrong {
  background: rgba(239, 83, 80, 0.15);
}
.exam-feedback {
  margin-top: 16px;
  padding: 14px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
  display: none;
}
.exam-feedback.show { display: block; }

.exam-progress {
  max-width: 900px;
  margin: 0 auto 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--text-secondary);
}
.exam-nav {
  max-width: 900px;
  margin: 20px auto 0;
  display: flex;
  justify-content: flex-end;
}

.exam-result-panel {
  max-width: 900px;
  margin: 0 auto 20px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
}
.exam-result-title { font-size: 18px; font-weight: 600; margin-bottom: 10px; }
.exam-result-score { font-size: 28px; font-weight: 700; color: var(--accent); }
.exam-wrong-list { margin-top: 14px; }
.exam-wrong-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  line-height: 1.6;
}
.exam-wrong-item:last-child { border-bottom: none; }

/* 错题诊断按钮 */
.diagnosis-buttons {
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}
.diagnosis-btn {
  padding: 5px 10px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-panel);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.diagnosis-btn:hover {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.diagnosis-btn.auto {
  border-color: var(--accent);
  background: var(--accent-bg);
  font-weight: 600;
}
.diagnosis-btn.confused { color: #e65100; }
.diagnosis-btn.misremembered { color: #6a1b9a; }
.diagnosis-btn.unknown { color: #1565c0; }

/* 错题直接问Kimi按钮 */
.wrong-kimi-btn {
  padding: 5px 10px;
  border-radius: 6px;
  border: 1px solid var(--accent);
  background: var(--accent-bg);
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.wrong-kimi-btn:hover {
  background: var(--accent);
  color: white;
}

/* 批量打标签区域 */
.batch-tag-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  padding: 10px 14px;
  background: var(--bg-panel);
  border-radius: 8px;
  border: 1px dashed var(--border);
}
.batch-tag-hint {
  font-size: 13px;
  color: var(--text-secondary);
  flex: 1;
}
.batch-tag-btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--accent);
  background: var(--accent-bg);
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.batch-tag-btn:hover {
  background: var(--accent);
  color: white;
}
.diagnosis-btn.random { color: #c62828; }

/* AI 学习弹窗 */
.ai-study-modal .modal-box {
  max-width: 600px;
  max-height: 85vh;
  overflow-y: auto;
}
.ai-study-header {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.ai-study-prompt {
  background: #f8f9fa;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  font-size: 13px;
  line-height: 1.7;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 220px;
  overflow-y: auto;
  margin-bottom: 12px;
  font-family: -apple-system, 'Segoe UI', sans-serif;
}
.ai-study-actions {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.ai-study-textarea {
  width: 100%;
  min-height: 100px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
  resize: vertical;
  margin-bottom: 12px;
  font-family: inherit;
}
.ai-study-schedule {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 8px;
  padding: 10px;
  background: var(--bg-body);
  border-radius: 6px;
}

/* 练习总结 */
.practice-summary-section { margin-top: 18px; }
.practice-summary-section-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 10px;
  color: var(--text-primary);
}
.practice-summary-item {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  line-height: 1.5;
}
.practice-summary-item:last-child { border-bottom: none; }
.practice-summary-item.correct { color: var(--success); }
.practice-summary-item.wrong { color: var(--error); }
.practice-summary-meta {
  color: var(--text-secondary);
  font-size: 12px;
  margin-top: 2px;
}
.practice-summary-detail {
  color: var(--text-secondary);
  font-size: 12px;
  margin-top: 4px;
}
.category-coverage-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
  font-size: 13px;
}
.category-coverage-label {
  width: 90px;
  flex-shrink: 0;
}
.category-coverage-bar {
  flex: 1;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}
.category-coverage-fill {
  height: 100%;
  background: var(--success);
  border-radius: 4px;
}
.category-coverage-fill.partial {
  background: var(--accent);
}
.category-coverage-fill.weak {
  background: var(--error);
}
.category-coverage-text {
  width: 70px;
  text-align: right;
  font-size: 12px;
  color: var(--text-secondary);
}

/* Markdown 渲染样式 */

/* === 条文讲解：方案B 右侧滑入面板样式 === */

  background: var(--bg-panel);

  margin-bottom: 16px;
  overflow: hidden;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme="dark"] .anno-card {
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.anno-header {
  padding: 20px 24px 0;
}
.anno-title {
  font-size: 17px;
  font-weight: 700;
  margin-bottom: 4px;
  color: var(--text-primary);
}
.anno-meta {
  font-size: 13px;
  color: var(--text-muted);

}

  line-height: 1.8;

}
.anno-summary::after {
  content: '';
  position: absolute;

  height: 40px;

}

  border: 1px solid var(--border);
  padding: 6px 16px;
  border-radius: 20px;
  cursor: pointer;
  margin: 0 24px 16px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.anno-btn:hover {
  background: var(--accent-bg);
  border-color: var(--accent);
}

/* 右侧滑入面板 */
.slide-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.35);
  z-index: 1999;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.slide-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.slide-panel {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 60%;
  max-width: 700px;
  background: var(--bg-panel);
  z-index: 2000;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 8px 30px rgba(0,0,0,0.12);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}
[data-theme="dark"] .slide-panel {
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
}
.slide-panel.open {
  transform: translateX(0);
}
.slide-panel-header {
  padding: 24px 28px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.slide-panel-title {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.4;
  padding-right: 20px;
  color: var(--text-primary);
}
.slide-panel-meta {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
}
.slide-panel-close {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-panel);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  line-height: 1;
  flex-shrink: 0;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.slide-panel-close:hover {
  background: var(--error);
  color: #fff;
  border-color: var(--error);
}
.slide-panel-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px 28px 40px;
}

.md-content {
  font-size: 15px;

async function loadData() {
  try {
    const [cardsRes, expRes, srcRes, aliasRes] = await Promise.all([
      fetch('../data/formula_cards.json'),
      fetch('../data/experience_cards.json'),
      fetch('../data/source_cards.json'),
      fetch('../data/herb_alias_map.json')
    ]);
    if (!cardsRes.ok || !expRes.ok || !srcRes.ok) {
      throw new Error('One or more JSON files failed to load');
    }
    CARDS = await cardsRes.json();
    EXPERIENCES = await expRes.json();
    SOURCE_CARDS = await srcRes.json();
    
    // 将 SOURCE_CARDS 挂载到 window，供 normalizeSourceAnnotations 使用
    window.SOURCE_CARDS = SOURCE_CARDS;
    
    // 加载药名映射表（优先外部，fallback 硬编码）
    if (aliasRes.ok) {
      try {
        const aliasData = await aliasRes.json();
        window.HERB_ALIAS_MAP = Object.assign({}, window.HERB_ALIASES, aliasData.alias_to_standard || {});
        window.HERB_CLASS_MAP = aliasData.herb_class_map || {};
      } catch (e) {
        window.HERB_ALIAS_MAP = window.HERB_ALIASES;
        window.HERB_CLASS_MAP = {};
      }
    } else {
      window.HERB_ALIAS_MAP = window.HERB_ALIASES;
      window.HERB_CLASS_MAP = {};
    }
  } catch (e) {
    console.warn('无法动态加载 data/*.json，使用内联演示数据。建议通过本地服务器打开以加载最新数据。', e);
    CARDS = FALLBACK_DATA.cards;
    EXPERIENCES = FALLBACK_DATA.experiences;
    SOURCE_CARDS = FALLBACK_DATA.source_cards;
    window.SOURCE_CARDS = SOURCE_CARDS;
    window.HERB_ALIAS_MAP = window.HERB_ALIASES;
    window.HERB_CLASS_MAP = {};
  }
}

function slugToName(id) {
  const c = CARDS.find(x => x.id === id);
  return c ? c.name : id;
}

function formatCorrectAnswer(q) {
  if (q.type === '1→0' || q.type === '2→0') {
    return slugToName(q.correct);
  }
  return Array.isArray(q.correct) ? q.correct.join('、') : q.correct;
}

// ===== 练习总结：纯数据层（与渲染解耦） =====
const VECTOR_LABELS = {
  '0→1': '方名→症状',
  '1→0': '症状→方名',
  '0→2': '方名→核心药组',
  '2→0': '核心药组→方名',
  '0→contra': '方名→禁忌',
  '0→usage': '方名→煎服法'
};

function getVectorLabel(type) {
  return VECTOR_LABELS[type] || type;
}

// 构建一次练习的总结数据对象
function buildPracticeSummary(questions, answers, activeCardId) {
  const items = answers.map((a, i) => ({
    index: i + 1,
    cardId: a.question.cardId,
    cardName: slugToName(a.question.cardId),
    type: a.question.type,
    typeLabel: getVectorLabel(a.question.type),
    text: a.question.text,
    selectedLabel: a.selected ? a.selected.label : '未作答',
    correctLabel: formatCorrectAnswer(a.question),
    isCorrect: !!a.isCorrect
  }));
  const wrongItems = items.filter(x => !x.isCorrect);

  const vectorStats = {};
  items.forEach(item => {
    if (!vectorStats[item.type]) {
      vectorStats[item.type] = { type: item.type, label: item.typeLabel, total: 0, right: 0, wrong: 0 };
    }
    vectorStats[item.type].total++;
    if (item.isCorrect) vectorStats[item.type].right++;
    else vectorStats[item.type].wrong++;
  });

  const categoryCoverage = activeCardId ? getCategoryCoverage(activeCardId) : null;
  const weakVectors = pickWeakVectors(items, categoryCoverage);

  return {
    activeCardId,
    total: items.length,
    right: items.filter(x => x.isCorrect).length,
    wrong: wrongItems.length,
    items,
    wrongItems,
    vectorStats: Object.values(vectorStats),
    weakVectors,
    categoryCoverage
  };
}

// 挑选薄弱向量：优先本次答错的向量，再补充类别掌握度低的向量
function pickWeakVectors(items, categoryCoverage, limit = 4) {
  const weak = [];
  const add = (type, label, reason) => {
    if (!weak.some(w => w.type === type)) weak.push({ type, label, reason });
  };

  items.filter(x => !x.isCorrect).forEach(x => add(x.type, x.typeLabel, '本次答错'));

  if (categoryCoverage) {
    categoryCoverage.coverage.forEach(c => {
      if (weak.length >= limit) return;
      const ratio = c.total > 0 ? c.mastered / c.total : 0;
      if (ratio < 0.5) add(c.vector, c.label, '类别掌握度低');
    });
  }

  return weak.slice(0, limit);
}

// 计算当前卡片所属类别的向量覆盖度
function getCategoryCoverage(cardId) {
  const target = getCard(cardId);
  if (!target) return null;

  const categoryKey = target.source_chapter || (target.tags && target.tags[0]) || '全部';
  const categoryCards = CARDS.filter(c =>
    c.source_chapter === target.source_chapter ||
    (target.tags && target.tags.some(t => c.tags && c.tags.includes(t)))
  );
  const uniqueCards = [...new Map(categoryCards.map(c => [c.id, c])).values()];
  const vectors = Object.keys(target.mastery || {});

  const coverage = vectors.map(vec => {
    const entries = uniqueCards.map(c => c.mastery && c.mastery[vec]).filter(Boolean);
    const mastered = entries.filter(m => m.status === '已掌握').length;
    const learning = entries.filter(m => m.status === '学习中').length;
    const unknown = entries.filter(m => m.status === '未知').length;
    const label = (entries[0] && entries[0].label) || getVectorLabel(vec);
    return { vector: vec, label, total: entries.length, mastered, learning, unknown };
  });

  return {
    categoryKey,
    categoryLabel: categoryKey,
    cardIds: uniqueCards.map(c => c.id),
    coverage
  };
}

// ===== 持久化与 SRS 调度 =====
const STORAGE_KEY = 'sh_index_v1_state';
const SRS_INTERVALS = [1, 2, 4, 7, 14, 30];

function scheduleNextReview(level) {
  const days = SRS_INTERVALS[Math.min(level, SRS_INTERVALS.length - 1)] || 1;
  return Date.now() + days * 24 * 60 * 60 * 1000;
}

function ensureMasteryFields(card) {
  if (!card.mastery) return;
  Object.values(card.mastery).forEach(m => {
    if (typeof m.next_review !== 'number') m.next_review = 0;
  });
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.stats) state.stats = { ...state.stats, ...saved.stats };
    if (saved.cards) {
      CARDS.forEach(card => {
        const savedCard = saved.cards[card.id];
        if (!savedCard || !savedCard.mastery) return;
        if (!card.mastery) card.mastery = {};
        Object.keys(savedCard.mastery).forEach(vec => {
          if (!card.mastery[vec]) return;
          Object.assign(card.mastery[vec], savedCard.mastery[vec]);
        });
      });
    }
  } catch (e) {
    console.warn('加载学习进度失败', e);
  }
}

function saveProgress() {
  try {
    const payload = {
      version: 1,
      savedAt: Date.now(),
      stats: state.stats,
      cards: {}
    };
    CARDS.forEach(card => {
      if (!card.mastery) return;
      payload.cards[card.id] = { mastery: {} };
      Object.keys(card.mastery).forEach(vec => {
        const m = card.mastery[vec];
        payload.cards[card.id].mastery[vec] = {
          level: m.level,
          status: m.status,
          streak_right: m.streak_right,
          streak_wrong: m.streak_wrong,
          total_rights: m.total_rights,
          total_wrongs: m.total_wrongs,
          last_result: m.last_result,
          last_review: m.last_review,
          next_review: m.next_review
        };
      });
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
  } catch (e) {
    console.warn('保存学习进度失败', e);
  }
}

function getDueVectors() {
  const now = Date.now();
  const all = [];
  CARDS.forEach(card => {
    if (!card.mastery) return;
    Object.entries(card.mastery).forEach(([vec, m]) => {
      all.push({ card, vector: vec, mastery: m, due: (m.next_review || 0) <= now });
    });
  });
  return all;
}

function generateQuestionForVector(card, vector) {
  const c = card.data.canonical;
  const profile = c.symptom_profile || {};
  const allSymptoms = [...(profile.necessary || []), ...(profile.common || [])];
  if (vector === '0→1') {
    const necessaryJoined = (profile.necessary || []).join('、');
    return {
      type: '0→1', cardId: card.id,
      text: `${card.name}的必要症状包括哪些？`,
      correct: necessaryJoined,
      options: generateOptions(card.id, '0→1', necessaryJoined)
    };
  }
  if (vector === '1→0' && allSymptoms.length > 0) {
    return {
      type: '1→0', cardId: card.id,
      text: `患者出现 ${allSymptoms.slice(0, 2).join('、')}，最可能选哪个方？`,
      correct: card.id,
      options: generateOptions(card.id, '1→0')
    };
  }
  if (vector === '0→2' && c.herbs.length > 0) {
    const core = getCoreCombo(card);
    return {
      type: '0→2', cardId: card.id,
      text: `${card.name}的核心药物组合是？`,
      correct: [core],
      options: generateOptions(card.id, '0→2', core)
    };
  }
  if (vector === '0→contra' && c.contraindications.length > 0) {
    return {
      type: '0→contra', cardId: card.id,
      text: `${card.name}的禁忌是什么？`,
      correct: [c.contraindications[0]],
      options: generateOptions(card.id, '0→contra', c.contraindications[0])
    };
  }
  if (vector === '0→usage' && c.usage) {
    return {
      type: '0→usage', cardId: card.id,
      text: `${card.name}的煎服法是什么？`,
      correct: c.usage,
      options: generateOptions(card.id, '0→usage', c.usage)
    };
  }
  if (vector === '2→0' && c.herbs.length > 0) {
    const core = getCoreCombo(card);
    return {
      type: '2→0', cardId: card.id,
      text: `药物组合“${core}”对应哪个方？`,
      correct: card.name,
      options: generateOptions(card.id, '2→0')
    };
  }
  return null;
}

function startDailyReview(count = 5) {
  const allVectors = getDueVectors();
  const due = allVectors.filter(x => x.due);
  const notDue = allVectors.filter(x => !x.due);
  due.sort((a, b) => (a.mastery.level - b.mastery.level) || (a.mastery.next_review - b.mastery.next_review));
  notDue.sort((a, b) => (a.mastery.level - b.mastery.level) || (a.mastery.next_review - b.mastery.next_review));
  let selected = due.slice(0, count);
  if (selected.length < count) {
    selected = selected.concat(notDue.slice(0, count - selected.length));
  }
  if (selected.length < count) {
    const mastered = allVectors.filter(x => x.mastery.status === '已掌握').sort(() => Math.random() - 0.5);
    selected = selected.concat(mastered.slice(0, count - selected.length));
  }
  const questions = selected.map(s => generateQuestionForVector(s.card, s.vector)).filter(Boolean);
  if (questions.length === 0) {
    alert('暂无可复习题目，请先学习卡片。');
    return;
  }
  state.exam.questions = questions;
  state.exam.current = 0;
  state.exam.answers = [];
  state.exam.finished = false;
  state.exam.submitted = false;
  state.exam.mode = 'daily';
  state.activeCardId = questions[0].cardId;
  switchView('exam');
  renderExam();
}

function updateMasteryAfterAnswer(vector, isCorrect, cardId) {
  const card = getCard(cardId || state.activeCardId);
  if (!card || !card.mastery || !card.mastery[vector]) return;
  const m = card.mastery[vector];
  if (isCorrect) {
    m.streak_right++;
    m.streak_wrong = 0;
    m.total_rights++;
    m.last_result = 'right';
    if (m.streak_right >= 3) {
      m.level = Math.min(5, m.level + 1);
      m.status = '已掌握';
      m.streak_right = 0;
    } else {
      m.status = '正在学习';
    }
  } else {
    m.streak_wrong++;
    m.streak_right = 0;
    m.total_wrongs++;
    m.last_result = 'wrong';
    if (m.streak_wrong >= 2) {
      m.level = Math.max(0, m.level - 1);
      m.status = m.level >= 3 ? '正在学习' : '已遗忘';
      m.streak_wrong = 0;
    }
  }
  m.last_review = new Date().toISOString();
  m.next_review = scheduleNextReview(m.level);
  saveProgress();
}

function getPinyinInitials(cardId) {
  return PINYIN_INITIALS[cardId] || cardId.split('-').map(s => s[0].toUpperCase()).join('');
}

function handleCardFilter(query) {
  const clearBtn = document.getElementById('searchClear');
  if (clearBtn) clearBtn.style.display = query.trim() ? 'flex' : 'none';
  
  if (!query.trim()) {
    state.searchFilteredCards = null;
    state.searchQuery = '';
    renderCardList(); // 显示全部卡片
    return;
  }
  
  // 联合三种匹配方式，去重
  const nameMatches = matchByName(query);
  const pinyinMatches = matchByPinyin(query);
  const tagMatches = matchByTag(query);
  
  const matchedIds = new Set();
  const filtered = [];
  [nameMatches, pinyinMatches, tagMatches].forEach(list => {
    list.forEach(c => {
      if (!matchedIds.has(c.id)) {
        matchedIds.add(c.id);
        filtered.push(c);
      }
    });
  });
  
  // 保存到state，供聚类复习使用
  state.searchFilteredCards = filtered;
  state.searchQuery = query;
  
  // 渲染过滤后的卡片列表
  renderCardList(filtered, query);
  saveSearchHistory(query);
}

function matchByName(query) {
  return CARDS.filter(c => c.name.includes(query) || (c.formula_name && c.formula_name.includes(query)));
}

function matchByPinyin(query) {
  const upper = query.toUpperCase();
  return CARDS.filter(c => {
    const initials = getPinyinInitials(c.id);
    return initials === upper || initials.includes(upper);
  });
}

function matchByTag(query) {
  return CARDS.filter(c => c.tags && c.tags.some(t => t.includes(query)));
}

function saveSearchHistory(query) {
  let history = JSON.parse(localStorage.getItem('search_history') || '[]');
  history = history.filter(q => q !== query);
  history.unshift(query);
  localStorage.setItem('search_history', JSON.stringify(history.slice(0, 10)));
}

// 获取卡片的核心药物组合（优先读取 canonical.core_combinations，否则退回到首药）
function getCoreCombo(card) {
  const c = card && card.data && card.data.canonical;
  if (c && c.core_combinations) return c.core_combinations;
  if (c && c.herbs && c.herbs.length > 0) return c.herbs[0].name;
  return '无';
}

// 统一计算某题型下某卡片的选项标签
function getOptionLabel(card, type) {
  if (!card || !card.data || !card.data.canonical) return '无';
  const canonical = card.data.canonical;
  const profile = canonical.symptom_profile || {};
  if (type === '0→1') {
    return (profile.necessary || []).join('、') || '无';
  }
  if (type === '1→0' || type === '2→0') {
    return card.name;
  }
  if (type === '0→2') {
    return getCoreCombo(card);
  }
  if (type === '0→contra') {
    return (canonical.contraindications || [])[0] || '无';
  }
  if (type === '0→usage') {
    return canonical.usage || '无';
  }
  return '无';
}

const PIECE_WEIGHT_MAP = {

  '粳米': { perLiter: 180, note: '文献均值' },

const SPECIAL_UNIT_MAP = {
  '方寸匕': { min: 1, max: 2.74, note: '草木1g/金石2.74g' },
  '半方寸匕': { min: 0.5, max: 1.5, note: '一刀圭=1.5g' },

function parseChineseNum(str) {
  if (!str) return null;
  if (str === '半') return 0.5;
  let result = 0, current = 0;
  for (let i = 0; i < str.length; i++) {
    const v = CN_NUM_MAP[str[i]];
    if (v === undefined) continue;
    if (v < 10) { current = v; }
    else {
      if (current === 0) current = 1;
      current *= v;
      result += current;
      current = 0;
    }
  }
  result += current;
  return result;
}

function parseChineseDosage(dosage) {
  if (!dosage) return null;
  if (dosage.startsWith('半')) {
    const rest = dosage.slice(1);
    const m = rest.match(/^([^（(]*)/);
    return { num: 0.5, unit: m ? m[1] : rest, note: '' };
  }
  let numStr = '';
  for (let c of dosage) {
    if (CN_NUM_MAP[c] !== undefined) numStr += c;
    else break;
  }
  if (!numStr) return null;
  const num = parseChineseNum(numStr);
  const rest = dosage.slice(numStr.length);
  // 提取括号前的纯单位，括号内容作为备注
  const m = rest.match(/^([^（(]*)([（(].*)?$/);
  const unit = m ? m[1] : rest;
  const note = m && m[2] ? m[2] : '';
  return { num, unit, note };
}

function convertDosage(herbName, dosage) {
  if (!dosage) return null;
  const fmt = (n) => n.toFixed(1).replace(/\.0$/, '') + 'g';
  const fmtMl = (n) => n.toFixed(0) + 'ml';
  const fmtRange = (a, b) => {
    const min = a.toFixed(1).replace(/\.0$/, '');
    const max = b.toFixed(1).replace(/\.0$/, '');
    return min === max ? min + 'g' : min + '~' + max + 'g';
  };

  // 先检查特殊单位（无数字前缀，如"如鸡子大"）
  if (SPECIAL_UNIT_MAP[dosage]) {
    const s = SPECIAL_UNIT_MAP[dosage];
    return {
      original: dosage,
      modern: fmtRange(s.min, s.max),
      light: fmtRange(s.min, s.max),
      medium: fmtRange(s.min, s.max),
      full: fmtRange(s.min, s.max),
      unit: dosage, type: 'special', note: s.note
    };
  }

  const parsed = parseChineseDosage(dosage);
  if (!parsed) return null;
  const { num, unit, note: rawNote } = parsed;
  const baseNote = rawNote || '';

  // ===== 标准重量单位：两/钱/斤/分/两半 =====
  if (unit === '两') {
    return { original: dosage, modern: fmt(num * 3), light: fmt(num * 6), medium: fmt(num * 9), full: fmt(num * 15), unit, type: 'weight', note: baseNote };
  }
  if (unit === '钱') {
    return { original: dosage, modern: fmt(num * 0.3), light: fmt(num * 0.6), medium: fmt(num * 0.9), full: fmt(num * 1.5), unit, type: 'weight', note: baseNote };
  }
  if (unit === '斤') {
    const liang = num * 16;
    return { original: dosage, modern: fmt(liang * 3), light: fmt(liang * 6), medium: fmt(liang * 9), full: fmt(liang * 15), unit, type: 'weight', note: baseNote + ' 1斤=16两' };
  }
  if (unit === '分') {
    const liang = num * 0.025; // 1分 = 0.025两（本系统标准定义）
    return { original: dosage, modern: fmt(liang * 3), light: fmt(liang * 6), medium: fmt(liang * 9), full: fmt(liang * 15), unit, type: 'weight', note: baseNote + ' 1两=40分（本系统标准）' };
  }
  if (unit === '两半') {
    const liang = num + 0.5;
    return { original: dosage, modern: fmt(liang * 3), light: fmt(liang * 6), medium: fmt(liang * 9), full: fmt(liang * 15), unit, type: 'weight', note: baseNote + ' 一两半=1.5两' };
  }

  // ===== 特殊容量单位：升/合/合半（需按药物密度）=====
  if (unit === '升') {
    const density = herbName && VOLUME_WEIGHT_MAP[herbName];
    if (density) {
      return { original: dosage, modern: fmt(num * density.perLiter), light: fmt(num * density.perLiter), medium: fmt(num * density.perLiter), full: fmt(num * density.perLiter), unit, type: 'special', note: baseNote + (density.note ? ' ' + density.note : '') };
    }
    return { original: dosage, modern: fmtMl(num * 200), light: fmtMl(num * 200), medium: fmtMl(num * 200), full: fmtMl(num * 200), unit, type: 'volume', note: baseNote };
  }
  if (unit === '合') {
    const density = herbName && VOLUME_WEIGHT_MAP[herbName];
    if (density) {
      return { original: dosage, modern: fmt(num * density.perLiter / 10), light: fmt(num * density.perLiter / 10), medium: fmt(num * density.perLiter / 10), full: fmt(num * density.perLiter / 10), unit, type: 'special', note: baseNote + (density.note ? ' ' + density.note : '') };
    }
    return { original: dosage, modern: fmtMl(num * 20), light: fmtMl(num * 20), medium: fmtMl(num * 20), full: fmtMl(num * 20), unit, type: 'volume', note: baseNote };
  }
  if (unit === '合半') {
    const total = num + 0.5;
    const density = herbName && VOLUME_WEIGHT_MAP[herbName];
    if (density) {
      return { original: dosage, modern: fmt(total * density.perLiter / 10), light: fmt(total * density.perLiter / 10), medium: fmt(total * density.perLiter / 10), full: fmt(total * density.perLiter / 10), unit: '合', type: 'special', note: baseNote + (density.note ? ' ' + density.note : '') };
    }
    return { original: dosage, modern: fmtMl(total * 20), light: fmtMl(total * 20), medium: fmtMl(total * 20), full: fmtMl(total * 20), unit: '合', type: 'volume', note: baseNote };
  }

  // ===== 计数单位：枚/个（需按药物单枚重量）=====
  if (unit === '枚' || unit === '个') {
    const weight = herbName && PIECE_WEIGHT_MAP[herbName];
    if (weight) {
      return { original: dosage, modern: fmtRange(num * weight.min, num * weight.max), light: fmtRange(num * weight.min, num * weight.max), medium: fmtRange(num * weight.min, num * weight.max), full: fmtRange(num * weight.min, num * weight.max), unit, type: 'special', note: baseNote + (weight.note ? ' ' + weight.note : '') };
    }
    return { original: dosage, modern: null, light: null, medium: null, full: null, unit, type: 'count', note: baseNote };
  }

  // ===== 铢单位（按四档标准）=====
  if (unit === '铢') {
    return { original: dosage, modern: fmt(num * 0.125), light: fmt(num * 0.25), medium: fmt(num * 0.375), full: fmt(num * 0.625), unit, type: 'weight', note: baseNote + ' 1两=24铢' };
  }

  // ===== 复合单位：两X铢（如"两十六铢"）=====
  const mCompound = unit.match(/^两(.+)铢$/);
  if (mCompound) {
    const zhu = parseChineseNum(mCompound[1]);
    if (zhu !== null) {
      const totalLiang = num + zhu / 24;
      return { original: dosage, modern: fmt(totalLiang * 3), light: fmt(totalLiang * 6), medium: fmt(totalLiang * 9), full: fmt(totalLiang * 15), unit, type: 'weight', note: baseNote + ' 1两=24铢' };
    }
  }

  // ===== 茎单位（葱白等）=====
  if (unit === '茎') {
    return { original: dosage, modern: fmtRange(num * 10, num * 15), light: fmtRange(num * 10, num * 15), medium: fmtRange(num * 10, num * 15), full: fmtRange(num * 10, num * 15), unit, type: 'special', note: baseNote + ' 葱白一茎约10-15g' };
  }

  // ===== 尺单位（厚朴等）=====
  if (unit === '尺') {
    return { original: dosage, modern: fmtRange(num * 10, num * 20), light: fmtRange(num * 10, num * 20), medium: fmtRange(num * 10, num * 20), full: fmtRange(num * 10, num * 20), unit, type: 'special', note: baseNote + ' 长度单位，一尺约23.1cm，按厚度估算' };
  }

  // ===== 不支持的单位 =====
  return { original: dosage, modern: null, light: null, medium: null, full: null, unit, type: 'unsupported', note: baseNote };
}

function formatDoseHtml(herbName, dosage) {
  const c = convertDosage(herbName, dosage);
  if (!c) return `<div class="dose-original">${dosage}</div>`;
  if (!c.modern) return `<div class="dose-original">${dosage}</div>`;

  let html = `<div class="dose-original">${dosage}</div>`;

  // 特殊单位（文献实测）：只显示一个"文献"药丸
  if (c.type === 'special') {
    html += `<div class="dose-pill-container">`;
    html += `<div class="dose-pill active" title="${c.note || '文献实测'}（点击查看标准说明）"><div class="dose-pill-label">文献</div><div class="dose-pill-value">${c.medium}</div></div>`;
    html += `</div>`;
    return html;
  }

  // 纯容量单位（升/合无密度数据）：只显示容量
  if (c.type === 'volume') {
    html += `<div class="dose-pill-container">`;
    html += `<div class="dose-pill"><div class="dose-pill-label">容量</div><div class="dose-pill-value">${c.medium}</div></div>`;
    html += `</div>`;
    return html;
  }

  // 标准重量单位（两/钱）：显示四个标准药丸
  const pills = [
    { label: '教材', val: c.modern, key: 'modern' },
    { label: '轻量', val: c.light, key: 'light' },
    { label: '经方', val: c.medium, key: 'medium' },
    { label: '原方', val: c.full, key: 'full' }
  ];
  html += `<div class="dose-pill-container">`;
  pills.forEach(p => {
    const active = p.key === 'medium' ? 'active' : '';
    html += `<div class="dose-pill ${active}" title="点击查看剂量标准说明"><div class="dose-pill-label">${p.label}</div><div class="dose-pill-value">${p.val}</div></div>`;
  });
  html += `</div>`;
  return html;
}

function toggleReveal(el) {
  // 支持点击 section 容器或 button
  const section = el.closest ? el.closest('.section') : el;
  const btn = section.querySelector('.reveal-btn');
  const content = section.querySelector('.reveal-content');
  if (!content) return;
  const willReveal = !content.classList.contains('revealed');
  content.classList.toggle('revealed', willReveal);
  if (btn) btn.textContent = willReveal ? '隐藏' : '显示';
}

function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
  state.page = name;
  const btnDaily = document.getElementById('btnDaily');
  if (btnDaily) {
    btnDaily.style.display = (name === 'dashboard' || name === 'review') ? 'inline-block' : 'none';
  }
}

/** 渲染错题本区块（仪表盘快捷卡片流） */
function renderWrongBookSection() {
  const notes = loadStudyNotes();
  if (notes.length === 0) return;

  const dueToday = getDueStudyNotes();
  const counts = { confused: 0, misremembered: 0, unknown: 0, random: 0, skipped: 0 };
  notes.forEach(n => { counts[n.diagnosis] = (counts[n.diagnosis] || 0) + 1; });

  const container = document.getElementById('reviewPanel');
  if (!container) return;

  // 插入错题本区块到 reviewPanel 后面
  let wb = document.getElementById('wrongBookSection');
  if (!wb) {
    wb = document.createElement('div');
    wb.id = 'wrongBookSection';
    container.parentNode.insertBefore(wb, container.nextSibling);
  }

  wb.innerHTML = `
    <div class="wrongbook-section">
      <div class="wrongbook-header">
        <div class="wrongbook-title">
          📚 错题本
          <span class="wrongbook-badge">${notes.length}</span>
          <span class="wrongbook-subtitle">— ${dueToday.length} 题今日待复习</span>
        </div>
        <div class="wrongbook-actions">
          <button class="btn-filter active" onclick="renderWrongBookSection()">全部</button>
          ${counts.confused > 0 ? `<button class="btn-filter" onclick="filterWrongBook('confused')">🔀 类方混淆(${counts.confused})</button>` : ''}
          ${counts.misremembered > 0 ? `<button class="btn-filter" onclick="filterWrongBook('misremembered')">↔️ 反向盲区(${counts.misremembered})</button>` : ''}
          ${counts.unknown > 0 ? `<button class="btn-filter" onclick="filterWrongBook('unknown')">🕳️ 知识缺口(${counts.unknown})</button>` : ''}
          ${counts.random > 0 ? `<button class="btn-filter" onclick="filterWrongBook('random')">🧠 决策失误(${counts.random})</button>` : ''}
          <button class="btn-review-all" onclick="startWrongBookReview()">🔁 一键复习全部</button>
        </div>
      </div>
      <div class="wrongbook-flow">
        ${notes.slice(0, 6).map(n => renderWrongCard(n)).join('')}
        <div class="wrong-card-more" onclick="showAllWrongNotes()">
          查看全部 ${notes.length} 题 →
        </div>
      </div>
    </div>
  `;
}

function renderWrongCard(note) {
  const doneCount = note.reviewSchedule.filter(r => r.done).length;
  const totalCount = note.reviewSchedule.length;
  const tagClass = note.diagnosis;
  const tagLabels = { confused: '🔀 类方混淆', misremembered: '↔️ 反向盲区', unknown: '🕳️ 知识缺口', random: '🧠 决策失误', skipped: '⏭️ 未作答' };
  return `
    <div class="wrong-card" onclick="showWrongDetailModal('${note.id}')">
      <span class="wrong-card-tag ${tagClass}">${tagLabels[tagClass] || '❓'}</span>
      <div class="wrong-card-title">${escapeHtml(note.question)}</div>
      <div class="wrong-card-meta">${escapeHtml(note.cardName)} · ${note.vectorLabel}</div>
      <div class="wrong-card-stats">
        <span>❌ ${escapeHtml(note.selected)}</span>
        <span>✅ ${escapeHtml(note.correct)}</span>
      </div>
      <div class="wrong-card-bar">
        ${note.reviewSchedule.map(r => `<div class="wrong-card-bar-dot ${r.done ? 'done' : ''}"></div>`).join('')}
      </div>
      ${note.notes ? '<div style="font-size:11px;color:var(--text-secondary);">💡 有笔记</div>' : ''}
    </div>
  `;
}

function filterWrongBook(diagnosis) {
  const notes = loadStudyNotes().filter(n => n.diagnosis === diagnosis);
  const wb = document.getElementById('wrongBookSection');
  if (!wb) return;
  const flow = wb.querySelector('.wrongbook-flow');
  if (flow) {
    flow.innerHTML = notes.map(n => renderWrongCard(n)).join('') + `
      <div class="wrong-card-more" onclick="renderWrongBookSection()">← 显示全部</div>
    `;
  }
  // 切换按钮高亮
  wb.querySelectorAll('.wrongbook-actions .btn-filter').forEach(btn => {
    btn.classList.toggle('active', btn.textContent.includes(getDiagnosisLabel(diagnosis).replace(/[^\u4e00-\u9fa5]/g, '')));
  });
}

function showAllWrongNotes() {
  const notes = loadStudyNotes();
  let html = '<div class="modal-title">📚 全部错题（' + notes.length + '）</div>';
  html += '<div class="modal-body">';
  notes.forEach(n => {
    html += renderWrongCard(n).replace('class="wrong-card"', 'class="wrong-card" style="margin-bottom:12px;"');
  });
  html += '</div>';
  html += '<div class="modal-actions"><button class="modal-btn" onclick="closeModal()">关闭</button></div>';
  showModal(html, 'ai-study-modal');
}

function editWrongNote(noteId) {
  const notes = loadStudyNotes();
  const note = notes.find(n => n.id === noteId);
  if (!note) return;

  const html = `
    <div class="modal-title">✏️ 编辑学习笔记</div>
    <div class="modal-body">
      <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">
        ${escapeHtml(note.cardName)} · ${note.vectorLabel} · ${note.diagnosisLabel}
      </div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">
        题目：${escapeHtml(note.question)}
      </div>
      <textarea id="editNoteTextarea" style="width:100%;min-height:120px;padding:10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-panel);color:var(--text);font-size:13px;resize:vertical;">${escapeHtml(note.notes || '')}</textarea>
    </div>
    <div class="modal-actions">

function saveEditedNote(noteId) {
  const newNotes = document.getElementById('editNoteTextarea').value.trim();
  const all = JSON.parse(localStorage.getItem(STUDY_NOTES_KEY) || '{"notes":[]}');
  const note = all.notes.find(n => n.id === noteId);
  if (note) {
    note.notes = newNotes;
    note.updatedAt = new Date().toISOString();
    localStorage.setItem(STUDY_NOTES_KEY, JSON.stringify(all));
    showToast('笔记已更新');
    closeModal();
    setTimeout(() => showWrongDetailModal(noteId), 200);
  }
}

function deleteWrongNote(noteId) {
  if (!confirm('确定要删除这条错题记录吗？删除后不可恢复。')) return;
  const all = JSON.parse(localStorage.getItem(STUDY_NOTES_KEY) || '{"notes":[]}');
  all.notes = all.notes.filter(n => n.id !== noteId);
  localStorage.setItem(STUDY_NOTES_KEY, JSON.stringify(all));
  showToast('已删除');
  closeModal();
  renderWrongBookSection();
}

function openKimiFromNote(noteId) {
  const notes = loadStudyNotes();
  const note = notes.find(n => n.id === noteId);
  if (!note) return;
  const prompt = generateDiagnosisPrompt({ question: { text: note.question, type: note.vector, cardId: note.cardId }, selected: { label: note.selected } }, note.diagnosis);
  copyToClipboard(prompt);
  window.open('https://kimi.moonshot.cn', '_blank');
  showToast('Prompt 已复制，请粘贴到 Kimi');
}

function retryWrongNote(noteId) {
  const notes = loadStudyNotes();
  const note = notes.find(n => n.id === noteId);
  if (!note) return;
  const card = getCard(note.cardId);
  if (!card) return;
  const q = generateQuestionForVector(card, note.vector);
  if (!q) { alert('暂无可练习题目'); return; }
  q.options = generateOptions(q.cardId, q.type, CARDS);
  state.exam.questions = [q];
  state.exam.current = 0;
  state.exam.answers = [{ question: q, selected: null, isCorrect: null }];
  state.exam.finished = false;
  state.exam.submitted = false;
  state.exam.mode = 'practice-card';
  switchView('exam');
  renderExam();
  closeModal();
}

function masterWrongNote(noteId) {
  if (!confirm('确定标记为已掌握？此题将从错题本中移除。')) return;
  const all = JSON.parse(localStorage.getItem(STUDY_NOTES_KEY) || '{"notes":[]}');
  all.notes = all.notes.filter(n => n.id !== noteId);
  localStorage.setItem(STUDY_NOTES_KEY, JSON.stringify(all));
  renderWrongBookSection();
  closeModal();
  showToast('已标记掌握');
}

function startWrongBookReview() {
  const notes = loadStudyNotes();
  if (notes.length === 0) { alert('错题本为空'); return; }
  const questions = notes.map(n => {
    const card = getCard(n.cardId);
    if (!card) return null;
    const q = generateQuestionForVector(card, n.vector);
    if (!q) return null;
    q.options = generateOptions(q.cardId, q.type, CARDS);
    return q;
  }).filter(Boolean);
  if (questions.length === 0) { alert('暂无可复习题目'); return; }
  state.exam.questions = questions;
  state.exam.current = 0;
  state.exam.answers = questions.map(q => ({ question: q, selected: null, isCorrect: null }));
  state.exam.finished = false;
  state.exam.submitted = false;
  state.exam.mode = 'wrongbook-review';
  switchView('exam');
  renderExam();
}

function spRenderCaseList() {

        </div>
        <div style="font-size:28px;">${p.gender === '女' ? '👩' : '👨'}</div>

function renderCardList(cardsToShow, searchQuery) {
  const container = document.getElementById('cardList');
  if (!container) return;
  
  const cards = cardsToShow || CARDS;
  let html = '';
  
  // 搜索提示
  if (searchQuery) {
    html += `<div class="search-filter-hint">
      🔍 搜索结果：${cards.length} 张卡片匹配「${searchQuery}」
      <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">

      </div>
    </div>`;

    return;
  }

    const total = Object.keys(m).length;
    return `
      <div class="card-list-item" tabindex="0" onclick="goToLearn('${card.id}')" onkeydown="if(event.key==='Enter'){event.preventDefault();goToLearn('${card.id}');}">
        <div class="card-list-main">
          <div class="card-list-name">${card.name}</div>

        </div>
        <div class="progress-dots">
          ${Array.from({length: total}, (_, i) => `<div class="progress-dot ${i < done ? 'done' : ''}"></div>`).join('')}
        </div>
      </div>
    `;
  }).join('');
  
  container.innerHTML = html;
}

/* ===== 标签聚类 + 批量考试 ===== */

function showTagCluster(tag) {
  const matchingCards = CARDS.filter(c => c.tags && c.tags.includes(tag));
  if (matchingCards.length === 0) {
    showToast('未找到带有该标签的卡片');
    return;
  }
  state.tagClusterTag = tag;
  state.tagClusterCards = matchingCards;
  renderTagCluster();
}

function renderTagCluster() {
  const tag = state.tagClusterTag;
  const cards = state.tagClusterCards || [];
  const container = document.getElementById('cardList');
  if (!container) return;

  let html = '<div class="tag-cluster-header">';
  html += '<span class="tag-cluster-badge">🏷️ ' + tag + '</span>';
  html += '<span class="tag-cluster-count">' + cards.length + ' 张卡片</span>';
  html += '<div class="tag-cluster-actions">';
  html += '<button class="tag-cluster-back" onclick="goToDashboard()">← 返回全部</button>';
  html += '<button class="tag-cluster-exam" onclick="startTagExam()">📋 一起考试</button>';
  html += '</div></div>';

  html += cards.map(card => {
    const m = card.mastery || {};
    const done = Object.values(m).filter(x => x && x.status === '已掌握').length;
    const total = Object.keys(m).length;
    return `
      <div class="card-list-item" tabindex="0" onclick="goToLearn('${card.id}')" onkeydown="if(event.key==='Enter'){event.preventDefault();goToLearn('${card.id}');}">
        <div class="card-list-main">
          <div class="card-list-name">${card.name}</div>
          <div class="card-list-desc">${card.desc}</div>
          <div class="card-list-tags">
            ${card.tags.slice(0, 3).map(t => `<span class="tag ${t === tag ? 'active' : ''}" onclick="event.stopPropagation();showTagCluster('${t}')">${t}</span>`).join('')}
          </div>
        </div>
        <div class="progress-dots">
          ${Array.from({length: total}, (_, i) => `<div class="progress-dot ${i < done ? 'done' : ''}"></div>`).join('')}
        </div>
      </div>
    `;
  }).join('');

  container.innerHTML = html;
}

function startTagExam() {
  startClusterExam(state.tagClusterCards || [], '标签聚类', 'practice-similar');
}

function startSearchClusterExam() {
  const cards = state.searchFilteredCards || [];
  const query = state.searchQuery || '';
  if (cards.length === 0) {
    showToast('没有可考试的卡片');
    return;
  }
  startClusterExam(cards, '搜索聚类「' + query + '」', 'search-cluster');
}

function startClusterExam(cards, clusterName, mode) {
  if (cards.length === 0) {
    showToast('没有可考试的卡片');
    return;
  }

  // 从聚类卡片中生成题目，每个卡片至少一道题
  let questions = [];
  cards.forEach(card => {
    const q = generateQuestions(card.id);
    if (q && q.length > 0) {
      // 从每张卡片中随机抽1-2题
      const count = Math.min(q.length, Math.random() > 0.5 ? 2 : 1);
      const shuffled = q.sort(() => Math.random() - 0.5).slice(0, count);
      questions = questions.concat(shuffled);
    }
  });

  if (questions.length === 0) {
    showToast('这些卡片暂无题目，请先学习');
    return;
  }

  // 打乱顺序
  questions = questions.sort(() => Math.random() - 0.5);
  // 最多15题
  if (questions.length > 15) questions = questions.slice(0, 15);

  state.exam.questions = questions;
  state.exam.current = 0;
  state.exam.answers = [];
  state.exam.finished = false;
  state.exam.submitted = false;
  state.exam.mode = mode || 'practice-similar';
  state.activeCardId = cards[0].id; // 以第一张卡片作为上下文

  switchView('exam');

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/** 简单 Markdown 渲染（支持粗体、斜体、标题、列表、引用、代码、分隔线） */
function renderMarkdown(text) {
  if (!text) return '';
  let html = escapeHtml(text);

  // 代码块 ```code```（先处理，避免内部被转义）
  const codeBlocks = [];
  html = html.replace(/```(\n?[\s\S]*?)```/g, function(match, code) {
    codeBlocks.push('<pre><code>' + code + '</code></pre>');
    return '\n\nCODEBLOCK_' + (codeBlocks.length - 1) + '\n\n';
  });

  // 行内代码 `code`
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // 标题 h4-h1（从长到短匹配）
  html = html.replace(/^#{4} (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^#{3} (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^#{2} (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^#{1} (.+)$/gm, '<h1>$1</h1>');

  // 粗体 **text**
  html = html.replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>');
  // 斜体 *text*（粗体之后，避免重复）
  html = html.replace(/\*([^\*]+)\*/g, '<em>$1</em>');

  // 引用 > text
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // 分隔线 ---
  html = html.replace(/^---$/gm, '<hr>');
  html = html.replace(/^\*\*\*$/gm, '<hr>');

  // 表格渲染
  html = renderMarkdownTables(html);

  // 列表处理：先规范化 li 之间的空白
  // 有序/无序列表的 li 生成后，包裹连续的 li
  // 1. 先生成所有 li
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  // 2. 把 li 之间任意数量的空白行压缩为单个换行
  html = html.replace(/(<\/li>)(\n*)(<li>)/g, '$1\n$3');
  // 3. 包裹连续 li（ul 和 ol 分开）
  // 先标记来源：有序 li（来自数字）vs 无序 li（来自 -）
  // 这里简化处理：连续 li 包裹为 ol（如果第一个 li 来自数字）或 ul
  // 但已混在一起了，统一包裹为 ol 也可以，或者先统一为 ul
  // 简单方案：连续 li 统一包裹为 ul
  html = html.replace(/(<li>.+<\/li>\n?)+/g, '<ul>$&</ul>');

  // 段落处理：压缩多余空白
  html = html.replace(/\n{3,}/g, '\n\n');
  html = html.split('\n\n').map(p => {
    p = p.trim();
    if (!p) return '';
    if (p.match(/^<(h[1-6]|ul|ol|blockquote|pre|hr|table|div)/)) return p;
    p = p.replace(/\n/g, '<br>');
    return '<p>' + p + '</p>';
  }).join('');

  // 还原代码块
  codeBlocks.forEach((block, i) => {
    html = html.replace('CODEBLOCK_' + i, block);
  });

  return html;
}

// ===== Markdown 表格渲染 =====
function renderMarkdownTables(html) {
  const lines = html.split('\n');
  const result = [];
  let i = 0;
  while (i < lines.length) {
    if (lines[i].trim().startsWith('|')) {
      const tableLines = [];
      while (i < lines.length && lines[i].trim().startsWith('|')) {
        tableLines.push(lines[i]);
        i++;
      }
      // 有效表格：至少2行，第二行是分隔符（包含 |---| 或 |-| 等）
      if (tableLines.length >= 2 && tableLines[1].match(/^\s*\|[-:\s|]+\|\s*$/)) {
        result.push(parseTableHTML(tableLines));
      } else {
        result.push(...tableLines);
      }
    } else {
      result.push(lines[i]);
      i++;
    }
  }
  return result.join('\n');
}

function splitTableRow(line) {
  return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|');
}

function parseTableHTML(lines) {
  const headerCells = splitTableRow(lines[0]);
  const rows = lines.slice(2).map(splitTableRow);
  let html = '<table class="md-table">';
  html += '<thead><tr>' + headerCells.map(c => `<th>${c.trim()}</th>`).join('') + '</tr></thead>';
  html += '<tbody>' + rows.map(row =>
    '<tr>' + row.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>'
  ).join('') + '</tbody>';
  html += '</table>';
  return html;
}

function toggleSourcePanel() {
  const panel = document.getElementById('sourcePanel');
  const overlay = document.getElementById('sourcePanelOverlay');
  if (!panel || !overlay) return;
  const isOpen = panel.classList.contains('open');

function renderSourcePanel() {
  const panel = document.getElementById('sourcePanel');

  currentPanelCard = card;

  const sourceIds = card.source_text_ids || [];
  const sources = [];
  sourceIds.forEach(id => {
    const sc = (window.SOURCE_CARDS || []).find(s => s.id === id);
    if (sc) sources.push(sc);
  });

  // 也按 name 匹配（向后兼容）
  if (sources.length === 0 && card.formula_name) {
    (window.SOURCE_CARDS || []).forEach(sc => {

        sources.push(sc);
      }
    });

  let html = '<div class="sp-header"><h4>📜 ' + (card.name || card.formula_name || '条文') + '</h4><button class="btn-icon" onclick="toggleSourcePanel()">✕</button></div>';
  html += '<div class="sp-body">';

  if (sources.length === 0) {
    html += '<p style="color:var(--text-muted);text-align:center;padding:40px 20px;">暂无关联条文</p>';
  } else {
    sources.forEach((sc, idx) => {
      html += '<div class="sp-source-card" id="sp-source-' + idx + '">';
      html += '<div class="sp-source-chapter">' + (sc.chapter || sc.source_chapter || '伤寒论') + '</div>';
      html += '<div class="sp-source-text">' + (sc.source_text || sc.data?.source_text || '条文原文缺失').replace(/\n/g, '<br>') + '</div>';

      }
      html += '<div class="sp-source-actions">';

function escapeJs(str) {
  if (!str) return '';
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r');
}

function extractBulletPoints(text) {
  if (!text) return [];
  // 按句号、分号拆分
  const sentences = text.split(/[。；]/).filter(s => s.trim().length > 5);
  // 过滤掉太短的
  return sentences.slice(0, 6);
}

// 渲染学习视图
function renderReferences(card) {
  const refs = card.references;
  if (!refs) return '';
  
  let html = '';
  
  // 辅助：渲染结构化处方（视觉规范V1）
  function renderPrescription(rxItems, cardId) {
    if (!rxItems || !rxItems.length) return '';
    return rxItems.map((item, idx) => {
      // 检查药名是否在映射表中（存疑标注）
      const isKnown = window.HERB_ALIAS_MAP && window.HERB_ALIAS_MAP[item.name];
      const doubtMark = isKnown ? '' : '<span title="该药名未在映射表中确认，可能存在别名" style="color:var(--error);font-size:11px;margin-left:2px;cursor:help;">⚠</span>';
      return `<span class="rx-herb-name" onclick="onHerbClick('${escapeJs(item.name)}', '${cardId}')">${item.name}${doubtMark}</span><span class="rx-herb-dose">${item.dose || ''}</span>${idx < rxItems.length - 1 ? '<span class="rx-separator">、</span>' : ''}`;
    }).join('');
  }
  
  // 辅助：渲染方剂链接（视觉规范V1：合方标签）
  function renderFormulaLink(name, fromCardId) {
    const target = CARDS.find(c => c.formula_name === name || c.name === name);
    if (target) {
      return `<span class="rx-formula-tag" onclick="onFormulaClick('${escapeJs(name)}', '${escapeJs(target.id)}', '${fromCardId}')"><span class="rx-formula-label">合</span>${name}</span>`;
    }
    return `<span style="color:var(--text-muted);">${name}</span>`;
  }
  
  // 名家言论 → 拆分为经验要点
  if (refs.teacher_notes && refs.teacher_notes.length) {
    html += `<div class="ref-section"><div class="ref-section-title">📖 名家言论</div>`;
    refs.teacher_notes.forEach(note => {
      // 尝试从 summary 提取 bullet points
      const points = extractBulletPoints(note.summary);
      html += `
      <div class="ref-exp-card">
        <div class="ref-exp-card-header">${note.title}</div>
        <div class="ref-exp-card-meta">${note.author} · ${note.source}</div>
        <div class="ref-exp-points">
          ${points.map(p => `<div class="ref-exp-point">${escapeHtml(p)}</div>`).join('')}
        </div>
        ${note.url ? `<div style="margin-top:8px;font-size:12px;"><a href="${note.url}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;" onclick="recordTrace('link_click','reference_url','${escapeJs(note.url)}','${card.id}','${card.formula_name}')">🔗 查看原文链接</a></div>` : ''}
      </div>`;
    });
    html += `</div>`;
  }
  
  // 临床医案 → 结构化卡片
  if (refs.clinical_cases && refs.clinical_cases.length) {
    html += `<div class="ref-section"><div class="ref-section-title">🏥 临床医案 (${refs.clinical_cases.length})</div>`;
    refs.clinical_cases.forEach((caseItem, idx) => {
      // 解析患者标签
      const patientTags = [];
      if (caseItem.summary) {
        const ageMatch = caseItem.summary.match(/(\d+)\s*岁/);
        if (ageMatch) patientTags.push(ageMatch[1] + '岁');
        if (/女/.test(caseItem.summary)) patientTags.push('女性');
        else if (/男/.test(caseItem.summary)) patientTags.push('男性');
        const bodyTypes = ['形体壮实', '形体中等', '形体偏实', '中等偏实', '肌肉结实', '体格充实', '体格较充实'];
        bodyTypes.forEach(bt => { if (caseItem.summary.includes(bt)) patientTags.push(bt); });
      }
      
      // 症状标签
      const symptomTags = caseItem.tags || [];
      
      // 渲染处方
      let rxHtml = '';
      if (caseItem.prescription_structured && caseItem.prescription_structured.length) {
        rxHtml = `<div class="ref-case-rx"><div class="ref-exp-formula-label">📋 处方</div>${renderPrescription(caseItem.prescription_structured, card.id)}</div>`;
      } else if (caseItem.prescription) {
        rxHtml = `<div class="ref-case-rx"><div class="ref-exp-formula-label">📋 处方</div>${escapeHtml(caseItem.prescription)}</div>`;
      }
      
      // 疗效
      let outcomeHtml = '';
      if (caseItem.summary) {
        const outcomeKeywords = ['药后', '好转', '缓解', '减轻', '消失', '改善', '舒适', '畅', '止'];
        const lines = caseItem.summary.split(/[。；]/);
        for (const line of lines) {
          if (outcomeKeywords.some(kw => line.includes(kw)) && line.length > 10 && line.length < 200) {
            outcomeHtml = `<div class="ref-case-outcome"><strong>疗效：</strong>${escapeHtml(line.trim())}</div>`;
            break;
          }
        }
      }
      
      html += `
      <div class="ref-exp-card" style="border-left-color:var(--success);">

          <span style="font-size:11px;color:var(--text-muted);background:var(--accent-bg);padding:2px 8px;border-radius:4px;">#${idx+1}</span>

        <div class="ref-exp-card-meta">${caseItem.author} · ${caseItem.source}</div>
        
        <div class="ref-case-card">
          <div class="ref-case-header">
            <span class="ref-case-label">患者画像</span>

          <div class="ref-case-patient">

          </div>
          <div class="ref-case-symptoms">${escapeHtml(caseItem.summary || '')}</div>
          ${rxHtml}
          ${outcomeHtml}
        </div>
        
        <div class="ref-case-footer" style="margin-top:12px;">
          <span class="ref-case-source">${caseItem.source}</span>
          ${caseItem.url ? `<a href="${caseItem.url}" target="_blank" rel="noopener" class="ref-case-link" onclick="recordTrace('link_click','reference_url','${escapeJs(caseItem.url)}','${card.id}','${card.formula_name}')">查看原文</a>` : `<span class="ref-case-link broken">链接不可用</span>`}
          ${caseItem.local_path ? `<a href="${encodeURI('/' + caseItem.local_path)}" target="_blank" class="ref-case-link" onclick="recordTrace('link_click','reference_local','${escapeJs(caseItem.local_path)}','${card.id}','${card.formula_name}')">本地文件</a>` : ''}
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  
  // 条文讲解（方案B：右侧滑入面板 v2）
  // 新格式：card.source_annotations.references[]
  // 旧格式：card.references.source_annotations[]
  const allArticles = normalizeSourceAnnotations(card);
  if (allArticles.length > 0) {
    html += `<div class="ref-section"><div class="ref-section-title">📜 条文讲解 (${allArticles.length})</div>`;
    allArticles.forEach((article, idx) => {
      const firstTab = article.tabs[0];
      const preview = firstTab ? (firstTab.content.substring(0, 120) + '...') : '';

      <div class="anno-card" style="cursor:pointer;" onclick="openSlidePanel(getCard('${escapeJs(card.id)}'))">

          <div class="anno-title">${article.title}</div>

        <div class="anno-summary">${escapeHtml(preview)}</div>

          ${article.tabs.map((t,i) => `<span class="md-tag${i===0?'':(t.label==='刘渡舟'?'-teacher1':(t.label==='胡希恕'?'-teacher2':''))}" style="font-size:11px;padding:2px 6px;margin-right:4px;">${t.label}</span>`).join('')}
        </div>
      </div>`;
    });
    html += `</div>`;
  }
  
  // 兼容旧格式
  const cRefs = card.data && card.data.canonical && card.data.canonical.references;
  if (cRefs && cRefs.length && !refs.teacher_notes && !refs.clinical_cases) {
    const seenSources = new Set();
    html += `<div class="ref-section"><div class="ref-section-title">后世参考资料</div>`;
    cRefs.forEach(r => {
      const isFirst = r.source_path && !seenSources.has(r.source_path);
      if (r.source_path) seenSources.add(r.source_path);
      html += `
      <div class="ref-exp-card">
        <div class="ref-exp-card-header">${r.title}</div>
        <div class="ref-exp-card-meta">${r.author} · ${r.source} · ${r.type}</div>
        <div class="ref-exp-points"><div class="ref-exp-point">${escapeHtml(r.summary)}</div></div>
        ${isFirst ? `<a href="${encodeURI('/' + r.source_path)}" target="_blank" rel="noopener" class="ref-case-link" onclick="recordTrace('link_click','reference_local','${escapeJs(r.source_path)}','${card.id}','${card.formula_name}')">查看原文</a>` : ''}
      </div>`;
    });
    html += `</div>`;
  }
  
  return html;
}
