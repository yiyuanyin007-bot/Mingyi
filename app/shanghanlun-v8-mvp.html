<!DOCTYPE html>
<html data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《伤寒论》方剂训练 · MVP v8</title>
<style>
:root {
  --bg-body: #fafafa;
  --bg-panel: #ffffff;
  --bg-card: #f5f5f5;
  --bg-hover: #eeeeee;
  --border: #e0e0e0;
  --text-primary: #212121;
  --text-secondary: #616161;
  --text-muted: #9e9e9e;
  --accent: #455a64;
  --accent-bg: #eceff1;
  --success: #2e7d32;
  --error: #c62828;
  --shadow: 0 1px 2px rgba(0,0,0,0.06);
}

[data-theme="dark"] {
  --bg-body: #121212;
  --bg-panel: #1e1e1e;
  --bg-card: #252525;
  --bg-hover: #2d2d2d;
  --border: #333333;
  --text-primary: #e0e0e0;
  --text-secondary: #b0b0b0;
  --text-muted: #757575;
  --accent: #90a4ae;
  --accent-bg: #263238;
  --success: #66bb6a;
  --error: #ef5350;
  --shadow: 0 1px 2px rgba(0,0,0,0.2);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-body);
  color: var(--text-primary);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 顶部栏 */
.topbar {
  height: 52px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  box-shadow: var(--shadow);
  flex-shrink: 0;
}
.topbar-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
.topbar-actions { display: flex; gap: 10px; align-items: center; }
.topbar-btn {
  padding: 6px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-panel);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.15s;
}
.topbar-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
.topbar-btn.active {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
}
.topbar-btn.active:hover { background: var(--accent); color: #ffffff; }
.theme-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-panel);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 主内容区 */
.main {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.view {
  display: none;
  height: 100%;
  overflow-y: auto;
  padding: 24px;
  animation: fadeIn 0.2s ease;
}
.view.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 仪表盘 */
.dashboard-header {
  max-width: 720px;
  margin: 0 auto 24px;
}
.dashboard-title { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
.dashboard-desc { font-size: 13px; color: var(--text-secondary); }
.card-list {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card-list-item {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 18px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-list-item:hover {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.card-list-main { flex: 1; }
.card-list-name { font-size: 16px; font-weight: 600; }
.card-list-desc { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
.card-list-tags { display: flex; gap: 6px; margin-top: 8px; }
.tag {
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  background: var(--bg-card);
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.progress-dots { display: flex; gap: 4px; }
.progress-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--border);
}
.progress-dot.done { background: var(--accent); }

/* 学习视图 - 单栏 */
.learn-container {
  max-width: 680px;
  margin: 0 auto;
}
.back-link {
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  margin-bottom: 16px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.back-link:hover { color: var(--accent); }
.learn-header {
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
}
.learn-header-main { flex: 1; min-width: 0; }
.learn-name { font-size: 26px; font-weight: 700; }
.learn-tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.learn-header-actions { flex-shrink: 0; }

.section {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
  margin-bottom: 14px;
}
.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 12px;
}
.section-body {
  font-size: 14px;
  line-height: 1.8;
  color: var(--text-primary);
}

.source-text {
  font-size: 16px;
  line-height: 1.9;
  color: var(--text-primary);
  padding: 16px;
  background: var(--bg-card);
  border-radius: 8px;
  border-left: 3px solid var(--accent);
}

.symptom-group { margin-bottom: 12px; }
.symptom-group:last-child { margin-bottom: 0; }
.symptom-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.symptom-items { display: flex; flex-wrap: wrap; gap: 6px; }
.symptom-item {
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 13px;
  background: var(--bg-card);
  border: 1px solid var(--border);
}
.symptom-item.necessary {
  background: var(--accent-bg);
  border-color: var(--accent);
  color: var(--text-primary);
}
.symptom-item.excluding {
  text-decoration: line-through;
  opacity: 0.6;
}

.herbs-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
  gap: 10px;
}
.herb-item {
  text-align: center;
  padding: 12px 8px;
  background: var(--bg-card);
  border-radius: 8px;
  border: 1px solid var(--border);
}
.herb-name { font-size: 15px; font-weight: 600; }
.herb-dose { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }

.experience-box {
  background: var(--accent-bg);
  border: 1px solid var(--accent);
  border-radius: 8px;
  padding: 14px;
  margin-top: 8px;
}
.experience-title { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.experience-content { font-size: 13px; line-height: 1.7; color: var(--text-secondary); }
.efficacy-tags { display: flex; gap: 6px; margin-top: 10px; }

.action-bar {
  display: flex;
  gap: 10px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.btn-primary {
  padding: 10px 20px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: white;
  font-size: 14px;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn-primary:hover { opacity: 0.85; }
.btn-secondary {
  padding: 10px 20px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-panel);
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
}
.btn-secondary:hover { background: var(--bg-hover); }

/* 考试视图 - 双栏 */
.exam-layout {
  max-width: 900px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  height: 100%;
}
.exam-question {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px;
}
.exam-question-title {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 12px;
}
.exam-question-body {
  font-size: 18px;
  line-height: 1.7;
  font-weight: 500;
}
.exam-question-hint {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 16px;
}
.exam-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.exam-option {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  cursor: pointer;
  font-size: 15px;
  transition: all 0.15s;
  text-align: left;
}
.exam-option:hover {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.exam-option.selected {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.exam-option.correct {
  border-color: var(--success);
  background: rgba(46,125,50,0.12);
}
.exam-option.wrong {
  border-color: var(--error);
  background: rgba(198,40,40,0.12);
}
.exam-feedback {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.6;
  display: none;
  border-left: 4px solid transparent;
}
.exam-feedback.show { display: block; }
.exam-feedback.correct {
  background: rgba(46,125,50,0.08);
  border-color: var(--success);
  color: var(--success);
}
.exam-feedback.wrong {
  background: rgba(198,40,40,0.08);
  border-color: var(--error);
  color: var(--error);
}
.exam-feedback strong {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
}

.exam-progress {
  max-width: 900px;
  margin: 0 auto 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--text-secondary);
}
.exam-nav {
  max-width: 900px;
  margin: 20px auto 0;
  display: flex;
  justify-content: flex-end;
}

/* 统计视图 */
.stats-grid {
  max-width: 720px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 14px;
}
.stat-card {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
}
.stat-value { font-size: 28px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">《伤寒论》方剂训练 · MVP v8</div>
  <div class="topbar-actions">
    <button class="topbar-btn" id="btnStats" onclick="goToStats()">统计</button>
    <button class="topbar-btn" id="btnDashboard" onclick="goToDashboard()">卡片</button>
    <button class="theme-btn" id="btnTheme" onclick="toggleTheme()" title="切换主题">🌙</button>
  </div>
</div>

<div class="main">
  <!-- 仪表盘 -->
  <div class="view active" id="viewDashboard">
    <div class="dashboard-header">
      <div class="dashboard-title">选择一张卡片开始学习</div>
      <div class="dashboard-desc">当前为 Level 0（小白模式），仅展示原文标准与基础禁忌。</div>
    </div>
    <div class="card-list" id="cardList"></div>
    <div id="loadingOverlay" style="text-align:center;padding:60px 20px;color:var(--text-secondary);font-size:14px;">正在加载数据…</div>
  </div>

  <!-- 学习视图 -->
  <div class="view" id="viewLearn">
    <div class="learn-container" id="learnContainer"></div>
  </div>

  <!-- 考试视图 -->
  <div class="view" id="viewExam">
    <div class="exam-progress" id="examProgress"></div>
    <div class="exam-layout">
      <div class="exam-question">
        <div class="exam-question-title">题目</div>
        <div class="exam-question-body" id="examQuestion"></div>
        <div class="exam-question-hint" id="examHint"></div>
      </div>
      <div>
        <div class="exam-options" id="examOptions"></div>
        <div class="exam-feedback" id="examFeedback"></div>
        <div class="exam-nav" id="examNav"></div>
      </div>
    </div>
  </div>

  <!-- 统计视图 -->
  <div class="view" id="viewStats">
    <div class="dashboard-header">
      <div class="dashboard-title">学习统计</div>
      <div class="dashboard-desc">掌握度进度已自动保存，刷新不丢失。本次答题统计仅限当前会话。</div>
    </div>
    <div class="stats-grid" id="statsGrid"></div>
  </div>
</div>

<script>
// ========== 数据：从 JSON 文件动态加载 ==========
let CARDS = [];
let EXPERIENCES = [];
let SOURCE_CARDS = [];

// 数据文件路径（相对路径，适配本地和 CloudStudio 部署）
const DATA_PATHS = {
  formula: '../data/formula_cards.json',
  experience: '../data/experience_cards.json',
  source: '../data/source_cards.json'
};

// ========== 数据加载 ==========
async function loadData() {
  const [fcRes, ecRes, scRes] = await Promise.all([
    fetch(DATA_PATHS.formula),
    fetch(DATA_PATHS.experience),
    fetch(DATA_PATHS.source)
  ]);

  if (!fcRes.ok) throw new Error(`加载 formula_cards.json 失败: ${fcRes.status}`);
  if (!ecRes.ok) throw new Error(`加载 experience_cards.json 失败: ${ecRes.status}`);
  if (!scRes.ok) throw new Error(`加载 source_cards.json 失败: ${scRes.status}`);

  CARDS = await fcRes.json();
  EXPERIENCES = await ecRes.json();
  SOURCE_CARDS = await scRes.json();
  // SOURCE_CARDS 为后续原文阅读视图预留，当前版本未使用

  console.log(`数据加载完成: ${CARDS.length} 方剂卡, ${EXPERIENCES.length} 经验卡, ${SOURCE_CARDS.length} 原文卡`);

  // 加载完成后恢复掌握度
  loadMastery();
}

// ========== localStorage 掌握度持久化 ==========
const STORAGE_KEY = 'shanghanlun_mastery';

function saveMastery() {
  try {
    const masteryData = {};
    CARDS.forEach(card => {
      if (card.mastery) {
        masteryData[card.id] = card.mastery;
      }
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(masteryData));
  } catch (e) {
    console.warn('保存掌握度失败:', e);
  }
}

function loadMastery() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const masteryData = JSON.parse(raw);
    CARDS.forEach(card => {
      if (masteryData[card.id]) {
        card.mastery = masteryData[card.id];
      }
    });
    console.log('掌握度已从 localStorage 恢复');
  } catch (e) {
    console.warn('恢复掌握度失败:', e);
  }
}

// ========== 工具函数 ==========
function slugToName(id) {
  const c = CARDS.find(x => x.id === id);
  return c ? c.name : id;
}

function getCard(id) { return CARDS.find(c => c.id === id); }
function getExperience(id) { return EXPERIENCES.find(e => e.id === id); }
function getSourceCard(id) { return SOURCE_CARDS.find(s => s.id === id); }

// ========== 视图切换 ==========
function switchView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
  state.page = name;

  // 更新顶部导航选中态：只有 dashboard/stats 有对应按钮
  document.querySelectorAll('.topbar-btn').forEach(btn => btn.classList.remove('active'));
  if (name === 'dashboard') document.getElementById('btnDashboard').classList.add('active');
  if (name === 'stats') document.getElementById('btnStats').classList.add('active');
}

function goToDashboard() {
  state.activeCardId = null;
  switchView('dashboard');
  renderDashboard();
}

function goToStats() {
  switchView('stats');
  renderStats();
}

function goToLearn(cardId) {
  state.activeCardId = cardId;
  switchView('learn');
  renderLearn();
}

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('btnTheme').textContent = isDark ? '🌙' : '☀️';
}

// ========== 渲染仪表盘 ==========
function renderDashboard() {
  const container = document.getElementById('cardList');
  container.innerHTML = CARDS.map(card => {
    const m = card.mastery || {};
    const done = Object.values(m).filter(x => x && x.status === '已掌握').length;
    const total = Object.keys(m).length;
    return `
      <div class="card-list-item" onclick="goToLearn('${card.id}')">
        <div class="card-list-main">
          <div class="card-list-name">${card.name}</div>
          <div class="card-list-desc">${card.desc || ''}</div>
          <div class="card-list-tags">
            ${(card.tags || []).slice(0, 3).map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
        </div>
        <div class="progress-dots">
          ${Array.from({length: total}, (_, i) => `<div class="progress-dot ${i < done ? 'done' : ''}"></div>`).join('')}
        </div>
      </div>
    `;
  }).join('');
}

// ========== 渲染学习视图 ==========
function renderLearn() {
  const card = getCard(state.activeCardId);
  if (!card) return;
  const c = card.data.canonical;
  const profile = c.symptom_profile || {};
  const exp = (card.experience_ids || []).map(getExperience).filter(Boolean)[0];

  document.getElementById('learnContainer').innerHTML = `
    <div class="back-link" onclick="goToDashboard()">← 返回卡片列表</div>
    <div class="learn-header">
      <div class="learn-header-main">
        <div class="learn-name">${card.name}</div>
        <div class="learn-tags">
          ${(card.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
      </div>
      <div class="learn-header-actions">
        <button class="btn-primary" onclick="startExam('${card.id}')">开始测试</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">原文条文</div>
      <div class="source-text">${card.data.source_text || '暂无'}</div>
    </div>

    <div class="section">
      <div class="section-title">症状谱</div>
      <div class="symptom-group">
        <div class="symptom-label">必要症（出现此方才成立）</div>
        <div class="symptom-items">
          ${(profile.necessary || []).map(s => `<span class="symptom-item necessary">${s}</span>`).join('') || '<span class="symptom-item">暂无</span>'}
        </div>
      </div>
      <div class="symptom-group">
        <div class="symptom-label">常见症（可出现也可不出现）</div>
        <div class="symptom-items">
          ${(profile.common || []).map(s => `<span class="symptom-item">${s}</span>`).join('') || '<span class="symptom-item">暂无</span>'}
        </div>
      </div>
      <div class="symptom-group">
        <div class="symptom-label">排除症（出现则排除此方）</div>
        <div class="symptom-items">
          ${(profile.excluding || []).map(s => `<span class="symptom-item excluding">${s}</span>`).join('') || '<span class="symptom-item">暂无</span>'}
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">药物组成</div>
      <div class="herbs-grid">
        ${c.herbs.map(h => `
          <div class="herb-item">
            <div class="herb-name">${h.name}</div>
            <div class="herb-dose">${h.dosage || ''}</div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="section">
      <div class="section-title">病机</div>
      <div class="section-body">${c.pathology || '暂无'}</div>
    </div>

    <div class="section">
      <div class="section-title">禁忌</div>
      <div class="section-body">${(c.contraindications || []).join('、') || '无明确禁忌'}</div>
    </div>

    <div class="section">
      <div class="section-title">煎服法</div>
      <div class="section-body">${c.usage || '暂无'}</div>
    </div>

    ${exp ? `
    <div class="section">
      <div class="section-title">经验记录</div>
      <div class="experience-box">
        <div class="experience-title">${exp.title || ''}</div>
        <div class="experience-content">${exp.content || ''}</div>
        <div class="efficacy-tags">
          <span class="tag">主观有效：${exp.efficacy && exp.efficacy.subjective_effective ? '是' : '否'}</span>
          <span class="tag">客观变化：${(exp.efficacy && exp.efficacy.objective_change || []).join('、') || '无'}</span>
          <span class="tag">置信度：${exp.efficacy && exp.efficacy.confidence_level || '未知'}</span>
        </div>
      </div>
    </div>
    ` : ''}

    <div class="action-bar">
      <button class="btn-secondary" onclick="goToDashboard()">返回卡片列表</button>
    </div>
  `;
}

// ========== 考试逻辑 ==========
function generateQuestions(cardId) {
  const card = getCard(cardId);
  if (!card) return [];
  const c = card.data.canonical;
  const profile = c.symptom_profile || {};
  const allSymptoms = [...(profile.necessary || []), ...(profile.common || [])];
  const questions = [];

  // 0→1: 方名→症状（仅当有必要症时才生成）
  if ((profile.necessary || []).length > 0) {
    const necessaryJoined = profile.necessary.join('、');
    questions.push({
      type: '0→1',
      text: `${card.name}的必要症状包括哪些？`,
      correct: necessaryJoined,
      options: generateOptions(cardId, '0→1', necessaryJoined)
    });
  }

  // 1→0: 症状→方名
  if (allSymptoms.length > 0) {
    questions.push({
      type: '1→0',
      text: `患者出现 ${allSymptoms.slice(0, 2).join('、')}，最可能选哪个方？`,
      correct: card.id,
      options: generateOptions(cardId, '1→0')
    });
  }

  // 0→2: 方名→药物
  if (c.herbs.length > 0) {
    questions.push({
      type: '0→2',
      text: `${card.name}包含以下哪味药？`,
      correct: [c.herbs[0].name],
      options: generateOptions(cardId, '0→2', c.herbs[0].name)
    });
  }

  // 0→contra: 方名→禁忌
  if (c.contraindications.length > 0) {
    questions.push({
      type: '0→contra',
      text: `${card.name}的禁忌是什么？`,
      correct: [c.contraindications[0]],
      options: generateOptions(cardId, '0→contra', c.contraindications[0])
    });
  }

  return questions;
}

function generateOptions(cardId, type, correctValue) {
  const others = CARDS.filter(c => c.id !== cardId);
  const shuffled = others.sort(() => Math.random() - 0.5).slice(0, 3);
  const opts = [];

  for (const c of [getCard(cardId), ...shuffled]) {
    const canonical = c.data.canonical;
    const profile = canonical.symptom_profile || {};
    if (type === '0→1') {
      opts.push({ id: c.id, label: (profile.necessary || []).join('、') || '无' });
    } else if (type === '1→0') {
      opts.push({ id: c.id, label: c.name });
    } else if (type === '0→2') {
      const herbs = canonical.herbs.map(h => h.name);
      opts.push({ id: c.id, label: herbs[0] || '无' });
    } else if (type === '0→contra') {
      opts.push({ id: c.id, label: canonical.contraindications[0] || '无' });
    }
  }

  return opts.sort(() => Math.random() - 0.5);
}

function startExam(cardId) {
  state.activeCardId = cardId;
  state.exam.questions = generateQuestions(cardId);
  state.exam.current = 0;
  state.exam.answers = [];
  state.exam.finished = false;
  switchView('exam');
  renderExam();
}

function renderExam() {
  const q = state.exam.questions[state.exam.current];
  if (!q) return;

  document.getElementById('examProgress').textContent =
    `题目 ${state.exam.current + 1} / ${state.exam.questions.length}`;
  document.getElementById('examQuestion').textContent = q.text;
  document.getElementById('examHint').textContent = `类型：${q.type}`;

  const optsContainer = document.getElementById('examOptions');
  optsContainer.innerHTML = q.options.map((opt, idx) => `
    <button class="exam-option" id="opt-${idx}" onclick="selectOption(${idx})">
      ${opt.label}
    </button>
  `).join('');

  document.getElementById('examFeedback').className = 'exam-feedback';
  document.getElementById('examFeedback').innerHTML = '';
  document.getElementById('examNav').innerHTML = '';
}

function selectOption(idx) {
  if (state.exam.finished) return;
  const q = state.exam.questions[state.exam.current];
  const selected = q.options[idx];
  const isCorrect = q.type === '1→0'
    ? selected.id === q.correct
    : selected.label === q.correct;

  state.exam.answers.push({ question: q, selected, isCorrect });
  state.exam.finished = true;
  state.stats.total++;
  if (isCorrect) state.stats.right++; else state.stats.wrong++;

  // 更新掌握度
  const card = getCard(state.activeCardId);
  if (card && card.mastery && card.mastery[q.type]) {
    const m = card.mastery[q.type];
    if (isCorrect) {
      m.streak_right++;
      m.streak_wrong = 0;
      m.total_rights++;
      m.last_result = 'right';
      if (m.streak_right >= 3) {
        m.status = '已掌握';
        m.level = Math.min(5, m.level + 1);
        m.streak_right = 0;
      } else {
        m.status = '正在学习';
      }
    } else {
      m.streak_wrong++;
      m.streak_right = 0;
      m.total_wrongs++;
      m.last_result = 'wrong';
      if (m.streak_wrong >= 2) {
        m.level = Math.max(0, m.level - 1);
        m.status = m.level >= 3 ? '正在学习' : '已遗忘';
        m.streak_wrong = 0;
      }
    }
    m.last_review = new Date().toISOString();
    saveMastery(); // 持久化
  }

  // UI 反馈
  q.options.forEach((opt, i) => {
    const btn = document.getElementById(`opt-${i}`);
    const optCorrect = q.type === '1→0'
      ? opt.id === q.correct
      : q.correct.includes(opt.label);
    if (optCorrect) btn.classList.add('correct');
    if (i === idx && !optCorrect) btn.classList.add('wrong');
    btn.disabled = true;
  });

  const fb = document.getElementById('examFeedback');
  fb.className = isCorrect ? 'exam-feedback show correct' : 'exam-feedback show wrong';
  fb.innerHTML = isCorrect
    ? `<strong><span>✓</span> 回答正确</strong> ${q.type === '1→0' ? '该症状组合指向' + slugToName(q.correct) : ''}`
    : `<strong><span>✕</span> 回答错误</strong> 正确答案是：${q.correct}`;
}

function nextQuestion() {
  state.exam.current++;
  state.exam.finished = false;
  renderExam();
}

function finishExam() {
  goToLearn(state.activeCardId);
}

// ========== 渲染统计 ==========
function renderStats() {
  const totalCards = CARDS.length;
  const mastered = CARDS.reduce((sum, c) => {
    return sum + Object.values(c.mastery || {}).filter(m => m.status === '已掌握').length;
  }, 0);
  const totalVectors = CARDS.reduce((sum, c) => sum + Object.keys(c.mastery || {}).length, 0);

  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="stat-value">${totalCards}</div><div class="stat-label">方剂卡</div></div>
    <div class="stat-card"><div class="stat-value">${state.stats.total}</div><div class="stat-label">本次会话答题数</div></div>
    <div class="stat-card"><div class="stat-value">${state.stats.right}</div><div class="stat-label">正确</div></div>
    <div class="stat-card"><div class="stat-value">${state.stats.wrong}</div><div class="stat-label">错误</div></div>
    <div class="stat-card"><div class="stat-value">${mastered}/${totalVectors}</div><div class="stat-label">已掌握向量</div></div>
  `;
}

// ========== 应用状态 ==========
const state = {
  page: 'dashboard',
  activeCardId: null,
  exam: {
    questions: [],
    current: 0,
    answers: [],
    finished: false
  },
  stats: {
    total: 0,
    right: 0,
    wrong: 0
  }
};

// ========== 初始化 ==========
async function initApp() {
  const loading = document.getElementById('loadingOverlay');
  try {
    await loadData();
    loading.style.display = 'none';
    renderDashboard();
  } catch (err) {
    console.error('数据加载失败:', err);
    loading.innerHTML =
      `<div style="color:var(--error);padding:40px;text-align:center;">
        <strong>数据加载失败</strong><br><br>
        ${err.message}<br><br>
        <button class="btn-primary" onclick="location.reload()">重新加载</button>
      </div>`;
  }
}

initApp();
</script>
