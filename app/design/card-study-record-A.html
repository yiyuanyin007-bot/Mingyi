<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡片学习记录 - 版本A：底部进度条版</title>
<style>
:root {
  --bg: #f5f5f0;
  --bg-panel: #fff;
  --bg-hover: #faf9f6;
  --border: #e8e4df;
  --text: #2a2a28;
  --text-secondary: #6b6863;
  --text-muted: #9a9590;
  --accent: #b45309;
  --accent-bg: #fef3c7;
  --success: #22c55e;
  --danger: #ef4444;
  --warning: #f59e0b;
}
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif; background: var(--bg); padding: 40px 24px; margin: 0; }
.container { max-width: 1200px; margin: 0 auto; }
h1 { font-size: 20px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
.subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 32px; }

/* 卡片列表 - CSS Grid */
.card-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}

/* 卡片主体 */
.card-list-item {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px 18px;
  cursor: pointer;
  transition: box-shadow 0.15s, border-color 0.15s;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.04);
}
.card-list-item:hover {
  border-color: var(--accent);
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

/* 卡片头部 */
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.card-name { font-size: 16px; font-weight: 600; color: var(--text); }
.card-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag {
  padding: 2px 8px; border-radius: 10px; font-size: 11px;
  background: var(--bg); color: var(--text-secondary);
  border: 1px solid var(--border); cursor: pointer;
}

/* 学习记录 - 版本A特有：底部进度条 */
.study-record-a {
  border-top: 1px dashed var(--border);
  padding-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.record-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.record-dots {
  display: flex;
  gap: 4px;
  align-items: center;
}
.dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #d1d5db; /* 未学习 */
}
.dot.mastered { background: var(--success); }
.dot.learning { background: var(--warning); }
.dot.wrong { background: var(--danger); box-shadow: 0 0 0 1px var(--danger); }

.record-text {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  gap: 12px;
  align-items: center;
}
.record-text .highlight { color: var(--accent); font-weight: 600; }
.record-text .review-today { color: var(--danger); font-weight: 600; }

/* 错题徽章 */
.wrong-badge {
  background: #fee2e2;
  color: var(--danger);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 3px;
}

/* 进度数字 */
.record-score {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  min-width: 40px;
  text-align: right;
}
</style>
</head>
<body>
<div class="container">
  <h1>卡片学习记录 · 版本A：底部进度条版</h1>
  <div class="subtitle">最简洁。卡片底部显示6向量进度条 + 上次学习 + 错题提示。一瞥即知。</div>

  <div class="card-list">

    <!-- 卡片1：已掌握较多 -->
    <div class="card-list-item">
      <div>
        <div class="card-header">
          <div>
            <div class="card-name">桂枝汤</div>
            <div class="card-desc">太阳中风主方</div>
          </div>
        </div>
        <div class="card-tags">
          <span class="tag">太阳病</span><span class="tag">解表剂</span><span class="tag">风伤卫</span>
        </div>
      </div>
      <!-- 学习记录 -->
      <div class="study-record-a">
        <div class="record-row">
          <div class="record-dots">
            <div class="dot mastered" title="症状→方名: 已掌握"></div>
            <div class="dot mastered" title="方名→症状: 已掌握"></div>
            <div class="dot mastered" title="方名→药组: 已掌握"></div>
            <div class="dot learning" title="药组→方名: 学习中"></div>
            <div class="dot" title="禁忌: 未学习"></div>
            <div class="dot" title="煎服法: 未学习"></div>
          </div>
          <div class="record-score">3/6</div>
        </div>
        <div class="record-text">
          <span>上次学习: 2天前</span>
          <span class="review-today">⚠️ 今天复习</span>
        </div>
      </div>
    </div>

    <!-- 卡片2：有错题 -->
    <div class="card-list-item">
      <div>
        <div class="card-header">
          <div>
            <div class="card-name">桂枝加葛根汤</div>
            <div class="card-desc">太阳中风兼项背强痛</div>
          </div>
        </div>
        <div class="card-tags">
          <span class="tag">太阳病</span><span class="tag">项背强几几</span><span class="tag">汗出</span>
        </div>
      </div>
      <div class="study-record-a">
        <div class="record-row">
          <div class="record-dots">
            <div class="dot mastered" title="症状→方名: 已掌握"></div>
            <div class="dot learning" title="方名→症状: 学习中"></div>
            <div class="dot" title="方名→药组: 未学习"></div>
            <div class="dot" title="药组→方名: 未学习"></div>
            <div class="dot" title="禁忌: 未学习"></div>
            <div class="dot" title="煎服法: 未学习"></div>
          </div>
          <div class="wrong-badge">💡 2条错题</div>
        </div>
        <div class="record-text">
          <span>上次学习: 5天前</span>
          <span class="highlight">下次复习: 3天后</span>
        </div>
      </div>
    </div>

    <!-- 卡片3：全部未学习 -->
    <div class="card-list-item">
      <div>
        <div class="card-header">
          <div>
            <div class="card-name">小建中汤</div>
            <div class="card-desc">虚劳里急</div>
          </div>
        </div>
        <div class="card-tags">
          <span class="tag">太阴病</span><span class="tag">补益剂</span><span class="tag">腹痛</span>
        </div>
      </div>
      <div class="study-record-a">
        <div class="record-row">
          <div class="record-dots">
            <div class="dot" title="症状→方名: 未学习"></div>
            <div class="dot" title="方名→症状: 未学习"></div>
            <div class="dot" title="方名→药组: 未学习"></div>
            <div class="dot" title="药组→方名: 未学习"></div>
            <div class="dot" title="禁忌: 未学习"></div>
            <div class="dot" title="煎服法: 未学习"></div>
          </div>
          <div class="record-score" style="color:var(--text-muted);">0/6</div>
        </div>
        <div class="record-text">
          <span style="color:var(--text-muted);">尚未学习</span>
        </div>
      </div>
    </div>

    <!-- 卡片4：全部已掌握 -->
    <div class="card-list-item">
      <div>
        <div class="card-header">
          <div>
            <div class="card-name">麻黄汤</div>
            <div class="card-desc">太阳伤寒主方</div>
          </div>
        </div>
        <div class="card-tags">
          <span class="tag">太阳病</span><span class="tag">解表剂</span><span class="tag">寒伤营</span>
        </div>
      </div>
      <div class="study-record-a">
        <div class="record-row">
          <div class="record-dots">
            <div class="dot mastered" title="症状→方名: 已掌握"></div>
            <div class="dot mastered" title="方名→症状: 已掌握"></div>
            <div class="dot mastered" title="方名→药组: 已掌握"></div>
            <div class="dot mastered" title="药组→方名: 已掌握"></div>
            <div class="dot mastered" title="禁忌: 已掌握"></div>
            <div class="dot mastered" title="煎服法: 已掌握"></div>
          </div>
          <div class="record-score" style="color:var(--success);">6/6</div>
        </div>
        <div class="record-text">
          <span>上次学习: 1天前</span>
          <span class="highlight">下次复习: 7天后</span>
        </div>
      </div>
    </div>

    <!-- 卡片5：混合状态 -->
    <div class="card-list-item">
      <div>
        <div class="card-header">
          <div>
            <div class="card-name">大承气汤</div>
            <div class="card-desc">阳明腑实重证</div>
          </div>
        </div>
        <div class="card-tags">
          <span class="tag">阳明病</span><span class="tag">攻下剂</span><span class="tag">重证</span>
        </div>
      </div>
      <div class="study-record-a">
        <div class="record-row">
          <div class="record-dots">
            <div class="dot mastered" title="症状→方名: 已掌握"></div>
            <div class="dot mastered" title="方名→症状: 已掌握"></div>
            <div class="dot mastered" title="方名→药组: 已掌握"></div>
            <div class="dot mastered" title="药组→方名: 已掌握"></div>
            <div class="dot learning" title="禁忌: 学习中"></div>
            <div class="dot" title="煎服法: 未学习"></div>
          </div>
          <div class="record-score">4/6</div>
        </div>
        <div class="record-text">
          <span>上次学习: 今天</span>
          <span class="highlight">下次复习: 2天后</span>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
