<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案B：错题弹窗 · 卡片流</title>
<style>
:root {
  --bg: #f5f6f8;
  --panel: #fff;
  --border: #e5e7eb;
  --text: #1f2937;
  --text-sec: #6b7280;
  --accent: #059669;
  --accent-bg: #ecfdf5;
  --error: #dc2626;
  --error-bg: #fef2f2;
  --warn: #d97706;
  --warn-bg: #fffbeb;
  --shadow: 0 4px 20px rgba(0,0,0,0.15);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #333; color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; }

/* 场景描述 */
.scene-desc {
  position: fixed; top: 0; left: 0; right: 0; background: #fff3e0; border-bottom: 1px solid #ffe0b2;
  padding: 12px 20px; font-size: 14px; color: #e65100; z-index: 100; text-align: center;
}

/* 弹窗遮罩 */
.overlay { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 40px 20px; margin-top: 40px; }

/* 弹窗本体 */
.modal {
  background: var(--panel); border-radius: 16px; width: 100%; max-width: 640px; max-height: 85vh;
  overflow: hidden; box-shadow: var(--shadow); display: flex; flex-direction: column;
}

/* 弹窗头部 */
.modal-header {
  padding: 20px 24px 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
}
.modal-title { font-size: 18px; font-weight: 600; }
.modal-close { font-size: 20px; color: var(--text-sec); cursor: pointer; }

/* 进度条 */
.progress-bar { padding: 0 24px 16px; display: flex; gap: 4px; }
.progress-seg { height: 4px; flex: 1; border-radius: 2px; background: var(--border); }
.progress-seg.done { background: var(--accent); }
.progress-seg.current { background: var(--accent); opacity: 0.5; }

/* 卡片内容区 */
.modal-body { padding: 0 24px 20px; overflow-y: auto; flex: 1; }

/* 错题卡片 */
.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.card-number { font-size: 13px; color: var(--text-sec); }
.card-tag {
  font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 600;
}
.card-tag.confused { background: var(--warn-bg); color: var(--warn); }
.card-tag.unknown { background: #eff6ff; color: #2563eb; }
.card-tag.random { background: var(--error-bg); color: var(--error); }

.card-question { font-size: 18px; font-weight: 600; margin-bottom: 16px; line-height: 1.5; }

/* 选项区 */
.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.option {
  padding: 14px 18px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px;
  cursor: pointer; transition: all 0.15s; display: flex; justify-content: space-between; align-items: center;
}
.option:hover { border-color: var(--accent); background: var(--accent-bg); }
.option.wrong { border-color: var(--error); background: var(--error-bg); color: var(--error); }
.option.right { border-color: var(--accent); background: var(--accent-bg); color: var(--accent); }
.option-label { font-size: 12px; color: var(--text-sec); }

/* 反馈区 */
.feedback { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 13px; line-height: 1.6; }
.feedback.wrong { background: var(--error-bg); border: 1px solid #fecaca; }
.feedback.right { background: var(--accent-bg); border: 1px solid #a7f3d0; }

/* 笔记区 */
.notes-area {
  background: var(--bg); border-radius: 8px; padding: 12px; margin-bottom: 16px;
}
.notes-area textarea {
  width: 100%; border: none; background: transparent; font-size: 13px; line-height: 1.6; resize: vertical; min-height: 60px; font-family: inherit;
}
.notes-area textarea:focus { outline: none; }
.notes-label { font-size: 12px; color: var(--text-sec); margin-bottom: 6px; font-weight: 600; }

/* 底部导航 */
.modal-footer {
  padding: 12px 24px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
}
.nav-btn {
  padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel);
  font-size: 14px; cursor: pointer; transition: all 0.15s;
}
.nav-btn:hover { background: var(--bg); }
.nav-btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
.nav-btn.primary:hover { background: #047857; }

/* 侧边统计 */
.side-stats { display: flex; gap: 16px; font-size: 12px; color: var(--text-sec); }

/* 复习按钮组 */
.action-row { display: flex; gap: 8px; margin-bottom: 16px; }
.action-row button {
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; cursor: pointer;
}
.action-row .btn-ai { background: var(--accent); color: white; border-color: var(--accent); }
.action-row .btn-master { background: var(--panel); }
</style>
</head>
<body>

<div class="scene-desc">
  📖 <strong>方案B：错题弹窗 · 卡片流</strong> — 从任何页面点击"错题本"弹出大弹窗，左右翻页像刷卡片。沉浸式，不打断当前页面。适合"即错即记"的轻量化用户。
</div>

<div class="overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">📚 错题复习（3 / 12）</div>
      <div class="modal-close">✕</div>
    </div>

    <div class="progress-bar">
      <div class="progress-seg done"></div><div class="progress-seg done"></div><div class="progress-seg current"></div>
      <div class="progress-seg"></div><div class="progress-seg"></div><div class="progress-seg"></div>
      <div class="progress-seg"></div><div class="progress-seg"></div><div class="progress-seg"></div>
      <div class="progress-seg"></div><div class="progress-seg"></div><div class="progress-seg"></div>
    </div>

    <div class="modal-body">
      <div class="card-header">
        <span class="card-number">第 3 题</span>
        <span class="card-tag confused">🤔 搞混了</span>
        <span style="font-size:12px;color:var(--text-sec);margin-left:auto;">白虎汤 · 0→contra</span>
      </div>

      <div class="card-question">白虎汤的禁忌是什么？</div>

      <div class="options">
        <div class="option wrong">
          <span>脉微弱无阳者慎用</span>
          <span class="option-label">❌ 你选的</span>
        </div>
        <div class="option right">
          <span>表证未解</span>
          <span class="option-label">✅ 正确</span>
        </div>
        <div class="option">
          <span>阴虚火旺</span>
        </div>
        <div class="option">
          <span>阳明腑实</span>
        </div>
      </div>

      <div class="feedback wrong">
        <strong>回答错误。</strong> 正确答案是：表证未解<br>
        <span style="color:var(--text-sec);">💡 提示：白虎汤清热生津，若表证未解而用之，会引邪入里。</span>
      </div>

      <div class="notes-area">
        <div class="notes-label">📝 我的学习笔记（从 Kimi 对话记录）</div>
        <textarea placeholder="在此记录本次错题的核心要点...">白虎汤禁忌：1.表证未解（最关键） 2.脉微弱（但非最核心）——口诀："白虎不碰表"</textarea>
      </div>

      <div class="action-row">
        <button class="btn-ai">🤖 去 Kimi 深入学</button>
        <button class="btn-master">✅ 标记已掌握</button>
      </div>
    </div>

    <div class="modal-footer">
      <button class="nav-btn">← 上一题</button>
      <div class="side-stats">
        <span>📅 下次复习：6月19日</span>
        <span>🔄 2/6次</span>
      </div>
      <button class="nav-btn primary">下一题 →</button>
    </div>
  </div>
</div>

</body>
</html>
