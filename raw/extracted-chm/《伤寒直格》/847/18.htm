<tr><td align="left">五运太过不及</td><td align="right">《伤寒直格》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>五运太过不及</h1></center>
<p>阳刚夫为太过；阴柔妻为不及。</p><p>此其略也。凡六十四年而周甲子，其中有岁运同司天曰天府，同岁支曰岁会，孟年同曰支德符，岁运同司地，刚为同天符，柔为同岁会。凡此二十九岁，太过司天克之曰天刑，及年前大寒交气日，反时程与运程为夫妇曰程德符，皆非太过、不及，乃年运之气也。申、子、辰年寅初交；巳、酉、丑年巳初交；寅、午、戌年申初交；亥、卯、未年亥初交气也。</p>
