<tr><td valign="top"><hr /><center><h1>六气有余不足</h1></center>
<p>孟少，仲平，季多也。</p><p>《内经》以寅、申、巳、亥四孟为一阴一阳也，子、午、卯、酉四仲为一阴一阳也，辰、戌、丑、未为三阴三阳也。然阳为先，故主虚无变化，轻微而少；阴为后，故形体安静，重浊而多也。故风火动乱至阳为先，居孟，未甚为少；寒湿肃静至阴为后，居季，已甚而为多，燥热各得乎中，故居仲而平也。注曰∶气有多少，是言六气；形有旺衰，言五运也。</p>
