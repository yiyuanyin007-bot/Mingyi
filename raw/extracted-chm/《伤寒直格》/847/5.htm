<tr><td valign="top"><hr /><center><h1>脏腑配合</h1></center>
<p>甲 胆（手少阳） 乙肝（手厥阴） 东方木也。</p><p>丙小肠（手太阳） 丁心（手少阴） 南方火也。</p><p>庚大肠（手阳明） 辛肺（手太阴） 西方金也。</p><p>壬膀胱（足太阳） 癸肾（足太阴） 北方水也。</p><p>戊 胃（足阳明） 己脾（足太阴） 中央土也。</p><p>凡先言者为刚、为阳为兄、为腑、主于表；后言者为柔、为阴、为妹、为脏、主于里也。</p>
