<tr><td valign="top"><hr /><center><h1>五邪</h1></center>
<p>母乘子曰虚邪（乘，胜也，克也），如心火热，乘脾土也。</p><p>子乘母曰实邪，如肺金燥，乘脾土也。</p><p>妻乘夫曰微邪，如肾水寒，乘脾土也。</p><p>夫乘妻曰贼邪，如肝木风，乘脾土也。</p><p>自病曰正邪，如脾土自病湿也。</p><p><a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/lilunshuji/jichulilun/44-3-1.html#m0-0" target="_blank" title="书籍相关：五脏">五脏</a>腑同法（各以类推）。</p>
