<tr><td valign="top"><hr /><center><h1>五运应五脏主病</h1></center>
<p>诸风掉眩皆属肝木。诸痛痒<a href="http://www.zysj.%63%6F%6D%2E%63%6E/lilunshuji/waikexue/80-2-0.html#m0-0" target="_blank" title="书籍相关：疮疡">疮疡</a>皆属心火。</p><p>诸湿肿满皆属脾土。诸寒收引皆属肾水。</p><p>诸气 郁病痿皆属肺金。（闷乱也。）郁（结滞、壅塞也。）</p>
