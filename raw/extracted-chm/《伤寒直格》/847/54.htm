<tr><td valign="top"><hr /><center><h1>受汗</h1></center>
<p>夫大汗将出者，慎不可限其烦热，而外用水湿及风凉制热也。</p><p>阳热开发，将欲作汗而出者，若为外风、凉、水、湿所薄，则怫热反入于里而不能出泄，病多危极而死矣。</p><p>亦不可恨其汗迟而浓衣壅覆，欲令大汗快而早出也。</p><p>怫热已甚，而郁极乃发，其发之微则顺，甚则逆。顺则发易，逆则发难。病已怫热作发，而烦热闷乱，更以浓衣壅覆太过，则阳热暴然太甚，阴气转衰，而正气不荣，则无由开发。即燥热喘满，危而死矣。</p>
