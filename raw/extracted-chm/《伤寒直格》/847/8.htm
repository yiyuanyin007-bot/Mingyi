<tr><td valign="top"><hr /><center><h1>手足经络配天地四时</h1></center>
<p>寅卯辰手三阳，天阳春也。巳午未手三阴，天阴夏也。</p><p>申酉戌足三阳，地阳秋也。亥子丑足三阴，地阴冬也。</p>
