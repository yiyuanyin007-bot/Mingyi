<tr><td valign="top"><hr /><center><h1>十干夫妇配合成五运</h1></center>
<p>甲己合为“土运”甲刚木，克己柔土，为夫妇成土运。</p><p>乙庚合为“金运”乙柔木，嫁庚刚金。</p><p>丁壬合为“木运”丁阴火，配壬阳水。</p><p>丙辛合为“水运”丙阳火，娶辛柔金。</p><p>戊癸合为“火运”戊阳土，娶癸阴水。</p>
