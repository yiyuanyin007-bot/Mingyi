<tr><td valign="top"><hr /><center><h1>阴阳脏腑</h1></center>
<p>肝与胆（厥阴）风木也，心与小肠（少阴）君火暑热也，包络及三焦（少阳）相火也（此为阳之脏腑）。脾与胃（太阴）湿土也，肺与大肠（阳明）燥金也，肾与膀胱（太阳）寒水也（此为阴之脏腑）。脾、心、肝、肺、肾兼包络（一名命门），为六脏。胃、小肠、胆、大肠、膀胱兼三焦，为<a href="http://www.zy%73%6A%2E%63%6F%6D%2E%63%6E/lilunshuji/jichulilun/44-3-2.html#m0-0" target="_blank" title="书籍相关：六腑">六腑</a>。</p>
