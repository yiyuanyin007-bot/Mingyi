<tr><td valign="top"><hr /><center><h1>结促代</h1></center>
<p>结脉者，迟缓而时一止，为阴也，主阴盛发躁烦满，或阳厥极深，以至身冷，脉微欲绝，而缓弱时一止者，亦胸烦躁，此止为热极而非寒也，皆须以标本明之。</p><p>促脉者，阳也，数而时一止也，主聚积、气痞，忧思所成；亦或热剧失下，则令脉促。下之则平也。</p><p>代脉者，主缓弱而无力不能动，因而复动，病必危而死。</p>
