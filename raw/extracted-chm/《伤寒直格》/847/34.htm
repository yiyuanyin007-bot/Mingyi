<tr><td valign="top"><hr /><center><h1>太溪脉</h1></center>
<p>太溪者，肾水之脉也，动于左足内踝下后、跟骨下陷中，足少阴肾水之胃，故曰大浮也。太溪脉，则肾气如经也，弱则微烦，涩则厥逆（微厥也）。</p>
