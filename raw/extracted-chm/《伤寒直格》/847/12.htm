<tr><td valign="top"><hr /><center><h1>内外八邪</h1></center>
<p>外有风寒暑湿，内有饥饱劳逸。劳逸，非奔逸之逸，乃逸豫怠惰而生病也，与劳相反。故经曰∶劳者温之，逸者行之。使气血营运也。西山记曰∶久劳则安闲以保其极力之处，久逸则导引以宣其积滞之气。或作役者误也。</p>
