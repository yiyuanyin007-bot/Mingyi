<tr><td valign="top"><hr /><center><h1>里外伤</h1></center>
<p>如得病脉便沉，而里病表和者，内伤也；脉浮而表病里和者，外伤也。</p><p>病在身体四肢为表病，病在胸腹之内为里病。</p>
