<tr><td valign="top"><hr /><center><h1>合主表里</h1></center>
<p>（合音甘，入声，余不音者并如字）</p><p>太阳、少阴合，阳明、太阴合，少阳、厥阴合；足与足合，手与手合。如∶足太阳膀胱水，合足阴肾水。阳为腑属表，阴为脏属里。</p>
