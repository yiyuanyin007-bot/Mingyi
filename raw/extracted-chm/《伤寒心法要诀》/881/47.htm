<tr><td align="left">自汗头汗</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>自汗头汗</h1></center>
<p>自汗热越多急下，更兼热利不休凶，头汗热蒸不得越，黄湿水火血皆成。</p><p>【注】自汗在太阳，谓之风邪，<a href="http://www.zysj.c%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤证也。在阳明，谓之热越，白虎汤证也。若大热蒸蒸汗出过多，则宜调胃承气汤，急下其热，救其津也。若更兼<a href="http://www.zysj.com%2E%63%6E/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>下利不休，内外两脱，故凶也。头汗出，剂颈而还，则为热不得外越，上蒸于首也。或因黄郁未发，或因湿家误下，或因水结胸蒸，或因火劫热迫，或因阳明蓄血，或因热入血室，皆令成之，则当分门施治可也。</p>
