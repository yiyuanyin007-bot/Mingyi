<tr><td align="left">往来寒热如疟寒热</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>往来寒热如疟寒热</h1></center>
<p>往来寒热少阳证，寒热相因小<a href="http://www%2E%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>，如疟寒热三五发，太阳麻桂等汤除。</p><p>【注】寒而热，热而寒，寒热相因不已，故名曰往来寒热，为少阳主证，宜小<a href="http://www%2E%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤。寒热而有作止之常，一日一次，或隔日一次，谓之疟，属杂病也。寒热而无作止之常，日三、五发，谓之如疟，属太阳经未尽之表邪也，宜麻桂各半汤。若热多寒少，宜<a href="http://www.zysj.co%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>二越婢一汤。若有汗，宜<a href="http://www.zysj.co%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>二<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>一汤。若无汗，亦宜麻桂各半汤。此皆治太阳未尽之微邪法也。</p>
