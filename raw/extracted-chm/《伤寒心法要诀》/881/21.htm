<tr><td align="left">太阴阳邪脉证</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>太阴阳邪脉证</h1></center>
<p>阳邪嗌干腹满痛，误下时痛大实疼，大承<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加芍大，脉弱芍大当审行。</p><p>【注】阳邪，谓太阴邪从阳化之热证也。嗌干，谓咽干太阴热也。腹满痛，太阴有余证也。误下，谓误下邪陷太阴当分轻重也。时痛，谓腹有时痛，有时不痛，宜<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加芍药汤和之。大实痛，谓腹大满痛，无时不痛，宜<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加<a href="http://www.zysj.%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_d/daihuang.html" target="_blank" title="中药材：大黄">大黄</a>汤下之。兼阳明胃实，以大承气汤下之。若脉弱即当行<a href="http://www.zysj.%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_d/daihuang.html" target="_blank" title="中药材：大黄">大黄</a>芍药，宜斟酌减之，以其人胃气弱易动也。详太阴篇。</p>
