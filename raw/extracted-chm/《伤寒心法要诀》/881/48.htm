<tr><td align="left">手足汗</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>手足汗</h1></center>
<p>手足 然汗出，便硬尿利本当攻，寒中汗冷尿不利，攻之固瘕泻澄清。</p><p>【注】胃主四肢为<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/lilunshuji/jichulilun/44-4-4.html#m0-0" target="_blank" title="书籍相关：津液">津液</a>之主，今热聚于胃，蒸其<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/lilunshuji/jichulilun/44-4-4.html#m0-0" target="_blank" title="书籍相关：津液">津液</a>，傍达于四肢，故手足 然汗出，且小便自利，胃中<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/lilunshuji/jichulilun/44-4-4.html#m0-0" target="_blank" title="书籍相关：津液">津液</a>必干，大便必硬，本当攻也。若中寒胃阳土虚，脾不约束，<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/lilunshuji/jichulilun/44-4-4.html#m0-0" target="_blank" title="书籍相关：津液">津液</a>横溢，四肢犹如阴盛淫雨滂沱，故汗出而冷也。阳虚失运，中寒不化，故小便不利也。今虽便硬而手足汗出，非为热越者比，慎不可攻，攻之必变生，固瘕<a href="http://w%77%77%2E%7A%79%73%6A%2E%63om.cn/lilunshuji/neikexue/76-5-7.html#m0-0" target="_blank" title="书籍相关：泄泻">泄泻</a>澄清不止也。</p>
