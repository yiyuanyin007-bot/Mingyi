<tr><td align="left">阳明表病脉证</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>阳明表病脉证</h1></center>
<p><a href="http://www.zysj.com%2E%63%6E/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>浮长表阳明，缘缘面赤额头疼，<a href="http://www.z%79%73%6A.com.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>恶寒而无汗，目痛鼻干卧不宁。</p><p>【注】太阳未罢，又传阳明，太阳表邪怫郁，阳明肌热，为阳明经表病也。<a href="http://www.zysj.com%2E%63%6E/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>表阳明，谓<a href="http://www.zysj.com%2E%63%6E/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>汤主治阳明表病也。浮长，谓阳明之表脉也。缘缘面赤连额头疼，<a href="http://www.z%79%73%6A.com.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>恶寒无汗，目痛鼻干卧不得宁，皆谓阳明经之表证也。用<a href="http://www.zysj.com%2E%63%6E/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>汤解两经之邪也。详阳明篇。</p>
