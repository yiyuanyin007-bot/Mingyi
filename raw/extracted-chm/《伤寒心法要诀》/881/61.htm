<tr><td valign="top"><hr /><center><h1>阴阳咽痛</h1></center>
<p>咽痛干肿为阳热，不干不肿属阴寒，阳用甘桔等汤治，阴用甘桔附姜攒。</p><p>【注】咽痛一证，寒热皆有。咽干肿痛，为三阳热证，宜甘桔、半夏、苦酒、猪肤等汤调治。不干不肿而痛，为三阴寒证，宜四逆汤加<a href="http://www%2Ezysj.com.cn/zhongyaocai/yaocai_j/jugeng.html" target="_blank" title="中药材：桔梗">桔梗</a>主治也。</p>
