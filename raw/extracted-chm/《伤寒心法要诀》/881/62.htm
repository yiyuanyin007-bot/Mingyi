<tr><td align="left">气上冲</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>气上冲</h1></center>
<p>气撞吐蛔厥阴本，无蛔阳表<a href="http://www.z%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤，少腹急引烧 散，冲喉难息瓜蒂良。</p><p>【注】气撞吐蛔，谓厥阴本证也。无蛔，谓气撞不吐蛔，乃邪犹在阳表也，宜<a href="http://www.z%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤。</p><p>少腹急引，谓气上冲，更少腹引阴急痛，乃阴阳易病也，宜烧 散。冲喉难息，谓气上冲喉，胸满难以布息，乃寒实在胸也，宜瓜蒂散。</p>
