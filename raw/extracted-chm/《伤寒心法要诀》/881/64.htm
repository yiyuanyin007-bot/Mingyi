<tr><td align="left">手足厥逆</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>手足厥逆</h1></center>
<p>太阴手足温无厥，少阴厥冷不能温，厥阴寒厥分微甚，热厥相因辨浅深。</p><p>【注】太阴经无厥逆，而有手足自温。少阴经有寒厥，而无热厥。厥阴经有寒、热二厥。寒厥者，只寒而不热也。热厥者，由热而厥，由厥而热，热厥相因无休歇也。当辨阴阳浅深，以<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_d/danggui.html" target="_blank" title="中药材：当归">当归</a>四逆、承气等汤施治可也。详厥阴篇。</p>
