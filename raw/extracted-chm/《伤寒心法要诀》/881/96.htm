<tr><td align="left">湿温</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>湿温</h1></center>
<p>温复伤湿湿温病，身重胸满及头疼，妄言多汗两胫冷，白虎汤加<a href="http://www.zysj.%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_c/cangshu.html" target="_blank" title="中药材：苍术">苍术</a>苓。</p><p>【注】温病复伤于湿，名曰湿温。其证则身重胸满，头疼妄言，多汗两胫逆冷，宜白虎汤加<a href="http://www.zysj.%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_c/cangshu.html" target="_blank" title="中药材：苍术">苍术</a>、<a href="http://www.zys%6A%2E%63%6Fm.cn/zhongyaocai/yaocai_f/fuling.html" target="_blank" title="中药材：茯苓">茯苓</a>，温、湿两治法也。</p>
