<tr><td valign="top"><hr /><center><h1>少阴太阳表里同病</h1></center>
<p>少阴脉沉反<a href="http://w%77%77%2E%7Aysj.com.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>，<a href="http://www.zysj.%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a><a href="http://www.zysj.c%6F%6D%2E%63%6E/zhongyaocai/yaocai_f/fuzi.html" target="_blank" title="中药材：附子">附子</a><a href="http://ww%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_x/xixin.html" target="_blank" title="中药材：细辛">细辛</a>汤，若二三日无里证，减辛加草用之良。</p><p>【注】少阴病脉沉，为阴寒之证，当无热，今反<a href="http://w%77%77%2E%7Aysj.com.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>，是兼有太阳表也。宜<a href="http://www.zysj.%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a><a href="http://www.zysj.c%6F%6D%2E%63%6E/zhongyaocai/yaocai_f/fuzi.html" target="_blank" title="中药材：附子">附子</a><a href="http://ww%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_x/xixin.html" target="_blank" title="中药材：细辛">细辛</a>汤，急温而散之。若二、三日热仍不解，亦无里寒吐利之证，去<a href="http://ww%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_x/xixin.html" target="_blank" title="中药材：细辛">细辛</a>易<a href="http://www.zysj.com%2E%63%6E/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>，缓温而和之。详少阴篇。</p>
