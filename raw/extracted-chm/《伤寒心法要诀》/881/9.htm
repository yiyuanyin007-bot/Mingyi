<tr><td valign="top"><hr /><center><h1>三阳受病传经欲愈脉证</h1></center>
<p>伤寒一日太阳病，欲吐烦躁数急传、阳明少阳证不见，脉静身和为不传。</p><p>【注】伤寒一日太阳受病，二日阳明受病，三日少阳受病，此其传经之常也。若初病颇欲吐，烦躁脉数急者，谓邪盛传经而不解也。二、三日阳明少阳证不见，脉静身无所苦者，谓邪衰不传，欲自愈矣。</p>
