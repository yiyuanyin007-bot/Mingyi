<tr><td align="left">饥不欲食</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>饥不欲食</h1></center>
<p>饥不欲食吐蛔厥，下后不食属阳明，懊 头汗<a href="http://www.zysj.c%6F%6D%2E%63%6E/zhongyaocai/yaocai_z/zhizi.html" target="_blank" title="中药材：栀子">栀子</a>豉，厥紧心烦邪在胸。</p><p>【注】饥不欲食吐蛔厥，谓厥阴本证也。下后饥不能食属阳明也。阳明病则懊 ，心中烦甚，头上汗出，是热在胃中，宜<a href="http://www.zysj.c%6F%6D%2E%63%6E/zhongyaocai/yaocai_z/zhizi.html" target="_blank" title="中药材：栀子">栀子</a>豉汤涌之。厥阴病则吐蛔、厥逆、脉微，今不微而紧更心烦者，非寒虚邪，是寒实邪，而在胸中，宜瓜蒂散吐之。</p>
