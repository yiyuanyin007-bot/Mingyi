<tr><td valign="top"><hr /><center><h1>恶风</h1></center>
<p>风寒相因相离少，三阳俱有恶寒风，恶风属阳法从表，三阴恶寒无恶风。</p><p>【注】风寒二者，大率多相因而少相离，有寒时不皆无风，有风时不皆无寒，故三阳俱有恶寒恶风同见也。恶风与恶寒均表病也，法当从表；然风属阳、寒属阴，故三阴经证有恶寒而无恶风也。</p>
