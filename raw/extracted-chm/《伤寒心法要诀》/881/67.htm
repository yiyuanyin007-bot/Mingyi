<tr><td align="left">循衣摸床</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>循衣摸床</h1></center>
<p>循衣摸床有二因，太阳火劫热伤阴，小便利生不利死，阳明热极热弥深，皆缘三法失成坏，脉实堪下弱难禁，虚实阴阳难辨处，独参六味可回春。</p><p>【注】循衣摸床，危恶之证也。一因太阳火劫取汗，致阳盛伤阴。阴若末竭，则小便利，多生；阴若已竭，则小便难，多死。一因阳明热极，汗、吐、下三法失宜，致成坏证。其热弥深，脉实者，堪下则可治；脉弱者，不堪下则难治。此已成危恶坏证，往往阴阳虚实，医莫能辨，无下手处，当以大剂独参、六味、干生<a href="http://www.zy%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_d/dihuang.html" target="_blank" title="中药材：地黄">地黄</a>汤，时时与之，每获生也。</p>
