<tr><td valign="top"><hr /><center><h1>太阳风邪伤卫脉证</h1></center>
<p><a href="http://www.zysj.c%6F%6D%2E%63%6E/lilunshuji/waikexue/80-9-3.html#m0-0" target="_blank" title="书籍相关：中风">中风</a>伤卫脉浮缓，头项强痛恶寒风，病即<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>汗自出，鼻鸣干呕<a href="http://www.zy%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>功。</p><p>【注】<a href="http://www.zysj.c%6F%6D%2E%63%6E/lilunshuji/waikexue/80-9-3.html#m0-0" target="_blank" title="书籍相关：中风">中风</a>，病名也。伤卫，谓风伤卫也。脉浮缓，谓<a href="http://www.zysj.c%6F%6D%2E%63%6E/lilunshuji/waikexue/80-9-3.html#m0-0" target="_blank" title="书籍相关：中风">中风</a>脉也。<a href="http://www.zysj.%63%6F%6D%2E%63%6E/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>项强，恶寒恶风，<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>汗自出，鼻鸣干呕，谓<a href="http://www.zysj.c%6F%6D%2E%63%6E/lilunshuji/waikexue/80-9-3.html#m0-0" target="_blank" title="书籍相关：中风">中风</a>证也。<a href="http://www.zy%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>功，谓<a href="http://www.zy%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤功能治<a href="http://www.zysj.c%6F%6D%2E%63%6E/lilunshuji/waikexue/80-9-3.html#m0-0" target="_blank" title="书籍相关：中风">中风</a>虚邪也。详太阳上篇。</p>
