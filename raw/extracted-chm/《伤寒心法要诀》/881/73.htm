<tr><td valign="top"><hr /><center><h1>心下悸</h1></center>
<p>筑筑惕惕心动悸，怔怔仲仲不自安，饮多尿少为停水，厥冷汗后是虚寒。</p><p>【注】心下筑筑惕惕、怔怔忡忡，谓悸病之状也。饮水多而小便少，水停心下之悸也，宜<a href="http://www.zy%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_f/fuling.html" target="_blank" title="中药材：茯苓">茯苓</a><a href="http://www.zysj.%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>汤，或五苓散。厥冷为寒，宜真武汤，汗后为虚，宜小建中汤。或不因汗后，是虚之甚也，宜炙<a href="http://www.zysj.%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>汤。</p>
