<tr><td align="left">伤寒附法</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>伤寒附法</h1></center>
<p>伤寒传变大法，已详《<a href="http://www.zysj.c%6F%6D%2Ecn/lilunshuji/shanghanlun/index.html" target="_blank" title="中医书籍：伤寒论">伤寒论</a>注》及《心法要诀》中矣。然近世治四时伤寒者，咸用河间两解等法，每多神效，诚治斯证之捷法也。今复采双解散。<a href="http://www.zysj.%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_f/fangfeng.html" target="_blank" title="中药材：防风">防风</a>通圣散诸经验名方，编为歌诀，附于心法之后，俾后之学人，知所变通，庶几于伤寒一证，经权常变，有所遵循，而无遗法云。</p>
