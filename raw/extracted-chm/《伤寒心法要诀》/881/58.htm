<tr><td align="left">吐证</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>吐证</h1></center>
<p>中寒吐食不能食，不渴而厥吐寒虚，得食吐渴火为逆，饮吐相因水病居。</p><p>【注】中寒吐食，谓中寒吐食不能食也。凡不渴而厥吐，是寒虚吐也，宜理中、<a href="http://www.zys%6A%2E%63%6F%6D.cn/zhongyaocai/yaocai_w/wuzhuyu.html" target="_blank" title="中药材：吴茱萸">吴茱萸</a>辈。凡渴而得食即吐，是火吐也，热实宜<a href="http://www.zysj.%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_h/huanglian.html" target="_blank" title="中药材：黄连">黄连</a>解毒汤。热虚宜<a href="http://www.zysj.com%2E%63n/zhongyaocai/yaocai_g/ganjiang.html" target="_blank" title="中药材：干姜">干姜</a><a href="http://www.zysj.%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_h/huanglian.html" target="_blank" title="中药材：黄连">黄连</a><a href="http://www.zy%73%6A.com.cn/zhongyaocai/yaocai_h/huangqin.html" target="_blank" title="中药材：黄芩">黄芩</a>汤，或竹叶石膏汤。渴而饮，饮而吐，吐而复渴，水逆病也，宜五苓散。</p>
