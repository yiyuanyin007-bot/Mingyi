<tr><td align="left">温疟</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>温疟</h1></center>
<p>温疟得之冬<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/lilunshuji/waikexue/80-9-3.html#m0-0" target="_blank" title="书籍相关：中风">中风</a>，寒气藏于骨髓中，至春邪气不能发，遇暑烁髓消肌形，或因用力腠发泄，邪汗同出故热生，衰则气复寒后作，证同温热治相同。</p><p>【注】经曰∶温疟得之冬中于风，寒气藏于骨髓之中，至春阳气尚微，邪气不能自出，因值大暑，烁脑髓消肌肉，腠理发泄，或有所用力，邪气与汗同出，出则阴虚而阳盛，故热生也，衰则气复入，入则阳虚而阴盛，故后作寒也。其证同温热，治亦相同也。</p>
