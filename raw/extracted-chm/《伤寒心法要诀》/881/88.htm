<tr><td align="left">房劳复阴阳易</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>房劳复阴阳易</h1></center>
<p>房劳复与阴阳易，二病情异证则同。病后犯色复自病，病传不病易之名。男女俱主烧散，少腹急痛引阴中，身重少气头<a href="http://www.z%79sj.com.cn/lilunshuji/neikexue/76-4-3.html#m0-0" target="_blank" title="书籍相关：眩晕">眩晕</a>，拘挛热气上冲胸。</p><p>【注】男女新愈交接，因而复病，名曰房劳复。男女新愈交接，病男传不病之女，病女传不病之男，名曰阴阳易，即交易之义也。犯是病者，男以女之 裆，女以男之 裆烧灰，白汤或酒，日三服之则愈。少腹急痛牵引阴中，身重少气，头目<a href="http://www.z%79sj.com.cn/lilunshuji/neikexue/76-4-3.html#m0-0" target="_blank" title="书籍相关：眩晕">眩晕</a>，四肢拘挛，热气冲胸，是其证也。</p>
