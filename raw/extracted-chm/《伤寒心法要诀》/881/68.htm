<tr><td align="left">太阳阳邪停饮</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>太阳阳邪停饮</h1></center>
<p>太阳阳邪有水逆，<a href="http://www.zysj.com%2E%63%6E/lilunshuji/neikexue/76-8-4.html#m0-0" target="_blank" title="书籍相关：消渴">消渴</a><a href="http://w%77%77.zysj.com.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>汗出烦，小便不利水入吐，脉浮而数五苓攒。</p><p>【注】太阳阳邪，有水逆<a href="http://www.zysj.com%2E%63%6E/lilunshuji/neikexue/76-8-4.html#m0-0" target="_blank" title="书籍相关：消渴">消渴</a>之病，谓太阳<a href="http://ww%77%2Ezysj.com.cn/lilunshuji/waikexue/80-9-3.html#m0-0" target="_blank" title="书籍相关：中风">中风</a>，有渴欲饮水，水入即吐者，名曰水逆；饮水多而小便少者，名曰<a href="http://www.zysj.com%2E%63%6E/lilunshuji/neikexue/76-8-4.html#m0-0" target="_blank" title="书籍相关：消渴">消渴</a>。<a href="http://w%77%77.zysj.com.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>汗出，风邪出。烦，热也。小便不利，水入则吐，饮停也。浮数，风热脉也。均宜五苓散，多服暖水，令微汗出，外解太阳，内利停水则愈。若不能饮暖水，欲饮冷水者，是热盛也，以五苓散加寒水石、石膏、<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_h/huashi.html" target="_blank" title="中药材：滑石">滑石</a>可也。详太阳上编。</p>
