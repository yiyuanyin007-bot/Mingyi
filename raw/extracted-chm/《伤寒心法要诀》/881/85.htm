<tr><td valign="top"><hr /><center><h1>百合</h1></center>
<p><a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_b/baihe.html" target="_blank" title="中药材：百合">百合</a>百脉合一病，如寒似热药无灵，饮食起居皆忽忽，如神若鬼附其形。脉数尿时辄<a href="http://w%77%77%2E%7A%79sj.com.cn/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>，尿时不痛淅淅风，尿时快然但头眩，六四二十病方宁。</p><p>【注】<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_b/baihe.html" target="_blank" title="中药材：百合">百合</a>病者，谓伤寒过期，留连不解，不分经络百脉，悉合为一病也。如寒似热，诸药无灵。欲饮不能饮，欲食不能食，欲卧不能卧，欲行不能行，精神忽忽，如神若鬼附其形体，而莫知所适从也。如脉数、尿尿时辄<a href="http://w%77%77%2E%7A%79sj.com.cn/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>者，六十日乃愈。若尿尿时头不痛，惟淅淅然恶风寒者，四十日乃愈。若尿时快然，但头眩者，二十日乃愈。故曰∶六四二十日病方宁也。</p>
