<tr><td align="left">中、温毒、风湿</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>中、温毒、风湿</h1></center>
<p>温病中 温毒病，证同温热热尤炎。伤湿汗出当风立，风湿<a href="http://%77%77%77%2E%7A%79%73%6A.com.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>重疼牵。</p><p>【注】中 ，即中暑也。温热之病复中于暑，名曰温毒证；治同乎温热，但热尤盛也。伤湿之病复感于风，名曰风湿；其证<a href="http://%77%77%77%2E%7A%79%73%6A.com.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>身重，疼痛牵掣也，治法已详于身痛矣。中详在暑门。</p>
