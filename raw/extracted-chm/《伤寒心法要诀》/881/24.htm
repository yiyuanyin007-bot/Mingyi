<tr><td align="left">少阴阳邪脉</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>少阴阳邪脉</h1></center>
<p>少阴阳邪沉细数，口燥咽干大承汤，少阴心烦不得卧，<a href="http://ww%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_h/huanglian.html" target="_blank" title="中药材：黄连">黄连</a><a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D.cn/zhongyaocai/yaocai_e/ejiao.html" target="_blank" title="中药材：阿胶">阿胶</a>是主方。</p><p>【注】阳邪，谓少阴邪从阳化之热证也。少阴病但欲寐，阴邪则脉沉细无力，阳邪则脉加数而有力矣。始病即口燥咽干，水不上升，热之甚也。宜大承气汤急下之，泻阳救阴也。少阴病但欲寐，二、三日以上变生心烦不得眠，是阳邪乘阴，阴不能静也，宜<a href="http://ww%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_h/huanglian.html" target="_blank" title="中药材：黄连">黄连</a><a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D.cn/zhongyaocai/yaocai_e/ejiao.html" target="_blank" title="中药材：阿胶">阿胶</a>汤，清阳益阴也。详少阴篇。</p>
