<tr><td align="left">大小便脓血</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>大小便脓血</h1></center>
<p>热在膀胱小便血，八正导赤利之佳，热瘀里急下脓血，<a href="http://www.%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_h/huanglian.html" target="_blank" title="中药材：黄连">黄连</a>白头与桃花。</p><p>【注】阳经之热，下注膀胱，伤其营分，热少血多，瘀成血蓄。热多血少，热迫血行，血不得蓄，而走下窍，故尿血也，以八正散、导赤散利而清之。阴经之热，转迫阳明，伤其营分，瘀则血蓄，喜忘如狂。不蓄则便血，热腐则便脓。便脓热郁，里急下重，所必然也。轻者宜<a href="http://www.%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_h/huanglian.html" target="_blank" title="中药材：黄连">黄连</a><a href="http://www.zysj.com%2E%63%6E/zhongyaocai/yaocai_e/ejiao.html" target="_blank" title="中药材：阿胶">阿胶</a>肠，重者<a href="http://www.zysj.com.c%6E/zhongyaocai/yaocai_b/baitouweng.html" target="_blank" title="中药材：白头翁">白头翁</a>汤清之，滑脱者，桃花汤涩之可也。</p>
