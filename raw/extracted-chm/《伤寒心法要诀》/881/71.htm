<tr><td align="left">少阴阴邪停饮</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>少阴阴邪停饮</h1></center>
<p>少阴阴邪有水气，<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/lilunshuji/neikexue/76-5-3.html#m0-0" target="_blank" title="书籍相关：腹痛">腹痛</a>四肢重沉疼，小便不利自下利，或咳或呕真武平。咳加<a href="http://www.zy%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_g/ganjiang.html" target="_blank" title="中药材：干姜">干姜</a>辛味共，小便若利去<a href="http://www.zy%73%6A%2E%63%6F%6D.cn/zhongyaocai/yaocai_f/fuling.html" target="_blank" title="中药材：茯苓">茯苓</a>，呕去<a href="http://ww%77%2E%7A%79%73%6A%2E%63%6F%6D.cn/zhongyaocai/yaocai_f/fuzi.html" target="_blank" title="中药材：附子">附子</a><a href="http://www.zys%6A%2E%63om.cn/zhongyaocai/yaocai_s/shengjiang.html" target="_blank" title="中药材：生姜">生姜</a>倍，利去芍药入干宁。</p><p>【注】少阴阴邪有水气，谓少阴阴寒兼有水气病也，饮病主证，谓<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/lilunshuji/neikexue/76-5-3.html#m0-0" target="_blank" title="书籍相关：腹痛">腹痛</a>，四肢沉重疼痛，大便自利、小便不利，宜真武汤温中利水也。饮病或有之证，或咳，或小便利，或呕，或下利。咳加<a href="http://www.zys%6A%2E%63om.cn/zhongyaocai/yaocai_s/shengjiang.html" target="_blank" title="中药材：生姜">生姜</a>、<a href="http://www.zysj.com.c%6E/zhongyaocai/yaocai_x/xixin.html" target="_blank" title="中药材：细辛">细辛</a>、<a href="http://w%77%77%2E%7Aysj.com.cn/zhongyaocai/yaocai_w/wuweizi.html" target="_blank" title="中药材：五味子">五味子</a>。小便若利去<a href="http://www.zy%73%6A%2E%63%6F%6D.cn/zhongyaocai/yaocai_f/fuling.html" target="_blank" title="中药材：茯苓">茯苓</a>。呕，去<a href="http://ww%77%2E%7A%79%73%6A%2E%63%6F%6D.cn/zhongyaocai/yaocai_f/fuzi.html" target="_blank" title="中药材：附子">附子</a>倍加<a href="http://www.zys%6A%2E%63om.cn/zhongyaocai/yaocai_s/shengjiang.html" target="_blank" title="中药材：生姜">生姜</a>。利，去芍药入<a href="http://www.zy%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_g/ganjiang.html" target="_blank" title="中药材：干姜">干姜</a>也。</p>
