<tr><td align="left">卷一</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>卷一</h1></center>
<p>伤寒一证，仲景论中立三百九十七法，一百一十三方，神明变化，可谓既详且尽矣。其治杂证也，则有《金匮要略》，分门别类，包举该括，无非示人以规矩准绳，欲其触类傍通，以应变于无穷也。但其辞旨古奥，义蕴幽深。条目繁多，未易领会，人多苦之。兹特撮其要旨，编为歌诀，俾学人便于熟读默记，融会贯通，然后再玩味全书，则易读易解，有会心之乐，而无望洋之叹矣。由此登堂入室，将见二千年来大法微言，昭如日月，不致尘封，庶几于斯道不无小补云尔。</p>
