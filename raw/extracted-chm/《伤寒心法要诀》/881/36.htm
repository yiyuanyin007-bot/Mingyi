<tr><td align="left">阴盛格阳</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>阴盛格阳</h1></center>
<p>阴盛格阳色浅赤，<a href="http://www.zysj.com.%63%6E/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>不渴厥而烦，下利尿清爪青白，浮微通脉复阳还。</p><p>【注】经曰∶阴气太盛，阳气不得相营也。不相营者，不相入也。既不相入，则格阳于外，故曰阴盛格阳也。色浅赤，谓面色见浮浅之红赤色也。其外证面赤<a href="http://www.zysj.com.%63%6E/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>而烦，颇类阳热，其内则不渴，下利清谷，小便清白，爪甲青白，四肢厥冷，脉浮微欲绝，一派阴寒虚证。宜通脉四逆汤冷服之，从其阴而复其阳也。利止脉不出，加倍<a href="http://www%2E%7A%79%73%6A%2E%63%6F%6D.cn/zhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>。下利无脉，宜白通加猪胆汁人尿汤。厥烦欲死，宜<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_w/wuzhuyu.html" target="_blank" title="中药材：吴茱萸">吴茱萸</a>汤。</p>
