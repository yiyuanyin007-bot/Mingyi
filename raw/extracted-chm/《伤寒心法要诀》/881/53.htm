<tr><td align="left">胸胁满痛</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>胸胁满痛</h1></center>
<p>邪气传里必先胸，由胸及胁少阳经。太阳脉浮惟胸满，过经不解有阳明。干呕潮热胸胁满，大柴加硝两解行。心腹引胁硬满痛，干呕尿秘十枣攻。</p><p>【注】邪气传里必先自胸，若脉浮惟胸满而不及胁者，仍属太阳表分也，宜<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>汤。因胸及胁而皆满者，属少阳经也，宜小<a href="http://www.zysj%2Ecom.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤。若十余日不解，而胸胁满，兼干呕潮热者，是少阳兼有阳明也，宜大<a href="http://www.zysj%2Ecom.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤加<a href="http://www.z%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_m/mangxiao.html" target="_blank" title="中药材：芒硝">芒硝</a>两解之。若表已解，心下及腹引胁、满硬而痛，干呕小便不利者，是停饮内实也，宜十枣汤攻之。</p>
