<tr><td align="left">太阳寒邪伤营脉证</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>太阳寒邪伤营脉证</h1></center>
<p>伤寒伤营脉浮紧，头疼身痛恶寒风，无汗而喘已未热，呕逆<a href="http://www.zysj.com%2Ecn/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>汤发灵。</p><p>【注】伤寒，病名也。伤营，谓寒伤营也。脉浮紧，谓伤寒脉也。头疼身痛，恶寒恶风，无汗而喘，或已<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>，或未<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>，呕逆，谓伤寒证也。<a href="http://www.zysj.com%2Ecn/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>汤发，谓伤寒实邪，当与<a href="http://www.zysj.com%2Ecn/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>汤发汗最灵也。详太阳中篇。</p>
