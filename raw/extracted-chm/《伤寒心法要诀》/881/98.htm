<tr><td valign="top"><hr /><center><h1>痉证</h1></center>
<p>痉证反张摇头噤，项强拘急转侧难，身热足寒面目赤，须审刚柔治法全。</p><p>【注】风湿寒之邪合而为痉，其证则背反张，摇头口噤，项强拘急，转侧艰难，身热足寒，面目赤色也。须审刚柔治之可痊也。风湿盛者则有汗，为柔痉。风寒盛者则无汗，为刚痉。均以小续命汤主之。刚痉去<a href="http://www.zysj.co%6D%2E%63%6E/zhongyaocai/yaocai_f/fuzi.html" target="_blank" title="中药材：附子">附子</a>，柔痉去<a href="http://w%77w.zysj.com.cn/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>。表实者去参、附，加<a href="http://www.zy%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_q/qianghuo.html" target="_blank" title="中药材：羌活">羌活</a>、<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_d/duhuo.html" target="_blank" title="中药材：独活">独活</a>。里实者去参、附，加<a href="http://www.zysj.c%6F%6D%2E%63%6E/zhongyaocai/yaocai_m/mangxiao.html" target="_blank" title="中药材：芒硝">芒硝</a>、<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_d/daihuang.html" target="_blank" title="中药材：大黄">大黄</a>。甚者则以<a href="http://www.zys%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>汤、<a href="http://www.zysj.com%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加<a href="http://www.zys%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>汤发之。此治痉之大略也，详在痉门。</p>
