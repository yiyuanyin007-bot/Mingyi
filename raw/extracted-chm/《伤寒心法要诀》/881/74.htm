<tr><td align="left">战振栗</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>战振栗</h1></center>
<p>战身耸动栗心HT ，振虽耸动比战轻，故振责虚因无力，栗战相交邪正争，此证若生三法后，虚其中外逆而成，不逆因和而作解，正胜邪却战汗平。</p><p>【注】战，谓身抖耸动也。栗，谓心内发HT 也。振，亦耸动，比之于战则无力也。所以论中曰∶振振者，皆责其虚也。栗，邪气为之也。战，正气为之也。邪正相交故争也。此证若生于汗、吐。下之后，是虚其中外而致逆也。若不致逆，邪因以衰，正因以和而作解，则为正胜邪却，战栗汗出而平也。</p>
