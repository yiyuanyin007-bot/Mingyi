<tr><td valign="top"><hr /><center><h1>三阴受病传经欲愈脉证</h1></center>
<p>伤寒三日三阳尽，热微烦躁入阴传，其人能食而不呕，脉小尿清为不传。</p><p>【注】伤寒三日，三阳受邪为尽，三阴当受邪，其人身热虽微，而烦躁者，谓邪去阳入阴不解也。若其人反能食而不呕，脉静小，小便清，谓邪未入于阴为不传，欲自愈也。</p>
