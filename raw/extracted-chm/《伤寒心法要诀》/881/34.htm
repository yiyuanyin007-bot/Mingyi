<tr><td align="left">阴证</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>阴证</h1></center>
<p>阴证身重息短冷，目不了了色不红，无热欲卧厥吐利，小便白兮爪甲青。</p><p>【注】阴证，谓阴寒之证也。不论三阴、三阳，凡见是证者，均为阴寒不足也。阴主静，故身重也。阴主寐，故目不了了但欲卧也。阳气虚寒，故息短口鼻气冷也，阴淫于外，故面无红色，四肢厥冷爪甲青也。阴邪入内，故<a href="http://w%77%77.zysj.com.cn/lilunshuji/neikexue/76-5-4.html#m0-0" target="_blank" title="书籍相关：呕吐">呕吐</a>，下利清谷，小便清白也。以上皆三阴寒证，临证者以<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_f/fuzi.html" target="_blank" title="中药材：附子">附子</a>、四逆、理中、<a href="http://w%77%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_w/wuzhuyu.html" target="_blank" title="中药材：吴茱萸">吴茱萸</a>等汤，择其宜而与之可也。详三阴篇。</p>
