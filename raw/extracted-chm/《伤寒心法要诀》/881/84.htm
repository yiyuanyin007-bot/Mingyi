<tr><td align="left">狐惑</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>狐惑</h1></center>
<p>古名狐惑近名疳，狐蚀肛阴惑唇咽，病后余毒斑疹后，癖疾利后也同然，面 赤白黑不一，目不能闭喜贪眠，潮热声哑腐秽气，能食堪药治多全。</p><p>【注】狐惑，牙疳、下疳等疮之古名也，近时惟以疳呼之。下疳即狐也，蚀烂肛阴；牙疳即惑也，蚀咽腐龈，脱牙穿腮破唇。毒因伤寒病后，余毒与湿 之为害也，或生斑疹之后，或生癖疾下利之后，其为患亦同也。其证则面色目 或赤或白或黑，时时不一，喜睡目不能闭，潮热声哑，腐烂之处，秽气熏人。若胃壮能食，堪受攻病重药，或病之势缓，治多全也。</p>
