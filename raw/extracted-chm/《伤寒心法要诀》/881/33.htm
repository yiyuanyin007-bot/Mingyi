<tr><td valign="top"><hr /><center><h1>阳证</h1></center>
<p>阳证身轻气高热，目睛了了面唇红，热烦口燥舌干渴，指甲红兮小便同。</p><p>【注】阳证，谓阳热之证也。不论三阴、三阳，凡见是证者，均为阳热有余也，阳主动，故身轻也。阳气盛，故气高而喘也。阳主热，故口鼻气热也，阳主寤，故目睛了了而不眠也。目睛不了了，亦有热极朦陇似不了了，然必目赤多眵，非若阴证之不了了而神短无光也。阳气热，故身热，面唇红，指甲红也。阳热入里，故心烦，口燥，舌干而渴，小便红也。表实者，三黄石膏汤发之。里实者，三承气汤下之，表里不实而热盛者，白虎解毒等汤清之可也，详三阳篇。</p>
