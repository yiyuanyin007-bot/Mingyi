<tr><td valign="top"><hr /><center><h1>里证</h1></center>
<p>里证宜下不大便，恶热潮热汗蒸蒸，燥干谵语满硬痛，便溏为虚不可攻。</p><p>【注】里证，谓热邪内结，不大便，恶热潮热，自汗蒸蒸，口燥舌干谵语，腹满硬痛也。阳明腑主里，故曰里证。里实者，有脾约，有胃实，有大便难，三者均为可下之证，然不无轻重之别。三承气汤、脾约丸，量其可者而与之，庶乎无过也。若便溏为里虚，即有是证不可攻也。论中有急下数证，不待便实而下之者，是下其热也，非下其结也。义详阳明、少阴篇。</p>
