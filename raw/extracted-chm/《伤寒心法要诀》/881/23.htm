<tr><td align="left">少阴阴邪脉证</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>少阴阴邪脉证</h1></center>
<p>少阴阴邪脉沉细，背寒欲寐口中和，咽痛<a href="http://www%2E%7A%79%73%6A%2E%63%6F%6D%2E%63n/lilunshuji/neikexue/76-5-3.html#m0-0" target="_blank" title="书籍相关：腹痛">腹痛</a>骨节痛，厥利清谷四逆瘥。</p><p>【注】少阴阴邪，谓邪从阴化之寒证也。脉沉细，少阴阴邪之脉也。背寒，谓背恶寒，阳气虚也。欲寐，谓但欲寐，阴气盛也。口中和，口中不干燥也。咽痛<a href="http://www%2E%7A%79%73%6A%2E%63%6F%6D%2E%63n/lilunshuji/neikexue/76-5-3.html#m0-0" target="_blank" title="书籍相关：腹痛">腹痛</a>，下利清谷，寒盛于中也。骨节疼痛，四肢厥冷，寒淫于外也，宜四逆汤，温中散寒也。详少阴篇。</p>
