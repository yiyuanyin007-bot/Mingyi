<tr><td align="left">目眩耳聋</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>目眩耳聋</h1></center>
<p>少阳目眩神自正，诸逆昏乱不能生，重蝎耳聋湿温汗，不语面色变身青。</p><p>【注】目眩者，目黑不明也。耳聋者，耳无所闻也。皆少阳经主证，非死候也。其目之明，其耳之聪，神自完整。若因三法失宜，致诸变逆坏证，目眩而<a href="http://ww%77%2E%7A%79%73%6A.com.cn/lilunshuji/neikexue/76-1-4.html#m15-0" target="_blank" title="书籍相关：神昏">神昏</a>言乱，乃神散气脱之候，故曰不能生也。若因误发湿温家汗而不能言语，耳聋无闻，身青面色变者，名曰重 ，亦死证也。</p>
