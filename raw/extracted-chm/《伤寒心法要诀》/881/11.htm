<tr><td align="left">阳明热病脉证</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>阳明热病脉证</h1></center>
<p>白虎烦渴热阳明，汗出身热脉长洪，不恶寒兮反恶热，合柴兼见少阳经。</p><p>【注】太阳已罢，而传阳明不传少阳，亦未入腑，其热渐深，表里俱热，为阳明经热病也。白虎热阳明，谓白虎汤主治阳明热病也。脉长洪，谓阳明之热脉也。烦躁<a href="http://www.zysj.com%2E%63%6E/lilunshuji/neikexue/76-1-4.html#m4-0" target="_blank" title="书籍相关：口渴">口渴</a>，引饮汗出身热，不恶寒反恶热，皆谓阳明经热病之证也。用白虎汤解阳明表里俱热也。阳明未罢，又传少阳，亦阳明热病也。合柴，谓白虎合小<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63%6Fm.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤，治阳明经热证，兼见少阳经弦脉，寒热往来，口苦耳聋，目眩而呕，胸<a href="http://www.zysj.com%2E%63%6E/lilunshuji/neikexue/76-6-2.html#m0-0" target="_blank" title="书籍相关：胁痛">胁痛</a>之病也。详阳明少阳篇。</p>
