<tr><td valign="top"><hr /><center><h1>少阴厥阴外热里寒脉证</h1></center>
<p>少阴里寒外热证，面赤身反不恶寒，厥利清谷脉微绝，通脉四逆主之先，利止参加脉不出，葱入面色赤炎炎，<a href="http://%77%77%77.zysj.com.cn/lilunshuji/neikexue/76-5-3.html#m0-0" target="_blank" title="书籍相关：腹痛">腹痛</a>加芍咽<a href="http://ww%77%2E%7A%79sj.com.cn/zhongyaocai/yaocai_j/jugeng.html" target="_blank" title="中药材：桔梗">桔梗</a>，呕加圣药用姜鲜。</p><p>【注】少阴里寒外热之证，面赤不恶寒，格阳外热也。四肢厥冷，下利清谷，脉微欲绝，阴极里寒也，宜通脉四逆汤主之。服四逆汤下利止，脉仍不出加<a href="http://www.z%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>，面色赤者加葱，<a href="http://%77%77%77.zysj.com.cn/lilunshuji/neikexue/76-5-3.html#m0-0" target="_blank" title="书籍相关：腹痛">腹痛</a>加芍药，咽痛加<a href="http://ww%77%2E%7A%79sj.com.cn/zhongyaocai/yaocai_j/jugeng.html" target="_blank" title="中药材：桔梗">桔梗</a>，呕加<a href="http://www.zys%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_s/shengjiang.html" target="_blank" title="中药材：生姜">生姜</a>。详少阴篇。</p>
