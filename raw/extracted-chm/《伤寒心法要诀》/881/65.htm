<tr><td align="left">少腹满痛</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>少腹满痛</h1></center>
<p>少腹满而按之痛，厥逆尿白冷膀胱，不厥血蓄小便利，小便不利水为殃。</p><p>【注】少腹满按之痛，若四肢厥冷，小便清白者，是冷结膀胱，宜<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_d/danggui.html" target="_blank" title="中药材：当归">当归</a>四逆加<a href="http://www.zy%73%6A%2E%63%6Fm.cn/zhongyaocai/yaocai_w/wuzhuyu.html" target="_blank" title="中药材：吴茱萸">吴茱萸</a><a href="http://www.zysj.co%6D%2E%63%6E/zhongyaocai/yaocai_s/shengjiang.html" target="_blank" title="中药材：生姜">生姜</a>汤。不厥冷，小便自利者，是血蓄膀胱，宜<a href="http://www.z%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_t/taoren.html" target="_blank" title="中药材：桃仁">桃仁</a>承气汤。小便不利者，是水蓄膀胱，宜五苓散，若大小便不利者，是水热蓄结，宜八正散。</p>
