<tr><td align="left">头痛</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>头痛</h1></center>
<p>三阳<a href="http://www.zysj.co%6D%2E%63%6E/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>身皆热，无热吐沫厥阴经，不便尿红当议下，尿白犹属表未清。</p><p>【注】三阳，谓太阳、阳明、少阳也。<a href="http://www.zysj.co%6D%2E%63%6E/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>身皆热，谓三阳<a href="http://www.zysj.co%6D%2E%63%6E/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>身皆热也。三阳经<a href="http://www.zysj.co%6D%2E%63%6E/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>，法当从三阳治也。厥阴<a href="http://www.zysj.co%6D%2E%63%6E/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>，则多厥而无热，<a href="http://www.z%79%73%6A%2E%63om.cn/lilunshuji/neikexue/76-5-4.html#m0-0" target="_blank" title="书籍相关：呕吐">呕吐</a>涎沫，是厥阴挟寒邪上逆也，宜<a href="http://ww%77%2E%7A%79%73%6A.com.cn/zhongyaocai/yaocai_w/wuzhuyu.html" target="_blank" title="中药材：吴茱萸">吴茱萸</a>汤温而降之。三阳<a href="http://www.zysj.co%6D%2E%63%6E/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>，若不大便，小便红赤，为里实热，法当议下，宜承气汤。若小便清白，即不大便，为里热未实，表尚未清，法当先从表治也。三阴经无<a href="http://www.zysj.co%6D%2E%63%6E/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>，惟厥阴有<a href="http://www.zysj.co%6D%2E%63%6E/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>，以其脉与督脉上会于巅也。三阴经无<a href="http://%77%77%77%2E%7A%79%73%6A%2Ecom.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>，厥阴少阴亦有<a href="http://%77%77%77%2E%7A%79%73%6A%2Ecom.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>，谓之反<a href="http://%77%77%77%2E%7A%79%73%6A%2Ecom.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>，以其藏有相火，阴盛格阳于外也。</p>
