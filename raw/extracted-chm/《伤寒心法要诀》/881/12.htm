<tr><td align="left">阳明腑病脉证</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>阳明腑病脉证</h1></center>
<p>胃实脉大腑阳明，大便难兮脾约同，蒸蒸潮热 汗，满痛始可议三承。</p><p>【注】脉大腑阳明，谓热邪入腑，阳明当脉大也。曰胃实，曰大便难，曰脾约，谓腑病受邪之不同也。脾约者，太阳阳明也。胃实者，正阳阳明也。大便难者，少阳阳明也。</p><p>皆为可下之证，不无轻重之别。然必蒸蒸潮热，身肢 然汗出，或满或痛，始可议其微、甚，以三承气汤、麻仁丸下之可也。详阳明篇。</p>
