<tr><td valign="top"><hr /><center><h1>少阴阳邪停饮</h1></center>
<p>少阴阳邪有停饮，六七日反不得眠，下利而渴咳而呕，小便不利<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_z/zhuling.html" target="_blank" title="中药材：猪苓">猪苓</a>煎。</p><p>【注】少阴阳邪有停饮，谓少阴阳邪热证，兼有停饮病也。少阴病当欲寐，至六、七日反心烦不得眠，是少阴热也，下利而渴，咳呕，小便不利，是水饮停也。以<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_z/zhuling.html" target="_blank" title="中药材：猪苓">猪苓</a>汤去其热而利其水可也。详少阴篇。</p>
