<tr><td align="left">但欲寐</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>但欲寐</h1></center>
<p>行阴嗜卧无表里，呼醒复睡不须惊，风温脉浮热汗出，多眠身重息鼾鸣。</p><p>【注】行阴欲寐嗜卧，少阴证也。若欲寐嗜卧无表里证，身和脉小，知已解也。然解后之睡，呼之则醒，醒而又睡，是阴气来复，非阴盛困阳，不须惊也。风温亦欲寐多眠，则有脉浮<a href="http://www.zysj.co%6D%2E%63%6E/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>，汗出身重，鼻息鼾鸣之别也。</p>
