<tr><td align="left">腹满痛</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>腹满痛</h1></center>
<p>腹满时痛不足证，腹满大痛有余名。误下邪陷太阴里，汗热便硬转阳明。</p><p>【注】腹满时痛为不足，<a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加芍药汤，不愈，用理中汤。腹满大痛为有余，<a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加<a href="http://ww%77%2E%7A%79%73%6A%2E%63%6F%6D.cn/zhongyaocai/yaocai_d/daihuang.html" target="_blank" title="中药材：大黄">大黄</a>汤。此皆误下邪陷太阴之里证也。若潮热自汗，大便硬，则为太阴之邪转属阳明也，宜大承气汤。</p>
