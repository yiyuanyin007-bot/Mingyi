<tr><td valign="top"><hr /><center><h1>太阴阳明表里同病</h1></center>
<p>腹满时减复如故，此是寒虚气上从，腹满不减不大便，转属阳明乃可攻。</p><p>【注】腹满时减，减复如故，谓腹时满时不满，而减复如常，此为太阴寒邪寒虚之气上逆之满，乃可温之证也，宜浓朴<a href="http://w%77%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_s/shengjiang.html" target="_blank" title="中药材：生姜">生姜</a><a href="http://www.zysj.%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>半夏<a href="http://www.zysj%2E%63%6Fm.cn/zhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>汤。腹满不减，谓常常而满，终日不减，或不大便，此为转属阳明实热内壅之满，乃可攻之证也，宜大承气汤。详太阴篇。</p>
