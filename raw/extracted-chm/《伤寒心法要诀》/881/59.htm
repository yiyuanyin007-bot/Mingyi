<tr><td align="left">热利寒利</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>热利寒利</h1></center>
<p>热利尿红渴粘秽，寒利澄清小便白，理中不应宜<a href="http://www.zysj.com%2E%63%6E/lilunshuji/neikexue/76-1-5.html#m2-10" target="_blank" title="书籍相关：固涩">固涩</a>，仍然不应利之瘥。</p><p>【注】自利不渴者，属太阴寒也。下利欲饮水者，以有热故也。此以渴辨寒热也。小便黄赤，秽气稠粘者，皆热利也。小便清白，澄彻清谷，皆寒利也。热利有表证，轻者<a href="http://www%2E%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_s/shengma.html" target="_blank" title="中药材：升麻">升麻</a><a href="http://www.zysj.com%2E%63%6E/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>汤，重者<a href="http://www.zysj.com%2E%63%6E/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>汤汗之。有里证者，量以三承气汤下之。无表里证，轻者宜<a href="http://www.zysj.c%6F%6D.cn/zhongyaocai/yaocai_h/huangqin.html" target="_blank" title="中药材：黄芩">黄芩</a>汤，重者宜<a href="http://www.zysj.com%2E%63%6E/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a><a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_h/huanglian.html" target="_blank" title="中药材：黄连">黄连</a><a href="http://www.zysj.c%6F%6D.cn/zhongyaocai/yaocai_h/huangqin.html" target="_blank" title="中药材：黄芩">黄芩</a>汤清之。寒利宜理中汤温而补之。若服理中汤不应者，此属下焦滑脱，宜<a href="http://www%2E%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_c/chishizhi.html" target="_blank" title="中药材：赤石脂">赤石脂</a><a href="http://www.zysj%2E%63om.cn/zhongyaocai/yaocai_y/yuyuliang.html" target="_blank" title="中药材：禹余粮">禹余粮</a>汤<a href="http://www.zysj.com%2E%63%6E/lilunshuji/neikexue/76-1-5.html#m2-10" target="_blank" title="书籍相关：固涩">固涩</a>。仍然不应，此为清浊不分，水走大肠，宜五苓散或<a href="http://www.zysj.com%2E%63%6E/zhongyaocai/yaocai_z/zhuling.html" target="_blank" title="中药材：猪苓">猪苓</a>汤利之，可瘥也。</p>
