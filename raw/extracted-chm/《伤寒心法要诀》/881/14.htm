<tr><td align="left">少阳脉证</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>少阳脉证</h1></center>
<p>往来寒热胸胁满，脉弦目眩而耳聋，口苦默默不欲食，心烦喜呕少阳经，或渴或咳身微热，或胁硬痛腹中疼，或悸不呕尿不利，舌苔滑白小柴宗。</p><p>【注】脉弦，谓少阳病脉也。往来寒热胸胁满，目眩耳聋，口苦默默不欲食，心烦喜呕，少阳经主证也。或渴、或咳身微热，或胁硬痛、腹中疼，或悸、不呕、尿不利、舌苔滑白者，皆少阳或有之证也。均宜小<a href="http://w%77%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤主之，随证加减治之可也。详少阳篇。</p>
