<tr><td valign="top"><hr /><center><h1>少阳禁汗禁吐禁下</h1></center>
<p>少阳三禁要详明，汗谵吐下悸而惊，甚则吐下利不止，水浆不入命难生。</p><p>【注】三禁，谓少阳禁吐、禁汗、禁下也。若误发汗，则生谵语，若误吐下，则<a href="http://www%2E%7Aysj.com.cn/lilunshuji/neikexue/76-4-1.html#m0-0" target="_blank" title="书籍相关：心悸">心悸</a>而惊。少阳经，即有心下硬，不可下，下之甚，则下利不止。即有胸中满，不可吐，吐之甚，则水浆不入，变成危候，命难生也。详少阳篇。</p>
