<tr><td align="left">衄血</td><td align="right">《伤寒心法要诀》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>衄血</h1></center>
<p>阳明衄血热在里，太阳衄血热瘀经，太阳<a href="http://www%2E%7A%79%73%6A%2E%63%6Fm.cn/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>目瞑兆，阳明漱水不咽征。衄后身凉知作解，不解<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_s/shengma.html" target="_blank" title="中药材：升麻">升麻</a>犀角清。未衄表实<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>汗，里热犀角芩连同。</p><p>【注】阳明衄血热在里也。太阳衄血热瘀经也。太阳失汗则有<a href="http://www%2E%7A%79%73%6A%2E%63%6Fm.cn/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>目瞑之兆，阳明失下则有漱水不欲咽之征。衄血之后，身凉脉静，知作解也，若仍不解，知衄未尽，热留于营也。无汗表热，宜<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_s/shengma.html" target="_blank" title="中药材：升麻">升麻</a><a href="http://www.%7Aysj.com.cn/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>合犀角<a href="http://www.zy%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_d/dihuang.html" target="_blank" title="中药材：地黄">地黄</a>汤清解之；欲作衄未衄者，表实宜<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>汤汗之，里热宜犀角<a href="http://www.zy%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_d/dihuang.html" target="_blank" title="中药材：地黄">地黄</a>汤加芩、连清之。若表实里热者，则又当合二方两解之。</p>
