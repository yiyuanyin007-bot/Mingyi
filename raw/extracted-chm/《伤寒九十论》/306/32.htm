<tr><td align="left">桂枝证（三十一）</td><td align="right">《伤寒九十论》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>桂枝证（三十一）</h1></center>
<p></p><p>里间张太医家一妇．病伤寒．<a href="http://ww%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>．恶风．自汗．脉浮而弱．予曰．当服<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>．彼云家有自合者．予令三啜之．而病不除．予询其药中用<a href="http://ww%77%2E%7A%79%73j.com.cn/zhongyaocai/yaocai_r/rougui.html" target="_blank" title="中药材：肉桂">肉桂</a>耳．予曰．<a href="http://ww%77%2E%7A%79%73j.com.cn/zhongyaocai/yaocai_r/rougui.html" target="_blank" title="中药材：肉桂">肉桂</a>与<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>不同．予自治以<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤．一啜而解．论曰．仲景论用<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>者．盖取<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>轻薄者耳．非<a href="http://ww%77%2E%7A%79%73j.com.cn/zhongyaocai/yaocai_r/rougui.html" target="_blank" title="中药材：肉桂">肉桂</a>之肉浓也．盖<a href="http://ww%77%2E%7A%79%73j.com.cn/zhongyaocai/yaocai_r/rougui.html" target="_blank" title="中药材：肉桂">肉桂</a>浓实．治<a href="http://www.zysj.com.c%6E/lilunshuji/jichulilun/44-3-1.html#m0-0" target="_blank" title="书籍相关：五脏">五脏</a>用之．取其镇重．<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>清轻．治伤寒用之．取其发散．今人一例．是以无功．</p>
