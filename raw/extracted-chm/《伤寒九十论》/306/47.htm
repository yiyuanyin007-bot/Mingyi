<tr><td valign="top"><hr /><center><h1>发黄证（四十六）</h1></center>
<p></p><p>五月．避地维扬东面里沙中．一豪子病伤寒八九日．身体洞黄．鼻目皆痛．两膊及项头腰皆强急．大便涩．小便如金．予诊曰．脉紧且数．其病脾先受湿．暑热蕴蓄于足太阴之经．宿谷相搏．郁蒸而不得泄．故使头面有汗．项以下无之．若鼻中气冷．寸口近掌无脉．则死．今脉与证相应．以<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_y/yinchen.html" target="_blank" title="中药材：茵陈">茵陈</a>汤调五苓散与之．数日瘥．</p>
