<tr><td valign="top"><hr /><center><h1>汗后吃逆证（四十）</h1></center>
<p></p><p>张保义得汗后吃逆．或者以胃虚则哕．故吃逆也．投以<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/ganjiang.html" target="_blank" title="中药材：干姜">干姜</a>橘皮等汤．不下．命予治之．予曰．此证不可全作胃虚治．六脉尚躁．是余毒未解耳．投以小<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤．两啜而俞．</p>
