<tr><td valign="top"><hr /><center><h1>阴阳交证（五十六）</h1></center>
<p></p><p>里有张姓者．病伤寒．医汗之．汗虽出．身热如旧．予诊之曰．得汗．宜身凉脉静喜食．今脉躁．身热．不食．狂言．病名阴阳交．不可治也．素问黄帝问有温病．汗出辄复热．而脉躁．病不为汗衰．狂言不能食．名何疾．岐伯曰病名阴阳交．交者死也．人所以汗出者．皆生于谷．谷生于精．今邪气交争于骨肉而得汗者．是邪却而精胜也．精胜则能食而不复热矣．汗者精气．今汗出而复热者．是邪胜也．不能食者精无俾也．其寿可立而倾也．果半日死．</p>
