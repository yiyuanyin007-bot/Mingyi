<tr><td valign="top"><hr /><center><h1>刚证（二十一）</h1></center>
<p></p><p>宣和戊戌．表兄秦云老病伤寒．身热．足寒．颈项螈 ．医作<a href="http://www.zysj.%63%6F%6D%2E%63%6E/lilunshuji/waikexue/80-9-3.html#m0-0" target="_blank" title="书籍相关：中风">中风</a>治．见其口噤故也．予诊其脉实而有力．而又脚挛．啮齿．大便不利．身燥无汗．予曰．此刚 也．先以承气汤下之．次以续命汤调之．愈矣．论曰．五常政大论曰．赫曦之纪．上羽与正征同．其收齐．其病 ．盖戌太阳寒水羽也．戊火运．正征也．太过之火．上见太阳．则天气且刚．故其收齐．而人病 者．过气然耳．火木遇故年病．此证多刚 ．</p>
