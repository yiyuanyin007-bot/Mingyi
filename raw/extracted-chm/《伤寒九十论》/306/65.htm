<tr><td valign="top"><hr /><center><h1>伤寒胁痛证（六十四）</h1></center>
<p></p><p>董齐贤病伤寒数日．两胁挟脐．痛不可忍．或作奔豚治．予视之曰非也．少阳胆经．循胁入耳．邪在此经．故病心烦．喜呕．渴．往来寒热．默不能食．胸胁满闷．少阳证也．始太阳传入此经．故有是证．仲景云太阳病不解．传入少阳．胁下满干呕者．小<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤主之．三投而痛止．续得汗解．</p>
