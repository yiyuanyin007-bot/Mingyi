<tr><td valign="top"><hr /><center><h1>脏结证（六十七）</h1></center>
<p></p><p>甲辰．盐商舣舟江次．得伤寒．胸膈痞．连脐下旁不可忍．饮食不进．予诊之曰．此非结胸．乃脏结也．不可救矣．脏结者寸脉浮．关脉细小沉紧者．尚有白苔．痛引小腹则死．仲景云痛引小腹．入阴经者死．次日痛引小腹．午时果死．</p>
