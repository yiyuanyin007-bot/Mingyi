<tr><td valign="top"><hr /><center><h1>桂枝加葛根汤证（十九）</h1></center>
<p></p><p>庚戌．建康徐南强．得伤寒．背强．汗出．恶风．予曰．<a href="http://%77%77%77%2E%7A%79%73j.com.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>汤证．病家曰．他医用此方．尽二剂而病如旧．汗出愈加．予曰．得非仲景三方乎．曰然．予曰．误矣．是方有<a href="http://www.zysj%2E%63om.cn/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>．服则愈见汗多．林亿谓止于<a href="http://%77%77%77%2E%7A%79%73j.com.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>汤也．予令生而服之．微汗而解．</p>
