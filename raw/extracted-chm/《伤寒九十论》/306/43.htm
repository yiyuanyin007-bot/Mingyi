<tr><td valign="top"><hr /><center><h1>小便出血证（四十二）</h1></center>
<p></p><p>里人有病中脘吐．心下烦闷．多昏睡．倦卧．手足冷．盖少阴证也．十余日不瘥．忽尔通身大热．小便<a href="http://ww%77%2Ezysj.com.cn/lilunshuji/neikexue/76-1-4.html#m17-0" target="_blank" title="书籍相关：出血">出血</a>．予曰．阴虚者阳必凑之．今脉细弱．而脐下不痛．未可下．<a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_t/taoren.html" target="_blank" title="中药材：桃仁">桃仁</a>承气．且以芍药<a href="http://www%2E%7A%79%73%6A%2E%63%6Fm.cn/zhongyaocai/yaocai_d/dihuang.html" target="_blank" title="中药材：地黄">地黄</a>汤．三投而愈．</p>
