<tr><td valign="top"><hr /><center><h1>伤寒暴死证（十一）</h1></center>
<p></p><p>己未岁．一时官病伤寒．<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>狂言烦躁．无他恶证．四日死．或者以为两感．然其证初无两感证候．是岁得此疾．三日四日死者甚多．人窃怪．予叹之．曰是运使然也．己为土运．土运之岁．上见太阴．盖太乙天符为贵人．中执法者．其病速而危．中行令者．其病徐而持．中贵人者．其病暴而死．谓之异也．又曰臣为君则逆．逆则其病危．其害速．是年少宫土运．木气大旺．邪中贵人．故多暴死．气运当然．何足怪也．</p>
