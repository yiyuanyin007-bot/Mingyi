<tr><td valign="top"><hr /><center><h1>葛根汤证（二十）</h1></center>
<p></p><p>市人杨姓者．病伤寒．无汗．恶风．项虽屈而强．医者以<a href="http://www.zysj.c%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a><a href="http://www.zysj%2E%63om.cn/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>各半汤与之．予曰．非其治也．是谓项强KT KT ．<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>证也．三投． 然微汗解．翌日项不强．脉已和矣．论曰．何谓KT KT ．如短羽鸟之状．虽屈而强也．谢复古谓病患羸弱．须凭几而起．非是．此与成氏解不同．</p>
