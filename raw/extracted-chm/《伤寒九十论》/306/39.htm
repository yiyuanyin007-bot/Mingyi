<tr><td valign="top"><hr /><center><h1>结胸可下证（三十八）</h1></center>
<p></p><p>维扬李寅始病．头疼．<a href="http://www%2E%7A%79%73%6A%2Ecom.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>．恶风．医者下之．忽尔心下坚硬．项强．短气．宛然结胸中证也．予曰幸尔脉不浮．心不烦躁．非陷胸汤不可．投之．一宿乃下．论曰．仲景言病发于阳而反下之．热入于胸．因作结胸者．以下之太早故也．盖恶寒尚有表证未罢．而下之．故阳气内陷．阳内拒痛．脉浮者不可下．下之则死．结胸烦躁者必死．此是恶证．辩者仔细．</p>
