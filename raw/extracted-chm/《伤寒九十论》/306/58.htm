<tr><td valign="top"><hr /><center><h1>阴阳易证（五十七）</h1></center>
<p></p><p>己巳．邻人王友生以贩京为业．蓄一婢．患伤寒．热八九日．予为治之．得汗而愈．未数日生自病．身热头重不欲举．目中生花．召予视之．予曰．是必伤寒初愈．妇人交接得之．即令阴头上必肿．小腹绞痛．然是阴阳易也．生曰前患者婢子、意谓已安．遂与之交．翌日得此疾．良苦．予曰．失所治．必吐舌数寸而死．予作 鼠粪．烧 散等．以利其毒瓦斯．旬日安．</p>
