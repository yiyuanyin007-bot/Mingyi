<tr><td valign="top"><hr /><center><h1>扬手踯足证（六十）</h1></center>
<p></p><p>己酉．王仲贤患伤寒．<a href="http://www.zysj.co%6D%2E%63%6E/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a><a href="http://www.zysj%2E%63om.cn/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>．不恶风．身无汗．烦闷．脉浮而紧．八九日不退．予诊之曰．<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>证也．所感多热．是以烦躁．遂投以<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>汤三服．至暮．烦愈甚．手足躁乱．扬踯不止．或以为发狂．须用寒药．予争之曰．此汗证也．幸勿忧．切忌乱服药．守一时．须稍定．比寐少时中．汗出矣．仲景云至六七日三部大．手足躁乱者．欲解也．盖谓此耳．若行寒剂．定是医杀．</p>
