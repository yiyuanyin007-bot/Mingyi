<tr><td valign="top"><hr /><center><h1>三阳合病证（三十五）</h1></center>
<p></p><p>有市人李九妻．患<a href="http://www.z%79%73%6A%2E%63%6F%6D%2Ecn/lilunshuji/neikexue/76-5-3.html#m0-0" target="_blank" title="书籍相关：腹痛">腹痛</a>．身体重．不能转侧．小便遗失．或作中湿治．予曰．非是也．三阳合病证．仲景云．见阳明篇第十证．三阳合病．腹满．身重难转侧．口不仁．面垢．谵语．遗尿不可汗．汗则谵语．下则额上汗出．手足逆冷．乃三投白虎汤而愈．</p>
