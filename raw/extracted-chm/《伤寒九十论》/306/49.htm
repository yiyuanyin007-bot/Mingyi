<tr><td valign="top"><hr /><center><h1>黄入清道证（四十八）</h1></center>
<p></p><p>夏有高师病黄证．鼻内 疼．身与目如金色．小便赤涩．大便如常．则知病不在脏腑．今眼睛疼．鼻额痛．则知病在清道中矣．清道者华盖．肺之经也．若服<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_d/daihuang.html" target="_blank" title="中药材：大黄">大黄</a>．则必腹胀为逆．当用瓜蒂散．先含水．次搐之．令鼻中黄水尽则愈．如其言．数日而病除．</p>
