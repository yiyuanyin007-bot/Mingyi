<tr><td valign="top"><hr /><center><h1>大青龙汤证（五）</h1></center>
<p></p><p>何保义从王太尉军中．得伤寒．脉浮涩而紧．予曰若头疼．<a href="http://www%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>．恶风．无汗．则<a href="http://www.zysj.%63%6F%6D%2E%63n/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>证也．烦躁．则青龙汤证也．何曰．今烦躁甚．予投以大青龙汤．三投．汗解．论曰．<a href="http://ww%77%2E%7A%79%73%6A.com.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>．<a href="http://www.zysj.%63%6F%6D%2E%63n/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>．青龙．皆表证发汗药．而<a href="http://ww%77%2E%7A%79%73%6A.com.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>治汗出．恶风．<a href="http://www.zysj.%63%6F%6D%2E%63n/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>治无汗．恶寒．青龙治无汗．而烦．三者皆欲微汗解．若汗多．亡阳．为虚．则烦躁不眠也．</p>
