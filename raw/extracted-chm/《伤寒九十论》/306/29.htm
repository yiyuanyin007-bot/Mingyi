<tr><td valign="top"><hr /><center><h1>循衣摸床证（二十八）</h1></center>
<p></p><p>仪真一妇．病伤寒．八九日．<a href="http://www.%7A%79%73%6A%2E%63om.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>．昏闷不识人．手循衣缝．摸床．谵语．不识人事．他医不识．或汗或利．旬日增甚．予诊之曰．此脉涩而小便不利．不可治也．翌日死．论曰．华佗云．病患循衣摸床谵语．不可治．仲景云伤寒．吐下后不解．不大便．五六日．发潮热不识人．循衣．撮空．微喘．直视．脉弦者生．脉涩者死．又云小便利者可治．今脉涩．小便不利．见其两死．不见一生．吾莫能为也．</p>
