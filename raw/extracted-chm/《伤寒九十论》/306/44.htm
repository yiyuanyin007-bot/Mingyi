<tr><td valign="top"><hr /><center><h1>妊娠伤寒脚肿证（四十三）</h1></center>
<p></p><p>里巷一妇人妊娠．得伤寒．自腰以下肿满．医者或谓之阻．或谓之香港脚．或谓之水分．予曰．此证受胎脉也．病名曰心实．当利小便．医者曰利小便．是作水分治．莫用木通葶苈桑皮否．曰当刺劳宫关元穴．医大骇曰．此出何家书．予曰．仲景玉函经曰．妇人伤寒．妊娠．及七月．腹满．腰以下如水溢之状．七月太阴当养不养．此心气实．当刺劳宫及关元．以利小便．则愈．予教令刺穴遂瘥．</p>
