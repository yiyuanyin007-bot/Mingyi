<tr><td valign="top"><hr /><center><h1>两胫逆冷证（七十二）</h1></center>
<p></p><p>江西茶客吴某．病．头疼如裹．两脚自膝以下皆冷．胸间多汗．时时谵语．医作阴证．治以<a href="http://www.zys%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_f/fuzi.html" target="_blank" title="中药材：附子">附子</a>辈．意其足冷而厥也．予诊其脉关濡尺急．遂断以湿温脉证．其病先日受湿．而又中 ．湿热相搏．故此证成．急以白虎三投而解．</p>
