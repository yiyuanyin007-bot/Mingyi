<tr><td valign="top"><hr /><center><h1>舌卷囊缩证（二十七）</h1></center>
<p></p><p>句容县豪子李姓．初得伤寒．手足冷．气上冲心．饥不欲食．脉紧而弦．予诊曰．厥阴悉具．脉有刑克．最忌舌卷囊缩．翌日卷舌而死．论曰．内经云．厥阴者肝也．肝者筋合之．筋者聚于阴器．络于舌本．厥阴之气．故舌卷而囊缩也．</p>
