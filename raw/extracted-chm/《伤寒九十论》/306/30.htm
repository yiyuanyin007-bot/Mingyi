<tr><td valign="top"><hr /><center><h1>邪入大经证（二十九）</h1></center>
<p></p><p>维扬谢康中．任仪真酒官．咽干．烦渴．腰疼．身热．脉细而微急．予诊视之曰．此真少阴证也．六经之中．少阴难治．少阴病传之经络．此证有补泻法．仲景泻者用承气．补者用四逆．误之则相去远矣．此证当温．勿以水证为疑也．予适以事出境．后七日归．则为他医汗之矣．经络既虚．邪毒流入大经之中．手足螈 ．如惊痫状．其家野狼狈求救．予曰．不可治也．予验此甚多．是谓邪入大经．不旋踵．其家已哭矣．</p>
