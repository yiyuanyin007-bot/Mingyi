<tr><td valign="top"><hr /><center><h1>胃热呕吐证（七十）</h1></center>
<p></p><p>丁未岁夏．族妹因伤寒．已汗后．<a href="http://www.zysj.c%6F%6D%2E%63n/lilunshuji/neikexue/76-5-4.html#m0-0" target="_blank" title="书籍相关：呕吐">呕吐</a>不止．强．药不下．医以<a href="http://www.zysj.%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_d/dingxiang.html" target="_blank" title="中药材：丁香">丁香</a>硝石<a href="http://%77%77%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_l/liuhuang.html" target="_blank" title="中药材：硫黄">硫黄</a>藿香等药治之．盖作胃冷治也．予往视之．曰．此汗后余热尚留胃脘．若投以热药．如以火济火．安能止也．故以<a href="http://www.zys%6A.com.cn/zhongyaocai/yaocai_x/xiangru.html" target="_blank" title="中药材：香薷">香薷</a>汤．<a href="http://www%2E%7Aysj.com.cn/zhongyaocai/yaocai_z/zhuru.html" target="_blank" title="中药材：竹茹">竹茹</a>汤．三服愈．</p>
