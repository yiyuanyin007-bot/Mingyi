<tr><td valign="top"><hr /><center><h1>霍乱转筋证（七十一）</h1></center>
<p></p><p>夏．钟离德全一夕病．上吐下泻．身冷．汗出如洗．心烦躁．予以<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_x/xiangru.html" target="_blank" title="中药材：香薷">香薷</a>饮与服之．翌日遂定．进理中等调之痊．论曰．仲景云．病<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63%6Fm.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>．<a href="http://www.zysj.c%6F%6D%2Ecn/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>．身疼．恶寒．吐利者．此属何病．答曰此名霍乱．自吐下又利．止而复作．更<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63%6Fm.cn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>也．此病多由暑热．阴阳不和．清浊相干．饮食过伤．三焦溷乱．腹中撮痛．烦渴不止．两足转筋．杀人颇急．不可缓也．</p>
