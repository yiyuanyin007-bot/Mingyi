<tr><td valign="top"><hr /><center><h1>叉手冒心证（五十八）</h1></center>
<p></p><p>乙巳六月．吉水谭商人寓城南．得伤寒．八九日．心下惕惕然．以两手扪心．身体振振动摇．他医以心痛治之．不效．予曰．此汗过多之所致也．仲景云持脉时．病患叉手自冒心．心下悸．所以然者以重获汗．虚．故如此．又云发汗过多．其人叉手自冒心．心下悸．欲得按者．<a href="http://www.zysj.c%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a><a href="http://www.zy%73%6A%2E%63%6Fm.cn/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>汤证．予投黄 建中真武．及<a href="http://www.zy%73%6A%2E%63%6Fm.cn/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a><a href="http://www.zysj.c%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>．渐得平复．</p>
