<tr><td valign="top"><hr /><center><h1>指甲黑青证（二十五）</h1></center>
<p></p><p>干明僧人．病伤寒．目赤．颇渴．咽干．饮水无 ．腰疼．身热．脉沉而微细．此少阴证也．恣纵不慎忌．乃饮水．遂致痞气．痞气结聚．身如被杖．数日变为阴毒矣．脉见于皮肤上．大而且虚．鼻中如烟煤．甲青．须臾发喘．是夕死．论曰．扁鹊云手足爪下青黑者死．宋迪阴证诀云．阴毒盛．则指甲黑青．病至此则为不治．</p>
