<tr><td valign="top"><hr /><center><h1>伤寒协热利证（六十九）</h1></center>
<p></p><p>庚戌四月．乡妇吴氏病伤寒．头疼身热．下利不止．众医多以<a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_f/fuzi.html" target="_blank" title="中药材：附子">附子</a>理中金液治之．烦躁而利愈甚．予视之曰．脉迟而沉．若脐下热．则协热利也．投三黄熟艾汤．三服而利止渴除．渐投以解肌汗药．而得汗瘥．</p>
