<tr><td valign="top"><hr /><center><h1>面垢恶寒证（七十五）</h1></center>
<p></p><p>一尼病<a href="http://www.zysj.com%2E%63%6E/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>身热．烦渴．躁．诊其脉大而虚．问之曰小便赤．背恶寒．毛竦洒洒然．面垢中暑也．医作热病治．但未敢服药．予投以白虎汤．数日愈．论曰．仲景云脉虚身热．得之伤暑．又云其脉弦细芤迟何也．素问曰寒伤形．热伤气．盖伤气不伤形．则气消而脉虚弱．所以弦迟芤细．皆虚脉而可知矣．</p>
