<tr><td valign="top"><hr /><center><h1>狐惑证（四十五）</h1></center>
<p></p><p>句容县东豪子李姓者．得伤寒数日．村落无医．易师巫者五六日矣．或汗下．杂治百出．遂成坏病．予时自江北避寇．遁伏江左．求宿于其家．夜半闻呻吟声．询之．云患伤寒逾旬矣．予为诊视．其脉见于上下唇皆已 蚀．声嘶而咽干．舌上白苔．齿无色．予曰病名狐惑．杀人甚急．秉烛为作<a href="http://www.zy%73%6A%2E%63%6Fm.cn/zhongyaocai/yaocai_x/xionghuang.html" target="_blank" title="中药材：雄黄">雄黄</a>丸泻心汤．投之．数日瘥．</p>
