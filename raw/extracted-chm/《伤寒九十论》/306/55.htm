<tr><td valign="top"><hr /><center><h1>下脓血证（五十四）</h1></center>
<p></p><p>远族人患伤寒．他医以阴证治之．<a href="http://ww%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_l/liuhuang.html" target="_blank" title="中药材：硫黄">硫黄</a><a href="http://www.zysj.com.c%6E/zhongyaocai/yaocai_f/fuzi.html" target="_blank" title="中药材：附子">附子</a>相继而进．旬日大胀下脓血．或如赤豆汁．医尚作少阴证治．复下桃花汤治之．予因诊视曰所误多矣．表里虚．热气乘虚入肠胃．而又投以燥药．是以下脓血也．遂投梅煎散．数剂愈．</p>
