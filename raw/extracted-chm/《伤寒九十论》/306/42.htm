<tr><td valign="top"><hr /><center><h1>漏风证（四十一）</h1></center>
<p></p><p>癸卯秋九月．牒试淮南僧台．同试有建阳彭子静．得疾．身热<a href="http://www.zysj.com.c%6E/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>．呕逆．自汗如洗．已数日矣．召予诊视．谓予曰．去试不数日．而疾势如此．为之奈何．予曰．误服药多矣．此证当先止汗．幸无忧也．予作术附汤与之．三投而汗止．次日微汗 ．身凉．五日而得愈．</p>
