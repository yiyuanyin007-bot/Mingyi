<tr><td valign="top"><hr /><center><h1>脐中出血证（九）</h1></center>
<p></p><p>一妇人得伤寒数日．咽干．烦渴．脉弦细．医者汗之．其始衄血．继而脐中<a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E/lilunshuji/neikexue/76-1-4.html#m17-0" target="_blank" title="书籍相关：出血">出血</a>．医者惊骇而遁．予曰少阴强汗之所致也．盖少阴不当发汗．仲景云少阴强发汗．必动其血．未知从何道而出．或从口鼻．或从耳目．是为下厥上竭．此为难治．仲景云无治法．无药方．予投以姜附汤．数服．血止．后得微汗愈．论曰．本少阴证．而误汗之．故血妄行．自脐中出．若服以止血药．可见其标．而不见其本．予以治少阴之本．而用姜附汤．故血止而病除．</p>
