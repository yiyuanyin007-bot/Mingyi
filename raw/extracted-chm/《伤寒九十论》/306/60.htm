<tr><td valign="top"><hr /><center><h1>伤寒耳聋证（五十九）</h1></center>
<p></p><p>戊申年．类试山阳．一时官病伤寒八九日．耳聋而无闻．楚医少阳治．意谓仲景称少阳受病．则<a href="http://www.z%79%73%6A%2E%63om.cn/lilunshuji/neikexue/76-6-2.html#m0-0" target="_blank" title="书籍相关：胁痛">胁痛</a>而耳聋也．予诊之曰．两手脉弱而无力．非少阳证也．若少阳则渴饮水．心烦．但寐．咽痛．今俱无此证．但多汗惊悸．必汗过多所致也．仲景云未持脉时．令病患咳．而不咳者．两耳聋无所闻也．所以然者．因重发汗．虚．故如此．病家曰医者尝大发汗矣．遂投以真武<a href="http://www.zys%6A%2E%63om.cn/zhongyaocai/yaocai_b/baishu.html" target="_blank" title="中药材：白术">白术</a><a href="http://www.zysj.c%6F%6D%2Ecn/zhongyaocai/yaocai_f/fuzi.html" target="_blank" title="中药材：附子">附子</a>汤辈．数日．耳有闻而愈．</p>
