<tr><td valign="top"><hr /><center><h1>结胸可灸证（三十九）</h1></center>
<p></p><p>城东李氏子．年十八．病伤寒结胸．状如 ．自心至脐．手不可近．短气心烦．真结胸也．医者便欲下之．予适过其门．见其怆惶面无色．予曰公有忧色何也．曰以长子病伤寒作结胸证．医者将下之．而犹豫．予就为诊之．自关以上浮大．表证未罢．不可下也．曰事急矣．予以<a href="http://www.zy%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_h/huanglian.html" target="_blank" title="中药材：黄连">黄连</a>饼子．灸脐中数十壮．得气下．心腹软．继以和气解肌药．数日瘥．当时若下．定是医杀．</p>
