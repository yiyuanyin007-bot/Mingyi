<tr><td valign="top"><hr /><center><h1>舌上滑苔证（六十二）</h1></center>
<p></p><p>丁未五月．乡人邢原晖病伤寒．寒热往来．心下郁闷．舌上白滑苔．予曰．舌上滑苔有数证．有阴阳脉紧．鼻出涕者．有脏结而不可治者．有温瘴．丹田有热者．有阳明．胁下坚者．此证属阳明．宜<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_z/zhizi.html" target="_blank" title="中药材：栀子">栀子</a>汤吐之于前．小<a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>继于其后．数日汗解而愈．</p>
