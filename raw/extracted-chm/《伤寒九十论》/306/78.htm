<tr><td align="left">伤寒闭目证（七十七）</td><td align="right">《伤寒九十论》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>伤寒闭目证（七十七）</h1></center>
<p></p><p>李思顺得伤寒．恶寒<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>．口中气热如火．不绝七八日矣．而目闭不肯开．予诊其脉．阴阳俱紧．是必汗之而复下之故也．此坏证矣．病家曰．一医于三日前汗之不愈．一医复下之．而目闭矣．遂投以小<a href="http://www.zy%73%6A.com.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤．五啜而愈．论曰．或问何以知其汗下而目闭．予曰．仲景称伤寒<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>．口中气勃勃然．<a href="http://www.zys%6A%2E%63om.cn/lilunshuji/neikexue/76-9-1.html#m0-0" target="_blank" title="书籍相关：头痛">头痛</a>目黄．若下之则目闭．又云伤寒脉阴阳俱紧．恶寒<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>．目赤．脉多睛不慧．医复汗之．咽中伤．若复下．则两目闭．此坏证．须小<a href="http://www.zy%73%6A.com.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤．调之愈．</p>
