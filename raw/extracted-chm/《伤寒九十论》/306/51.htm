<tr><td valign="top"><hr /><center><h1>太阳瘀血证（五十）</h1></center>
<p></p><p>仇景莫子仪病伤寒七八日．脉微而沉．身黄发狂．小腹胀满．脐下如冰．小便反利．医见发狂．以为热毒蓄伏心经．以铁粉<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_n/niuhuang.html" target="_blank" title="中药材：牛黄">牛黄</a>等药．欲止其狂躁．予诊之曰非其治也．此瘀血证尔．仲景云阳病身黄．脉沉结．小腹硬．小便不利．为无血．小便自利．其人如狂者．血证也．可用抵当汤．再投．而下血几数升．狂止．得汗而解．经云血在下则狂．在上则忘．太阳膀胱经也．随经而蓄于膀胱．故脐下胀．自阑门会渗入大肠．若大便黑者．此其验也．</p>
