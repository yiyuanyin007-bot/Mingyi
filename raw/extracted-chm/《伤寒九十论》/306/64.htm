<tr><td align="left">衄血证（六十三）</td><td align="right">《伤寒九十论》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>衄血证（六十三）</h1></center>
<p></p><p>睢阳张士美病伤寒七八日．口燥饮水而不咽入．俄而衄血．脉浮紧．身热．医者云伤寒．脉浮紧．不发汗．因致衄血者．属<a href="http://www.zy%73j.com.cn/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>汤．予曰．不可．古人虽云当汗不汗．热化为血．此证亦有不可汗者．仲景云阳明病．口燥．但欲饮水而不咽者．必发衄．衄家不可发汗．发汗则额上陷．不得眠．不能 ．此只可用犀角汤．<a href="http://www%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_d/dihuang.html" target="_blank" title="中药材：地黄">地黄</a>汤．若当时行<a href="http://www.zy%73j.com.cn/zhongyaocai/yaocai_m/mahuang.html" target="_blank" title="中药材：麻黄">麻黄</a>．必额上陷．直视不眠也．</p>
