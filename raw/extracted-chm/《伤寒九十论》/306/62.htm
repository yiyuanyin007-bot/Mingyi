<tr><td valign="top"><hr /><center><h1>遗尿证（六十一）</h1></center>
<p></p><p>城南妇人．腹满身重．遗尿．言语失常．他医曰．不可治也．肾绝矣．其家惊忧无措．密召予至．则医尚在座．乃诊之曰．何谓肾绝．医家曰仲景谓溲便遗失．狂言．反目直视．此谓肾绝也．予曰．今脉浮大而长．此三阳合病也．胡为肾绝．仲景云腹满身重．难以转侧．口不仁．谵语．遗尿．发汗则谵语．下之则额上生汗．手足厥冷．白虎证也．今病患谵语者．以不当汗而汗之．非狂言反目直视．须是肾绝脉．方可言此证．乃投以白虎加<a href="http://www.z%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>汤．数服而病悉除．</p>
