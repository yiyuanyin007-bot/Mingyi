<p STYLE="MArGin: 0cm 0cm 0pt; VerTiCAL-ALiGn: baseline; WorD-BreAK: break-all; TexT-inDenT: 24pt; Line-HeiGHT: 22pt; TexT-ALiGn: left; mso-line-height-rule: exactly; mso-char-indent-count: 2.0; punctuation-trim: leading" ALIGN="left"><span STYLE="FonT-siZe: 12pt; CoLor: black; FonT-FAMiLY: 宋体; mso-bidi-font-family: 宋体; mso-font-kerning: 0pt">
这它是简文啊，那桂枝汤它脉浮不，也脉浮。脉浮病在表这是肯定的，那就得用麻黄汤发汗吗？这不一定的，这是个简文，因为桂枝汤麻黄汤已经反复的说了，头前都有了。那么就是脉浮无汗者，它起码有个无汗，那么这类的表证必须用麻黄汤发汗，这是简文，这书里面很多。</SPAN></P>
