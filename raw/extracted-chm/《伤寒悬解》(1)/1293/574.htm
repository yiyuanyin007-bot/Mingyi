<tr><td align="left">差后劳复四</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>差后劳复四</h1></center>
<p><strong>【394】伤寒差已后，更发热，小<a href="http://www.zysj.com%2E%63%6E%2Fzhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤主之。</strong>方在少阳二（方【19】）。<strong>脉浮者，以汗解之，脉沉实者，以下解之。</strong></p><p>病后中气未复，最易感伤，设更见发热者，宜<a href="http://www.zysj.com%2E%63%6E%2Fzhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤温里而清表。其脉浮者，病在表，应以汗解之，脉沉实者，病在里，应以下解之也。</p>
