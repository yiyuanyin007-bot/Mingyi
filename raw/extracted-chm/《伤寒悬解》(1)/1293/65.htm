<tr><td align="left">脉法四十七</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>脉法四十七</h1></center>
<p><strong>师曰：立夏得洪大脉，是其本位。其人病，身体苦疼重者，须发其汗。若明日身不疼不重者，不须发汗。若汗濈濈自出者，明日便解矣。何以言之？立夏得洪大脉，是其时脉，故使然也。四时仿此。</strong></p><p>火旺于夏，立夏得洪大脉，是其本位之盛也。其人病，身体苦疼痛而沉重者，风寒郁其皮毛也，立夏湿动，湿郁则身重也。须发其汗。若至明日，身不疼不重者，外邪欲解，不须发汗也，俟之必汗自出。若汗濈濈然自出者，明日便解矣。何以言之？立夏得洪大脉，是其脉之应时，故使然也。四时解期，仿此类推。</p>
