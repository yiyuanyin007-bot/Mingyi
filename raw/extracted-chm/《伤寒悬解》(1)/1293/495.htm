<tr><td valign="top"><hr /><center><h1>脉促发厥证十三　厥阴十四</h1></center>
<p><strong>【349】伤寒，脉促，手足厥逆者，可灸之。</strong></p><p>阳为阴格，不得下达，故脉见促象。阴盛中寒，四肢失温，故手足厥逆。宜灸之，以助阳胜阴也。</p>
