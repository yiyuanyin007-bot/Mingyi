<tr><td valign="top"><hr /><center><h1>脉虚厥逆证十七　厥阴十八</h1></center>
<p><strong>【347】伤寒五六日，不结胸，腹濡，脉虚，复厥者，不可下，此为亡血，下之死。</strong></p><p>五六日，正传厥阴之时，不结胸，而腹亦濡而不满，此内无冷结也。但脉虚而厥逆者，不可下也，此为亡血，下之则死。盖血中温气，所以充经络而温肢节，营血虚寒，故肢冷脉虚也。</p>
