<tr><td valign="top"><hr /><center><h1>不可汗十</h1></center>
<p><strong>【　】咽中闭塞，不可发汗，发汗则吐血，气欲绝，手足逆冷，欲得蜷卧，不得自温。</strong></p><p>咽中闭塞，浊气上填也。汗之中气颓败，不能统血，温气欲绝，故厥逆蜷卧也。</p>
