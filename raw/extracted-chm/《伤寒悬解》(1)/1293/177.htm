<tr><td valign="top"><hr /><center><h1>汗后作喘证四　太阳五十九</h1></center>
<p><strong>【75】发汗后，饮水多者，必喘，以水灌之，亦喘。</strong></p><p>推原上章喘字之义。汗出亡津液，燥渴饮水，饮水太多，而汗后阳虚，不能消散，水停则肺气壅遏，故必喘。以水灌之，皮毛外闭，肺气郁阻，故亦喘也。</p>
