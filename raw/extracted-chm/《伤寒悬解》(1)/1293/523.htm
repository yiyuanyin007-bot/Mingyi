<tr><td valign="top"><hr /><center><h1>阳回证三　厥阴四十</h1></center>
<p><strong>【361】下利，脉数，而有微热，汗出，令自愈，设复紧，为未解。</strong></p><p>下利脉数，而有微热，阳欲复也，一见汗出，则阳气外达，利将止矣，可令自愈，不须治也。设脉复紧，则阴邪外闭，阳陷而不升，为未解也。</p>
