<tr><td valign="top"><hr /><center><h1>桂枝厚朴杏子证十四　太阳八十四</h1></center>
<p><strong>【18】喘家，作<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤，加厚朴杏子仁。</strong></p><p>平素喘家，胃逆肺阻，作<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤解表，宜加朴、杏，降逆而破壅也。</p>
