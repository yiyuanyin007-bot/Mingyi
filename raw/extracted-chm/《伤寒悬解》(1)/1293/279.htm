<tr><td valign="top"><hr /><center><h1>阳明经病桂枝证一　阳明十三</h1></center>
<p><strong>【234】阳明病，脉迟，汗出多，微恶寒者，表未解也，可发汗，宜<a href="http://www.zysj.%63%6F%6D%2Ecn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤。</strong>方在太阳五（方【1】）。</p><p>脉迟，汗出，恶寒，是太阳中风脉证，故宜<a href="http://www.zysj.%63%6F%6D%2Ecn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>。而汗多已属胃阳之盛，故曰阳明病也。</p>
