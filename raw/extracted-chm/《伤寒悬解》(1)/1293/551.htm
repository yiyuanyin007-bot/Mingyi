<tr><td valign="top"><hr /><center><h1>湿病七</h1></center>
<p><strong>【　】病者一身尽疼，发热，日晡所剧者，名曰风湿。此病伤于汗出当风，或久伤取冷所致也。</strong></p><p>午后湿土当令，故日晡时剧。汗出当风，开其皮毛，汗液郁遏，流溢经隧，阻碍气道，故身痛而发热也。</p>
