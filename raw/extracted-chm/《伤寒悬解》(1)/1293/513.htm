<tr><td valign="top"><hr /><center><h1>厥阴阳绝死证一　厥阴三十一</h1></center>
<p><strong>【345】伤寒发热，下利至甚，厥不止者，死。</strong></p><p>发热而下利至甚，里寒外热，阳气不归也。而厥逆不止，则土败阳绝，而无来复之望，必主死也。</p>
