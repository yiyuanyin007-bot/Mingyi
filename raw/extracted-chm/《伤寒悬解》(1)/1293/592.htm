<tr><td valign="top"><hr /><center><h1>不可汗十一</h1></center>
<p><strong>【86】衄家，不可发汗，汗出必额上陷，脉紧急，目直视，不能眴，不得眠。</strong></p><p>衄家阳气升泄，汗之亡阳，必额上塌陷，经脉紧急，目晴直视，不能眴转，不得眠睡，由其阳根泄露而不秘藏也。</p>
