<tr><td valign="top"><hr /><center><h1>咳逆咽痛证八　阳明五十九</h1></center>
<p><strong>【198】阳明病，但头眩，不恶寒，故能食而咳，其人必咽痛。若不咳者，咽不痛。</strong></p><p>阳明以下行为顺，上行为逆，胃土上逆，阳气不降，浮越无根，是以头眩。表解，故不恶寒。胃阳未败，故能食。胃土上逆，肺金壅碍则为咳。咳则相火逆冲，是以咽痛。不咳者，相火未冲，故咽不痛。</p>
