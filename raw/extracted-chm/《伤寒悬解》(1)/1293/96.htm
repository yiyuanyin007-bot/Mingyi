<tr><td align="left">脉法七十八</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>脉法七十八</h1></center>
<p><strong>师持脉，病人欠者，无病也。脉之呻者，病也。言迟者，风也。摇头言者，里痛也。行迟者，表强也。坐而伏者，短气也。坐而下一脚者，腰痛也。里实护腹，如怀卵物者，心痛也。</strong></p><p>平人神倦若睡则欠呵，非病证也，故欠者无病。身有痛苦则呻，故呻者有病。内风者，内湿外燥，语言蹇涩，故言迟为风。心腹痛极则头摇，故头摇言者，里痛也。阳性轻清，表郁气浊，故言重而行迟。短气者，身仰则气愈短，故坐而身伏。腰痛则身弯不敢直，故坐则下一脚。心痛则用手护腹，形如怀抱卵物也。此望闻之法也。</p>
