<tr><td valign="top"><hr /><center><h1>桂枝证三　太阳七</h1></center>
<p><strong>【95】太阳病，发热汗出者，此为营弱卫强，故使汗出，欲救邪风者，<a href="http://www.zysj.com%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤主之。</strong></p><p>营弱卫强，即上章阳浮阴弱之义，卫闭而遏营血也。邪风者，经所谓虚邪贼风也。风随八节，而居八方，自本方来者，谓之正风，不伤人也，自冲后来者，谓之贼风，伤人者也。如夏至风自南来，是正风也，若来自北方，是冲后也。义详《灵枢·九官八风篇》。</p>
