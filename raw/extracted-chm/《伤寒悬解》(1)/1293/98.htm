<tr><td valign="top"><hr /><center><h1>脉法八十</h1></center>
<p><strong>人愧者，其脉何类？师曰：脉浮而面色乍白乍赤。</strong></p><p>愧发于心，心动火炎，故面乍赤，赤者，心之色也。火炎金伤，故面色乍白，白者，金之色也。心肺之脉俱浮，心肺气动，是以脉浮。人愧而汗出者，心动火炎而刑肺气，故气泄而为汗也。此望切之法也。</p>
