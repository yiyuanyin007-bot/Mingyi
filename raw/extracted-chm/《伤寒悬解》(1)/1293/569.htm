<tr><td valign="top"><hr /><center><h1>霍乱十一</h1></center>
<p><strong>【391】吐利发汗，脉平，小烦者，以新虚不胜谷气故也。</strong></p><p>吐利发汗之后，阳气极虚，而脉却平和，是正复邪退，必自愈也。而犹有烦者，以阳气新虚，不胜谷气，谷气不消，则阳郁而烦生故也。</p>
