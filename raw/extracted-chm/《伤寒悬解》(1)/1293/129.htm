<tr><td valign="top"><hr /><center><h1>麻黄证三　太阳二十二</h1></center>
<p><strong>【57】伤寒发汗已解，半日许复烦，脉浮数者，可更发汗，宜<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤。</strong>方在太阳五（方【1】）。</p><p>伤寒，服麻黄发汗已解，乃半日许复烦，脉见浮数，是卫郁已泻而营郁不达，可更发汗，以泻其营，宜<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤也。</p>
