<tr><td valign="top"><hr /><center><h1>脉法六十五</h1></center>
<p><strong>问曰：病有不战而汗出解者，何也？答曰：脉大而浮数，故知不战汗出而解也。</strong></p><p>脉大而浮数，阳气盛旺，阴邪不能遏郁，故不战而汗解也。</p>
