<tr><td valign="top"><hr /><center><h1>脉浮盗汗证二十三　阳明七十四</h1></center>
<p><strong>【201】阳明病，脉浮而紧者，必潮热，发作有时，但浮，必盗汗出。</strong></p><p>脉浮而紧，太阳之脉，阳明得之，必潮热，按时而发，以表寒郁其腑热也。若但浮而不紧，则外无表寒而内无里热，寐时卫气不入阴分，皮毛失敛，经热蒸泄，必盗汗出，几盗汗之家，皆阴盛脏寒，阳不内交者也。</p>
