<tr><td valign="top"><hr /><center><h1>阳回生烦证十一　厥阴四十八</h1></center>
<p><strong>【375】下利后更烦，按之心下濡者，为虚烦也，宜栀子豉汤。</strong>方在太阳八十九（方【34】）。</p><p>利后阳泄，不应生烦，乃更烦者，是阳复而有内热也。承气证之烦，其心下必当硬满，是为实烦，若按之心下濡者，是为虚烦。缘阳复热升，熏蒸肺津，而化涎沫，心气郁阻，是以生烦。宜栀子豉汤，以清烦热也。</p>
