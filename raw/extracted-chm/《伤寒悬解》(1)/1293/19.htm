<tr><td valign="top"><hr /><center><h1>脉法三</h1></center>
<p><strong>寸口脉，浮为在表，沉为在里，数为在腑，迟为在脏。假令脉迟，此为在脏也。</strong></p><p>表为阳，里为阴，故表脉浮而里脉沉。腑为阳，脏为阴，故腑脉数而藏脉迟。浮数沉迟，阴阳自然之性也。此审察表里，料度脏腑之义。</p>
