<tr><td valign="top"><hr /><center><h1>少阳坏病</h1></center>
<p>少阳在半表半里之间，故宜小<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>，半表半里治之。而半表之阳盛，则小<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>之<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_h/huangqin.html" target="_blank" title="中药材：黄芩">黄芩</a>不足以清表阳，而<a href="http://w%77%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>反益半表之热，服<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤已，渴者，属阳明是也。半里之阴盛，则小<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>之<a href="http://w%77%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>不足以温里阴，而<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_h/huangqin.html" target="_blank" title="中药材：黄芩">黄芩</a>反益半里之寒，与<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤，后必下重是也。小<a href="http://www.zysj.com.%63%6E/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>未尝犯本经之禁，而于阴阳偏盛者，犹有助虐之弊，况乎汗、下、温针，倒行逆施，阳盛而泻其阴，阴盛而代其阳，则入阴入阳，坏病百出矣。</p><p>仲景于是有救逆之法，补苴挽回，使之离阳明之腑，而出太阴之脏，所谓明辅造化，幽赞鬼神者也。</p>
