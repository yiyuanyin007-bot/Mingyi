<tr><td valign="top"><hr /><center><h1>温针亡阳证十三　太阳一百四</h1></center>
<p><strong>【119】太阳伤寒者，加温针，必惊也。</strong></p><p>温针发汗亡阳，土败胃逆，神魂无归，必生惊悸也。</p>
