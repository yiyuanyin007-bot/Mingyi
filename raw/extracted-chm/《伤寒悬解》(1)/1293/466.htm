<tr><td valign="top"><hr /><center><h1>阳回证二　少阴三十七</h1></center>
<p><strong>【289】少阴病，恶寒而蜷，时自烦，欲去衣被者，可治。</strong></p><p>自烦而去衣被，阳气之复也，是以可治。</p>
