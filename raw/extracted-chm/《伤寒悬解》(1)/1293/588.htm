<tr><td valign="top"><hr /><center><h1>不可汗七</h1></center>
<p><strong>【　】动气在右，不可发汗，发汗即衄而渴，心苦烦，饮即吐水。</strong></p><p>动气在右，肺气之郁，汗泄肺气，则收敛失政，衄血作渴，心中苦烦。阳虚里寒，故饮即吐水。</p>
