<tr><td valign="top"><hr /><center><h1>桂枝证九　太阳十三</h1></center>
<p><strong>【　】①夫病脉浮大，问病者，言但便硬耳，设利之，为大逆。硬为实，汗出而解，何以故？脉浮，当以汗解。</strong></p><p>阳明腑病脉浮大，（阳明篇：二阳合病，脉浮大，上关上）。病脉浮大，是有腑证。乃问病者，言但觉便硬耳，未至痛满也，则非急下之证。设遽利之，此为大逆。盖便硬虽内实，而表证尚在，犹须汗出而解，不宜下也。此何以故？其脉大纵属内实，而脉浮则当以汗解也。</p><p><em>①【　】　此条《<a href="http://www.zysj.c%6F%6D%2E%63%6E/lilunshuji/shanghanlun/index.html" target="_blank" title="中医书籍：伤寒论">伤寒论</a>》398条不载。</em></p>
