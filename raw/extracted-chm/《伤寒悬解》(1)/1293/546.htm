<tr><td valign="top"><hr /><center><h1>湿病二</h1></center>
<p><strong>【　】湿家之为病，一身尽疼，发热，身色如熏黄也。</strong></p><p>湿盛则气滞，故疼作。阳郁故发热。土郁故色黄。黄而兼黑，色如烟熏，如曰熏黄。</p>
