<tr><td valign="top"><hr /><center><h1>提纲　一章</h1></center>
<p>太阳表证不解，传于少阳之经，胁下硬满，干呕不食，往来寒热，谵语，是其腑病而经郁也。若汗、下、温针，一经逆治，阳盛则入阳明之腑，阴盛则入三阴之脏，少阳之证已罢，他经之证蜂生，病自少阳而坏，是谓少阳之坏病。其逆犯不同，则病坏非一，知其所犯，治之以法，法在则人存，病虽坏而人不坏，是贵乎良工也。</p>
