<tr><td valign="top"><hr /><center><h1>桂枝证四　太阳八</h1></center>
<p><strong>【54】病人脏无他病，时发热，自汗出，而不愈者，此为卫气不和也，先于其时发汗则愈，<a href="http://www%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤主之。</strong></p><p>阳明腑病，汗愈出而胃愈燥，故发热汗出，而病不愈。病人脏气平和，无他胃热之证，时发热，自汗出而不愈者，此为卫气得风，郁勃而不和也。当先于其时以<a href="http://www%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>发汗则愈，迟恐变生他病也。</p>
