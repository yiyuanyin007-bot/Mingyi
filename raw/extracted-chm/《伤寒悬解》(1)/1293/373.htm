<tr><td valign="top"><hr /><center><h1>少阳传经一　少阳十六</h1></center>
<p><strong>【271】伤寒三日，少阳脉小者，欲已也。</strong></p><p>伤寒一日太阳，二日阳明，三日少阳。阳明篇：伤寒三日，阳明脉大，若三日而见少阳之小脉，不见阳明之大脉，是不传阳明之腑，而病欲已也。此与太阳经伤寒一日，太阳受之，脉若静者，为不传义同。言六经俱遍，邪不里传，自能汗解也。</p>
