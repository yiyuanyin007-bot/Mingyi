<tr><td valign="top"><hr /><center><h1>栀于香豉证十九　太阳八十九</h1></center>
<p><strong>【77】发汗，若下之，而烦热胸中窒者，栀子豉汤主之。</strong></p><p>汗下败其中气，胃土上逆，浊气填瘀，君火不得下行，故心宫烦热，胸中窒塞。栀子豉汤，香豉调中气而开窒塞，栀子吐浊瘀而除烦热也。</p><p><strong>〖栀子豉汤〗二十九　（方【34】）</strong></p><p><strong>【34】栀子豉汤</strong></p><p>栀子<em>擘，十四个</em>　香豉<em>绵裹，四合</em></p><p><em>上二味，以水四升，先煮栀子，得二升半，内豉，煮取一升半，去滓，分二服，温进一服，得吐者，止后服。</em></p>
