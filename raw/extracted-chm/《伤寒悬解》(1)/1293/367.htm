<tr><td valign="top"><hr /><center><h1>属阳明证十　少阳十一</h1></center>
<p><strong>【97】服<a href="http://w%77%77%2E%7A%79%73%6A.com.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤已，渴者，属阳明也，以法治之。</strong></p><p>服<a href="http://w%77%77%2E%7A%79%73%6A.com.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤已，半表之热清，应当不渴，渴者，胃腑燥热，属阳明也。以法治之，</p><p>去其燥热，则胃病不成矣。</p>
