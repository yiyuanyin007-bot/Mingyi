<tr><td valign="top"><hr /><center><h1>传经三　少阳十八　三阴去路</h1></center>
<p><strong>【269】伤寒六七日，无大热，其人烦躁者，此为阳去入阴也。</strong></p><p>伤寒六七日，经尽之期，外无大热，而其人烦躁者，此为阳去而入三阴之脏也。脏阴旺则阳气离根而失归，必至烦躁。</p>
