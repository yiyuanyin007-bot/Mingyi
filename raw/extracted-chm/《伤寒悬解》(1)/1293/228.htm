<tr><td valign="top"><hr /><center><h1>禹余粮证十七　太阳一百八</h1></center>
<p><strong>【88】汗家，重发汗，必恍惚心乱，小便已阴痛，与禹余粮丸。</strong>方阙<em>（方阙　《桂林古本》中此方药为：禹余粮四两，<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>三两，附子二枚，五味子三合，,<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_f/fuling.html" target="_blank" title="中药材：茯苓">茯苓</a>三两，<a href="http://www%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_g/ganjiang.html" target="_blank" title="中药材：干姜">干姜</a>三两。上六味，蜜为丸，如梧桐子大。每服二十丸。）</em>（方【40】）。</p><p>平素汗家，液亡神虚，重发其汗，阳亡神败，必恍惚心乱。湿动木郁，小便后阴痛。以木郁于水，疏泄不畅，便后滞气凝涩，故尿孔作痛。禹余粮敛阳神于阴精，蛰君火而达风木也。</p>
