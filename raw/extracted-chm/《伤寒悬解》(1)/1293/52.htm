<tr><td valign="top"><hr /><center><h1>脉法三十四</h1></center>
<p><strong>脉来缓，时一止复来者，名曰结，脉来数，时一止复来者，名曰促。脉阳盛则促，阴盛则结，此为病脉。</strong></p><p>曰病脉者，以其阴阳之偏也。</p>
