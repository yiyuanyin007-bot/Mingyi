<tr><td valign="top"><hr /><center><h1>通脉四逆证二十三　厥阴二十四</h1></center>
<p><strong>【370】下利清谷，里寒外热，汗出而厥者，通脉四逆汤主之。</strong>方在少阴二十三（方【99】）。</p><p>下利清谷，里寒外热，手足厥逆，脉微欲绝，身反不恶寒，其人面赤色，是少阴通脉四逆证，缘其阳弱而气郁也。少阴阴盛阳微，故面见赤色，阳郁皮腠，而不得出汗。厥阴阴极阳生，内胎火气，故热盛而汗出。虽见汗出，而阳气犹郁。以其脏气寒凝，故其经络郁遏不畅，亦宜通脉四逆也。</p>
