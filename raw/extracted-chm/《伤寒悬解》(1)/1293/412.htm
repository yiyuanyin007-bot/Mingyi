<tr><td valign="top"><hr /><center><h1>四逆证五　太阴六</h1></center>
<p><strong>【277】自利不渴者，属太阴，以其脏有寒故也，当温之，宜服四逆辈。</strong></p><p>三阳之利，津亡里燥，多见渴证，自利而不渴者，此属太阴，以其脏有寒故也。是当温之，宜四逆辈也。</p>
