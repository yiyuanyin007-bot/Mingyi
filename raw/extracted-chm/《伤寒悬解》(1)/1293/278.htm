<tr><td valign="top"><hr /><center><h1>阳明经病　七章　腑病连经</h1></center>
<p>阳明自太阳传来，未入于腑，全是经病。经病宜汗，其未离大阳之经，则用麻、桂，其将入阳明之腑，则加<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>。阳明一见吐利，虽未是里实可下之证，然而经迫腑郁，已是胃热将成之根，故用<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>双解经腑之郁。此证得法，自无离经入腑之患矣。</p>
