<tr><td valign="top"><hr /><center><h1>汗后吐逆证五　太阳七十五</h1></center>
<p><strong>【76】发汗后，水药不得入口为逆，若更发汗，必吐下不止。</strong></p><p>汗出阳泄，土败胃逆，水药不得入口，是谓逆治。若更发汗，阳败土崩，太阴吐利之证，必将俱作，无有止期矣。</p>
