<tr><td valign="top"><hr /><center><h1>桂枝加桂证十一　太阳一百二</h1></center>
<p><strong>【15】太阳病，下之后，其气上冲者，可与<a href="http://www.zy%73%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤，用前法。若不上冲者，不可与之。</strong></p><p>下后其气上冲，是奔豚发作也，可与<a href="http://www.zy%73%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤，用如前法，疏风木而降奔冲。若不上冲者，奔豚未作，不可与前汤也。</p>
