<tr><td valign="top"><hr /><center><h1>咽痛吐利证十　少阴十一</h1></center>
<p><strong>【283】病人脉阴阳俱紧，反汗出者，亡阳也，此属少阴，法当咽痛而复吐利。</strong></p><p>阴阳俱紧，阴阳即尺寸也。伤寒之脉，不应有汗，反汗出者，阳亡于外也。则此之脉紧，乃里阴之内盛，非表寒之外束矣。此属少阴，法当咽痛而复吐利，水旺火盛则咽痛，水旺土湿则吐利也。</p><p>此提少阴咽痛吐利之纲，下分应之。</p>
