<tr><td valign="top"><hr /><center><h1>不可汗八</h1></center>
<p><strong>【　】动气在上，不可发汗，发汗则气上冲，正在心端。</strong></p><p>动气在上，风木郁冲而心下动悸也。汗亡肝家温气，则肝气上冲，正在心端也。</p>
