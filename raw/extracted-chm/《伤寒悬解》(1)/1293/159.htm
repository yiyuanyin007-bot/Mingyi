<tr><td valign="top"><hr /><center><h1>抵当证三　太阳四十六</h1></center>
<p><strong>【125】太阳病，身黄，脉沉结，少腹硬，小便不利者，为无血也，小便自利，其人如狂，血证谛也，抵当汤主之。</strong></p><p>身黄，脉沉结，少腹硬，是皆血瘀之脉证。血司于肝，血结木郁，贼伤己土，则发黄色，缘木主五色，入土为黄故也。然使小便不利，则三者乃膀胱湿热之瘀，是<a href="http://www.zysj.com.cn%2Fzhongyaocai/yaocai_y/yinchen.html" target="_blank" title="中药材：茵陈">茵陈</a>五苓证，非血证也，小便自利，其人如狂，血证已谛，故宜抵当。</p>
