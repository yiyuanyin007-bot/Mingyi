<tr><td valign="top"><hr /><center><h1>热胜便脓证十二　厥阴十三</h1></center>
<p><strong>【334】发热无汗，而利必自止，若不止，必便脓血，便脓血者，其喉不痹。</strong></p><p>发热无汗，是阳不外蒸，里气温暖，利必自止。若其不止，则内蒸营阴，必便脓血。便脓血者，热邪下行，其喉不痹也。</p>
