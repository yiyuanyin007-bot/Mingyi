<tr><td valign="top"><hr /><center><h1>脉法五十</h1></center>
<p><strong>寸口诸微亡阳，诸濡亡血，诸弱发热，诸紧为寒，诸乘寒者则为厥，郁冒不仁，以胃无谷气，脾塞不通，口急不能言，战而栗也。</strong></p><p>诸微亡阳，阳虚则脉微也。诸濡亡血，血脱则脉濡也。诸弱发热，脉弱则血虚而发热也。诸紧为寒，脉紧则阴盛而生寒也。诸乘寒者则为厥，郁冒不仁，寒水旺盛，而诸脏诸腑乘之，因乘而愈盛，寒气发作，侵侮脾胃，则四肢厥逆，怫郁昏冒，而无知觉。以胃无谷气，水邪莫畏，脾土寒湿，气塞不通，故一身顽昧而弗用，口急不能言语，战摇而寒栗也。</p>
