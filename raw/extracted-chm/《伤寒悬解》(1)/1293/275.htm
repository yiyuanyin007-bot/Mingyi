<tr><td valign="top"><hr /><center><h1>阳明来路三　阳明十</h1></center>
<p><strong>【185】本太阳病，初得时，发其汗，汗先出不彻，因转属阳明也。</strong></p><p>太阳病，汗出透彻，则表解而里气亦达。若汗出不彻，表邪未解，腑热郁生，因而转属阳明也。</p>
