<tr><td valign="top"><hr /><center><h1>阳明提纲二　阳明二</h1></center>
<p><strong>【186】伤寒三日，阳明脉大。</strong></p><p>伤寒一日太阳，二日阳明，三日少阳。阳明之脉大，少阳之脉弦细，若三日正传少阳之时，不见少阳弦细之脉，而见阳明之大脉，知其传于阳明之腑矣。</p>
