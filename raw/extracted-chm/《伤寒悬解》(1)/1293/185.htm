<tr><td valign="top"><hr /><center><h1>火邪圊血证十二　太阳六十七</h1></center>
<p><strong>【114】太阳病，以火熏之，不得汗，其人必躁，到经不解，必清血，名为火邪。清与圊同。</strong></p><p>太阳病，当以汗解，乃以火熏之，又不得汗，内热愈增，其人必躁。到经尽之期，当解而不解，热伤血分，必当圊血，此名火邪也。</p>
