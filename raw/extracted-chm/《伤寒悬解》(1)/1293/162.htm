<tr><td valign="top"><hr /><center><h1>传经一　太阳四十八</h1></center>
<p><strong>【58】大凡病，若发汗，若吐，若下，若亡血，若亡津液，阴阳自和者，必自愈。</strong></p><p>发汗、吐、下、亡血、亡津，不无损伤，而邪退正复，阴阳调和，不至偏胜，必自愈也。病，非阴胜，则阳胜，和而不偏，所以自愈。</p>
