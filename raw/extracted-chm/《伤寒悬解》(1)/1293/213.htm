<tr><td align="left">芍药甘草附子证二　太阳九十三</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>芍药甘草附子证二　太阳九十三</h1></center>
<p><strong>【68】发汗病不解，反恶寒者，虚故也，芍药<a href="http://www.zysj%2E%63om.cn/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>附子汤主之。</strong></p><p>汗泄血中温气，木郁阳陷，故表病不解，而反加恶寒。芍药<a href="http://www.zysj%2E%63om.cn/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>附子汤，芍药清风而敛营血，<a href="http://www.zysj%2E%63om.cn/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>培土而荣木气，附子暖水以补温气也。</p><p><strong>〖芍药<a href="http://www.zysj%2E%63om.cn/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>附子汤〗三十三　（方【30】）</strong></p><p><strong>【30】芍药<a href="http://www.zysj%2E%63om.cn/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>附子汤</strong></p><p>芍药<em>三两</em>　<a href="http://www.zysj%2E%63om.cn/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a><em>炙，三两</em>　附子<em>一枚，炮，去皮，破八片</em></p><p><em>上三味，以水五升，煮取一升五合，去滓，分温三服。</em></p>
