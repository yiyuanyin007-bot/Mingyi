<tr><td valign="top"><hr /><center><h1>太阴经病桂枝证一　太阴二</h1></center>
<p><strong>【276】太阴病，脉浮者，可发汗，宜<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤。</strong>方在太阳五（方【1】）。此太阴经病。</p><p>太阴病，已传脾脏，宜见腹满吐利，腹痛不食诸证。若不见诸证而脉浮者，是脏病未成而但见经病也，宜<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>发汗。</p>
