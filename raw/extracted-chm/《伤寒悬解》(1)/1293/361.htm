<tr><td valign="top"><hr /><center><h1>小柴胡证四　少阳五</h1></center>
<p><strong>【99】伤寒四五日，身热恶寒，颈项强，胁下满，手足温而渴者，小<a href="http://www.zysj.%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>杨主之。</strong></p><p>颈项强，是太阳之病，而肝胆主司筋脉，相火旺则筋脉燥急，少阳之经，自头下行，而循颈项，故亦有颈项强证。胁下满者，少阳之病。手足温者，阳明之病。四肢秉气于胃，胃阳盛旺，则手足温，而手少阳自手走头，足少阳自头走足，故亦有手足温证。是宜小<a href="http://www.zysj.%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤也。</p>
