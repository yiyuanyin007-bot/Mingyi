<tr><td valign="top"><hr /><center><h1>妇人热入血室一　少阳十九</h1></center>
<p><strong>【143】妇人中风，发热恶寒，经水适来，得之七八日，热除而脉迟身凉，胸胁下满，如结胸状，谵语者，此为热入血室，当刺期门，随其实而泻之。</strong></p><p>妇人中风，发热恶寒，而值经水适来之时。及得病七八日后，发热已除，而脉迟身凉，是当解矣。乃胸胁之下胀满，如结胸之状，而作谵语者，此为热入血室，热不在上而在下也。当刺厥阴之期门，随其经中之实处而泻之，以肝主藏血，肝胆同气。此与阳明刺期门章义同。</p>
