<tr><td valign="top"><hr /><center><h1>坏病提纲二　太阳五十五</h1></center>
<p><strong>【90】本发汗，而复下之，此为逆也。若先发汗，治不为逆。先本下之，而复汗之，为逆。若先下之，治不为逆。</strong></p><p>申明上章逆字之义。风寒外闭，宜辛温发散而不宜下，燥热内结，宜苦寒攻下而不宜汗。若表邪未解，里邪复盛，则宜先汗而后下，若里邪急迫，表邪轻微，则宜先下而后汗，错则成逆矣。若治法得宜，先后不失，不为逆也。</p>
