<tr><td valign="top"><hr /><center><h1>阳回谵语证十　厥阴四十七</h1></center>
<p><strong>【374】下利谵语者，有燥屎也，宜小承气汤。</strong>方在阳明二十二（方【76】）。</p><p>下利谵语者，阳复热过，传于土位，胃热而有燥屎也。宜小承气下其燥屎，以泻胃热。</p><p>上章是湿热下利，其伤在脾，脾伤则气陷，故病下重，此章是燥热下利，其伤在胃，胃伤则气逆，故病谵语。厥阴阴极阳复，热过伤津，亦有小承气证，厥阴自病，则无是也。</p>
