<tr><td valign="top"><hr /><center><h1>霍乱七</h1></center>
<p><strong>【389】既吐且利，小便复利，而大汗出，下利清谷，内寒外热，脉微欲绝者，四逆汤主之。</strong></p><p>膀胱不藏，则小便利，卫气不敛，则大汗出，经络脏腑之阳俱虚，故用四逆。</p>
