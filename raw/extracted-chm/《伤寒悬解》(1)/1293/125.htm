<tr><td valign="top"><hr /><center><h1>太阳伤寒　九章</h1></center>
<p>寒者，天地闭藏之气也。皮毛未合，寒气内入，伤其营阴，则窍阖而营闭。营性升发，营欲泄而寒闭之，欲泄不能，则外乘阳位，而束卫气，是以病也。</p>
