<tr><td valign="top"><hr /><center><h1>少阴阳回不死证一　少阴三十六</h1></center>
<p><strong>【292】少阴病，吐利，手足不厥冷，反发热者，不死。脉不至者，灸少阴七壮。</strong></p><p>吐利并作，脾胃俱败，而手足不逆冷，则中气未绝，反发热者，微阳欲复也，是以不死。若脉不至者，灸少阴经穴七壮，以助阳气，其脉必至，以其阳已回也。七为阳数，故灸七壮。</p>
