<tr><td align="left">脉法四十六</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>脉法四十六</h1></center>
<p><strong>西方肺脉，其形何似？师曰：肺者，金也，名太阴，其脉毛浮也。肺病自得此脉，若得缓迟者，皆愈。若得数者，则剧。何以知之？数者南方火，火克西方金，法当臃肿，为难治也。</strong></p><p>肺者，金也，居于西方，其位在右，经名太阴，其脉如毛而气浮也。肺病自得毛浮之脉，金得令也，得缓迟之脉，土生金也，故皆愈。若得数脉者，则剧。何以知之？数者，南方火也，火克西方之金，金被火刑，法当臃肿，此为难治也。</p>
