<tr><td valign="top"><hr /><center><h1>厥胜下利证十　厥阴十一</h1></center>
<p><strong>【331】伤寒，先厥，后发热，而下利者，必自止，见厥复利。</strong></p><p>厥而下利，是阴盛也。若先厥利，而后见发热，则阳进阴退，利必自止。若再见厥逆，则阴进阳退，当复利也。</p>
