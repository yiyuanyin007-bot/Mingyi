<tr><td valign="top"><hr /><center><h1>太阳坏病结胸痞证</h1></center>
<p>太阳之病，不解于太阳，而入阳明之腑，太阴之脏，寒热之偏胜，危机伏藏，是皆太阳之坏病也。然悠忽失治，离表传里，俟其入于阳明而用承气，入于太阴而用四逆，犹有救坏之方。至于未成阳明，下早而为结胸，将成太阴，误下而为痞，则阳明不成为阳明，太阴不成为太阴，承气、四逆方俱不可用，是为坏中之坏，莫可救挽者也。仲景于此，变承气、四逆而为陷胸、泻心法，挽逆为顺，至德神功，无以加矣！</p>
