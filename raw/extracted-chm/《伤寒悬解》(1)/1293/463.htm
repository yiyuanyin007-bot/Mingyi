<tr><td valign="top"><hr /><center><h1>死证六　少阴三十五</h1></center>
<p><strong>【299】少阴病，六七日，息高者，死。</strong></p><p>《<a href="http://www.zysj.com%2E%63%6E/lilunshuji/nanjing/index.html" target="_blank" title="中医书籍：难经">难经</a>》：呼出心与肺，吸入肾与肝。六七日后，水旺寒深而见息高，是有心肺之呼出而无肾肝之吸入，阳根下绝，升而不降，脱离非久，必主死也。</p>
