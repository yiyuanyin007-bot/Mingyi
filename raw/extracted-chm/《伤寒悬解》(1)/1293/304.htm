<tr><td valign="top"><hr /><center><h1>大承气证十九　阳明三十八</h1></center>
<p><strong>【239】病人不大便五六日，绕脐痛，烦躁，发作有时者，此有燥屎，故使不大便也。</strong></p><p>胃气郁遏，无下泄之窍，故绕脐作痛。</p>
