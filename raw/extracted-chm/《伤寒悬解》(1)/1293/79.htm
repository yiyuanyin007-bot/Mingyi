<tr><td align="left">脉法六十一</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>脉法六十一</h1></center>
<p><strong>问曰：凡病欲知何时得？何时愈？答曰：假令半夜得病者。明日日中愈，日中得病者，半夜愈，何以言之？日中得病，半夜愈者，以阳得阴则解也，半夜得病，明日日中愈者，以阴得阳则解也。</strong></p><p>日中得病，今日半夜愈者，以日中阳盛而病，得夜半阴盛以济之，则解也。夜半得病，明日日中愈者，以半夜阴盛而病，得日中阳盛以济之，则解也。</p>
