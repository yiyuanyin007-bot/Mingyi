<tr><td valign="top"><hr /><center><h1>麻黄证七　太阳二十六</h1></center>
<p><strong>【46】太阳病，脉浮紧，无汗，发热，身疼痛，八九日不解，表证仍在，此当发汗，麻黄汤主之。服药已，微除，其人发烦目瞑，剧者必衄，衄乃解。所以然者，阳气重故也。</strong></p><p>发热无汗，脉浮紧而身疼痛，此麻黄汤证。失不早服，至八九日不解，而表证仍在，此当发汗，宜麻黄汤。若卫气闭塞，泻之不透，服药之后，病仅微除，其人犹觉烦燥昏晕，未能全解。剧者卫郁升突，必至鼻衄，衄乃尽解。所以然者，久病失解，阳气之郁遏太重故也。</p>
