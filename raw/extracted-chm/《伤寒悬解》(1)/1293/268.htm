<tr><td valign="top"><hr /><center><h1>阳明外证二　阳明四</h1></center>
<p><strong>【183】问曰：病有得之一日，不发热而恶寒者，何也？答曰：虽得之一日，恶寒将自罢，即自汗出而恶热也。</strong></p><p>得阳明病之一日，太阳表证未罢，则犹见恶寒，以胃热未盛故也，迟则胃热隆盛，孔窍蒸泄，恶寒将自罢，即自汗出而恶热也。</p>
