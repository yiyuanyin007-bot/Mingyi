<tr><td valign="top"><hr /><center><h1>白虎证四　太阳四十</h1></center>
<p><strong>【169】伤寒，无大热，口燥渴，心烦，背微恶寒者，白虎加<a href="http://www%2E%7A%79%73j.com.cn/zhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>汤主之。</strong></p><p>表解，故无大热。背微恶寒，即前章表有寒也。阳乘阴位，而生里热，则阴乘阳位，而生表寒。远则客于肢节，近则浮于脊背，脊背肢节，皆阳位也。</p>
