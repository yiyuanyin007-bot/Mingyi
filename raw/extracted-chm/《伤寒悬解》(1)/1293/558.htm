<tr><td valign="top"><hr /><center><h1>霍乱　十一章</h1></center>
<p>霍乱者，夏秋之月，食寒饮冷，而外感风寒者也。时令则热，而病因则寒，故仲景立法，则主理中。此与太阳阳明合病之呕利，证同而气异。其外有风寒，内有水邪，中气紊乱，胃逆脾陷，则一也，而彼则热郁而莫泄，此则寒郁而莫容，气不同也。其与三阴之吐利，气同而因异。其俱属里寒，则一也，而彼缘脏气之自动，此缘饮食之郁发，因不同也。究之饮食之寒冷，得伤其脏气，总以其里阳之虚，是又其不同而同者也。</p>
