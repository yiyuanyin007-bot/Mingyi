<tr><td valign="top"><hr /><center><h1>一气独胜</h1></center>
<p>六气和平，则一气不至独胜，诸气败北，一气独胜，故见一腑一脏之病。</p><p>阳莫盛于阳明，阴莫盛于少阴，曰阳明之为病，是少阴水负而趺阳土盛者也，曰少阴之为病，是趺阳土负而少阴水胜者也。</p><p>土胜水负则为顺，水胜土负则为逆。阳明腑病，是土胜之证，三阴脏病，是水胜之证，燮理阴阳，补泻水土之奥，仲景既没，后世庸工，一丝不解也。</p>
