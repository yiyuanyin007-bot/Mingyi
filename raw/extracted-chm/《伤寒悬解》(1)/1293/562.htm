<tr><td valign="top"><hr /><center><h1>霍乱四</h1></center>
<p><strong>【384】下利后，当便硬，硬则能食者愈。今反不能食，到后经中，颇能食，复过一经，能食，过之一日当愈。不愈者，不属阳明也。</strong></p><p>阳明初证，亦有下利呕吐之条，甚似霍乱。但阳明下利后，大便当硬，便硬能食者，六日经尽自愈。若今更不能食，六日经毕不愈，到后一经中，颇能食，是初经不能食，复过一经能食也。如此则十二日后经亦尽，十三日，过后经之一日，必当愈。若不愈者，此不属阳明也。</p><p>此亦借伤寒以辨霍乱。</p>
