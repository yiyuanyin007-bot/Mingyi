<tr><td valign="top"><hr /><center><h1>大柴胡证七　少阳三十</h1></center>
<p><strong>【103】太阳病，过经十余日，反二三下之，后四五日，<a href="http://w%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>证仍在者，先与小<a href="http://w%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤。呕不止，心下急，郁郁微烦者，为未解也，大<a href="http://w%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤下之则愈。</strong>方在少阳十三（方【42】）。</p><p>下后<a href="http://w%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>证仍在，若但有少阳经证而无阳明腑证，先与小<a href="http://w%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤，应当解矣。若呕不止，心下急，郁郁微烦者，是经迫而腑郁，为未解也，与大<a href="http://w%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤下之，经腑双解则愈矣。</p>
