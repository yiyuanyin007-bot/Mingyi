<tr><td valign="top"><hr /><center><h1>脉法六十七</h1></center>
<p><strong>脉浮而迟，面热赤而战栗者，六七日当汗出而解。反发热者，差迟，迟为无阳，不能作汗，其身必痒也。</strong></p><p>脉浮而迟，面色热赤而身体战栗者，阳郁欲发，虚而不能遽发，故面热而身摇。待至六七日，经尽阳复，当汗出而解，若反热者，则解期差迟。以脉迟是为无阳，无阳则但能发热而不能作汗，气郁皮腠，其身必痒也。</p><p>阳复则病愈，阳虚则解迟，阳尽则命绝。此下命绝数章，发明首章阳病见阴脉者死之义。病无阳复而死者，亦无犯尽而生者也。</p>
