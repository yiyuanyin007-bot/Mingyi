<tr><td valign="top"><hr /><center><h1>脉法五十七</h1></center>
<p><strong>脉浮而数，浮为风，数为虚，风为热，虚为寒，风虚相抟，则洒淅恶寒也。</strong></p><p>脉浮而数，浮为风之在表，数为阳虚而阴乘也。风则阳郁而为热，虚则阴束而为寒，风虚相合，阳内闭而为热，则阴外束而为寒，是洒淅恶寒之故也。</p>
