<tr><td valign="top"><hr /><center><h1>咳呕厥逆证七　阳明五十八</h1></center>
<p><strong>【197】阳明病，反无汗而小便利，二三日，咳而呕，手足厥者，必苦头痛。若不咳，不呕，手足不厥者，头不痛。</strong></p><p>无汗则阳气内虚，小便利则阳气下虚，经所谓水泉不止者，是膀胱不藏也。《素问》语。二三日后，胃阳愈虚，气逆咳呕，手足厥冷，浊气上壅，必苦头痛。不咳，不呕，手足不厥逆者，浊气未逆，故头不痛。</p>
