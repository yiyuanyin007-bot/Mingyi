<tr><td align="left">风寒总纲二　太阳三</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>风寒总纲二　太阳三</h1></center>
<p><strong>【11】病人身大热，反欲得近衣者，热在皮肤，寒在骨髓也，身大寒，反不欲近衣者，寒在皮肤，热在骨髓也。</strong></p><p>申明上章寒热之义。</p><p>阴盛则内寒外热，内寒，故欲近衣。阳盛则内热外寒，内热，故不欲近衣。以其欲、不欲，而内外之寒热见焉，经所谓临病人问所便也。（《素问》语）。</p><p>上章发热恶寒、无热恶寒者，言其外也。风伤卫者多内热，寒伤营者多外寒，恐人略内而详外，故发此章。</p>
