<tr><td valign="top"><hr /><center><h1>脉法二十五</h1></center>
<p><strong>寸口脉弱而迟，弱者卫气微，迟者营中寒。营为血，血寒则发热，卫为气，气微者心内饥，饥而虚满，不能食也。</strong></p><p>寸口脉弱而迟，弱者卫气之微，迟者营中之寒。营为血，血寒则温气外泄而发热，卫为气，气微则心内空虚而若饥。然阳虚气滞，胃口痞满，虽饥而不能食也。</p>
