<tr><td valign="top"><hr /><center><h1>湿病　九章</h1></center>
<p>湿有内外之殊，外感则入经络而流关节，内伤则由脏腑而归脾肾。湿为土气，土居水火之中，水阴而火阳，阴阳交感，水火相蒸，则生湿气。火盛则湿化而为热，水盛则湿化而为寒。湿热者，治以燥凉，湿寒者，治以燥温，在脏腑者，利其水道，在经络者，开其汗孔，湿病之能事毕矣。</p>
