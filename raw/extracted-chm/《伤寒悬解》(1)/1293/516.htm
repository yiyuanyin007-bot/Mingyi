<tr><td valign="top"><hr /><center><h1>死证四　厥阴三十四</h1></center>
<p><strong>【343】伤寒六七日，脉微，手足厥冷，烦躁，灸厥阴，厥不还者，死。</strong></p><p>六七日，病传厥阴之时，脉微欲绝，手足厥冷，是<a href="http://www.z%79%73%6A.com.cn/zhongyaocai/yaocai_d/danggui.html" target="_blank" title="中药材：当归">当归</a>四逆之证。而加以烦躁，则微阳欲脱。灸厥阴经穴，以复其阳。而厥冷不回，则阳已绝根，必死不救也。</p>
