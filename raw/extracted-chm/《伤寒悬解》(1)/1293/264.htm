<tr><td valign="top"><hr /><center><h1>阳明经提纲一　阳明一</h1></center>
<p><strong>【180】阳明之为病，胃家实是也。</strong></p><p>胃者，阳明之腑，阳明之为病，全缘胃家之阳实。阳实则病至阳明，腑热郁发，病邪归胃，而不复他传，非他经之不病也。三阳之阳，莫盛于阳明，阳明之邪独旺，不得属之他经也。胃家之实，而病归胃腑，终始不迁，故曰阳明之为病。若胃阳非实，则今日在阳明之经，明日已传少阳之经，后日已传太阴之经，未可专名一经，曰阳明之为病也。</p>
