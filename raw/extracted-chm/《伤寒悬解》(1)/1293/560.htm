<tr><td valign="top"><hr /><center><h1>霍乱二</h1></center>
<p><strong>【383】问曰：病发热、头痛、身疼、恶寒、吐利者，此属何病？答曰：此名霍乱，自吐下，利止复更发热也。</strong></p><p>表寒外束，故发热、恶寒、头痛、身疼。利止发热者，表里寒盛，经阳郁遏也。</p>
