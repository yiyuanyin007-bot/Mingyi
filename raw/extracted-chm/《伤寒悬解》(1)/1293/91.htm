<tr><td valign="top"><hr /><center><h1>脉法七十三</h1></center>
<p><strong>伤寒咳逆上气，其脉散者死，谓其形损故也。</strong></p><p>咳逆上气，是胃土上逆，肺金不降。肺主气而性收，脉散者，金气之不收也，气败则死。盖气所以熏肤而充身，气散则骨枯肉陷而形损故也。</p>
