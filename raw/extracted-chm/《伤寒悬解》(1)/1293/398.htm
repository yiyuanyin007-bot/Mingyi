<tr><td valign="top"><hr /><center><h1>少阳坏病结胸痞证　五章</h1></center>
<p>病在少阳，或入阳明之腑，或入太阴之脏。将入阳明，而经证未罢，下早则为结胸，将入太阴，误下则为痞，与太阳之结胸、痞证由来正同也。</p>
