<tr><td valign="top"><hr /><center><h1>可下五</h1></center>
<p><strong>【　】下利脉反滑，当有所去，下之乃愈，宜大承气汤。</strong>方在阳明二十一。</p><p>内有宿物，沉取而脉反涩，必浮取而脉反滑。缘宿物郁碍，阳气外浮，不交于阴，而无阴气之翕聚，故令脉滑。滑即上章浮大之义。</p>
