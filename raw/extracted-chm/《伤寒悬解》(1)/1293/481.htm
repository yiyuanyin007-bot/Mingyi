<tr><td valign="top"><hr /><center><h1>提纲　一章</h1></center>
<p>厥阴脏气，自下上行，病则怒气郁升，心受其害，于是冲心疼热之证作，胃被其贼，于是吐蛔不食之病生。升令不遂，风木遏陷，于是脾蒙其虐，而泄利不止。其消渴疼热者，上热也，是阳复发热之根，下利不止者，下寒也，是阴盛发厥之本。只此数证，而厥阴之病皆备矣。</p><p>厥阴、少阳之经，同布于胁肋，少阳之病在经，故有胸胁之证，厥阴之病在脏，故有吐利之邪。吐为胃病，设吐之则胃气更伤，当吐逆而莫禁，利为脾病，故下之则脾气更败，乃洞泄而不止也。</p>
