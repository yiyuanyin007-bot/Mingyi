<tr><td align="left">附子证五　少阴六</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>附子证五　少阴六</h1></center>
<p><strong>【305】少阴病，身体疼，手足寒，骨节痛，脉沉者，附子汤主之。</strong></p><p>少阴水旺，阴凝气滞，故骨节疼痛。土败水侮，四肢失温，故手足寒冷。水寒木陷，生气欲绝，故脉沉细。附子汤，附子温癸水之寒，芍药清乙木之风，参、术、<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_f/fuling.html" target="_blank" title="中药材：茯苓">茯苓</a>，培土而泻水也。</p><p><strong>【附子汤】八十五　（方【90】）</strong></p><p><strong>【90】附子汤</strong></p><p>附子<em>炮，去皮，破八片，二枚</em>　<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_f/fuling.html" target="_blank" title="中药材：茯苓">茯苓</a><em>三两</em>　<a href="http://w%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a><em>二两</em>　<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_b/baishu.html" target="_blank" title="中药材：白术">白术</a><em>四两</em>　芍药<em>三两</em></p><p><em>上五味，以水八升。煮取三升，去滓，温服一升，日三服。</em></p>
