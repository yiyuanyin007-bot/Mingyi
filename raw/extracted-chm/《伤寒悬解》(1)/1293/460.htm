<tr><td valign="top"><hr /><center><h1>死证三　少阴三十二</h1></center>
<p><strong>【298】少阴病，四逆，恶寒而身蜷，脉不至，不烦而躁者，死。</strong></p><p>四逆，恶寒而身蜷，阴盛极矣，脉又不至，则阳气已绝，如是则不烦而躁者，亦死。盖阳升则烦，阳脱则躁，阳中之阳已亡，是以不烦，阴中之阳欲脱，是以躁也。</p><p>阴气者，静则神藏，躁则消亡。《素问》语。盖神发于阳而根藏于阴，精者，神之宅也，水冷精寒，阳根欲脱，神魂失藏，是以反静而为躁也。</p>
