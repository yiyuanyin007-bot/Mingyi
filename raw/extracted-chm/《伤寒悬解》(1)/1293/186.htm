<tr><td valign="top"><hr /><center><h1>火逆助邪证十三　太阳六十八</h1></center>
<p><strong>【116】脉浮，宜以汗解，用火灸之，邪无从出，因火而盛，病从腰以下必重而痹，名火逆也。</strong></p><p>脉浮，宜以汗解，乃用火灸之，邪无从出，因外火而更盛，病从腰以下必重浊而痹塞，此名火逆。</p>
