<tr><td valign="top"><hr /><center><h1>脉法二十二</h1></center>
<p><strong>寸口脉微而涩，微者卫气衰，涩者营气不足，卫气衰，面色黄，营气不足，面色青。营为根，卫为叶，营卫俱微，则根叶枯槁而寒栗，咳逆睡腥吐涎沫也。</strong></p><p>寸口脉微而涩，微者，卫气之衰，涩者，营气之不足。卫生于胃，卫衰则戊土虚而面色黄，营藏于肝，营不足则乙木枯而面色青。营为卫根，卫为营叶，营卫俱微，则根叶枯槁而寒栗，咳逆唾腥吐涎诸证皆作，以土败不能生金故也。</p>
