<tr><td valign="top"><hr /><center><h1>脉法上篇提纲</h1></center>
<p>脉气流行，应乎漏刻。呼吸有数，动静无差，是为平脉。一有病作，而浮、沉、迟、数、大、小、滑、涩诸变生焉，乖常失度，偏而不和。始于毫厘之参差，成于度量之悬隔。</p><p>仲景脉法，自微而著，由始及终，精粗悉具，洪纤毕陈，可谓法全而意备矣。而其变化纷纭，绝态殊状，总不出此一章中，盖下穷其委，而此约其要也。</p>
