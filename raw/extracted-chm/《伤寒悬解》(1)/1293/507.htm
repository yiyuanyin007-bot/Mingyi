<tr><td valign="top"><hr /><center><h1>吴茱萸证二十五　厥阴二十六</h1></center>
<p><strong>【378】干呕，吐涎沫，头痛者，吴茱萸汤主之。</strong>方在阳明六十（方【81】）。</p><p>胃气上逆，浊阴涌泛，则生干呕。胃逆肺阻，清气堙郁，则化痰涎。胃逆而胆火升炎，津液涌沸，则沫生焉，譬犹汤沸而沫起也。胃逆而浊阴升塞，头上气滞，故痛生焉。是少阳、阳明之病，而见之厥阴者，肝胆同气也。缘肝脾寒陷，故胆胃冲逆如此，宜吴茱萸汤，参、甘，补中而培土，茱、姜，温寒而降逆也。</p>
