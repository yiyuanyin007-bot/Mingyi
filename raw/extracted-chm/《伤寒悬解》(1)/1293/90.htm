<tr><td align="left">脉法七十二</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>脉法七十二</h1></center>
<p><strong>师曰：寸脉下不至关为阳绝，尺脉上不至关为阴绝，此皆不治，决死也。若计其余命生死之期，期以月节，克之也。</strong></p><p>尺寸之脉，发现于上下，而气根于中焦。中焦者，所以升降阴阳而使之相交，其脉现于关上。若寸脉下不至关，则阳根下断，是谓阳绝，尺脉上不至关，则阴根上断，是谓阴绝，此皆不治，决死也。此际虽生，命之余耳。若计算其余命生死之期，期以月之节气。克之，如木弱忌金，火弱忌水，一交金水之节气，则死期至矣。</p>
