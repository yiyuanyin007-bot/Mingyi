<tr><td valign="top"><hr /><center><h1>脉法四十</h1></center>
<p><strong>问曰：曾为人所难，紧脉从何而来？师曰：假令亡汗若吐，以肺里寒，故令脉紧也。假令咳者，坐饮冷水，故令脉紧也。假令下利，以胃中虚冷，故令脉紧也。</strong></p><p>汗吐伤其胸中之阳，肺寒则脉紧也。咳者，中寒而胃逆，下利者，中寒而脾陷，冷水下利，泻其胃阳，则脉紧也。</p>
