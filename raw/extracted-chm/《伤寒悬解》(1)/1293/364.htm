<tr><td valign="top"><hr /><center><h1>小柴胡证七　少阳八</h1></center>
<p><strong>【37】太阳病，十日已去，脉浮细而嗜卧者，外已解也，设胸满腹痛者，与小<a href="http://w%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤，脉但浮者，与麻黄汤。</strong>方在太阳二十（方【18】）。</p><p>太阳病，十日以外，脉浮细而嗜卧者，是太阳之外证已解也。表邪离太阳而入少阳，故浮紧变而为浮细，少阳之脉弦细也，胆热者善眠，是其嗜卧，必入少阳。设其胸满胁痛者，又见少阳经证，宜与小<a href="http://w%77%77%2E%7A%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤。若脉但浮而不细者，则未入少阳，而犹是太阳，宜与麻黄汤也。</p>
