<tr><td align="left">白虎证二　太阳三十八</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>白虎证二　太阳三十八</h1></center>
<p><strong>【176】伤寒，脉浮滑，此里有热表有寒也，白虎汤主之。</strong></p><p>此申明上章未显之义。脉滑者，里有热也，厥者，表有寒也。此不言厥者，诊脉浮滑，已知是表寒外束，里热内郁，不必问其肢节之厥热矣。若里热外发，则脉变实缓，不复浮滑也。浮滑者，阳气郁格之象也。此之表寒，乃阴气之外浮，非寒邪之外淫，不然，表寒未解，无用白虎之理。</p>
