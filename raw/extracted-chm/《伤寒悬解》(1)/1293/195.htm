<tr><td valign="top"><hr /><center><h1>汗后吐逆证六　太阳七十六</h1></center>
<p><strong>【122】病人脉数，数为热，当消谷引食，而反吐者，此以发汗令阳气微，膈气虚，脉乃数也。数为客热，不能消谷，以胃中虚冷，故吐也。</strong></p><p>阴阳互根，阳虚脱根，升浮于上，是以脉数。数为客热升浮，不能消化水谷，故作呕吐，缘其阳亡而胃中虚冷也。</p>
