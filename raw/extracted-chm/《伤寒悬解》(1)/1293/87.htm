<tr><td valign="top"><hr /><center><h1>脉法六十九</h1></center>
<p><strong>脉浮而洪，身汗如油，喘而不休，水浆不下，形体不仁，乍静乍乱，此为命绝也。</strong></p><p>脉浮而洪，阳不根阴也。身汗如油，《<a href="http://www.zysj.com%2E%63%6E/lilunshuji/nanjing/index.html" target="_blank" title="中医书籍：难经">难经</a>》所谓绝汗乃出，（引《灵枢》语），大如贯珠，转出不流也。喘而不休，气不归根也。水桨不下，胃气败也。形体不仁，营卫之败也。乍静乍乱，神明之败也。</p>
