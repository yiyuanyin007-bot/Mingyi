<tr><td align="left">不可汗下四</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>不可汗下四</h1></center>
<p><strong>【　】伤寒，发热头痛，微汗出，发汗则不识人，熏之则喘，不得小便，心腹满，下之则短气，小便难，头痛背强。加温针则衄。</strong></p><p>发热头痛，微汗出，证与前同。发汗败其阳神，故不识人。熏之伤其肺气，故喘。气不化水，故不得小便。湿气不泄，故心腹胀满。下之阳亡湿盛，浊气升塞，则短气而小便难，头疼而脊背强。温针烁其营血，则血升而鼻衄。总之，阳虚之家，汗、下、温针，俱非宜也。</p>
