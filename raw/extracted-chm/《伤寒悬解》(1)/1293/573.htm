<tr><td align="left">差后劳复三</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>差后劳复三</h1></center>
<p><strong>【395】大病差后，从腰以下有水气者，<a href="http://www.z%79%73%6A.com.cn/zhongyaocai/yaocai_m/muli.html" target="_blank" title="中药材：牡蛎">牡蛎</a><a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_z/zexie.html" target="_blank" title="中药材：泽泻">泽泻</a>散主之。</strong></p><p>病后上虚，不能制水，从腰以下有水气者，肾阴之盛也。<a href="http://www.z%79%73%6A.com.cn/zhongyaocai/yaocai_m/muli.html" target="_blank" title="中药材：牡蛎">牡蛎</a><a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_z/zexie.html" target="_blank" title="中药材：泽泻">泽泻</a>散，<a href="http://www.z%79%73%6A.com.cn/zhongyaocai/yaocai_m/muli.html" target="_blank" title="中药材：牡蛎">牡蛎</a>、栝蒌，清金而泻湿，蜀漆、<a href="http://w%77%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_h/haizao.html" target="_blank" title="中药材：海藻">海藻</a>，排饮而消痰，<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_z/zexie.html" target="_blank" title="中药材：泽泻">泽泻</a>、葶苈、<a href="http://www.z%79%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_s/shanglu.html" target="_blank" title="中药材：商陆">商陆</a>，决郁而泻水也。</p><p><strong>〖<a href="http://www.z%79%73%6A.com.cn/zhongyaocai/yaocai_m/muli.html" target="_blank" title="中药材：牡蛎">牡蛎</a><a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_z/zexie.html" target="_blank" title="中药材：泽泻">泽泻</a>散〗百十一　（方【112】）</strong></p><p><strong>【112】<a href="http://www.z%79%73%6A.com.cn/zhongyaocai/yaocai_m/muli.html" target="_blank" title="中药材：牡蛎">牡蛎</a><a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_z/zexie.html" target="_blank" title="中药材：泽泻">泽泻</a>散</strong></p><p><a href="http://www.z%79%73%6A.com.cn/zhongyaocai/yaocai_m/muli.html" target="_blank" title="中药材：牡蛎">牡蛎</a><em>熬</em>　<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_z/zexie.html" target="_blank" title="中药材：泽泻">泽泻</a>　蜀漆<em>暖水洗去腥</em>　葶苈子<em>熬</em>　<a href="http://www.z%79%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_s/shanglu.html" target="_blank" title="中药材：商陆">商陆</a>根<em>熬</em>　<a href="http://w%77%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_h/haizao.html" target="_blank" title="中药材：海藻">海藻</a><em>洗去咸</em>　栝蒌根　<em>各等分</em></p><p><em>上七味，异捣，下筛为散；更于臼中治之，白饮和服方寸匕，日三服。小便利，止后服。</em></p>
