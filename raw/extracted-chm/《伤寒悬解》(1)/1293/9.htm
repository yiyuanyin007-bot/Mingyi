<tr><td valign="top"><hr /><center><h1>寒热死生</h1></center>
<p>温病在脏在腑，总是内热，伤寒中风，原无内热，脏腑和平，寒热不偏，营卫不至内陷，故六经既尽，自能汗解。阳盛则腑热内作，从此但热而不寒，阴盛则脏寒里动，从此但寒而不热。入腑入脏，则营卫内陷，死机攸伏，解无定期矣。</p><p>阳盛而腑热则吉，其死者，阳亢而失下也，阴盛而脏寒则凶，其生者，阴退而用温也。阳生阴杀，显见之理。后世庸工，乃至滋阴而伐阳，泻火而补水。一临伤寒，先有传经为热之语横塞胸中，至于证脉阴阳，丝毫不解，人随药死，枉杀多矣，</p>
