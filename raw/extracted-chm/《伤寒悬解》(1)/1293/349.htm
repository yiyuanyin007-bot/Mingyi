<tr><td valign="top"><hr /><center><h1>茵陈蒿证二十八　阳明七十九</h1></center>
<p><strong>【236】阳明病，发热汗出者，此为热越，不能发黄也。但头汗出，身无汗，齐颈而还，小便不利，渴饮水浆者，此为瘀热在里，身必发黄，<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_y/yinchen.html" target="_blank" title="中药材：茵陈">茵陈</a>蒿汤主之。</strong>方在太阴十二（方【80】）。</p><p>汗出而湿热发泄，则不发黄。但头汗而身无汗，湿热莫泄，而小便又复不利，故身必发黄。<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_y/yinchen.html" target="_blank" title="中药材：茵陈">茵陈</a>蒿汤，<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_y/yinchen.html" target="_blank" title="中药材：茵陈">茵陈</a>利水而泻湿，栀子、<a href="http://www.zysj.co%6D%2E%63%6E%2Fzhongyaocai/yaocai_d/daihuang.html" target="_blank" title="中药材：大黄">大黄</a>，除烦而荡热也。</p>
