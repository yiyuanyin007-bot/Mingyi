<tr><td valign="top"><hr /><center><h1>不可下一</h1></center>
<p><strong>【　】脉濡而弱，弱反在关，濡反在巅，微反在上，涩反在下。微则阳气不足，涩则无血，阳气反微，中风汗出，而反躁烦，涩则无血，厥而且寒。阳微不可下，下之则心下痞硬。</strong></p><p>上之阳气不足，下之无血，总是阳微，下之阳败胃逆，浊气填塞，则心下痞硬。</p>
