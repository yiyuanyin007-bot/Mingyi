<tr><td valign="top"><hr /><center><h1>脉法六十八</h1></center>
<p><strong>寸口脉微，尺脉紧，其人虚损多汗，知阴常在，绝不见阳也。</strong></p><p>寸口脉微，阳气衰也，尺脉紧，阴气盛也，虚损多汗，卫败而不敛也。脉证见此，是绝阴而无阳也。</p>
