<tr><td valign="top"><hr /><center><h1>小柴胡证三十一　阳明八十二</h1></center>
<p><strong>【229】阳明病，发潮热，大便溏，小便自可，胸胁满不去者，小<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤主之。</strong>方在少阳二（【19】）。</p><p>阳明胃腑，为少阳经邪所郁，阳气遏逼，故发潮热。糟粕莫容，故便滑溏。胃逆胆壅，经气不降，故胸胁满结。宜小<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤，半补阳明之里气，半泻少阳之表邪也。</p>
