<tr><td valign="top"><hr /><center><h1>忌栀子证二十一　太阳九十一</h1></center>
<p><strong>【81】凡用栀子汤，病人旧微溏者，不可与服之。</strong></p><p>栀子苦寒之性，泻脾胃而滑大肠，凡用栀子诸汤，设病人旧日脾阳素虚，大便微溏者，不可与服也。</p>
