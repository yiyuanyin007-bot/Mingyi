<tr><td valign="top"><hr /><center><h1>桃花汤证二十六　少阴二十七</h1></center>
<p><strong>【306】少阴病，下利便脓血者，桃花汤主之。</strong></p><p>少阴水脏，下利而便脓血，总是湿寒，万无湿热之理，桃花汤实为主方，不可易也。</p>
