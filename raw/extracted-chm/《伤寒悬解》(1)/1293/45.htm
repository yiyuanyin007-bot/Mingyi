<tr><td align="left">脉法二十九</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>脉法二十九</h1></center>
<p><strong>趺阳脉浮，浮则为虚，虚浮相抟，故令气食訇，言胃气虚竭也。脉滑则为哕。此为医咎，责虚取实，守空迫血。脉浮，鼻中燥者，必衄也。</strong></p><p>趺阳脉浮，浮则为虚，虚浮相抟，故令气食訇，缘胃气虚竭，则痞塞不通也。若脉滑，则胃气上逆而为哕。此为医工之咎，以浮则为虚，反责其内虚以为实，而下以取之，浮则无血，反守其中空以为满，而汗以遏之，阳亡阴升，填塞清道，故非噎即哕也。若脉浮，鼻中干燥者，必将为衄，以中虚而气逆，故血随气升而为衄也。</p>
