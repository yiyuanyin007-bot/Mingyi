<tr><td valign="top"><hr /><center><h1>可下一</h1></center>
<p><strong>【　】下利，三部脉皆平，按之心下硬者，急下之，宜大承气汤。</strong>方在阳明二十一。</p><p>寸大于关，关大于尺，人之常也，是以三部脉不平。三部皆平，是乙木郁于尺中，不能上达，故尺与关平，甲木郁于关上，不能下达，故关与寸平。乙木陷则少腹胀满，甲木逆则心下痞硬，关尺弦浮，肝胆俱病。若按之少腹满者，是乙木之陷，土湿木郁，不可下也，若按之心下硬者，是甲木之逆，土燥火炎，当急下之。盖脾经壅迫，胃腑郁遏，水谷莫容，故见下利。宜大承气汤，泻其腑中之郁遏也。</p>
