<tr><td valign="top"><hr /><center><h1>热入血室三　少阳二十一</h1></center>
<p><strong>【145】妇人伤寒，发热，经水适来，昼日明了，暮则谵语，如见鬼状者，此为热入血室，无犯胃气及上二焦，必自愈。</strong></p><p>妇人伤寒，发热，而值经水适来之时，昼日清白明了，暮则谵语，如见鬼状者，此为热入血室。以血为阴，夜则阳气潜入阴分，血热发作，故谵妄不明也。热邪在下，治之勿犯中焦胃气及上焦清气，必自愈也。</p>
