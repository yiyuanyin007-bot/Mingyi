<tr><td valign="top"><hr /><center><h1>发汗亡阳证九　少阴十</h1></center>
<p><strong>【286】少阴病，脉微，不可发汗，亡阳故也。阳已虚，尺脉弱涩者，复不可下之。</strong></p><p>阳虚故脉微，脉微发汗，则阳根亦亡，是以不可发汗。阳气已虚，而尺脉弱涩者，则血中之温气非旺，复不可下之也。</p>
