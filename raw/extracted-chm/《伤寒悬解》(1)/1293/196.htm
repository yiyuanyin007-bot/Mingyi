<tr><td valign="top"><hr /><center><h1>吐后生烦证七　太阳七十七</h1></center>
<p><strong>【121】太阳病，吐之，但太阳病，当恶寒，今反不恶寒，不欲近衣，此为吐之内烦也。</strong></p><p>太阳病，伤寒、中风，表邪外闭，营卫不达，当见恶寒。吐伤胃气，里阳上逆，外达皮毛，故反不恶寒，而欲去衣被。此为吐之令阳火离根，而内烦故也。</p>
