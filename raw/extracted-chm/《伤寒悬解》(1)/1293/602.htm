<tr><td valign="top"><hr /><center><h1>不可下二</h1></center>
<p><strong>【　】脉濡而弱，弱反在关，濡反在巅，弦反在上，微反在下。弦为阳运，微为阴寒，上实下虚，意欲得温。微弦为虚，虚者，不可下也。</strong></p><p>寸口之弦，尺中之微，总因中焦阳虚，不可发汗，亦不可下也。</p>
