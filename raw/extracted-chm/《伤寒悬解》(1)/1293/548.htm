<tr><td valign="top"><hr /><center><h1>湿病四</h1></center>
<p><strong>【　】湿家下之，额上汗出，微喘，小便利者，死，若下利不止者，亦死。</strong></p><p>湿家之证，不可下也。下之额上汗出，微喘，则气脱于上矣，小便利，下利不止，则气脱于下矣，上下俱脱，是死证也。</p>
