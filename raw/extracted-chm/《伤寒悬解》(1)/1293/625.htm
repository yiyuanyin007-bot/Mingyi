<tr><td valign="top"><hr /><center><h1>可吐一</h1></center>
<p><strong>【　】病人手足厥冷，脉乍结，以客气在胸中，心下满而烦，欲食不能食者，病在胸中，当吐之。</strong></p><p>手足厥冷，脉乍结代，此以下焦浊气，客居胸中，心下胀满而烦生。欲食不能食者，病在胸中，阻碍气道故也。此当吐之。</p>
