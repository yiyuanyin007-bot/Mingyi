<tr><td valign="top"><hr /><center><h1>厥热胜复证四　厥阴五</h1></center>
<p><strong>【336】伤寒厥五日，热亦五日，设六日当复厥，不厥者自愈。厥终不过五日，以热五日，故知自愈。</strong></p><p>阴胜而厥者五日，阳复而热者亦五日，设至六日，则阴当又胜而复厥。阴胜则病进，复厥者，病必不愈，若不厥者，则阴不偏胜，必自愈也。盖天地之数，五日一候，则气化为之一变，是以阴胜而厥，终不过乎五日。阴胜而阳不能复，则病不愈，以阳复而热者，亦是五日，阴不偏胜，而阳不偏负，故知自愈。</p>
