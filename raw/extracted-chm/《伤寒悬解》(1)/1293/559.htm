<tr><td valign="top"><hr /><center><h1>霍乱一</h1></center>
<p><strong>【382】问曰：病有霍乱者何？答曰：呕吐而利，是名霍乱。</strong></p><p>食寒饮冷，水谷不消，外感风寒，则病霍乱。脾胃以消化为能，水谷消化，旧者下传而新者继入，中气运转，故吐利不作。水谷不消，在上脘者，则胃逆而为吐，在下脘者，则脾陷而为利。或吐或利，不并作也，若风寒外束，经迫腑郁，则未消之饮食，不能容受，于是吐利俱作。盖胃本下降，今上逆而为吐，脾本上升，今下陷而为利，是中气忽然而紊乱也，故名曰霍乱。</p>
