<tr><td valign="top"><hr /><center><h1>桂枝证七　太阳十一</h1></center>
<p><strong>【42】太阳病，外证未解，脉浮弱者，当以汗解，宜<a href="http://www.z%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤。</strong></p><p>太阳病，失于解表，经热不泄，则自表达里。然里证虽成，而外证不能自解，凡脉见浮弱者，犹当汗解，宜<a href="http://www.z%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤也。外解后，审有里证，乃可议下耳。</p><p>脉浮弱，即前章阳浮阴弱之义。</p>
