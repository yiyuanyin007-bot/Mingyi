<tr><td valign="top"><hr /><center><h1>腹痛欲利证十九　厥阴二十</h1></center>
<p><strong>【358】伤寒四五日，腹中痛，若转气下趋少腹，此欲自利也。</strong></p><p>四五日，将传厥阴，土湿木遏，肝气不达，侵克脾土，故腹中作痛。若雷鸣气转，下趋少腹者，此湿寒下旺，肝脾俱陷，风木贼土，疏泄失藏，故欲自利也。</p>
