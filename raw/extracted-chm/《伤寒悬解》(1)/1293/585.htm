<tr><td valign="top"><hr /><center><h1>不可汗四</h1></center>
<p><strong>【　】诸脉得数动微弱者，不可发汗，发汗则大便难，腹中干，胃燥而烦，其形相象，根本异源。</strong></p><p>数动者，阳气之盛，微弱者，阴血之虚。汗则阴血愈亡，故便难腹干，胃燥而烦。阴盛者，汗则亡阳，而阳盛者，汗则亡阴，其烦躁之形状，虽甚相象，而其亡阳亡阴之根本，则源委不同也。</p>
