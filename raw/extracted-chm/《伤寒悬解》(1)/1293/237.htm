<tr><td valign="top"><hr /><center><h1>大陷胸证二　太阳百十二</h1></center>
<p><strong>【135】伤寒六七日，结胸热实，脉沉而紧，心下痛，按之石硬者，大陷胸汤主之。</strong></p><p>伤寒六七日后，结胸而膈热内实，心下满痛，按之如石之硬者，是真大陷胸证也。</p><p>结胸之脉，寸浮而关沉，后章寸脉浮，关脉沉，名曰结胸是也。脉沉而紧，指关上言，抵当汤证，脉微而沉，反不结胸，盖结胸之脉，关上必沉也。后章：小结胸病，正在心下，脉浮滑者，太阳病下之，脉浮者，必结胸也，皆指寸脉言。</p>
