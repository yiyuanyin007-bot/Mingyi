<tr><td valign="top"><hr /><center><h1>不可汗十四</h1></center>
<p><strong>【85】疮家，虽身疼痛，不可发汗，汗出则痉。</strong></p><p>疮家，脓血损伤，再以汗伤其血，则筋脉挛缩而病痉。</p>
