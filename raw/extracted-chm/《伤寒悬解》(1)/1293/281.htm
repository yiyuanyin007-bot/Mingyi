<tr><td valign="top"><hr /><center><h1>麻黄证三　阳明十五</h1></center>
<p><strong>【36】太阳与阳明合病，喘而胸满者，不可下，宜麻黄汤。</strong></p><p>太阳与阳明合病，经迫腑郁，胃逆肺胀，故喘而胸满。宜麻黄汤，麻黄发表而散寒，杏仁降逆而止喘，不可下也。</p>
