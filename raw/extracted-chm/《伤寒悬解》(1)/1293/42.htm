<tr><td valign="top"><hr /><center><h1>脉法二十六</h1></center>
<p><strong>趺阳脉伏而涩，伏则吐逆，水谷不化，涩则食不得入，名曰关格。</strong></p><p>趺阳脉伏而涩，伏则胃虚，不能化谷而吐逆，涩则胃逆，不能纳谷而食不得入，名曰关格。水谷不化而吐逆，是反胃之病，食不得入而噎塞，是膈噎之病。伏者胃气之郁伏，阳衰于下，故不化谷，涩者胃气之凝涩，阴填于上，故不纳食。</p>
