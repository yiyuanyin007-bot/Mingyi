<tr><td align="left">脉法四十二</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>脉法四十二</h1></center>
<p><strong>寸口脉缓而迟，缓则阳气长，其色鲜，其颜光，其声商，毛发长，迟则阴气盛，骨髓生，血满，肌肉紧薄鲜硬，阴阳相抱，营卫俱行，刚柔相得，名曰强也。</strong></p><p>寸口脉缓而迟，缓为卫盛，缓则阳气长进，其色鲜明，其颜光润，其声清越，其毛发修长，迟为营盛，迟则阴气盛盈，骨髓滋生，血海充满，肌肉紧薄鲜硬。如是则阴阳相抱而不离，营卫俱行而无阻，是刚柔之相得。名曰强也。</p>
