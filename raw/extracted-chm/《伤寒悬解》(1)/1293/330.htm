<tr><td align="left">吴茱萸证九　阳明六十</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>吴茱萸证九　阳明六十</h1></center>
<p><strong>【243】食谷欲呕者，属阳明也，吴茱萸汤主之。得汤反剧者，属上焦。</strong></p><p>土败胃逆，则作呕吐，食谷欲吐者，属阳明也。吴茱萸汤，<a href="http://www.z%79%73%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>、<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_d/dazao.html" target="_blank" title="中药材：大枣">大枣</a>培土而补中，茱萸、<a href="http://www.zy%73%6A%2E%63%6Fm.cn/zhongyaocai/yaocai_s/shengjiang.html" target="_blank" title="中药材：生姜">生姜</a>温胃而降逆。若得汤反剧者，则由上焦之痞热，非关中焦之虚寒也。</p><p><strong>〖吴茱萸汤〗六十三　（方【81】）</strong></p><p><strong>【81】吴茱萸汤</strong></p><p>吴茱萸<em>洗，一升</em>　<a href="http://www.z%79%73%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a><em>三两</em>　<a href="http://www.zy%73%6A%2E%63%6Fm.cn/zhongyaocai/yaocai_s/shengjiang.html" target="_blank" title="中药材：生姜">生姜</a><em>切，六两</em>　<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_d/dazao.html" target="_blank" title="中药材：大枣">大枣</a><em>擘，十二枚</em></p><p><em>上四味，以水七升，煮取二升，去滓，温服七合。日三服。</em></p>
