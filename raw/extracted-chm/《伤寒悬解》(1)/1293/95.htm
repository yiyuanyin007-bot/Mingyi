<tr><td valign="top"><hr /><center><h1>脉法七十七</h1></center>
<p><strong>设令向壁卧，闻师到，不惊起而盼视，若三言三止，脉之咽唾者，此诈病也。设令脉自和，处言汝病太重，当须服吐下药，针灸数十百处，乃愈。</strong></p><p>向壁安卧，是无病邪，闻师到，不惊起而盼视，若三言三止，脉之咽唾者，此诈病也。设令脉自和平，亦处言汝病太重，当须服大吐大下之药，针灸数十百处，以恐怖之，则立言自愈矣。</p>
