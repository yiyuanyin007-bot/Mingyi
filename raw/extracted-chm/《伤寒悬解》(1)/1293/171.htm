<tr><td valign="top"><hr /><center><h1>太阳坏病提纲一　太阳五十四</h1></center>
<p><strong>【16】太阳病三日，已发汗，若吐，若下，若温针，仍不解者，此为坏病，<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>不中与也，观其脉证，知犯何逆，随证治之。</strong></p><p>太阳病，治之得法，当解于本经，不至入腑传脏，而成坏病。若至三日之久，已经发汗、吐、下、温针诸治，而病不解，则不在太阳，定缘误治，入别经而成坏病。当观其脉证，知其所犯何逆，随证治之。曰坏病者，非太阳之本病故也。</p>
