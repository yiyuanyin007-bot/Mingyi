<tr><td valign="top"><hr /><center><h1>小承气证十一　阳明三十</h1></center>
<p><strong>【214】阳明病，谵语，发潮热，脉滑而疾者，小承气汤主之。因与承气一升，腹中转失气，更服一升，若不转失气，勿更与之。明日不大便，脉反微涩者，里虚也，为难治，不可更与承气汤也。</strong></p><p>脉滑而疾者，血热而阳旺也。脉反微涩者，血寒而阳虚也。</p>
