<tr><td valign="top"><hr /><center><h1>太阳伤寒小青龙证　三章　太阳入太阴、少阴去路</h1></center>
<p>中风大青龙之证，外有风而内有热也，伤寒之小青龙证，表有寒而里有水也。大小青龙，外之解表则同，而内之温清大异，大青龙可以泻里热而不可以温内寒，小青龙所以佐大青龙之不逮也。</p><p>伤寒之人，或表邪外郁而宿水里发，或渴饮凉水而停留不消，是以多有水气之证。以其热渴，双解表里之寒，小青龙乃不易之法也。</p>
