<tr><td valign="top"><hr /><center><h1>调胃承气证九　太阳六十四</h1></center>
<p><strong>【70】发汗后，恶寒者，虚故也。不恶寒，反恶热者，实也，当和胃气，与调胃承气汤。</strong>方在阳明二十（方【13】）。</p><p>阳虚之人，汗则亡阳，阴虚之人，汗则亡阴。汗后恶寒者，气泄而阳虚故也，故防入少阴，不恶寒，反恶热者，津伤而阳实故也，是已入阳明，将成大承气证，宜早以调胃承气和其胃气，预夺其实也。</p>
