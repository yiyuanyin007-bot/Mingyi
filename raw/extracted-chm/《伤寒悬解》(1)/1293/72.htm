<tr><td align="left">脉法五十四</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>脉法五十四</h1></center>
<p><strong>伤寒，发热，啬啬恶寒，大渴欲饮水，其腹必满，自汗出，小便利，其病欲解，此肝乘肺也，名曰横，刺期门。</strong></p><p>伤寒，发热，啬啬恶寒，大渴欲饮水，其腹必满，是肺病也，自汗出，小便利，见风木之疏泄，此肝乘肺金也，名曰横，亦当刺厥阴之期门，以泻肝热。</p><p>肺统卫气而性收敛，肝司营血而性疏泄，发热恶寒，大渴腹满，是金气敛闭而木不能泄也，汗出便利，是木气发泄而金不能收也。营泄而卫宣，故其病欲解。</p>
