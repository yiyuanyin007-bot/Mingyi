<tr><td valign="top"><hr /><center><h1>亡津谵语证十三　阳明三十二</h1></center>
<p><strong>【218】伤寒四五日，脉沉而喘满，沉为在里，而反发其汗，津液越出，大便为难，表虚里实，久则谵语。</strong></p><p>热在里，则脉沉。胃气壅遏，则肺阻而为喘，气滞而为满。误汗亡津，表阳虚而里热实，久则神气烦乱，而为谵语。</p>
