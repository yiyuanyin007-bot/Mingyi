<tr><td valign="top"><hr /><center><h1>阳明外证一　阳明三</h1></center>
<p><strong>【182】问曰：阳明病，外证云何？答曰：身热，汗自出，不恶寒，反恶热也。</strong></p><p>里热外发，则身热。热气熏蒸，则汗自出。汗出表解，但热无寒，故不恶寒，反恶热。此后全是内热为害，与外寒无关也。</p>
