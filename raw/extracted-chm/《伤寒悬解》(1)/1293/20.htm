<tr><td valign="top"><hr /><center><h1>脉法四</h1></center>
<p><strong>寸口脉浮而紧，浮则为风，紧则为寒，风则伤卫，寒则伤营，营卫俱伤，骨节烦痛，当发其汗也。</strong></p><p>寸口脉浮而紧，病在表也。浮则为中风，紧则为伤寒，以风性浮而寒性紧，所谓风则浮虚，寒则牢坚也。中风则伤卫气，伤寒则伤营血，营卫俱伤，而骨节烦痛，当发汗以解风寒，此桂麻各半之证也。此明审察表里之义。</p>
