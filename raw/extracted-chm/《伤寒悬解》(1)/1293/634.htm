<tr><td valign="top"><hr /><center><h1>可下六</h1></center>
<p><strong>【　】下利脉迟而滑者，内实也，利未欲止，当下之，宜大承气汤。</strong>方在阳明二十一。</p><p>迟即涩之变文，宿食不能阻其表气，而郁其里气，故外滑而内迟。里气郁阻，肝脾不升，故利未欲止。</p>
