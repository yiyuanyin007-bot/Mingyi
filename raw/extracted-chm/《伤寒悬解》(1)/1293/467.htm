<tr><td valign="top"><hr /><center><h1>阳回证三　少阴三十八</h1></center>
<p><strong>【288】少阴病，下利，若利自止，恶寒而蜷卧，手足温者，可治。</strong></p><p>下利自止，则脏寒已差，恶寒蜷卧，则经阳未复，而手足温者，是中气未绝，四末阳回之象，故可治。</p>
