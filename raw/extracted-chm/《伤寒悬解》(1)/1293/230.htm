<tr><td valign="top"><hr /><center><h1>太阳坏病入厥阴胃冷吐蛔证一　太阳一百九</h1></center>
<p><strong>【89】病人有寒，复发汗，胃中冷，必吐蛔。</strong></p><p>脏腑素有积寒，复发汗以亡胃阳，胃冷不能安蛔，必吐蛔虫。</p><p>虫因木化，厥阴木郁，则生蛔虫。《素问》：厥阴者，阴之绝阳。厥阴以至阴之脏，寒极吐蛔，则水腾而火不能复，中伏死机，是以内外感伤诸病，一见吐蛔，便属阴证。阳绝则死，阳复则生，惟温病吐蛔，是热非寒，与余证不同也。</p>
