<tr><td valign="top"><hr /><center><h1>阳回有热证七　厥阴四十四</h1></center>
<p><strong>【373】下利欲饮水者，以有热故也，白头翁汤主之。</strong></p><p>欲饮水者，阳复而有内热也。白头翁汤，白头翁清少阳之相火，<a href="http://www.zy%73%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_h/huanglian.html" target="_blank" title="中药材：黄连">黄连</a>清少阴之君火，<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_h/huangbo.html" target="_blank" title="中药材：黄柏">黄柏</a>、<a href="http://%77%77%77%2E%7A%79%73j.com.cn/zhongyaocai/yaocai_q/qinpi.html" target="_blank" title="中药材：秦皮">秦皮</a>，泻厥阴之湿热也。</p><p><strong>【白头翁汤】百三　（方【106】）</strong></p><p><strong>【106】白头翁汤</strong></p><p>白头翁<em>二两</em>　<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_h/huangbo.html" target="_blank" title="中药材：黄柏">黄柏</a><em>三两</em>　<a href="http://www.zy%73%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_h/huanglian.html" target="_blank" title="中药材：黄连">黄连</a><em>三两</em>　<a href="http://%77%77%77%2E%7A%79%73j.com.cn/zhongyaocai/yaocai_q/qinpi.html" target="_blank" title="中药材：秦皮">秦皮</a><em>三两</em></p><p><em>上四味，以水七升，煮取二升，去滓，温服一升；不愈，更服一升。</em></p>
