<tr><td valign="top"><hr /><center><h1>大陷胸证三　太阳百十三</h1></center>
<p><strong>【137】太阳病，重发汗，而复下之，不大便五六日，舌上燥而渴，日晡时小有潮热，从心下至少腹硬满而痛不可近者，大陷胸汤主之。</strong></p><p>结胸证，攻下后，下寒逼热在上，病但在胸，不至少腹，此从心下至于少腹硬满而痛，是结胸而兼阳明府证也。合之舌上燥渴，日晡潮热，全是胃腑燥热。但小有潮热，腑邪尚轻，故用陷胸而不用承气也。</p>
