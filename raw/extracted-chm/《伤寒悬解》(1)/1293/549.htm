<tr><td valign="top"><hr /><center><h1>湿病五</h1></center>
<p><strong>【　】湿家病，身上疼痛，发热，面黄而喘，头痛鼻塞而烦，其脉大，自能饮食，腹中和无病，病在头中寒湿，故鼻塞，内药鼻中则愈。</strong></p><p>寒湿在头，不关中焦，故自能饮食。湿盛气滞，肺金不清，故头疼鼻塞。内药鼻中，清肺金而去寒湿，则愈矣。</p>
