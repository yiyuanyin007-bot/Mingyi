<tr><td valign="top"><hr /><center><h1>四逆桂枝证四　太阴五</h1></center>
<p><strong>【372】下利腹胀满，身体疼痛者，先温其里，乃攻其表，温里宜四逆汤，攻表宜<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤。</strong>方在太阳五（方【1】）。</p><p>下利而腹又胀满，是太阴脏病，腹满自利之证俱见矣，而其身体疼痛者，又有太阳经病，是当先温其里，乃攻其表。温里宜四逆汤以驱寒，攻表宜<a href="http://w%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤以驱风，里温则发汗不虑其亡阳矣。此与太阳伤寒，医下之，续得下利清谷章法同。</p>
