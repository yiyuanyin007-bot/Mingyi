<tr><td valign="top"><hr /><center><h1>提纲　一章</h1></center>
<p>病发于阳者，多入阳明而为热，病发于阴者，多入太阴而为寒。病发于阳，俟其表证已解，内热既实而用下，乃不为早，下早则表阳陷而为结胸，此阳明之坏病也。病发于阴，始终不可用下，误下则里阴升而为痞，此太阴之坏病也。</p>
