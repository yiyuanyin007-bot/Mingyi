<tr><td valign="top"><hr /><center><h1>麻黄证五　太阳二十四</h1></center>
<p><strong>【47】太阳病，脉浮紧，发热，身无汗，自衄者愈。</strong></p><p>发热无汗，而脉浮紧，是宜麻黄发汗，以泻卫郁。若失服麻黄，皮毛束闭，卫郁</p><p>莫泄，蓄极思通，势必逆冲鼻窍，而为衄证，自衄则卫泄而病愈矣。</p>
