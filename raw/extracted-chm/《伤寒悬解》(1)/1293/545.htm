<tr><td valign="top"><hr /><center><h1>湿病一</h1></center>
<p><strong>【　】太阳病，关节疼痛而烦，脉沉而细者，此名湿痹。湿痹之候，其人小便不利，大便反快，但当利其小便。</strong></p><p>湿流关节，气道壅阻，故疼痛而烦。经络凝涩，故脉沉而细。湿为阴邪，其性沉滞痹着，故曰湿痹。膀胱者，津液之腑，气化则出，湿则气不化水，故小便不利。前窍不通，则湿气后行，故大便反快。但当利其小便，以泻湿气，则疼痛止矣。</p>
