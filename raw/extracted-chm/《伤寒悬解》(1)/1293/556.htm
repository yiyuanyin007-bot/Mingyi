<tr><td valign="top"><hr /><center><h1>暍病二</h1></center>
<p><strong>【　】太阳中热者，暍是也，其人汗出恶寒，身热而渴也。</strong></p><p>太阳夏月感冒，而中暑热，其名曰暍。热盛于经，外蒸皮毛，是以汗出。风寒外束，阳郁不达，是以恶寒。肺金被烁，津液耗伤，故身热而渴。《金匮》主<a href="http://www.%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>白虎，清金益气，生津止渴，暍病之定法也。</p>
