<tr><td valign="top"><hr /><center><h1>阳回饮水证八　厥阴四十五</h1></center>
<p><strong>【329】厥阴病，欲饮水者，少少与之愈。</strong></p><p>阳复而欲饮水，有内热也，少少与之，滋其渴燥，必当自愈。阳气初复，未可过与，以伤胃气也。此白头翁汤之轻者。</p>
