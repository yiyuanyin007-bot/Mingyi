<tr><td valign="top"><hr /><center><h1>传经二　太阳四十九</h1></center>
<p><strong>【8】太阳病，头痛至七日以上自愈者，以行其经尽故也。若欲再作经者，针足阳明，使经不传，则愈。</strong></p><p>七日以上自愈者，即发于阳者七日愈之谓。六日六经俱尽，故至七日自愈，《素问·热论》所谓七日太阳病衰，头痛少愈也。阳莫盛于阳明，阳明之经，阳郁热盛，则六经俱遍而郁热未衰，虽不入腑，而经邪犹旺，不肯外发，热必再传六经。针足即明之经，泻其郁热，则经不再传，自然愈矣。</p>
