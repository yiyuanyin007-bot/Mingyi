<tr><td valign="top"><hr /><center><h1>死证二　少阴三十一</h1></center>
<p><strong>【296】少阴病，吐利烦躁，四逆者，死。</strong></p><p>吐利烦躁，则微阳飞走，本根欲断。倘其四末阳回，犹有生望，再加四肢厥逆，死不可医也。</p>
