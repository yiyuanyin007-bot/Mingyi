<tr><td valign="top"><hr /><center><h1>差后劳复一</h1></center>
<p><strong>【396】大病差后，喜唾，久不了了者，胃上有寒，当以丸药温之，宜理中丸。</strong>方在霍乱五（方【108】）。</p><p>病后阳虚，胃寒气逆，津唾上涌，久不了了。此当以丸药温之，不便急下，宜理中丸也。</p>
