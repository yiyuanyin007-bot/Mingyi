<tr><td valign="top"><hr /><center><h1>小柴胡证九　少阳十</h1></center>
<p><strong>【　】呕家，不可与建中汤，以甜故也。</strong></p><p>素惯呕家，不可与建中汤，以桂、甘、饴、枣之甜，最动呕吐也。</p>
