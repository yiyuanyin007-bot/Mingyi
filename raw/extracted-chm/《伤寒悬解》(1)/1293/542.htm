<tr><td valign="top"><hr /><center><h1>痉病四</h1></center>
<p><strong>【　】病身热足寒，颈项强急，恶寒，时头热，面赤，目赤，独头摇，卒口噤，背反张者，痉病也。</strong></p><p>身热足寒，颈项强急，恶寒，头热，面赤，目赤，头摇，口噤，脊背反张者，是为痉病。缘筋统于肝，肝血虚燥，风动筋缩，故头摇口噤。太阳行身之背，膀胱，津液之腑，津亡筋燥，故脊背反折。</p>
