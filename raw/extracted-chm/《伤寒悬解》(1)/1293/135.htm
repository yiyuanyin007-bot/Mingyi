<tr><td valign="top"><hr /><center><h1>太阳风寒双感证　四章</h1></center>
<p>太阳病，风则<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>，寒则麻黄，乃有风寒双感之证，爰垂桂麻各半之方，营卫兼发，风寒俱去。脉法：风则伤卫，寒则伤营，营卫俱伤，当发其汗，此之谓也。若夫风多而寒少，则有桂二麻一之剂，仍是各半法度，因病而小变者也。至于内热微而表寒轻，桂麻各半之法，不相合矣，用<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>之二越婢之一，微宣表寒，而轻清里热，此颇似大青龙法，而实亦不同，义更妙也。则桂麻各半，所以继桂麻二方之后，<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>越婢，开青龙一方之先也。</p>
