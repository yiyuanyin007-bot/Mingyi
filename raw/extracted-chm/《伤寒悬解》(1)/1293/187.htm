<tr><td valign="top"><hr /><center><h1>火逆吐血证十四　太阳六十九</h1></center>
<p><strong>【115】脉浮热甚，反灸之，此为实，实以虚治，因火而动，故咽燥吐血。</strong></p><p>脉浮热甚，当汗之以泻其热，反灸之，此为实证。实证而用灸，是实以虚治也，内之实热，因外火而大动，必伤阴气，故咽燥而吐血。</p>
