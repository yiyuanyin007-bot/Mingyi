<tr><td valign="top"><hr /><center><h1>不可下六</h1></center>
<p><strong>【　】脉数者，久数不止，止则邪结，正气未复，邪气却结于脏，故邪气浮之，与皮毛相得。脉数者，不可下，下之必烦利不止。</strong></p><p>凡外见数脉，必有里阴格阳，阳不下根，故动数失度。久数而不见停止，里阴未结也，一见停止，则阴邪结矣。正气内复，虽结必消，正气不能内复，则邪气却结于脏。盘据根深，外逼阳气，浮于皮毛之部，是以脉数。脉数者，不可下，下之阴邪愈旺，必上烦下利不止。盖盛于外者，必虚于内，见其外盛而知其内虚，是为良工。</p>
