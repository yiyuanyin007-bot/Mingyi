<tr><td valign="top"><hr /><center><h1>大承气证十七　阳明三十六</h1></center>
<p><strong>【215】阳明病，谵语，有潮热，反不能食者，胃中必有燥屎五六枚也，宜大承气汤下之。若能食者，但硬耳。</strong></p><p>燥屎结塞，浊气上冲，则不能食。</p>
