<tr><td valign="top"><hr /><center><h1>差后劳复　六章</h1></center>
<p>差后劳复者，病愈而复发者也。或余热犹存，停水未去，或宿物郁浊，新谷壅阻，偶因调理不节，伤其中气，旧根立发，新病如初。病因不同，立法亦异，清金泻水，发表攻中，内扫宿物，外损新谷，浊瘀消散，障碍清空，还其冲虚澹静之常，复其回运升沉之旧。劳复之病，爰无遗法，盖宿草之再发者，以有根也，削迹无遗根，则蔓自除矣。</p>
