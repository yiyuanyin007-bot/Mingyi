<tr><td valign="top"><hr /><center><h1>汗多亡阳证十五　阳明六十六</h1></center>
<p><strong>【211】发汗多，若重发汗者，亡其阳，谵语，脉短者，死，脉自和者，不死。</strong></p><p>汗多亡阳，神败而发谵语，脉短者，阳绝乃死，脉自和者，阳复则生。此申明上章发汗则躁，心愦愦，反谵语之义。</p>
