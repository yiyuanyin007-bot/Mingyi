<tr><td valign="top"><hr /><center><h1>太阳中风　十五章</h1></center>
<p>风者，天地发生之气也。皮毛未开，风气外客，伤其卫阳，则窍开而卫泄。卫性降敛，卫欲闭而风泄之，欲闭不得，则内乘阴位，而遏营血，是以病也。（曰风泄者，风闭其卫，营郁而外泄也）。</p>
