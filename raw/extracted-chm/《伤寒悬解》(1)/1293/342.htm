<tr><td valign="top"><hr /><center><h1>口燥欲衄证二十一　阳明七十二</h1></center>
<p><strong>【202】阳明病，口燥，但欲漱水，不欲咽，此必衄。</strong></p><p>口干而漱水不咽，以热在经而不在腑。经热不泄，此必衄也。</p>
