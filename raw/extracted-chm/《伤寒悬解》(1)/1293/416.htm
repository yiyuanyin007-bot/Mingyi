<tr><td valign="top"><hr /><center><h1>芍药大黄证九　太阴十</h1></center>
<p><strong>【280】太阴为病，脉弱，其人续自便利，设当行<a href="http://www.zy%73%6A%2Ecom.cn/zhongyaocai/yaocai_d/daihuang.html" target="_blank" title="中药材：大黄">大黄</a>、芍药者，宜减之，以其胃气弱，易动故也。</strong></p><p>太阴为病，其脉软弱，其人当续自便利。设腹满时痛，以至大实，当行芍药、<a href="http://www.zy%73%6A%2Ecom.cn/zhongyaocai/yaocai_d/daihuang.html" target="_blank" title="中药材：大黄">大黄</a>者，宜稍减之。以其人太阴既病，胃气必弱，易于伤动故也。</p>
