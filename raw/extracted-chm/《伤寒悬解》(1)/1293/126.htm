<tr><td valign="top"><hr /><center><h1>太阳伤寒一　太阳十九</h1></center>
<p><strong>【3】太阳病，或已发热，或未发热，必恶寒，体疼，呕逆，脉阴阳俱紧者，名曰伤寒。</strong></p><p>阳郁则发热，阴气外束则恶寒。寒闭皮毛，经气不得通达，则壅迫而为痛。经络郁闭，卫气遏逼，浊阴上逆，则为呕逆。经脉束迫，不得发越，则尺寸俱紧。</p><p><strong>太阳伤寒麻黄汤证</strong></p><p>肝藏营血，寒伤于营，行其闭藏之令，营血不宣，是以无汗。营愈闭而愈泄，泄而不通，则卫郁而寒生。麻黄汤所以开皮毛而泻卫郁也。</p>
