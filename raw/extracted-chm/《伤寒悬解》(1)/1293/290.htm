<tr><td valign="top"><hr /><center><h1>调胃承气证五　阳明二十四</h1></center>
<p><strong>【207】阳明病，不吐，不下，心烦者，可与调胃承气汤。</strong></p><p>不因吐下，而心烦者，胃阳原盛，所谓正阳阳明也。燥土耗伤津液则烦，心烦即谵语之根，甚则谵语，此亦大承气之初证也。</p>
