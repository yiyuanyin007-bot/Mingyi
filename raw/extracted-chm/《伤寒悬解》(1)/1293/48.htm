<tr><td valign="top"><hr /><center><h1>卷二·脉法下篇　五十二章</h1></center>
<p>脉理精微，发于上篇，而其名义之纷臣责，形象之迁化，诊候之机缄，望切之窍妙，</p><p>所未详悉者，设为问答，发于此篇。澄心渺虑，传兹奥旨，诚崆峒访道之仙梯，赤水</p><p>求珠之秘渡也。</p><p>后世医理无传，半缘脉法不解。仲景脉法，家藏而户收，白首不解，则终身不灵，</p><p>是胼拇支指之呼吸不应也，岂仲景传脉之心哉！</p>
