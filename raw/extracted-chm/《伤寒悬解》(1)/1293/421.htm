<tr><td valign="top"><hr /><center><h1>寒湿发黄证十四　太阴十五</h1></center>
<p><strong>【259】伤寒发汗己，身目为黄，所以然者，以寒湿在里不解故也。以为不可下也，当于寒湿中求之。</strong></p><p>黄缘湿热里瘀，若发汗以后，身目为黄，则是湿寒而非湿热，以汗后热泄而寒生，阳消而湿长也。寒湿不可下，当于寒湿中求之，用温寒去湿之法也。</p>
