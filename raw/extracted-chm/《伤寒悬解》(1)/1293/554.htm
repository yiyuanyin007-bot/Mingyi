<tr><td valign="top"><hr /><center><h1>暍病　三章</h1></center>
<p>暍者，夏月而伤风寒，郁其表热。表热盛则内气虚，故不可汗下。以寒则伤形，故外闭而为实，热则伤气，故外泻而为虚。当内度本气之虚实，不宜外泥时令之热寒。汗、下、温针之法，所以伐正而扶邪，不可轻犯也。</p>
