<tr><td align="left">五苓证二　太阳四十二</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>五苓证二　太阳四十二</h1></center>
<p><strong>【73】伤寒，汗出而渴者，五苓散主之，不渴者，<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_f/fuling.html" target="_blank" title="中药材：茯苓">茯苓</a><a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>汤主之。</strong></p><p>伤寒汗后，阳虚湿动，君相二火浮升，故作燥渴。其渴者，湿邪较甚，故用五苓。</p><p>不渴者，湿邪较轻，<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_f/fuling.html" target="_blank" title="中药材：茯苓">茯苓</a><a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>汤，苓、桂、姜、甘，泻水而疏木，和中而培土，防其</p><p>湿动而生水瘀也。</p><p><strong>〖<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_f/fuling.html" target="_blank" title="中药材：茯苓">茯苓</a><a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>汤〗十一　（方【33】）</strong></p><p><strong>【33】<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_f/fuling.html" target="_blank" title="中药材：茯苓">茯苓</a><a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>汤</strong></p><p><a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_f/fuling.html" target="_blank" title="中药材：茯苓">茯苓</a><em>二两</em>　<a href="http://www.z%79%73%6A%2E%63%6Fm.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a><em>去皮，二两</em>　<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a><em>炙，一两</em>　<a href="http://www.zysj.co%6D%2E%63%6E%2Fzhongyaocai/yaocai_s/shengjiang.html" target="_blank" title="中药材：生姜">生姜</a><em>切，三两</em></p><p>上四味，以水四升，煮取二升，去滓，分温三服。</p>
