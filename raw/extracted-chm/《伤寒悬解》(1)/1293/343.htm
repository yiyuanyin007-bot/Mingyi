<tr><td valign="top"><hr /><center><h1>鼻燥欲衄证二十二　阳明七十三</h1></center>
<p><strong>【227】脉浮发热，口干鼻燥，能食者，则衄。</strong></p><p>脉浮发热，表寒外束，口干鼻燥，经热内蒸，能食则热不在腑，经热不能旁泄，则上衄也。</p>
