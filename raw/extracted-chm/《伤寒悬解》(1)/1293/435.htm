<tr><td valign="top"><hr /><center><h1>咳利谵语证七　少阴八</h1></center>
<p><strong>【284】少阴病，咳而下利，谵语者，被火气劫故也，小便必难，以强责少阴汗也。</strong></p><p>少阴寒水之脏，下利则有之，不应谵语，咳而下利，谵语者，此被火气逼劫发汗，耗其心液，阳随汗泄，神明惑乱故也。其小便必难，以少阴阳弱，不宜发汗，火逼劫而强责之，泻其血中温气，湿旺木郁，不能疏泄也。</p>
