<tr><td valign="top"><hr /><center><h1>死证三　厥阴三十三</h1></center>
<p><strong>【344】伤寒发热，下利厥逆，躁不得卧者，死。</strong></p><p>发热下利，而见厥逆，阴盛而阳气不归，加以躁不得卧，则微阳绝根而外脱，死不可医也。</p>
