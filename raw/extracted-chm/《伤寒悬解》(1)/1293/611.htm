<tr><td valign="top"><hr /><center><h1>不可下十一</h1></center>
<p><strong>【　】咽中闭塞者，不可下，下之则上轻下重，水浆不下，卧则欲蜷，身急痛，下利日数十行。</strong></p><p>咽中闭塞者，浊阴冲逆，下之，阳亡湿动，则下重，阴盛胃逆，则水浆不下。</p>
