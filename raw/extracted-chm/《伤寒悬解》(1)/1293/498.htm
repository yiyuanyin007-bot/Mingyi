<tr><td valign="top"><hr /><center><h1>少腹满痛证十六　厥阴十七</h1></center>
<p><strong>【340】病人手足厥冷，言我不结胸，少腹满，按之痛者，此冷结在膀胱关元也。</strong></p><p>病人手足厥冷如前，而言我不结胸，其心下不满，而小腹则满，按之觉痛者，此冷气结在膀胱关元之间也。（关元，任脉穴，在脐下三寸，小肠之募，足三阴之会也）。此推广上章之义。上章病在胸中，此章病在少腹。</p>
