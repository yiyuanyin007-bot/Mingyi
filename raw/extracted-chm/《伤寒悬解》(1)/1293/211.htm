<tr><td valign="top"><hr /><center><h1>太阳坏病入少阴去路　十七章</h1></center>
<p>少阴以寒水而化君火，平人水火交则肾水温。阴盛之人，水旺火衰，肾气原寒。病在太阳，表阳外郁，内寒已动。一有汗、下、温针之逆，阳亡土败，寒水无制，水邪泛溢，死不旋踵。扶阳明而抑少阴，良工当思患而预防也。</p>
