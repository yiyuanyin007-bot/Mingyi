<tr><td valign="top"><hr /><center><h1>汗下</h1></center>
<p>汗下者，伤寒之法，而用之太过，则虚以实治，而或以亡身，用之不及，则实以虚治，而或以殒命。譬犹水也，载舟覆舟，水不任过，而破浪冲风，人之罪也，譬犹兵也，止乱生乱，兵不任咎，而纵敌长寇，人之责也。是以相阴阳之盛衰，审汗下之忌宜，忌汗下者，勿孟浪致误，引贼而入室，宜汗下者，勿迟回失断，养虎以贻患。故六经之外，又有汗下宜忌之篇，未可不求甚解矣。</p>
