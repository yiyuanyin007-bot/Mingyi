<tr><td valign="top"><hr /><center><h1>四逆证二十二　厥阴二十三</h1></center>
<p><strong>【353】大汗出，热不去，内拘急、四肢疼，又下利厥逆而恶寒者，四逆汤主之。</strong></p><p>伤寒，表寒闭其内热，大汗既出，热应解矣，若大汗出而热不去，此阳亡而不归也。里阴盛则内拘急，表阳虚则四肢疼，又下利厥逆而恶寒者，火土双败，宜主四逆。</p>
