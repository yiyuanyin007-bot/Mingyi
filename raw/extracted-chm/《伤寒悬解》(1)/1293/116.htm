<tr><td align="left">桂枝证六　太阳十</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>桂枝证六　太阳十</h1></center>
<p><strong>【24】太阳病，初服<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤，反烦不解者，先刺风池，风府，却与<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤则愈。</strong></p><p>风池，足少阳穴。风府，督脉穴，在项后，大椎之上。督与太阳，同行于背，而足少阳经，亦行项后，两穴常开，感伤最易。感则传之太阳，太阳中风之病，皆受自两穴。服<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤，风应解矣，反烦不解者，风池、风府必有内闭之风不能散也，先刺以泻两穴之风，再服<a href="http://%77%77%77%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>，无不愈矣。</p>
