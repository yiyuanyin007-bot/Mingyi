<tr><td valign="top"><hr /><center><h1>阴阳易　一章</h1></center>
<p>阴阳易者，男女交易之病也。以其原无阴阳寒热之偏，而病传于他人，非关于本气，则温凉补泻之法，俱无所用，惟以同气相召，引之前出。盖病原于人我之贸迁，是以其所无易其所有也，法亦用男女之交换，仍以其所有易其所无也。彼以易来，此以易往，不烦别方，而阴阳互位，物我各还，妙难言喻也。</p>
