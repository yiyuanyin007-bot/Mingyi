<tr><td valign="top"><hr /><center><h1>死证二　厥阴三十二</h1></center>
<p><strong>【347】伤寒六七日，不利，便发热而利，其人汗出不止者，死，有阴无阳故也。</strong></p><p>六七日，正传厥阴之时，从前不利，六七日间，便发热而利，脏中之温气内泄，其人汗出不止者，经中之温气外亡，如是必死。以其表里之阳皆脱，有阴无阳故也。</p>
