<tr><td valign="top"><hr /><center><h1>汗多胃燥证二十　阳明七十一</h1></center>
<p><strong>【224】阳明病，汗出多而渴者，不可与猪苓汤，以汗多胃中燥，猪苓汤复利其小便故也。</strong></p><p>六十五章：渴而小便不利者，乃与猪苓汤。若汗出多而渴者，则应白虎。不可与猪苓汤，以汗多则胃中已燥，猪苓汤复利其小便以亡津也。</p><p>此申明上章及六十五章猪苓汤之义。</p>
