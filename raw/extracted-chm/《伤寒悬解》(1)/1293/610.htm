<tr><td valign="top"><hr /><center><h1>不可下十</h1></center>
<p><strong>【　】动气在下，不可下，下之则腹胀满，卒起头眩，食则下清谷，心下痞也。</strong></p><p>动气在下，风木振撼于脐下也。下之，温气亡泄，木郁克土，则腹胀，阳气无根，则头眩，风木不敛，则下清谷，浊气上填，则心下痞也。</p>
