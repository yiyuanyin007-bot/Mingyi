<tr><td valign="top"><hr /><center><h1>脏结证九　太阳百十九</h1></center>
<p><strong>【167】病，胁下素有痞，连在脐旁，痛引少腹，入阴筋者，此名脏结，死。</strong></p><p>肝脉行于两胁，素有痞者，肝气之郁结也。脐当脾胃之交，中气所在，胁下之痞。连在脐旁，土败木郁，肝邪之乘脾也。肝主筋，自少腹而结阴器，前阴者，宗筋之聚，肝气郁结，则痛引少腹，而入阴筋。土木郁迫，痞塞不开，此名脏结。久而木贼土崩，必主死矣。</p>
