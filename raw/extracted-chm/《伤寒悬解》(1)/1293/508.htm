<tr><td valign="top"><hr /><center><h1>痈脓作呕证二十六　厥阴二十七</h1></center>
<p><strong>【376】呕家，有痈脓者，不可治呕，脓尽自愈。</strong></p><p>呕家有痈脓者，则呕乃痈脓之所致，不可治呕，脓尽自愈也。</p>
