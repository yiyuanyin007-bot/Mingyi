<tr><td valign="top"><hr /><center><h1>霍乱十</h1></center>
<p><strong>【387】吐利止，而身痛不休者，当消息和解其外，宜<a href="http://www.%7A%79sj.com.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤小和之。</strong>方在太阳五（方【1】）。</p><p>吐利既去，而痛不休，以表寒未解，经气壅滞之故。<a href="http://www.%7A%79sj.com.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤，通经解表，小和其外，身痛即休也。</p>
