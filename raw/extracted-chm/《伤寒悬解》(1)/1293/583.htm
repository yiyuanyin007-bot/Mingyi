<tr><td valign="top"><hr /><center><h1>不可汗二</h1></center>
<p><strong>【　】脉濡而弱，弱反在关，濡反在巅，弦反在上，微反在下，弦为阳运，微为阴寒，上实下虚，意欲得温。微弦为虚，不可发汗，发汗则寒栗，不能自还。</strong></p><p>肝胆之脉弦，弦者，阳生之象。木生于水而长于土，弦应在关上，今者弦反在上。寸部既弦，则尺不应微，今者微反在下。弦为阳气升运而不降，微为阴分阳虚而生寒，是上实而下虚也。下焦虚寒，则意欲得温。总之，寸口之弦，尺中之微，悉因中焦之阳虚，虚者不可发汗，汗亡其阳，则寒冷战栗，不能自还也。</p>
