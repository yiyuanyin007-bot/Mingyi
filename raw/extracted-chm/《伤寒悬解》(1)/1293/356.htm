<tr><td valign="top"><hr /><center><h1>提纲　一章</h1></center>
<p>少阳之气，化于相火，其经自头走足，病则气逆而火炎，升燎咽喉而上燔头目，少阳之兼证不一，而口苦、咽干、目眩，则为主证，以相火之上郁故也。病情递变而三者不变，病状善移而三者不移，缘相火不得下秘，离本根而上浮，故口苦咽干，头目旋转而不宁也。是则少阳之他证，皆在于或然之中，而少阳之三者，则处于必然之例。提纲揭三证以概少阳，少阳虽幻化无常，然或有殊状，而必无遁情矣。</p>
