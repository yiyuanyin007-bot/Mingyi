<tr><td valign="top"><hr /><center><h1>脉法八十三</h1></center>
<p><strong>问曰：脉有灾怪，何谓也？师曰：假令人病，脉得太阳，与形证相应，因为作汤。比还送汤，如食顷，病人乃大吐下利，腹中痛。师曰：我前来不见此证，今乃变易，是名灾怪。问曰：缘何作此吐利？答曰：或有旧时服药，今乃发作，故为此灾怪耳。</strong></p><p>脉证无差，而吐利忽作，诚为怪异。大抵药经人手，容有别缘，或者婢妾冤仇，毒行暧昧，事未可料也。</p>
