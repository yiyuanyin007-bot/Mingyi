<tr><td valign="top"><hr /><center><h1>暍病三</h1></center>
<p><strong>【　】太阳中暍，身热疼重，而脉微弱，此以夏月伤冷水，水行皮中所致也。</strong></p><p>冷水洗浴，汗孔未阖，水溃经络，而皮毛闭塞，经热不泄，故身热而疼。水阻气滞，故肢体重浊。热伤肺气，故脉微弱。肺气遏闭，必生痰饮，《金匮》以瓜蒂吐之，是定法也。</p><p>义详《金匮》。</p>
