<tr><td valign="top"><hr /><center><h1>热胜喉痹证十一　厥阴十二</h1></center>
<p><strong>【334】伤寒，先厥，后发热，下利必自止，而反汗出，咽中痛者，其喉为痹。</strong></p><p>先厥后热，利必自止。然热不可过，发热利止，而反汗出，咽痛者，是热气上蒸皮毛，而冲咽喉，其喉当痹塞也。</p>
