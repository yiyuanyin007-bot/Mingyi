<tr><td valign="top"><hr /><center><h1>附子证六　少阴七</h1></center>
<p><strong>【304】少阴病，得之一二日，口中和，其背恶寒者，当灸之，附子汤主之。</strong></p><p>一二日中，背恶寒者，督脉之阳衰，太阳寒水之旺。当灸之以温外寒，附子汤以温内寒也。后章口燥咽干者，急下之，此曰口中和，则纯是湿寒，而非燥热，互观自明。</p>
