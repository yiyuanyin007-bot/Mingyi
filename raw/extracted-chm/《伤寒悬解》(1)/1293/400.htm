<tr><td valign="top"><hr /><center><h1>结胸初证二　少阳三十五</h1></center>
<p><strong>【171】太阳少阳并病，心下硬，颈项强而眩者，当刺大椎、肺俞、肝俞，慎勿下之。</strong></p><p>颈项强，太阳之证，而少阳自头下耳，循颈而入缺盆，亦当有之，心下硬，目眩，则纯是少阳证。大椎，脊骨第一大节，正当项后，肺俞，在第三椎两旁，肝俞，在第九椎两旁，皆是太阳之经穴。《灵枢·背输》篇名。作腧，经气之所输泄也，义与输同。汗之脏阴外亡，则为谵语，上章是也，下之表阳内陷，则成结胸，下章是也。</p>
