<tr><td valign="top"><hr /><center><h1>不可汗下三</h1></center>
<p><strong>【　】伤寒头痛，翕翕发热，形像中风，常微汗出。自呕者，下之益烦，心中懊憹如饥。发汗则致痉，身强难以屈伸。熏之则发黄，不得小便，久则发咳吐。</strong></p><p>伤寒头痛，翕翕发热，形像中风，常微汗出，是湿盛而阳郁者也。若自呕者，胃气上逆，下之中气败而胃愈逆，益增其烦，心中懊憹不快，而清阳陷败，空馁如饥。发汗耗其津血，筋脉失养，则成痉病，身体强，难以屈伸。火熏则湿气郁蒸，身发黄色，不得小便，久则肺胃升逆，而发咳吐也。</p>
