<tr><td align="left">半夏散证十二　少阴十三</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>半夏散证十二　少阴十三</h1></center>
<p><strong>【313】少阴病，咽中痛，半夏散及汤主之。</strong></p><p>浊阴上逆，冲击咽喉，因而作痛。半夏、<a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>，降其冲气，<a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>缓其急迫也。</p><p><strong>【半夏散】八十八　（方【96】）</strong></p><p><strong>【96】半夏散</strong></p><p>半夏<em>洗</em>　<a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a><em>去皮</em>　<a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a><em>炙</em></p><p><em>上三味，等分，各别捣筛已，合治之。白饮和服方寸匕，日三服。若不能散服者，以水一升，煎七沸，内散两方寸匕，更煮三沸，下火令小冷，少少咽之。半夏有毒，不当散服。</em></p>
