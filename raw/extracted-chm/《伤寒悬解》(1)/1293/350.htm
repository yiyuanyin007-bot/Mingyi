<tr><td valign="top"><hr /><center><h1>脉迟发黄证二十九　阳明八十</h1></center>
<p><strong>【195】阳明病，脉迟，食难用饱，饱则微烦头眩，必小便难，此欲作谷疸。虽下之，腹满如故，所以然者，脉迟故也。</strong></p><p>阴盛则脉迟。阳虚胃逆，饮食不甘，故难以至饱。饱则脾不能化，中焦郁满，浊气不降，故心烦头眩。土湿木郁，必小便艰难。此欲作谷疸，缘谷气陈宿，是以郁而发黄也。虽下之，而腹满不减，以其阴盛而脉迟故也。</p>
