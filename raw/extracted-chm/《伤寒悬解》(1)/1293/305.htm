<tr><td valign="top"><hr /><center><h1>大承气证二十　阳明三十九</h1></center>
<p><strong>【241】大下后，六七日不大便，烦不解，腹满痛者，此有燥屎也，所以然者，本有宿食故也，宜大承气汤。</strong></p><p>本有宿食未消，被胃火炼成燥屎，阻碍肠胃之窍。胃气以下行为顺，下窍不通，胃气壅遏，不得降泄，逆为上行，故生烦躁而满痛也。</p>
