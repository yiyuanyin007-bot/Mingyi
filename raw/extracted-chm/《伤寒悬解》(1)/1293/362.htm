<tr><td valign="top"><hr /><center><h1>小柴胡证五　少阳六</h1></center>
<p><strong>【379】呕而发热者，小<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤主之。</strong></p><p>少阳经气不舒，侵迫阳明胃腑，胃气上逆，必作呕吐。相火郁蒸，是以发热。少阳之经，往来寒热，此但云发热而不言寒，是半表之阳盛，而将传于阳明者，是宜小<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤泻其表热也。</p>
