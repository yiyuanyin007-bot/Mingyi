<tr><td valign="top"><hr /><center><h1>厥阴欲愈十二　厥阴四十九</h1></center>
<p><strong>【327】厥阴中风，脉微浮，为欲愈，不浮，为未愈。</strong></p><p>太阳中风，而传厥阴，是谓厥阴中风。脉浮则阳复而陷升，故为欲愈也。</p>
