<tr><td align="left">栀子干姜证十八　太阳八十八</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>栀子干姜证十八　太阳八十八</h1></center>
<p><strong>【80】伤寒，医以丸药大下之，身热不去，微烦者，栀子<a href="http://www.%7A%79%73j.com.cn/zhongyaocai/yaocai_g/ganjiang.html" target="_blank" title="中药材：干姜">干姜</a>汤主之。</strong></p><p>大下败其中气，浊阴上逆。瘀生腐败，阻格君火，不得下秘，故身热而心烦。栀子<a href="http://www.%7A%79%73j.com.cn/zhongyaocai/yaocai_g/ganjiang.html" target="_blank" title="中药材：干姜">干姜</a>汤，<a href="http://www.%7A%79%73j.com.cn/zhongyaocai/yaocai_g/ganjiang.html" target="_blank" title="中药材：干姜">干姜</a>降逆而温中，栀子吐瘀而除烦也。</p><p><strong>〖栀子<a href="http://www.%7A%79%73j.com.cn/zhongyaocai/yaocai_g/ganjiang.html" target="_blank" title="中药材：干姜">干姜</a>汤〗二十八　（方【38】）</strong></p><p><strong>【38】栀子<a href="http://www.%7A%79%73j.com.cn/zhongyaocai/yaocai_g/ganjiang.html" target="_blank" title="中药材：干姜">干姜</a>汤</strong></p><p>栀子<em>擘，十四个</em>　<a href="http://www.%7A%79%73j.com.cn/zhongyaocai/yaocai_g/ganjiang.html" target="_blank" title="中药材：干姜">干姜</a><em>二两</em></p><p><em>上二味，以水三升半，煮取一升半，去滓，分二服，温进一服。得吐者，止后服。</em></p>
