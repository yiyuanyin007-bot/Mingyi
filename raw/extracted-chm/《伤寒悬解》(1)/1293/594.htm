<tr><td valign="top"><hr /><center><h1>不可汗十三</h1></center>
<p><strong>【84】淋家，不可发汗，发汗必便血。</strong></p><p>淋家，土湿木郁，生气不达，汗之再亡血中温气，风木愈陷，疏泄不藏，必便血也。</p>
