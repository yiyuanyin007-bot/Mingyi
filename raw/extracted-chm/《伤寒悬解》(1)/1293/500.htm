<tr><td valign="top"><hr /><center><h1>水渍作利证十八　厥阴十九</h1></center>
<p><strong>【356】伤寒，厥而心下悸者，宜先治水，当与<a href="http://www.z%79%73%6A%2E%63%6F%6D.cn/zhongyaocai/yaocai_f/fuling.html" target="_blank" title="中药材：茯苓">茯苓</a><a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>汤，</strong>方在太阳四十二（方【33】）。<strong>却治其厥，不尔，水渍入胃，必作利也。</strong></p><p>厥逆而心下悸动者，此内有水气，盖水饮停留，阻经脉往来之路，木郁风作，故心下动悸。宜与<a href="http://www.z%79%73%6A%2E%63%6F%6D.cn/zhongyaocai/yaocai_f/fuling.html" target="_blank" title="中药材：茯苓">茯苓</a><a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>汤，先治其水，停水既去，却治其厥。不然，水饮渍入胃脘，必作利也。</p>
