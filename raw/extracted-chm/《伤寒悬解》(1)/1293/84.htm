<tr><td align="left">脉法六十六</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>脉法六十六</h1></center>
<p><strong>问曰：病有不战不汗出而解者，何也？答曰：其脉自微，此以曾经发汗，若吐，若下，若亡血，以内无津液，此阴阳自和，必自愈，故不战不汗出而解也。</strong></p><p>其脉自微弱，则表里无邪，此以曾经发汗、吐、下、亡血失津，阴不济阳，未免烦热时作。然表里邪去，病根已除，迟而津液续复，阴阳自和，必当自愈，故不战不汗而亦解。</p>
