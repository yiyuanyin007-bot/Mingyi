<tr><td valign="top"><hr /><center><h1>大承气证十二　阳明三十一</h1></center>
<p><strong>【212】伤寒，若吐若下后不解，不大便五六日，上至十余日，日晡所发潮热，不恶寒，独语如见鬼状。若剧者，发则不识人，循衣摸床，惕而不安，微喘直视，脉弦者生，涩者死。微者，但发热谵语耳，大承气汤主之。若一服利，止后服。</strong></p><p>烦躁之极，则循衣摸床。木燥风生，则惕而不安。气阻肺热，则微喘。血枯系结，则直视。弦则木气犹存，故生。涩则营血已槁，故死。</p>
