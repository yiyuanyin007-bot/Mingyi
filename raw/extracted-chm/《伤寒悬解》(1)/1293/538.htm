<tr><td valign="top"><hr /><center><h1>痉病　五章</h1></center>
<p>痉亦太阳之病，外感于风寒者也。或缘于伤寒之多汗，或缘于产后之亡血。筋脉枯焦，固属阴虚，而汗血被夺，实为阳弱。切当照顾中气，不可恣用阴凉，缘为汗血失亡，虚者十九也。</p>
