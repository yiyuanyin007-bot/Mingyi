<tr><td valign="top"><hr /><center><h1>火邪内攻证十五　太阳七十</h1></center>
<p><strong>【116】微数之脉，慎不可灸，因火为邪，则为烦逆，追虚逐实，血散脉中。火气虽微，内攻有力，焦骨伤筋，血难复也。</strong></p><p>微数之脉，营血虚亏，慎不可灸，误灸而因火为邪，则为烦躁而气逆。追阴气之已虚，逐阳火之原实，因令血散脉中，耗亡失守。一灸之火虽微，而其煎熬内攻，则甚有力，焦骨伤筋，日就枯槁，营血消烁，终难复旧也。</p>
