<tr><td valign="top"><hr /><center><h1>死证五　厥阴三十五</h1></center>
<p><strong>【362】下利，手足厥冷，无脉者，灸之，不温，若脉不还，反微喘者，死。</strong></p><p>下利，厥冷无脉，灸之，厥不温与脉不还，是纯阴无阳，而反微喘者，则气不归根，必死无疑也。</p>
