<tr><td valign="top"><hr /><center><h1>汗多亡津证二十三　阳明四十二</h1></center>
<p><strong>【245】脉阳微而汗出少者，为自和也。汗出多者，为太过，阳脉实，因发其汗，多出者，亦为太过，太过为阳绝于里，亡津液，大便因硬也。</strong></p><p>脉阳微（寸为阳）而汗出少，是阳不亢而津未耗，故为自和。阳脉实而汗出多，是阳既亢而津又泄，故为太过。阳绝于里者，极盛而无其匹也。</p>
