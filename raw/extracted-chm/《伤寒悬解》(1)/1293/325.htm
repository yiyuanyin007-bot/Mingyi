<tr><td valign="top"><hr /><center><h1>胃中寒冷证四　阳明五十五</h1></center>
<p><strong>【380】伤寒，大吐大下之，极虚，复极汗出者，以其人外气拂郁，复与之水，以发其汗，因得哕。所以然者，胃中寒冷故也。</strong></p><p>吐下亡阳，中气极虚，而卫泄失敛，复极汗出者，以其人表阳拂郁，离根外浮，误谓表邪，复与之水，以发其汗，土败胃逆，故作呕哕。</p>
