<tr><td valign="top"><hr /><center><h1>白通汤证二十三　少阴二十四</h1></center>
<p><strong>【314】少阴病，下利，白通汤主之。</strong></p><p>少阴病，下利，气虚阳陷，则脉绝不出。白通汤，姜、附回阳，葱白达郁，阳回气达，则利止而脉出矣。</p><p><strong>〖白通汤〗九十四　（方【97】）</strong></p><p><strong>【97】白通汤</strong></p><p>葱白<em>四茎</em>　<a href="http://w%77%77%2E%7A%79sj.com.cn/zhongyaocai/yaocai_g/ganjiang.html" target="_blank" title="中药材：干姜">干姜</a><em>一两</em>　附子<em>生，去皮，破八片，一枚</em></p><p><em>上三味，以水三升，煮取一升，去滓，分温再服。</em></p>
