<tr><td valign="top"><hr /><center><h1>太阳坏病入太阴去路　二十一章</h1></center>
<p>太阴以湿土主令，阴盛之人，病在太阳，表郁则湿动。然不经误治，则胃阳未亏，湿气之作，犹俟渐成。及夫汗、下、温针，阳亡阴旺，湿邪勃兴，土败水侮，危证叠出，防微杜渐之法，不可不亟讲也。</p>
