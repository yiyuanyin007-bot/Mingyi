<tr><td valign="top"><hr /><center><h1>不可下十二</h1></center>
<p><strong>【　】诸外实者，不可下，下之则发微热，亡脉厥者，当脐握热。</strong></p><p>外实则内虚，下之阳亡气泄，则发微热。无脉而厥逆者，中气外脱，故当脐热。</p>
