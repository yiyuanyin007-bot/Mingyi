<tr><td valign="top"><hr /><center><h1>脉法六</h1></center>
<p><strong>师曰：脉肥人责浮，瘦人责沉。肥人当沉今反浮，瘦人当浮今反沉，故责之。</strong></p><p>肥人肌肉丰厚，故脉气沉深，瘦人肌肉减薄，故脉气浮浅。沉者浮而浮者沉，是谓反常，反常则病，故责之。</p>
