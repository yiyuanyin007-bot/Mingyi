<tr><td valign="top"><hr /><center><h1>大承气证二十五　阳明四十四</h1></center>
<p><strong>【254】发汗不解，腹满痛者，急下之，宜大承气汤。</strong></p><p>发汗不解，是非表证，乃胃气之实也，汗之愈亡其阴，燥屎阻其胃火，伤及太阴，故腹满而痛。阳亢阴亡，则成死证，故当急下之。</p><p>此下三章与少阴急下三章，彼此互文，是阳明之阳亢而伤阴者。阳未盛而下早，则亡其阳，阳已亢而下迟，则亡其阴，故有缓攻之法，又有急下之条。</p><p>此与少阴六七日，腹胀，不大便章义同。</p>
