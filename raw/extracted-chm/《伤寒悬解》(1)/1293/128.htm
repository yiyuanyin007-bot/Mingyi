<tr><td valign="top"><hr /><center><h1>麻黄证二　太阳二十一</h1></center>
<p><strong>【51】脉浮者，病在表，可发汗，宜麻黄汤。</strong></p><p><strong>【52】脉浮而数者，可发汗，宜麻黄汤。</strong></p><p>浮为在表，表被风寒，则宜汗。浮数即浮紧之变文，紧则必不迟缓，亦可言数，</p><p>是伤寒之脉，当以麻黄发汗也。</p>
