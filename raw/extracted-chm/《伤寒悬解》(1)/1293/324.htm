<tr><td valign="top"><hr /><center><h1>胃中虚冷证三　阳明五十四</h1></center>
<p><strong>【194】阳明病，不能食，攻其热必哕，所以然者，胃中虚冷故也。以其人本虚，故攻其热必哕。</strong></p><p>外热内寒，误谓内热而攻之，土败胃逆，必发呕哕。</p>
