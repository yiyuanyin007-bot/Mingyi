<tr><td valign="top"><hr /><center><h1>大承气证十八　阳明三十七</h1></center>
<p><strong>【242】病人小便不利，大便乍难乍易，时有微热，喘冒不得卧者，有躁屎也，宜大承气汤。</strong></p><p>土燥水枯，则小便不利。气有通塞，则大便乍难乍易。胃热内燔，则肌表时有微热。胃气郁遏，则喘阻昏冒，不得寝卧。此有燥屎堵塞之故也。《素问·腹中论》：不得卧而息有音者，是阳明之逆也。足三阳者下行，今逆而上行，故息有音也。阳明者，胃脉也，胃者，六腑之海，其脉亦下行，阳明逆，不得从其道，故不得卧也。</p>
