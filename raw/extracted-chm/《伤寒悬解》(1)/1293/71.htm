<tr><td valign="top"><hr /><center><h1>脉法五十三</h1></center>
<p><strong>伤寒，腹满谵语，寸口脉浮而紧，此肝乘脾也，名曰纵，刺期门。</strong></p><p>伤寒，腹满谵语，是脾病也，寸口脉浮而紧，是肝家之弦脉，此肝木乘脾土也，名曰纵，当刺厥阴之期门，以泻肝气。脉浮而紧者，名曰弦也，脉法三十九。肝脉弦，</p><p>故知为肝乘。</p>
