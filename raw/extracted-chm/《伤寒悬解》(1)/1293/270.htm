<tr><td valign="top"><hr /><center><h1>阳明外证四　阳明六</h1></center>
<p><strong>【185】伤寒，发热无汗，呕不能食，而反汗出濈濈然者，是转属阳明也。</strong></p><p>太阳伤寒，经证未解，发热无汗，呕不能食，缘寒邪束迫，胃气壅逆，故无汗而呕，食不能下也。而反汗出濈濈然者，必因胃腑有热，蒸其皮毛，是为转属阳明也。</p>
