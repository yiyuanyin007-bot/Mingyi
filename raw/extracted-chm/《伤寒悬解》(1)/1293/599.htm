<tr><td valign="top"><hr /><center><h1>不可汗十八</h1></center>
<p><strong>【　】诸逆发汗，病微者难差，剧者言乱目弦者死，命将难全。</strong></p><p>诸厥逆之证，阳气最虚，汗之阳脱阴败，则言乱目眩而死。</p>
