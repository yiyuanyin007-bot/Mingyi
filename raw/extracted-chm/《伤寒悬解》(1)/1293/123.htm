<tr><td valign="top"><hr /><center><h1>忌桂枝证十三　太阳十七</h1></center>
<p><strong>【19】凡服<a href="http://ww%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤吐者，其后必吐脓血也。</strong></p><p>大凡服<a href="http://ww%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤即吐者，胸膈湿热郁遏，<a href="http://ww%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>益其膈热，下咽即吐。缘其胃气上逆，心下痞塞，肺郁生热，无路下达，<a href="http://ww%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>辛温之性，至胸而出，不得入胃腑而行经络，是以吐也。其后湿热瘀蒸，必吐脓血。此宜凉辛清利之剂，不宜辛温也。</p>
