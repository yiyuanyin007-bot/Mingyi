<tr><td valign="top"><hr /><center><h1>四逆证二十八　厥阴二十九</h1></center>
<p><strong>【377】呕而脉弱，小便复利，身有微热，见厥者，难治，四逆汤主之。</strong>方在太阴三（方【14】）。</p><p>呕而脉弱，小便复利，身有微热，胃气之虚，小便复利，肾气之虚。（少阴病，小便利，色白者，少阴病形悉具，以其肾阳之虚也。肾司二便，寒则膀胱失约，故小便自利，《素问·脉要精微论》：水泉不止者，是膀胱不藏也）。里阳虚败，加以身有微热而厥逆者，则孤阴内盛而微阳外格，故为难治。宜四逆以回里阳也。</p>
