<tr><td valign="top"><hr /><center><h1>桂枝证八　太阳十二</h1></center>
<p><strong>【44】太阳病，外证未解者，不可下也，下之为逆，欲解外者，<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤主之。</strong></p><p>太阳病，外证未解，虽有里证，不可下也，下之卫阳内陷，此之为逆。欲解外者，不越<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>也。外解已，然后里证可议下否耳。</p>
