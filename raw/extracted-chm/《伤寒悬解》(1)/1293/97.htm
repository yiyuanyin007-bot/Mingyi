<tr><td valign="top"><hr /><center><h1>脉法七十九</h1></center>
<p><strong>问曰：人病恐怖者，其脉何状？师曰：脉形如循丝累累然，其面白脱色也。</strong></p><p>肾主恐，《素问·气厥论》：恐则气下，下之极，则肾也。少阴之脉微细，恐怖，少阴之气动，故脉细如丝累累然，惊惧不安之象也。恐主于肾，而六脉俱细，盖诸脏夺气，改而从肾也。肝藏血而主色，色者，血之华也。肝气下（恐则气下）而营血陷，不能华也。木虚而金气乘之，故色脱而面白，白者，金色也。此望切之法也。</p>
