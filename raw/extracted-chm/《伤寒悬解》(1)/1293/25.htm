<tr><td valign="top"><hr /><center><h1>脉法九</h1></center>
<p><strong>趺阳脉微而紧，紧则为寒，微则为虚，微紧相抟，则为短气。少阴脉弱而涩，弱者微烦，涩者厥逆。</strong></p><p>趺阳脉微而紧，紧则为胃气之寒，微则为胃气之虚。微紧相合，虚而且寒，浊阴凝塞，清气不升，则为短气。胃气虚寒，肾阳必败，少阴脉弱而涩，弱则血虚而微烦，涩则血寒而厥逆也。</p>
