<tr><td valign="top"><hr /><center><h1>吴茱萸证十七　少阴十八</h1></center>
<p><strong>【309】少阴病，吐利，手足厥冷，烦躁欲死者，吴茱萸汤主之。</strong>方在阳明六十（方【81】）。</p><p>吐利厥冷，烦躁欲死，则中气颓败，微阳离根矣。吴茱萸汤，<a href="http://www.zysj.com%2E%63%6E%2Fzhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>、<a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_d/dazao.html" target="_blank" title="中药材：大枣">大枣</a>，培土而补中，吴茱萸、<a href="http://www.%7A%79%73%6A%2E%63%6Fm.cn/zhongyaocai/yaocai_s/shengjiang.html" target="_blank" title="中药材：生姜">生姜</a>、温胃而回阳也。</p>
