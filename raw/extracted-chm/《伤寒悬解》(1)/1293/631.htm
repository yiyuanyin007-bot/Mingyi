<tr><td valign="top"><hr /><center><h1>可下三</h1></center>
<p><strong>【　】问曰：人病有宿食者，何以别之？答曰：寸口脉浮而大，按之反涩，尺中亦微而涩，故知有宿食。当下之，宜大承气汤。</strong>方在阳明二十一。</p><p>宿食在胃，郁格表阳，故寸口浮大，阻碍里气，故按之梗涩。尺中亦微而涩者，尺中主里也。涩即紧之变文，此申明上章之义。</p>
