<tr><td align="left">霍乱九</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>霍乱九</h1></center>
<p><strong>【385】恶寒脉微而复和，利止，亡血也，四逆加<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>汤主之。</strong></p><p>阳虚则恶寒脉微，而脉复和而无邪，利必止矣。而利泄血中温气，则气既脱而血亦亡也。气血俱虚，阴阳未尝偏胜，故脉虽微而复和。四逆加<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>汤，双补火土，并益血中之温气也。</p><p><strong>〖四逆加<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>汤〗百九　（方【107】）</strong></p><p><strong>【107】四逆加<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>汤</strong></p><p><a href="http://w%77%77%2E%7A%79%73j.com.cn/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a><em>炙，二两</em>　附子<em>生，去皮，破八片，一枚</em>　<a href="http://www.zysj.com.cn%2Fzhongyaocai/yaocai_g/ganjiang.html" target="_blank" title="中药材：干姜">干姜</a><em>一两半</em>　<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a><em>一两</em></p><p><em>上四味，以水三升，煮取一升二合，去滓，分温再服。</em></p><p>于四逆汤内加<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>一两，余依前法。</p>
