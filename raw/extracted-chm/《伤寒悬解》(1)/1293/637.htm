<tr><td valign="top"><hr /><center><h1>可下九</h1></center>
<p><strong>【　】下利差后，至其年月日复发者，以病不尽故也，当下之，宜大承气汤。</strong>方在阳明二十一。</p><p>下利差后、至其年月日而又发，以病根不尽故也。当下之，以绝其根。</p>
