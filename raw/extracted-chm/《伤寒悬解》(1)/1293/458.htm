<tr><td valign="top"><hr /><center><h1>少阴亡阳死证一　少阴三十</h1></center>
<p><strong>【300】少阴病，脉微沉细，但欲卧，汗出不烦，自欲吐，至五六日，自利，复烦躁不得卧寐者，死。</strong></p><p>脉微沉细，但欲卧者，水旺而阴盛也。汗出，自欲吐者，火泄而阳升也。微阳上越，而根本未拔，是以不烦。至五六日，寒水愈旺，下见自利，复烦不得卧寐，则阳根脱泄，必死无救也。</p>
