<tr><td valign="top"><hr /><center><h1>结胸证三　少阳三十六</h1></center>
<p><strong>【150】太阳少阳并病，而反下之，成结胸，心下硬，下利不止，水浆不下，其人心烦。</strong></p><p>太少并病，不解经邪，而反下之，因成结胸心下硬者。下而下利不止，上而水浆不入，清陷浊逆，相火郁升，其人必心烦也。</p>
