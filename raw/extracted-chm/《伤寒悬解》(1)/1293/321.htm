<tr><td valign="top"><hr /><center><h1>阳明虚证提纲　阳明五十一</h1></center>
<p><strong>【190】阳明病，若能食，名中风，不能食，名中寒。</strong></p><p>阳明之为病，胃家实也，胃实则当能食。若能食者，名为中风，是风中于表也，不能食者，名为中寒，是寒生于里也。阳明承气之证，来自中风者多。能食者，腑中阳旺，乃异日胃家燥热之根，不能食者，是阳虚而中寒，胃阳已不用事，脾阴将司其权，不得与实家之中风并论也。</p><p>下篇胃中虚冷与上篇胃家实也，虚实相对。实者，阳明之始基，虚者，太阴之初气也。</p>
