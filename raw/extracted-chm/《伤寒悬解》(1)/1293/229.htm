<tr><td valign="top"><hr /><center><h1>太阳坏病入厥阴去路　一章</h1></center>
<p>厥阴以风木主令，阴盛之人，病在太阳，木郁将发。一有汗、下、温针之逆，阳败水寒，乙木失温，生气不遂，厥阴之病，相继作矣。</p>
