<tr><td valign="top"><hr /><center><h1>五苓散证二　太阳七十二</h1></center>
<p><strong>【72】发汗已，脉浮数，烦渴者，五苓散主之。</strong>方在太阳四十一（方【32】）。</p><p>发汗已，热随汗散，乃脉见浮数而证见烦渴，是汗出阳虚，土湿而火升也。盖火秘阳蛰，全恃乎土，阳亡湿动，肺胃不降，君火升炎，故脉证如此，宜以五苓燥土泻湿。若未汗而见浮数烦渴之脉证，则宜大青龙而不宜五苓矣。</p>
