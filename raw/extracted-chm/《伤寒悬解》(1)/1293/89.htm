<tr><td valign="top"><hr /><center><h1>脉法七十一</h1></center>
<p><strong>又未知何脏阴阳先绝？若阳气前绝，阴气后竭者，其人死，身色必青，阴气前绝，阳气后竭者，其人死，身色必赤，腋下温，心下热也。</strong></p><p>青者，木色，肝肾皆阴也。赤者，火色，心肺皆阳也。腋下、心下者，阳之部。温热者，阳之气也。</p>
