<tr><td valign="top"><hr /><center><h1>可下二</h1></center>
<p><strong>【　】脉双弦而迟者，必心下硬，脉大而紧者，阳中有阴也，可以下之，宜大承气汤。</strong>方在阳明二十一。</p><p>心下硬者，虽关与寸平，上章。然胆木不降，必见弦象。脉双弦而迟者，是胆经郁塞，降令不遂，必心下痞硬，若脉大而紧者，是阳明胃中有未消之谷，外为胆经郁遏，里不能容而表不能达，故浮大而紧涩也。此可下之，宜大承气汤，泻其宿食也。</p>
