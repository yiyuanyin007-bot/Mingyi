<tr><td valign="top"><hr /><center><h1>脉法五十九</h1></center>
<p><strong>诸脉浮数，当发热，而洒淅恶寒，若有痛处，饮食如常者，此内热蓄积，而有痈脓也。</strong></p><p>诸脉浮数，应当发热，而洒淅恶寒，若有痛处，饮食如常者，此内热蓄积，而有痈脓也。盖郁热在内，不得外发，故肉腐为脓，而阳遏不达，故见恶寒也。</p>
