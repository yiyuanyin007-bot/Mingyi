<tr><td valign="top"><hr /><center><h1>可下七</h1></center>
<p><strong>【　】伤寒后，脉沉沉者，内实也，下解之，宜大<a href="http://www.zysj%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤。</strong>方在少阳十三。</p><p>脉沉沉者，少阳之经郁逼阳明之腑也，故宜大<a href="http://www.zysj%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤，外散甲木之邪，内泄戊土之郁。表里双解，故曰下解。缘少阳经气不舒，逼侵胃腑，胃热而郁，不得外达，故脉气沉沉而郁荡也。</p>
