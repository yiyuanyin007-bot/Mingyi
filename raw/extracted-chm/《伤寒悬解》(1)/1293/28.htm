<tr><td valign="top"><hr /><center><h1>脉法十二</h1></center>
<p><strong>趺阳脉沉而数，沉为实，数消谷，紧者，病难治。</strong></p><p>趺阳脉沉而数，沉为内实，数则消谷，是胃阳之盛者也。设使兼紧者，则病为难治矣。紧者，阳为邪郁而不达也，风寒外束，甲木郁迫，故见紧象。</p>
