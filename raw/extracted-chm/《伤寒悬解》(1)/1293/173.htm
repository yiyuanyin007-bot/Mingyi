<tr><td valign="top"><hr /><center><h1>太阳坏病入阳明去路　十五章</h1></center>
<p>阳明从燥金化气，阳旺之人，表郁则燥动。然不经误治，津液未耗，燥气之作，何至遽盛？及其汗、下、温针，伤津亡液，燥气大发，经腑合邪，乃成下证。虽不如三阴之险，然阴亏阳亢，亦伏危机，未可率然也。</p>
