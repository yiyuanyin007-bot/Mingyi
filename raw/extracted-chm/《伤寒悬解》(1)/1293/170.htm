<tr><td valign="top"><hr /><center><h1>提纲　二章</h1></center>
<p><a href="http://www.zysj.com.cn%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>、麻黄，太阳风寒主方也。若至三日之久，正将入阳明、太阴之期，业经汗、下、温针，而病仍不解，则事当大坏，未必犹在太阳。即太阳未罢，而亦未必尚属太阳桂、麻之证，是宜审观脉证，另立新法，故总立坏病之纲，详开救逆之门也。</p>
