<tr><td valign="top"><hr /><center><h1>太阳坏病结胸证　十二章</h1></center>
<p>结胸者，异日之阳明，今日下早而成者也。胃腑燥热，汗亡其阴，则成阳明，胸膈湿热，下陷其阳，则成结胸。若迟延数日，湿被燥夺，表寒已解，腑热既实，一下而愈，何至于此。故太阳而见阳明之证，宁迟迟而用承气，勿匆匆而用陷胸。盖结胸乃阳明之坏病也，阳明之病在腹，结胸之病在胸，承气泻下焦之燥热，陷胸泻上焦之湿热，高下不同，燥湿亦异也。</p>
