<tr><td align="left">差后劳复二</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>差后劳复二</h1></center>
<p><strong>【397】伤寒解后，虚赢少气，气逆欲吐者，竹叶石膏汤主之。</strong></p><p>病后中气虚，胃逆，故虚赢少气，气逆欲吐。胃逆则火金不降，肺热郁生。竹叶石膏汤，竹叶、石膏，清金而润燥，参、甘、粳米、半夏，补中而降逆也。</p><p><strong>〖竹叶石膏汤〗百十　（方【113】）</strong></p><p><strong>【113】竹叶石膏汤</strong></p><p>竹叶<em>二把</em>　石膏<em>一斤</em>　半夏<em>洗，半升</em>　麦门冬<em>去心，一升</em>　<a href="http://www.zysj.com.cn%2Fzhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a><em>二两</em>　<a href="http://ww%77%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a><em>炙，二两</em>　粳米<em>半升</em></p><p><em>上七味，以水一斗，煮取六升，去滓；内粳米，煮米熟，汤成去米，温服一升，日三服。</em></p>
