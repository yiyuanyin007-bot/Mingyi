<tr><td valign="top"><hr /><center><h1>脉法五十二</h1></center>
<p><strong>问曰：脉有相乘，有纵有横，有逆有顺，何谓也？师曰：水行乘火，金行乘木，名曰纵。火行乘水，木行乘金，名曰横。水行乘金，火行乘木，名曰逆。金行乘水，木行乘火，名曰顺也。</strong></p><p>脉有脏腑相乘，上章。而相乘之中，有纵有横，有逆有顺。水行乘火，金行乘木，是乘其所胜，名曰纵。火行乘水，木行乘金，是乘其所不胜，名曰横。水行乘金，火行乘木，是子乘其母，名曰逆。金行乘水，木行乘火，是母乘其子，名曰顺也。</p>
