<tr><td valign="top"><hr /><center><h1>阳明腑病　二十七章</h1></center>
<p>阳明病，自经传腑，腑病宜下，其经证未罢，犹见恶寒，则宜先汗而后下。经证已解，恶寒不作，而潮热汗出，全是腑证，当相其缓急而用下法也。</p>
