<tr><td valign="top"><hr /><center><h1>湿病六</h1></center>
<p><strong>【　】问曰：风湿相抟，一身尽疼痛，法当汗出而解，值天阴雨不止，医云此可发汗，汗之病不愈者，何也？答曰：发其汗，汗大出者，但风气去，湿气在，是故不愈也。若治风湿者，发其汗，但微微似欲汗出者，风湿俱去也。</strong></p><p>湿为阳虚，发汗太大，风去而阳亡，阴旺湿增，又值阴雨湿盛之时，是以湿气仍在。此当微汗以泻之，则风湿俱去矣。</p>
