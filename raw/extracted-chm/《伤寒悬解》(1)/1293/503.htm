<tr><td valign="top"><hr /><center><h1>四逆证二十一　厥阴二十二</h1></center>
<p><strong>【354】大汗，若大下，利而厥冷者，四逆汤主之。</strong>方在太阴三（方【14】）。</p><p>大汗大下，败其中气，下利而厥冷者，阳亡火败，宜四逆双补火土，以回阳气。</p>
