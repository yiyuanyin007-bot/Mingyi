<tr><td valign="top"><hr /><center><h1>葛根证六　阳明十八</h1></center>
<p><strong>【32】太阳与阳明合病者，必自下利，<a href="http://www.z%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>汤主之。</strong></p><p>太阳表寒外束，经络壅迫，郁遏阳明胃气，不能容纳水谷，已化之食，必当注泄而下，<a href="http://www.z%79%73%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/gegen.html" target="_blank" title="中药材：葛根">葛根</a>、麻黄，泻二阳之卫郁，以松里气也。</p>
