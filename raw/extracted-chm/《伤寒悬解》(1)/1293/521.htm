<tr><td valign="top"><hr /><center><h1>厥阴阳回不死证一　厥阴三十八</h1></center>
<p><strong>【365】下利，脉沉弦者，下重也，脉大者，为未止，脉微弱数者，为欲自止，虽发热，不死。</strong></p><p>下利而脉沉弦者，肝木郁陷而后重也。设其脉大者，是利亡肝脾之阳，枯木贼土，利为未止。是即<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_d/danggui.html" target="_blank" title="中药材：当归">当归</a>四逆证之浮革。若脉微弱数者，是脾阳欲复，肝邪将退，为欲自止，虽外见发热，然续将自还，不至死也。</p>
