<tr><td valign="top"><hr /><center><h1>可吐二</h1></center>
<p><strong>【　】病胸上诸实，胸中郁郁而痛，不能食，欲使人按之，而反有涎唾，下利日十余行，其脉反迟，寸口脉微涩，此可吐之，吐之利即止。</strong></p><p>胸上诸实者，内有败浊之物，非无形之空气也。败浊阻碍，肺气壅塞，故胸中郁郁而痛，不能下食，浊气冲突，欲使人按之。按之壅遏肺气，津液上涌，故反有涎唾。浊阴上逆，则清阳下陷，故下利日十余行。阴盛于下，故脉反迟。浊物填塞，清气阻滞，故脉涩见于寸口。此可吐之，吐之则败浊去而清阳升，利即止也。</p>
