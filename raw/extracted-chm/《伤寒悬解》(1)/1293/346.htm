<tr><td valign="top"><hr /><center><h1>发热色黄证二十五　阳明七十六</h1></center>
<p><strong>【206】阳明病，面合赤色，不可攻之，必发热，色黄，小便不利也。</strong></p><p>表寒外束，郁其经热，则面见赤色，此可汗而不可攻。以面之赤色，是经热而非腑热，腑热则毛蒸汗泄，阳气发越，而无赤色。攻之则阳败湿作，而表寒未解，湿郁经络，必发热色黄，小便不利也。</p>
