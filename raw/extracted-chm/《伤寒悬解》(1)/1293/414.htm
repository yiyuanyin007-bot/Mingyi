<tr><td align="left">桂枝芍药证七　太阴八</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>桂枝芍药证七　太阴八</h1></center>
<p><strong>【279】本太阳病，医反下之，因而腹满时痛者，属太阴也，<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加芍药汤主之。</strong></p><p>本太阳表证，医不解表，而反下之，脾败肝郁，因而腹满时痛者，此属太阴也。<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加芍药汤，<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>解太阳之表邪，芍药清乙木之风燥也。</p><p><strong>〖<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加芍药汤〗七十八　（方【85】）</strong></p><p><strong>【85】<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加芍药汤</strong></p><p><a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a><em>去皮，三两</em>　芍药<em>六两</em>　<a href="http://www.zysj.co%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a><em>炙，二两</em>　<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_d/dazao.html" target="_blank" title="中药材：大枣">大枣</a><em>擘，十二枚</em>　<a href="http://www.zysj.com%2E%63%6E%2Fzhongyaocai/yaocai_s/shengjiang.html" target="_blank" title="中药材：生姜">生姜</a><em>切，三两</em></p><p><em>上五味，以水七升，煮取三升，去滓，温分三服。本云<a href="http://www.zysj.c%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤，今加芍药。</em></p>
