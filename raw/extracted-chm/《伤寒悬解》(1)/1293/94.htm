<tr><td valign="top"><hr /><center><h1>脉法七十六</h1></center>
<p><strong>师曰：病家人来请云，病人发热烦极。明日师到，病人向壁卧，此热退也。设令脉不和，处言已愈。</strong></p><p>发热烦极，必不得卧，向壁静卧，此烦热已去也。假令脉犹未和，亦顷当自愈，此可处言已愈也。此望知之法也。</p>
