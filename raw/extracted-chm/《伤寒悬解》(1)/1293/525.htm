<tr><td valign="top"><hr /><center><h1>阳回圊脓证五　厥阴四十二</h1></center>
<p><strong>【363】下利，寸脉反浮数，尺中自涩者，必圊脓血。</strong></p><p>下利而寸脉反见浮数，是阳复而上盛也。尺中自涩者，是阴退而下虚也。阳盛必俯侵阴位，郁蒸营分，而圊脓血也。</p>
