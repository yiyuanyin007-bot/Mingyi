<tr><td valign="top"><hr /><center><h1>下利脓血证二十七　少阴二十八</h1></center>
<p><strong>【308】少阴病，下利便脓血者，可刺。</strong></p><p>《灵枢·脉度》：盛者泻之，虚者饮药以补之。桃花汤之治便脓血之虚者也，若稍盛而生热者，可刺经穴以泻之。</p>
