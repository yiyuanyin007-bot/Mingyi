<tr><td valign="top"><hr /><center><h1>厥少热多证六　厥阴七</h1></center>
<p><strong>【341】伤寒发热四日，厥反三日，复热四日，厥少热多，其病当愈。四日至七日，热不除者，必便脓血。</strong></p><p>阳胜而发热四日，阴复而厥者反止三日，复阳胜而发热者又是四日，厥少而热多，其病当愈。然热不宜太胜，四日至七日，而热不除者，积热伤阴，必便脓血也。</p>
