<tr><td valign="top"><hr /><center><h1>阳回证四　少阴三十九</h1></center>
<p><strong>【287】少阴病，脉紧，至七八日，自下利，脉暴微，手足反温，脉紧反去者，为欲解也，虽烦下利，必自愈。</strong></p><p>寒盛则脉紧，至七八日而自下利，则脏寒日甚矣。而脉忽暴微，手足反温，脉紧反去者，此为阳复而欲解也。虽烦而下利，必当自愈。微者，紧之反，缓之始也。白通汤证之脉，是阳绝之微，此是阳欲复之微也。</p>
