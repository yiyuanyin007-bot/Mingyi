<tr><td valign="top"><hr /><center><h1>脉法下篇提纲</h1></center>
<p>营卫之消息，是不一端，脏腑之乘除，是不一致，支派分别，不可纪极，而溯本</p><p>穷源，不过阴阳二者而已。诊阴阳之异同，判死生之悬殊。生之与死，孰美孰恶，阴</p><p>之与阳，孰贵孰贱。解此章之义，则以下诸章决生断死之方，起死回生之法，悉具于</p><p>此矣。</p>
