<tr><td valign="top"><hr /><center><h1>小柴胡证六　少阳二十九</h1></center>
<p><strong>【101】凡<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤病证而下之，若<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>证不罢者，复与<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤，必蒸蒸而振，却发热汗出而解。</strong></p><p><a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>证，本不宜下，而误下之，<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>证罢，此为坏病。若其证不罢，复与<a href="http://www.%7A%79%73%6A%2E%63%6F%6D%2E%63n/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤，必蒸蒸而振栗，却发热汗出而解。阳气欲发，为阴邪所束，郁勃鼓动，故振栗战摇。顷之透发肌表，则汗而解矣。</p>
