<tr><td valign="top"><hr /><center><h1>挂枝证十　太阳十四</h1></center>
<p><strong>【116】……欲自解者，必当先烦，乃有汗而解，何以知之？脉浮，故知汗出解。</strong></p><p>按①：宛邻本原脱此一条，今补于此，文在太阳篇也。黄氏注，不可考，大抵亦同上条注。</p><p><em>①按　清·徐受衡（树铭）按。</em></p>
