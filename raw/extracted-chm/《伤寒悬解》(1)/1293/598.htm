<tr><td valign="top"><hr /><center><h1>不可汗十七</h1></center>
<p><strong>【　】咳者则剧，数吐涎沫，咽中必干，小便不利，心中饥烦，晬时而发，其形似疟，有寒无热，虚而寒栗。咳而发汗，蜷而苦满，腹中复坚。</strong></p><p>凡病见咳，则证更剧。咳家多缘水旺土湿，肺气冲逆之故。气不清降，则津液凝结，化生涎沫。咽喉失滋，是以必干。气逆不能化水，故小便不利。此其清阳下陷，心中饥馁，君火不降，又觉烦生。晬时气虚寒战，发作如疟，但无热耳。咳而发汗，阳亡湿动，必蜷卧恶寒，而苦腹满，腹中复觉坚硬也。</p>
