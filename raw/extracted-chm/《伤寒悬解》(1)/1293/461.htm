<tr><td valign="top"><hr /><center><h1>死证四　少阴三十三</h1></center>
<p><strong>【295】少阴病，恶寒身蜷而利，手足逆冷者，不治。</strong></p><p>恶寒身蜷，加以下利，则阳有日断之忧，兼之手足逆冷，则阳无来复之望，不可治也。</p>
