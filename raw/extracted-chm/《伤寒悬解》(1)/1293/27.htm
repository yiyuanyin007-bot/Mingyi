<tr><td valign="top"><hr /><center><h1>脉法十一</h1></center>
<p><strong>趺阳脉滑而紧，滑者胃气实，紧者脾气强，持实击强，痛还自伤，以手把刃，坐作疮也。</strong></p><p>趺阳脉滑而紧，滑者胃气之实，紧者脾气之强，一实一强，两者不和，必至相击，持胃气之实，击脾气之强，强不受击，则痛还自伤，譬之以手抱刃自伤，坐作金疮也。此阴阳相干之义。乃太过不及之可怪者。</p>
