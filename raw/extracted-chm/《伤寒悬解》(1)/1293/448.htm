<tr><td valign="top"><hr /><center><h1>猪苓证二十　少阴二十一</h1></center>
<p><strong>【319】少阴病，下利六七日，咳而呕渴，心烦，不得眠者，猪苓汤主之。</strong>方在阳明六十五（方【77】）。</p><p>脾陷而为利，胃逆而为呕，肺逆而为咳，火升而为烦渴，阳泄而废卧眠，是皆水泛而土湿故也。宜猪苓汤，二苓、滑、泽、渗己土而泻湿，阿胶滋乙木而润燥也。</p>
