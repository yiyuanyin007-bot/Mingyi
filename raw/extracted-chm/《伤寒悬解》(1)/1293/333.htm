<tr><td valign="top"><hr /><center><h1>心下硬满证十二　阳明六十三</h1></center>
<p><strong>【205】阳明病，心下硬满者，不可攻之。攻之利遂不止者死，利止者愈。</strong></p><p>心下痞者，太阴之证，太阴病，腹满而吐，自利益甚，下之必胸下结硬是也。阳明之病，而见太阴心下硬满之证，阴盛即弱，故不可攻之。攻之脾阳陷败，利遂不止者死，阳回利止者，则愈也。</p>
