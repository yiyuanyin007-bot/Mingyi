<tr><td valign="top"><hr /><center><h1>无汗发黄证二十六　阳明七十七</h1></center>
<p><strong>【199】阳明病，无汗，小便不利，而心中懊憹者，身必发黄。</strong></p><p>饮入于胃，胃阳蒸动，化而为气，气降则水化。阳气升发，则化水之气外泄而为汗，阳气收藏，则气化之水下注而为尿，汗出水利，湿热发泄，故不发黄。无汗而小便不利，湿气莫泄，郁而生热，熏蒸于上，则心中懊憹，身必发黄也。</p>
