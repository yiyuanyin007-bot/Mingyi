<tr><td valign="top"><hr /><center><h1>四逆证二　阳明五十三</h1></center>
<p><strong>【225】脉浮而迟，表热里寒，下利清谷者，四逆汤主之。</strong>方在太阴三。</p><p><strong>【226】若胃中虚冷，不能食者，饮水则哕。</strong></p><p>水寒侮土，胃中虚冷，不能食者，饮水则以水济水，必发哕也。</p>
