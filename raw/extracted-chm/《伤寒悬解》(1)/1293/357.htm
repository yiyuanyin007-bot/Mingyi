<tr><td valign="top"><hr /><center><h1>少阳经提纲　少阳一</h1></center>
<p><strong>【263】少阳之为病，口苦、咽干、目眩也。</strong></p><p>足少阳之经，起目锐眦，下颈，合缺盆，口、咽、目，皆少阳经脉之所循。少阳以下行为顺，病则经气壅遏，逆循头面，相火燔腾，故见证如此。苦者火之味，炎上作苦也。眩者相火离根，升浮旋转之象也。《素问·标本病传论》：肝病头目眩，肝胆同气也。</p>
