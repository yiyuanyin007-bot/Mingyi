<tr><td valign="top"><hr /><center><h1>少阴经提纲一　少阴一</h1></center>
<p><strong>【281】少阴之为病，脉微细，但欲寐也。</strong></p><p>少阴，肾之经也。阴盛于水，独阴无阳，故脉微细。阳动而阴静，静则善眠，故曰欲寐。</p><p>脉法：浮为在表，沉为在里，数为在腑，迟为在脏，少阴之脉微细，必兼沉也。</p>
