<tr><td valign="top"><hr /><center><h1>传经三　太阳五十</h1></center>
<p><strong>【10】风家，表解而不了了者，十二日愈。</strong></p><p>《素问·热论》：七日巨阳病衰，头痛少愈。八日阳明病衰，身热少愈。九日少阳病衰，耳聋微闻。十日太阴病衰，腹减如故，则思饮食。十一日少阴病衰，渴止不满，舌干已而嚏。十二日厥阴病衰，囊纵，少腹微下，大气皆去，病已愈矣。中风表解，自当即愈，设不了了，则余热未尽，俟至十二日经邪尽解，无不愈矣。</p><p>风寒与温热之病，里气不同，而其经脉之络属，伤受之日期，无有不同也。</p>
