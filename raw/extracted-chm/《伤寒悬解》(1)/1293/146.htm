<tr><td valign="top"><hr /><center><h1>小青龙证三　太阳三十六</h1></center>
<p><strong>【41】伤寒，心下有水气，咳而微喘，发热不渴，小青龙汤主之。服汤已渴者，</strong></p><p><strong>此寒去欲解也。</strong></p><p>服汤已而渴者，表寒已解，里水亦去，津液乍耗，是以作渴。渴者，是表解寒去，积水化汗而外泻也。</p><p>大青龙证是表阳之盛，内有火气，小青龙证是里阳之虚，内有水气。阴阳一偏，逢郁即发，大小青龙外解风寒而内泻水火，感证之必不可少者也。</p>
