<tr><td valign="top"><hr /><center><h1>彻热除中证八　厥阴九</h1></center>
<p><strong>【333】伤寒脉迟，六七日，而反与<a href="http://www.zysj.com%2E%63%6E%2Fzhongyaocai/yaocai_h/huangqin.html" target="_blank" title="中药材：黄芩">黄芩</a>汤彻其热，脉迟为寒，今与<a href="http://www.zysj.com%2E%63%6E%2Fzhongyaocai/yaocai_h/huangqin.html" target="_blank" title="中药材：黄芩">黄芩</a>汤复除其热，腹中应冷，当不能食，今反能食，此名除中，必死。</strong></p><p>伤寒脉迟，是阳虚之证，六七日间，阴气愈旺，乃见其外热，而反与<a href="http://www.zysj.com%2E%63%6E%2Fzhongyaocai/yaocai_h/huangqin.html" target="_blank" title="中药材：黄芩">黄芩</a>汤，以彻其热。脉迟为内寒，今与<a href="http://www.zysj.com%2E%63%6E%2Fzhongyaocai/yaocai_h/huangqin.html" target="_blank" title="中药材：黄芩">黄芩</a>汤复除其热，腹中应冷，当不能食，今反能食，此名除中，以寒凉败其中气，中气除根，而居膈上。虽暂时能食，顷则上脱，必主死也。</p>
