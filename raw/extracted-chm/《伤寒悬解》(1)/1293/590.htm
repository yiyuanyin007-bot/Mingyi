<tr><td valign="top"><hr /><center><h1>不可汗九</h1></center>
<p><strong>【　】动气在下，不可发汗，发汗则无汗，心中大烦，骨节苦疼，目晕恶寒，食则反吐，谷不得前。</strong></p><p>动气在下，风木振摇而脐下动悸也。此缘水寒木郁，汗之阴旺无汗，而微阳升泄，心中大烦。阴旺湿作，骨节苦痛。阳飞火败，目晕恶寒。土败胃逆，食则反吐，谷不得入也。</p>
