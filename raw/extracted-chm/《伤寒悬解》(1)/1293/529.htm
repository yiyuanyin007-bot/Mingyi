<tr><td valign="top"><hr /><center><h1>阳回热利证九　厥阴四十六</h1></center>
<p><strong>【371】热利下重者，白头翁汤主之。</strong></p><p>阳回热过，肝气郁陷，泄利未止，而益以后重，宜白头翁汤清其郁热也。</p>
