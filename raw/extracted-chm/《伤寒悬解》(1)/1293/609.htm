<tr><td valign="top"><hr /><center><h1>不可下九</h1></center>
<p><strong>【　】动气在上，不可下，下之则掌握烦热，身上浮冷，热汗自泄，欲得水自灌。</strong></p><p>动气在上，风木郁冲于心下也。下之，温气外泄，风木不敛，故烦热汗出，欲得水灌。</p>
