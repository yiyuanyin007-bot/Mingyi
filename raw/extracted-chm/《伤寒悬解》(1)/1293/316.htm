<tr><td valign="top"><hr /><center><h1>热入血室证三　阳明四十九</h1></center>
<p><strong>【216】阳明病，下血谵语者，此为热入血室，但头汗出者，刺期门，随其实而泄之，濈然汗出则愈。</strong></p><p>心藏神，而神之魂藏于血，血热则心神昏乱，而作谵语。但头汗出者，阳盛于上，而表不能闭也。身上无汗，则热郁血分，不得外泄，宜刺期门，以泻血热，随其实处而泻之，令其濈然汗出则愈也。期门，肝脉之穴，在于乳上，肝藏血，故刺厥阴之期门。此妇人病，《金匮》入妇人杂病中。</p>
