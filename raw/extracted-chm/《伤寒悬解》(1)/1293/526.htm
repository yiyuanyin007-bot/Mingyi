<tr><td valign="top"><hr /><center><h1>阳回自愈证六　厥阴四十三</h1></center>
<p><strong>【360】下利，有微热而渴，脉弱者，令自愈。</strong></p><p>有微热而渴，是阳复矣，脉弱则无余热，故令自愈。</p><p>盖脉数则阳复，数而大则热有余，而便脓血，数而弱则热不胜，而令自愈。前章：脉微弱数者，为欲自止，正此义也。</p>
