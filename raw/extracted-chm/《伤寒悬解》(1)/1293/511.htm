<tr><td valign="top"><hr /><center><h1>热厥下利证二十九　厥阴三十</h1></center>
<p><strong>【348】发热而厥七日，下利者，为难治。</strong></p><p>发热而见厥逆，阴盛而阳不归也。至于七日之久，是微阳来复之时，而又见下利，则里阳败泄，难望其复，故为难治。</p>
