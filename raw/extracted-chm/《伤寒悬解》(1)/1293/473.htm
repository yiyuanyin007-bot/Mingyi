<tr><td valign="top"><hr /><center><h1>土胜水负大承气证四　少阴四十三</h1></center>
<p><strong>【321】少阴病，自利清水，色纯青，心下必痛，口干燥者，急下之，宜大承气汤。</strong>方在阳明二十一（方【75】）。</p><p>肝主疏泄，故见自利。青为木色。厥阴之经，布胁肋而贯膈，脉循心下，经脉燥急，故痛作焉。厥阴之经，循喉咙而环唇，风动津耗，故口干燥。燥土克水，水涸则木枯，木枯则风动，肾水愈消，更当急下。此与阳明目中不了了章义同。</p>
