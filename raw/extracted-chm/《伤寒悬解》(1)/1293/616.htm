<tr><td valign="top"><hr /><center><h1>不可下十六</h1></center>
<p><strong>【　】发汗多，亡阳谵语者，不可下，与<a href="http://www.zy%73%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a><a href="http://www%2E%7Aysj.com.cn/zhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤，方在少阳七。和其营卫，以通津液，后自愈。</strong></p><p>营卫和而津液通，神气渐复，谵语自止。</p>
