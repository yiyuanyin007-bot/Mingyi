<tr><td valign="top"><hr /><center><h1>阳虚耳聋证七　太阳九十八</h1></center>
<p><strong>【75】未持脉时，病人叉手自冒心，师因教试令咳，而不咳者，此必两耳聋，无闻也。所以然者，以重发汗，虚故如此。</strong></p><p>五脏阴也，阴中有阳，清阳升发，开窍五官，浊阴下降，七窍空灵，故能闻见。汗伤中气，肝脾不升，肺胃不降，清阳下陷，浊阴上逆，浊气湮塞，听宫障蔽，是以聋也。</p>
