<tr><td valign="top"><hr /><center><h1>脉法七十四</h1></center>
<p><strong>师曰：脉病人不病，名曰行尸，以无王气，卒眩仆，不识人者，短命则死。人病脉不病，名曰内虚，以无谷神，虽困无苦。</strong></p><p>脉病人不病，名曰行尸，以其脉病而无王气，倘卒然眩仆，不识人者，值其人之短命则死矣。人病脉不病者，名曰内虚，以其谷神之不旺，病在形骸而不在精神，虽困无妨也。</p>
