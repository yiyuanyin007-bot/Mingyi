<tr><td valign="top"><hr /><center><h1>微汗发黄证二十七　阳明七十八</h1></center>
<p><strong>【200】阳明病，被火，额上微汗出，小便不利者，必发黄。</strong></p><p>阳明病，无汗，是阳虚而土湿者。以火熏发汗，但额上微汗出，而身上无汗，小便不利者，湿无泄路，郁而生热，必发黄也。</p>
