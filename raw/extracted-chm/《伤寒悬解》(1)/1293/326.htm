<tr><td valign="top"><hr /><center><h1>哕而腹满证五　阳明五十六</h1></center>
<p><strong>【381】伤寒，哕而腹满，视其前后，知何部不利，利之则愈。</strong></p><p>哕而腹满，阳明之浊气不降，太阴之清气不升也，前后二阴，必有不利之部。前部不利，利其水道，后部不利，利其谷道，腹满之病，不过气水停郁二者而已。</p>
