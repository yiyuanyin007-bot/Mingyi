<tr><td valign="top"><hr /><center><h1>不可汗六</h1></center>
<p><strong>【　】动气在左，不可发汗，发汗则头眩，汗不止，筋惕肉瞤。</strong></p><p>动气在左，肝气之郁。汗泄肝气，则阳气飞升而头上眩晕，风木疏泄而汗出不止，风木摇撼而筋惕肉瞤。</p>
