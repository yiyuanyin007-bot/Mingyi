<tr><td valign="top"><hr /><center><h1>小柴胡证三十二　阳明八十三</h1></center>
<p><strong>【230】阳明病，胁下硬满，不大便而呕，舌上白胎者，可与小<a href="http://ww%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_c/chaihu.html" target="_blank" title="中药材：柴胡">柴胡</a>汤。</strong>方在少阳二（【19】）。<strong>上焦得通，津液得下，胃气因和，身濈然而汗出解也。</strong></p><p>阳明为少阳所遏，下脘之气陷，则病溏泄，上脘之气逆，则病呕吐。胃逆而津液不降，心部瘀浊，故舌起白胎，由肺壅塞，而上焦不通也。柴、芩泻少阳经邪，松其郁迫，故上焦通而津液下，胃气和而汗出解也。</p>
