<tr><td valign="top"><hr /><center><h1>三阳合病证二十二　阳明四十一</h1></center>
<p><strong>【268】三阳合病，脉浮大，上关上，但欲眠睡，目合则汗。</strong></p><p>太阳传阳明、少阳，阳明腑病，而太、少之经邪未解，是为三阳合病。太阳之脉浮，阳明之脉大，胆气候于左关，胃气候于右关，胆胃不降，二气逆行，故脉上关上。胆热则甲木克土，土气困乏，故欲眠睡。平人寐则阳气内蛰，三阳合病，阳盛于外，寐时阳气不敛，郁蒸而开皮毛，故目合则汗也。</p>
