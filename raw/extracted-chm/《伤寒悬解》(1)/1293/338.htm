<tr><td valign="top"><hr /><center><h1>谵语郑声证十七　阳明六十八</h1></center>
<p><strong>【210】夫实则谵语，虚则郑声，郑声，重语也。</strong></p><p>阳实则为谵语，阳虚则为郑声。郑声之义，语之繁絮重复者。实者，上篇之胃家实是也，虚者，本篇之胃中虚冷是也。</p><p>此申明上章亡阳谵语之义。</p>
