<tr><td valign="top"><hr /><center><h1>麻黄证六　太阳二十五</h1></center>
<p><strong>【55】伤寒脉浮紧，不发汗，因致衄者，宜麻黄汤主之。</strong></p><p>浮紧之脉，应当发汗，失不发汗，卫郁莫泄，因而致衄，是缘不早服麻黄，故至此，当先以麻黄发之，勿俟其衄也。</p>
