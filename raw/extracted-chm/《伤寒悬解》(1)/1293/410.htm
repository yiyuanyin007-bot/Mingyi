<tr><td valign="top"><hr /><center><h1>下利清谷证三　太阴四</h1></center>
<p><strong>【364】下利清谷，不可攻表，汗出必胀满。</strong></p><p>脉沉已当温里，不可发表，若见下利清谷之证，则脏病益显，不可攻表。汗出亡阳，必生胀满。</p>
