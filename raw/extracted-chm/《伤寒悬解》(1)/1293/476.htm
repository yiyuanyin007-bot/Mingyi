<tr><td valign="top"><hr /><center><h1>少阴中风欲愈一　少阴四十五</h1></center>
<p><strong>【290】少阴中风，脉阳微阴浮，为欲愈。</strong></p><p>太阳中风，而传少阴，是谓少阴中风。微者紧之反，浮者沉之反，寸微尺浮，是沉紧已去，阴退阳复之象，故为愈兆。</p>
