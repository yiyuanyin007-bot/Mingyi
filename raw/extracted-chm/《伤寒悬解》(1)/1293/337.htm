<tr><td valign="top"><hr /><center><h1>谵语喘满证十六　阳明六十七</h1></center>
<p><strong>【210】直视谵语，喘满者死，下利者，亦死。</strong></p><p>直视谵语，阳亡而神败也。喘满则胃逆而阳上脱，下利则脾陷而阳下脱，是以皆死。</p>
