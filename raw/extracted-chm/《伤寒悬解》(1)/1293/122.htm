<tr><td valign="top"><hr /><center><h1>忌桂枝证十二　太阳十六</h1></center>
<p><strong>【17】酒客病，不可与<a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤，得汤则呕，以洒客不喜甘故也。</strong></p><p><a href="http://www.zysj.com.cn%2Fzhongyaocai/yaocai_d/dazao.html" target="_blank" title="中药材：大枣">大枣</a>、<a href="http://www.zysj.co%6D%2E%63%6E%2Fzhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>，甘味动呕也。</p>
