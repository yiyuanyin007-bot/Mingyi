<tr><td valign="top"><hr /><center><h1>大承气证十六　阳明三十五</h1></center>
<p><strong>【238】阳明病，下之，心中懊憹而烦，胃中有燥屎者，可攻，腹微满，初头硬，后必溏，不可攻之。若有燥屎者，宜大承气汤。</strong></p><p>下之而心中懊憹而烦，胃中有燥屎者，可再攻也。平人燥屎俱在大肠，阳明病，热盛津枯，糟粕在胃，已成结燥，不须至肠，故曰胃中有燥屎。内无燥屎，胃气未至郁遏，故腹不大满也。</p>
