<tr><td valign="top"><hr /><center><h1>忌麻黄证八　太阳二十七</h1></center>
<p><strong>【50】脉浮紧者，法当身疼痛，宜以汗解之。假令脉尺中迟者，不可发汗，何以知之？然：以营气不足，血少故也。</strong>太阳入少阴去路。</p><p>卫候于寸，营候于尺，尺中迟者，营气不足，以肝脾阳虚而血少故也。汗泻营中温气，则生亡阳诸变，故不可发汗。然者，答辞，与《<a href="http://www.zys%6A%2E%63%6F%6D%2Ecn/lilunshuji/nanjing/index.html" target="_blank" title="中医书籍：难经">难经</a>》然字同义。</p>
