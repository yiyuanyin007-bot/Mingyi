<tr><td valign="top"><hr /><center><h1>内外俱虚证三　太阳九十四</h1></center>
<p><strong>【60】下之后，复发汗，必振寒，脉微细，所以然者，以内外俱虚故也。</strong></p><p>申明上章恶寒之义。汗下亡阳，必身体振寒，而经脉细微。所以然者，以下伤其内，汗泻其外，内外之阳俱虚故也。</p>
