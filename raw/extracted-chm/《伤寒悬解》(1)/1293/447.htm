<tr><td valign="top"><hr /><center><h1>呕利汗出证十九　少阴二十</h1></center>
<p><strong>【325】少阴病，下利，脉微涩，呕而汗出，必数更衣，反少者，当温其上，灸之。</strong></p><p>脾陷则为利，利亡血中温气，是以脉涩。胃逆则为呕，阳气升泄，是以汗出。阳气愈升，反则下愈寒而利愈多，必数更衣，乃利少者，是脾阳续复而胃阳欲脱也。当温其上，灸之以回胃阳也。</p>
