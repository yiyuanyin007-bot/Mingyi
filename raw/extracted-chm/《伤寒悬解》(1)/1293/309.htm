<tr><td valign="top"><hr /><center><h1>胃热阳绝证二十四　阳明四十三</h1></center>
<p><strong>【246】脉浮而芤，浮为阳，芤为阴，浮芤相抟，胃气生热，其阳则绝。</strong></p><p>浮者，阳盛而不藏也。芤者，阴虚而内空也。（外实中空，谓之芤）。浮芤相合，阳亡阴枯，是以胃气生热，其阳独绝而无伦也。</p>
