<tr><td valign="top"><hr /><center><h1>脉法十三</h1></center>
<p><strong>趺阳脉大而紧者，当即下利，为难治。</strong></p><p>趺阳脉大而紧者，胃阳为胆经所郁，不能容纳水谷，当即下利，此为难治。汗下宜忌篇：脉大而紧者，阳中有阴也，当下之，宜大承气汤，即此证也。</p>
