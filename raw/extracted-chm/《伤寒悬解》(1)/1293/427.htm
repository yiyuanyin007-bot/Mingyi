<tr><td valign="top"><hr /><center><h1>提纲　一章</h1></center>
<p>少阴虽从君火化气，病则还其本原，寒水司权，有阴无阳。寒主蛰藏，藏气当令，而无微阳以鼓之，是以脉微细而善寐。阳明之病，脉实大而不得卧者，少阴之负趺阳也，少阴之病，脉微细而但欲寐者，肤阳之负少阴也。盖土旺则不眠，水旺则善寐，自然之性如此。少阴提纲揭此一语，而少阴之性情体状传真如画，则夫扶趺阳而泻少阴，自为第一要义。于此而稍事滋润，将使之千古不寤矣。少阴醒梦之关，不可不急讲也。</p>
