<tr><td valign="top"><hr /><center><h1>表里俱虚证八　太阳六十三</h1></center>
<p><strong>【93】太阳病，先下之而不愈，因复发汗，以此表里俱虚，其人因致冒，冒家汗出则自愈，所以然者，汗出表和故也。得里未和，然后下之。</strong></p><p>太阳病，先下之而不愈，伤其阴液，因复发汗，伤其阳津，表阳里阴，以此俱虚。表阳虚则阴气外束，里阴虚则阳气内郁，阳气内郁而不外达，其人因致昏冒，冒家汗出则自愈，所以然者，汗出则卫气外达，经脉和畅，阴退而阳宣也。表和之后，得里未和，然后下之。</p>
