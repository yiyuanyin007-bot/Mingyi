<tr><td valign="top"><hr /><center><h1>脉法三十五</h1></center>
<p><strong>脉霭霭如车盖者，名曰阳结也。脉累累如循长竿者，名曰阴结也。脉瞥瞥如羹上肥者，阳气微也。脉萦萦如蜘蛛丝者，阳气衰也。脉绵绵如泻漆之绝者，亡其血也。</strong></p><p>脉霭霭郁动，如车盖之升沉者，名曰阳结也。脉累累不平，如循长竿之硬节者，名曰阴结也。脉瞥瞥虚飘，如羹上之油珠者，阳气微也。脉萦萦细弱，如蜘蛛之轻丝者，阳气衰也。脉绵绵断续，如泻漆之频绝者，亡其血也。</p>
