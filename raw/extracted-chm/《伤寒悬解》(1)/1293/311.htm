<tr><td valign="top"><hr /><center><h1>大承气证二十六　阳明四十五</h1></center>
<p><strong>【253】阳明病，发热汗多者，急下之，宜大承气汤。</strong></p><p>肾主五液，入心为汗，发热汗多，木枯土燥，伤及少阴，故当急下。</p><p>此与少阴口燥咽干章义同。</p>
