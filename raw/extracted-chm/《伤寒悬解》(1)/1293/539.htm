<tr><td valign="top"><hr /><center><h1>痉病一</h1></center>
<p><strong>【　】太阳病，发热汗出，不恶寒者，名曰柔痉。</strong></p><p>太阳病，发热汗出，不恶寒者，风伤卫也。风性柔，名曰柔痉。</p>
