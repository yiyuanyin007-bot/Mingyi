<tr><td valign="top"><hr /><center><h1>脉法十</h1></center>
<p><strong>趺阳脉不出，脾不上下，身冷肤硬。</strong></p><p>趺阳脉不出，胃气虚败，则脾不运行，中脘滞塞，不能上下升降，故身冷肤硬。以阳虚不能外达，无以温分肉而柔肌肤也。</p>
