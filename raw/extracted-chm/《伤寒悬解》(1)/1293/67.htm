<tr><td align="left">脉法四十九</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>脉法四十九</h1></center>
<p><strong>问曰：脉有残贼，何谓也？师曰：脉有弦、紧、浮、滑、沉、涩，此六脉，名曰残贼，能为诸脉作病也。</strong></p><p>残贼者，残害而贼克之也。脉弦、紧、浮、滑、沉、涩，木旺则脉弦，土虚者忌之，水旺则脉紧，火虚者忌之，表盛则脉浮，里虚者忌之，里盛则脉沉，表虚者忌之，血盛则脉滑，气虚者忌之，气盛则脉涩，血虚者忌之。此六脉，名为残贼，能为诸脉作病也。</p>
