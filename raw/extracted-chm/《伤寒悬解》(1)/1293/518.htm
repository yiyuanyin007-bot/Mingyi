<tr><td valign="top"><hr /><center><h1>死证六　厥阴三十六</h1></center>
<p><strong>【368】下利后脉绝，手足厥冷，晬时脉还，手足温者生，脉不还者死。</strong></p><p>利后脉绝，手足厥冷，阳欲断矣。晬时脉还，手足温者，经阳来复，中气渐回，如此则生。脉不还者，阳绝不复，死无望也。</p>
