<tr><td valign="top"><hr /><center><h1>太阳传经　五章</h1></center>
<p>伤寒、中风，一日太阳，二日阳明，三日少阳，四日太阴，五日少阴，六日厥阴，日传一经，六日而遍，此定数也。诸所谓不传者，言不传脏腑，并非不传经络。伤寒惟传经一事，讹谬百出，道理未为难解，自是医法不明耳。</p>
