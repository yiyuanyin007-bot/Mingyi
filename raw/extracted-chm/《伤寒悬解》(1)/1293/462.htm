<tr><td valign="top"><hr /><center><h1>死证五　少阴三十四</h1></center>
<p><strong>【297】少阴病，下利止而头眩，时时自冒者，死。</strong></p><p>下利止而眩冒者，阳根下绝，欲从上脱，是以死也。</p>
