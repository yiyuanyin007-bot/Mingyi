<tr><td valign="top"><hr /><center><h1>小青龙证二　太阳三十五</h1></center>
<p><strong>【127】太阳病，小便利者，以饮水多，必心下悸，小便少者，必苦里急也。</strong></p><p>申明上章小便不利少腹满之义。小便利者，津液渗泄，则必发燥渴。渴而饮水多者，土湿木郁，必心下动悸。水郁不能泄水，而小便少者，水积少腹，必苦腹里满急也。</p>
