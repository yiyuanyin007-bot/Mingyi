<tr><td align="left">桂枝大黄证八　太阴九</td><td align="right">《伤寒悬解》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>桂枝大黄证八　太阴九</h1></center>
<p><strong>【279】大实痛者，<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_d/daihuang.html" target="_blank" title="中药材：大黄">大黄</a>汤主之。</strong></p><p>满痛而加大实，非泻不可，<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_d/daihuang.html" target="_blank" title="中药材：大黄">大黄</a>汤，倍芍药以清木燥，而加<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_d/daihuang.html" target="_blank" title="中药材：大黄">大黄</a>，以泻土郁。</p><p><strong>〖<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_d/daihuang.html" target="_blank" title="中药材：大黄">大黄</a>汤〗七十九　（方【86】）</strong></p><p><strong>【86】<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>加<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_d/daihuang.html" target="_blank" title="中药材：大黄">大黄</a>汤</strong></p><p><a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a><em>去皮，三两</em>　<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_d/daihuang.html" target="_blank" title="中药材：大黄">大黄</a><em>二两</em>　芍药<em>六两</em>　<a href="http://www.z%79%73%6A%2E%63om.cn/zhongyaocai/yaocai_s/shengjiang.html" target="_blank" title="中药材：生姜">生姜</a><em>切，三两</em>　<a href="http://www.%7A%79sj.com.cn/zhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a><em>炙，二两</em>　<a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E%2Fzhongyaocai/yaocai_d/dazao.html" target="_blank" title="中药材：大枣">大枣</a><em>擘，十二枚</em></p><p><em>上六味，以水七升，煮取三升，去滓，温服一升，日三服。</em></p>
