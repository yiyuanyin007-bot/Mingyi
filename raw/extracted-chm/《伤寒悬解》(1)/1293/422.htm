<tr><td valign="top"><hr /><center><h1>中风欲愈十五　太阴十六</h1></center>
<p><strong>【274】太阴中风，四肢烦疼，阳微阴涩而长者，为欲愈。</strong></p><p>太阳中风，而传太阴，是谓太阴中风。脾主四肢，脾病不能行气于四肢，气血壅塞，故四肢烦疼。寸微则阳不上格，尺涩则阴不下盛，脾阳续复，脉渐舒长，是为欲愈也。</p>
