<tr><td valign="top"><hr /><center><h1>栀子柏皮证十三　太阴十四</h1></center>
<p><strong>【261】伤寒，身黄发热者，栀子柏皮汤主之。</strong></p><p>瘀热在里，则身热而腹满，瘀热在表，则身黄而发热，栀子柏皮汤，<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a>培土而补中气，栀子、柏皮，泻湿而清表热也。</p><p><strong>〖栀子柏皮汤〗八十二　（方【83】）</strong></p><p><strong>【83】栀子柏皮汤</strong></p><p>肥栀子<em>擘，十五个</em>　<a href="http://www.zysj.com.c%6E%2Fzhongyaocai/yaocai_g/gancao.html" target="_blank" title="中药材：甘草">甘草</a><em>炙，一两</em>　<a href="http://www.zysj.com%2E%63%6E%2Fzhongyaocai/yaocai_h/huangbo.html" target="_blank" title="中药材：黄柏">黄柏</a><em>二两</em></p><p><em>上三味，以水四升，煮取一升半，去滓，分温再服。</em></p>
