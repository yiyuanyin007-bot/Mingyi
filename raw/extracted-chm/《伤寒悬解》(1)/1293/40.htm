<tr><td valign="top"><hr /><center><h1>脉法二十四</h1></center>
<p><strong>寸口脉弱而缓，弱者阳气不足，缓者胃气有余，噫而吞酸，食卒不下，气填于膈上也。</strong></p><p>寸口脉弱而缓，弱者阳气之不足，缓者胃气之有余。有余者，胃气上逆，壅满不降，名为有馀，实则胃阳之不足也。上脘壅滞，则噫气吞酸，食卒不下，浊气填塞于膈上也。吞酸者，胃气痞塞，乙木不得升达，郁而为酸也。</p>
