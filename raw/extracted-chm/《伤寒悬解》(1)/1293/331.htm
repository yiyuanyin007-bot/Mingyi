<tr><td valign="top"><hr /><center><h1>呕多忌攻证十　阳明六十一</h1></center>
<p><strong>【204】伤寒呕多，虽有阳明证，不可攻也。</strong></p><p>伤寒经腑郁迫，不能容受，是以作呕。呕缘土虚胃逆，虽有阳明里证，不可攻之也。</p>
