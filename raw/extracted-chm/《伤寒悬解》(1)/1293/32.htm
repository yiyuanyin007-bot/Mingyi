<tr><td valign="top"><hr /><center><h1>脉法十六</h1></center>
<p><strong>脉阴阳俱紧者，至于吐利，其脉犹不解，紧去人安，此为欲解。若脉迟，至六七日，不欲食，此为晚发，水停故也，为未解，食自可者，为欲解。</strong></p><p>脉阴阳俱紧，经迫腑郁，至于吐利，里气松和，病应解也。而脉紧不去，则病必不解，必其脉紧已去，而人安和，此为欲解也。若其紧去而脉迟，至六七日，不欲食，此为晚发，内有水停故也。盖阴盛脉迟，虽时下无病，后必作病，特发之晚耳。缘水停在内，无不作病之理，故为未解。若紧去而食自可者，是内无停水，为欲解也。</p>
