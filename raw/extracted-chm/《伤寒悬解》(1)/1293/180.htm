<tr><td valign="top"><hr /><center><h1>人参白虎证七　太阳六十二</h1></center>
<p><strong>【168】伤寒，若吐若下后，七八日不解，热结在里，表里俱热，时时恶风，大渴，舌上干燥而烦，欲饮水数升者，白虎加<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>汤主之。</strong>方在太阳三十九（方【8】）。</p><p>吐下之后，气夺津伤，七八日不解，燥热内盛，而自里达表，表里俱热，热蒸窍泄，时时恶风，舌上干燥，而心内焦烦，欲饮水数升之多，主以<a href="http://www.zysj.com.%63%6E%2Fzhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>白虎，清金而泻热，化气而生津也。</p>
