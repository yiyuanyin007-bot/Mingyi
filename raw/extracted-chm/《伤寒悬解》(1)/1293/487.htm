<tr><td valign="top"><hr /><center><h1>厥多热少证五　厥阴六</h1></center>
<p><strong>【342】伤寒厥四日，热反三日，复厥五日，其病为进。寒多热少，阳气退，故为进也。</strong></p><p>阴胜而厥者四日，阳复而热者反止三日，复阴胜而厥者又是五日，则其病为进，不能自愈。以寒多而热少，阳气退败，故为病进也。</p>
