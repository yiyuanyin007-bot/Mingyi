<tr><td valign="top"><hr /><center><h1>阳明来路二　阳明九</h1></center>
<p><strong>【181】问曰：何缘得阳明病？答曰：太阳病，若发汗，若下，若利小便，此亡津液，胃中干燥，因转属阳明。不更衣，内实，大便难者，是名阳明也。</strong></p><p>阳明病，来自太阳者多，少阳者少。阳盛之人，太阳病感，汗、下、利水，亡其津液，以致胃中干燥，因而转属阳明。燥热内实，大便坚硬，此名为阳明也。</p>
