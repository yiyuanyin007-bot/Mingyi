<tr><td valign="top"><hr /><center><h1>脉法三十一</h1></center>
<p><strong>脉浮而滑，浮为阳，滑为实，阳实相抟，其脉数疾，卫气失度。浮滑之脉数疾，发热汗出者，此为不治。</strong></p><p>脉浮而滑，浮为阳，滑为实，阳与实合，脉必数疾，卫气失度。浮滑之脉，加以数疾，再复发热汗出者，阴阳消亡，此为不治。《<a href="http://www.zysj.c%6F%6D%2E%63%6E/lilunshuji/nanjing/index.html" target="_blank" title="中医书籍：难经">难经</a>》：脉一呼三至曰离经，四至曰夺精，五至曰死，六至曰命绝，正此浮滑数疾之脉也。</p>
