<tr><td valign="top"><hr /><center><h1>不可下七</h1></center>
<p><strong>【　】动气在左，不可下，下之则腹内拘急，食不下，动气更剧，虽有身热，卧则欲蜷。</strong></p><p>动气在左，肝气之郁。下之，生气愈败，是以拘急。</p>
