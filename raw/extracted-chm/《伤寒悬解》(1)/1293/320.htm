<tr><td valign="top"><hr /><center><h1>提纲　一章</h1></center>
<p>饮食者，胃家之能事也。胃气右降，上脘清虚，而善容受，是以能食。阳莫盛于阳明，阳盛而土燥，则胃降而善纳，阳虚而土湿，则胃逆而不食。不能食者，是胃土湿而肾水寒也。土克水，土性湿而水寒，阳盛则土燥而克水，阴盛则水寒而侮土。以肾家之寒，移于土位，则病中寒。中寒者，水胜而土负，胃败而气逆，故不能食。胃主受盛，脾主消克，食谷不化者，脾家之弱，绝粒不食者，胃家之虚。凡病一见不食，则责阳明而不责太阴，以其受盛之失职也。</p>
