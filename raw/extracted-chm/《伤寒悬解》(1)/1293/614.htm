<tr><td valign="top"><hr /><center><h1>不可下十四</h1></center>
<p><strong>【　】夫病阳多者热，下之则硬。</strong></p><p>阴盛者，下则亡阳，阳盛者，下则亡阴，所谓坚者不受，瑕者受之也。阳病热多，下之阴亡，是以便硬。</p>
