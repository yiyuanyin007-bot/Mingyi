<tr><td valign="top"><hr /><center><h1>脏结证十　太阳百二十</h1></center>
<p><strong>【130】脏结，无阳证，不往来寒热，其人反静，舌上胎滑者，不可攻也。</strong></p><p>脏结之证，阴胜则寒，阳复则热，寒为死机，热则生兆。阴阳相争，多见烦躁。复之过者，邪热如焚，亦有下证。若绝无阳证，不往来寒热，其人反静，舌上胎滑者，是为绝阴，不可攻也。</p><p>肝胆同气，寒热往来，而生烦者，胆木之阳复也，寒热不作，而反静者，肝木之阴胜也。</p>
