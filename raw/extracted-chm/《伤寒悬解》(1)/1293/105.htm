<tr><td valign="top"><hr /><center><h1>太阳经提纲一　太阳一</h1></center>
<p><strong>【1】①太阳之为病，脉浮，头项强痛而恶寒。</strong>太阳在表，故脉浮。其经行身之背，起于睛明（在目内眦，足太阳经之穴名），自头下行而走足，病则经气上郁，壅塞不降，故强痛也。风寒闭其营卫，气郁不能透泄，则外见恶寒。寒者，太阳之令气也。</p><p><em>①【1】　此编号为《<a href="http://www.zysj.com.%63%6E/lilunshuji/shanghanlun/index.html" target="_blank" title="中医书籍：伤寒论">伤寒论</a>》398条之编次，便于对照索引而加，下同。――泥巴匠注。</em></p>
