<tr><td valign="top"><hr /><center><h1>阳回圊脓证四　厥阴四十一</h1></center>
<p><strong>【367】下利，脉数而渴者，令自愈，设不差，必圊脓血，以有热故也。</strong></p><p>下利，脉数而渴者，阳已复矣，可令自愈。设利不差，必圊脓血，以其阳复之过，而有余热，以伤阴也。</p>
