<tr><td valign="top"><hr /><center><h1>差后劳复六</h1></center>
<p><strong>【398】病人脉已解，而日暮微烦，以病新差，人强与谷，脾胃气尚弱，不能消谷，故令微烦，损谷则愈。</strong></p><p>日暮阳收，宿食阻碍，阳气不降，是以生烦。食减易消，则愈也。</p>
