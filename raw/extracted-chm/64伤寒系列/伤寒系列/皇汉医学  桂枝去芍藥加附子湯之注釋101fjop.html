			<p STYLE="MArGin: 6.2pt 0cm 0pt; TexT-ALiGn: left; mso-para-margin-top: .4gd; mso-layout-grid-align: none" ALIGN="left"><span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; CoLor: red; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFKaishu-sB-estd-BF; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">太陽病，下之後，脈促胸滿者，桂枝去芍藥湯主之。</SPAN><span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; CoLor: red; FonT-FAMiLY: 'pMingLiU','serif'; mso-bidi-font-family: pMingLiU; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">&#63860;</SPAN><span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; CoLor: red; FonT-FAMiLY: 宋体; mso-bidi-font-family: 宋体; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">微</SPAN><span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; CoLor: red; FonT-FAMiLY: 'pMingLiU','serif'; mso-bidi-font-family: pMingLiU; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">&#63929;</SPAN><span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; CoLor: red; FonT-FAMiLY: 宋体; mso-bidi-font-family: 宋体; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">寒者，桂枝去芍藥加附子湯主之。</SPAN><span LANG="EN-US" STYLE="FonT-siZe: 12pt; CoLor: red; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFKaishu-sB-estd-BF; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="EN-US">(</SPAN><span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; CoLor: red; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFKaishu-sB-estd-BF; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">《傷寒</SPAN><span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; CoLor: red; FonT-FAMiLY: 'pMingLiU','serif'; mso-bidi-font-family: pMingLiU; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">&#63809;</SPAN><span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; CoLor: red; FonT-FAMiLY: 宋体; mso-bidi-font-family: 宋体; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">》</SPAN><span LANG="EN-US" STYLE="FonT-siZe: 12pt; CoLor: red; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFKaishu-sB-estd-BF; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="EN-US">)

</SPAN></P>
<p STYLE="MArGin: 6.2pt 0cm 0pt; TexT-ALiGn: left; mso-para-margin-top: .4gd; mso-layout-grid-align: none" ALIGN="left"><span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFLishu-Md-HK-BF; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">【註】</SPAN></P>
<p STYLE="MArGin: 6.2pt 0cm 0pt; TexT-ALiGn: left; mso-para-margin-top: .4gd; mso-layout-grid-align: none" ALIGN="left"><span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFLishu-Md-HK-BF; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">本方為桂枝去芍藥湯中加附子，如東洞翁之說，治桂枝去芍藥湯證之微惡寒者。然此惡寒與表證之惡寒異，乃因誤治而成陰證之惡寒，不可忽也。</SPAN></P>
<p STYLE="MArGin: 6.2pt 0cm 0pt; TexT-ALiGn: left; mso-para-margin-top: .4gd; mso-layout-grid-align: none" ALIGN="left"><span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFKaishu-sB-estd-BF; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">桂枝去芍藥加附子湯方</SPAN></P>
<p STYLE="MArGin: 6.2pt 0cm 0pt; TexT-ALiGn: left; mso-para-margin-top: .4gd; mso-layout-grid-align: none" ALIGN="left"><span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFLishu-Md-HK-BF; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">桂枝、大棗、生薑各</SPAN><span LANG="EN-US" STYLE="FonT-siZe: 12pt; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFLishustd-W5-identity-H; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="EN-US">9</SPAN> <span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFLishu-Md-HK-BF; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">克，甘草</SPAN><span LANG="EN-US" STYLE="FonT-siZe: 12pt; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFLishustd-W5-identity-H; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="EN-US">6</SPAN> <span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFLishu-Md-HK-BF; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">克，附子</SPAN><span LANG="EN-US" STYLE="FonT-siZe: 12pt; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFLishustd-W5-identity-H; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="EN-US">3</SPAN> <span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFLishu-Md-HK-BF; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">克。</SPAN></P>
<p STYLE="MArGin: 0cm 0cm 0pt"><span LANG="ZH-TW" STYLE="FonT-siZe: 12pt; FonT-FAMiLY: 宋体; mso-bidi-font-family: DFLishu-Md-HK-BF; mso-font-kerning: 0pt; mso-fareast-language: ZH-TW" XML:LANG="ZH-TW">煎法用法同前。</SPAN></P>
