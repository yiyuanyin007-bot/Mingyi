<tr><td valign="top"><hr /><center><h1>后序</h1></center>
<p></p><p>伤寒之病．传变不一．瞬息之间．死生决焉．专门之医．每病于此．予观古虞廷尉陈君彦材所送金镜一录．元敖氏立辨三十六舌图．法详以证．症附以方．明白简要．可以使人缘形以察脉．由粗而得精．中砭剂于膏肓．寄死生于呼吸．不苦其难．而卒应其变．虽病者地乏良医．亦有所据．而易为力．其不尽然者天乎．诚哉．伤寒家之快捷方式也．用梓之以广其传．夫良医者犹良相也．相传得．斯不误天下苍生司命者．其鉴之哉．其鉴之哉．</p><p><strong>嘉靖己未夏日西蜀笃斋汤绍恩谨识北海尧岗马崇儒校刊</strong></p>
