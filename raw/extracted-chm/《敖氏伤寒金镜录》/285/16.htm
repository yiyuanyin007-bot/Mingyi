<tr><td valign="top"><hr /><center><h1>第十一·里黑舌</h1></center>
<p></p><p>舌见红色．内有干硬黑色．形如小长舌有刺者．此热毒炽甚．坚结大肠．金受火制．不能平木故也．调胃承气汤下之．</p><p><em>（图缺）</em></p><p>【介按】苔至黑色而有刺．舌上必然干燥无津．脐腹必然硬满耕痛．大便必然秘结．此是胃中<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/lilunshuji/jichulilun/44-4-4.html#m0-0" target="_blank" title="书籍相关：津液">津液</a>将涸．热结大肠．故用调胃承气汤．以解邪热而调胃液．但证既如是．不若用大承气汤．奏效较速也．</p><p><strong>调胃承气汤</strong>（方见前）</p>
