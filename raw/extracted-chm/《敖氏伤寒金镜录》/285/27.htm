<tr><td align="left">第二十二·左边白苔舌</td><td align="right">《敖氏伤寒金镜录》</td></tr></table><table width="100%" height="90%" border="0" cellspacing="0" cellpadding="0">
<tr><td valign="top"><hr /><center><h1>第二十二·左边白苔舌</h1></center>
<p></p><p>舌左有白苔而自汗出者．不可下．宜白虎汤加<a href="http://w%77%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>三钱服之．</p><p><em>（图缺）</em></p><p>【介按】舌左边主胃．故白色在左．其苔必燥．而自汗出．则为胃热炽盛．是以治法宗仲景《<a href="http://ww%77%2E%7A%79%73%6A%2E%63%6F%6D%2Ecn/lilunshuji/shanghanlun/index.html" target="_blank" title="中医书籍：伤寒论">伤寒论</a>》“服<a href="http://www.zysj%2E%63%6F%6D%2E%63%6E/zhongyaocai/yaocai_g/guizhi.html" target="_blank" title="中药材：桂枝">桂枝</a>汤大汗出后．大烦渴不解．脉洪大者．白虎加<a href="http://w%77%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>汤主之”之例．盖以汗出过多．恐伤阳明之液．故用白虎加<a href="http://w%77%77%2E%7A%79%73%6A%2Ecom.cn/zhongyaocai/yaocai_r/renshen.html" target="_blank" title="中药材：人参">人参</a>．急救胃液而滋阳明之燥也．</p><p><strong>白虎汤</strong>（方见前）</p>
