<tr><td valign="top"><hr /><center><h1>第十九·白苔边黄舌</h1></center>
<p></p><p>舌中见白苔．外则微黄者．必作泄．宜服解毒汤．恶寒者．五苓散．</p><p><em>（图缺）</em></p><p>【介按】白苔属肺．黄苔属胃．兹因热炽于胃．邪尚在肺．日久不解．则肺胃之邪热．移于大肠而作泄．故用解毒汤以<a href="http://ww%77%2E%7A%79%73%6A%2E%63%6F%6D%2E%63%6E/lilunshuji/neikexue/76-1-5.html#m2-2" target="_blank" title="书籍相关：清热">清热</a>解毒．如若外证恶寒者．则为寒湿作泻．其舌必润．故用五苓散以渗其湿也．</p><p><strong>解毒汤 五苓散</strong>（方见前）</p>
