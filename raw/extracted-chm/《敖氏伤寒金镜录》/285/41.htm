<tr><td valign="top"><hr /><center><h1>第三十六·根灰尖黄舌</h1></center>
<p></p><p>舌见根微黑．尖黄隐见．或有一纹者．脉实，用大承气汤下之．脉浮渴饮水者．用凉膈散解之．十可救其二三．</p><p><em>（图缺）</em></p><p>【介按】舌见根黑尖黄．或边黄中心焦黑起刺．而脉实者．脐腹必胀满硬痛．此系阳明实热之症．故可用大承气汤．苦寒以泄阳明之热．急下以救<a href="http://www.zys%6A%2E%63%6F%6D%2E%63%6E/lilunshuji/jichulilun/44-4-4.html#m0-0" target="_blank" title="书籍相关：津液">津液</a>之虚．若脉浮而<a href="http://www.z%79%73j.com.cn/lilunshuji/neikexue/76-1-4.html#m4-0" target="_blank" title="书籍相关：口渴">口渴</a>饮水者．邪未入腑．犹可用凉膈散以解热也．</p><p><strong>大承气汤 凉膈散</strong>（二方见前）</p>
