<tr><td valign="top"><hr /><center><h1>第十六·白苔黑点舌</h1></center>
<p></p><p>舌见白苔中有小点乱生者．尚有表证．其病求之虽恶．宜凉膈散微表之．表退即当下之．下用调胃承气汤．</p><p><em>（图缺）</em></p><p>【介按】舌苔白而中有燥刺者．此系温邪在手太阴肺经．外证初必恶寒．继即<a href="http://www.zysj.%63%6F%6D%2E%63%6E/lilunshuji/neikexue/76-1-4.html#m1-0" target="_blank" title="书籍相关：发热">发热</a>不已．症势虽似恶候．治宜辛凉清解．宜用凉膈散先清上中二焦之热．若热退而大便未下者．即当改投<a href="http://www.zysj.co%6D%2E%63%6E/lilunshuji/neikexue/76-1-5.html#m2-3" target="_blank" title="书籍相关：攻下">攻下</a>之剂．如欲下之．宜与调胃承气汤．</p><p><strong>凉膈散 调胃承气汤</strong>（方见前）</p>
